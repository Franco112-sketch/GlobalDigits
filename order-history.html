<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#1a56db"/>
<meta name="robots" content="noindex"/>
<title>Order History — Global Digits</title>
<link rel="icon" type="image/x-icon" href="favicon.ico"/>
<link rel="manifest" href="site.webmanifest"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --brand:#1a56db;--brand-dk:#1342b0;--brand-lt:#e8f0ff;
  --danger:#ef4444;--warn:#f59e0b;--success:#10b981;
  --bg:#f6f9ff;--surface:#fff;--surface2:#eef5ff;--border:#dbe9fd;
  --text:#0d1321;--text2:#5a6580;--text3:#9aa3b8;
  --bnav-h:60px;--r:10px;--r-sm:7px;--r-lg:18px;
  --shadow:0 2px 12px rgba(15,25,50,.06);
  --shadow-md:0 10px 32px rgba(26,86,219,.22);
  --font:'Plus Jakarta Sans',sans-serif;--font-d:'Syne',sans-serif;--t:.18s ease;
  --grad-premium:linear-gradient(135deg,#2f6feb 0%,#1a56db 100%);
  --ring-lt:#eaf2ff;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);font-size:11px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:600!important}
button{cursor:pointer;font-family:var(--font);border:none;background:none}
a{color:inherit;text-decoration:none}
input{font-family:var(--font);font-size:13px}
.hidden{display:none!important}
#appShell{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(var(--bnav-h) + 26px)}
#tb{position:sticky;top:0;z-index:20;height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 14px}
#tbBack{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text);transition:var(--t);flex-shrink:0}
#tbBack:hover{background:var(--surface2)}
#tbTitle{font-family:var(--font-d);font-size:15px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:14px}
.searchBar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--border);border-radius:100px;padding:10px 14px;margin-bottom:16px;box-shadow:var(--shadow)}
.searchBar svg{flex-shrink:0;color:var(--text3)}
.searchBar input{flex:1;border:none;outline:none;background:none;color:var(--text)}
.searchBar input::placeholder{color:var(--text3)}
.searchClear{flex-shrink:0;color:var(--text3);padding:2px}
.dateGroupLabel{font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin:18px 2px 9px}
.dateGroupLabel:first-child{margin-top:0}
.ordCard{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:13px;margin-bottom:9px;box-shadow:var(--shadow);transition:transform var(--t);cursor:pointer}
.ordCard:active{transform:scale(.98)}
.ordIco{flex-shrink:0;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.ordMain{flex:1;min-width:0}
.ordTitle{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ordMeta{font-size:10px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ordRight{flex-shrink:0;text-align:right}
.ordAmt{font-family:var(--font-d);font-size:13px;font-weight:700;color:var(--text)}
.ordBadge{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:100px;font-size:9px;font-weight:700}
.ordBadge.completed,.ordBadge.delivered,.ordBadge.successful,.ordBadge.approved{background:#dcfce7;color:#15803d}
.ordBadge.pending,.ordBadge.processing,.ordBadge.waiting{background:#fef3c7;color:#92400e}
.ordBadge.cancelled,.ordBadge.expired,.ordBadge.rejected,.ordBadge.failed{background:#fee2e2;color:#991b1b}
.skel{background:linear-gradient(90deg,var(--surface2) 25%,var(--border) 37%,var(--surface2) 63%);background-size:400% 100%;animation:skel 1.4s ease infinite;border-radius:var(--r-lg)}
@keyframes skel{0%{background-position:100% 50%}100%{background-position:0 50%}}
.emptyState{text-align:center;padding:60px 20px}
.emptyState .eIcon{width:64px;height:64px;border-radius:50%;background:var(--brand-lt);color:var(--brand);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.emptyState h3{font-size:14px;font-weight:700}
.emptyState p{font-size:11.5px;color:var(--text2);margin-top:5px}
.errState{text-align:center;padding:40px 20px;color:var(--danger);font-size:12px}
.errState button{margin-top:10px;color:var(--brand);font-weight:700;text-decoration:underline}
#bnav{
  position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  max-width:492px;margin:0 auto;height:60px;background:var(--surface);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-radius:22px;border:1px solid var(--border);
  display:flex;align-items:stretch;
  z-index:200;box-shadow:0 10px 32px rgba(15,25,50,.14);
}
.bnItem{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text3);font-size:10px;font-weight:500;transition:color var(--t);border:none;background:none;cursor:pointer;position:relative}
.bnItem.active,.bnItem:hover{color:var(--brand)}
.bnItem svg{width:20px;height:20px;transition:transform var(--t)}
.bnItem.active svg{transform:translateY(-2px)}
.bnItem.active::after{content:'';position:absolute;top:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--grad-premium)}
.bnavFab{position:absolute;top:-24px;left:50%;transform:translateX(-50%);width:54px;height:54px;border-radius:50%;background:var(--grad-premium);border:3px solid var(--surface);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(26,86,219,.4),0 0 0 4px rgba(26,86,219,.12);cursor:pointer;z-index:5;transition:transform var(--t)}
.bnavFab:active{transform:translateX(-50%) scale(.93)}
</style>
</head>
<body>
<div id="appShell">
  <header id="tb">
    <button id="tbBack" onclick="goBack()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span id="tbTitle">Orders</span>
  </header>

  <main>
    <div class="searchBar">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Search your orders" oninput="handleSearch()"/>
      <button class="searchClear hidden" id="searchClearBtn" onclick="clearSearch()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="listBody">
      <div class="skel" style="height:66px;margin-bottom:9px"></div>
      <div class="skel" style="height:66px;margin-bottom:9px"></div>
      <div class="skel" style="height:66px;margin-bottom:9px"></div>
    </div>
  </main>

  <nav id="bnav">
    <a class="bnItem" href="index.html?page=dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Home
    </a>
    <a class="bnItem" href="index.html?page=vtu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>VTU
    </a>
    <a class="bnavFab" href="index.html?page=addfunds" aria-label="Add Funds">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </a>
    <a class="bnItem" href="index.html?page=boost">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/></svg>Boost
    </a>
    <a class="bnItem active" href="index.html?page=myorders">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>Orders
    </a>
  </nav>
</div>

<script>
const SUPA_URL='https://pzronmbvusjwrcizxwef.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6cm9ubWJ2dXNqd3JjaXp4d2VmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNTE0MjUsImV4cCI6MjA5NDYyNzQyNX0.v6bz5YeLWKzRN4g09QYTY0x-ur5KGfeXupglKfTVKwA';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
var currentUser=null;

// One config drives everything about each order type — which real table
// to query, its icon/label/empty copy. The rows themselves always come
// straight from Supabase; nothing about an individual order is ever
// hardcoded here.
var TYPE_CONFIG={
  numbers:{
    label:'Numbers',
    table:'orders',
    accent:'blue',
    icon:'<rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="18" x2="8.01" y2="18"/>',
    emptyTitle:'No number orders yet',
    emptyText:'Virtual numbers you purchase for OTP and verification will show up here.'
  },
  sm_accounts:{
    label:'SM Accounts',
    table:'acc_orders',
    accent:'purple',
    icon:'<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>',
    emptyTitle:'No SM account orders yet',
    emptyText:'Social media accounts you purchase will show up here.'
  },
  boosting:{
    label:'Boosting',
    table:'boost_orders',
    accent:'teal',
    icon:'<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>',
    emptyTitle:'No boost orders yet',
    emptyText:'Your social media boost and engagement orders will show up here.'
  },
  mail:{
    label:'Mail',
    table:'mail_orders',
    accent:'blue',
    icon:'<path d="M4 4h16a2 2 0 012 2v12a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2z"/><polyline points="22 6 12 13 2 6"/>',
    emptyTitle:'No Random-Mail orders yet',
    emptyText:'Your temporary inboxes and their verification codes will show up here.'
  }
};

var currentType=null;
var allRows=[];
var rawById={};

function cap(s){return s?String(s).charAt(0).toUpperCase()+String(s).slice(1):s;}
function fmtDate(d){try{return new Date(d).toLocaleDateString('en-NG',{day:'numeric',month:'short',year:'numeric'});}catch(e){return d||'';}}
function fmtTime(d){try{return new Date(d).toLocaleTimeString('en-NG',{hour:'2-digit',minute:'2-digit'});}catch(e){return'';}}
function escapeHtml(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}

// Real, present-day-consistent effective status per type — mirrors the
// same terminal-state logic the main site uses for number orders (a
// pending order with an OTP already delivered reads as "delivered"),
// applied generically so every type gets a sensible real status label.
function effectiveStatus(type,row){
  var s=row.status||'pending';
  if(type==='numbers'&&s==='pending'&&row.otp)s='delivered';
  return s;
}
function orderSearchText(type,row){
  var fields=type==='numbers'?[row.country,row.service,row.tier_name,row.number,row.otp,row.id]
    :type==='sm_accounts'?[row.platform,row.type,row.account_details,row.id]
    :type==='mail'?[row.service_name,row.email,row.otp,row.id]
    :[row.platform,row.boost_type,row.target_url,row.id];
  return fields.filter(Boolean).join(' ').toLowerCase();
}
function normalizeRow(type,row){
  var status=effectiveStatus(type,row);
  if(type==='numbers'){
    return{
      id:row.id,
      title:row.tier_name||row.country||row.service||'Virtual Number',
      subtitle:row.number?('Number: '+row.number):(status==='cancelled'||status==='expired'?'':'Searching for a number…'),
      amount:row.price||0,
      status:status,
      date:row.created_at
    };
  }
  if(type==='sm_accounts'){
    return{
      id:row.id,
      title:(row.platform||'')+(row.type?' — '+row.type:'')||'SM Account',
      subtitle:row.account_details?'Account details ready':(status==='pending'?'Preparing account details…':''),
      amount:row.price||0,
      status:status,
      date:row.created_at
    };
  }
  if(type==='mail'){
    return{
      id:row.id,
      title:(row.service_name||'Random-Mail')+' Verification',
      subtitle:row.email||(status==='waiting'?'Creating inbox…':''),
      amount:row.price||0,
      status:status,
      date:row.created_at
    };
  }
  // boosting
  return{
    id:row.id,
    title:(row.platform||'')+' '+(row.boost_type||'Boost'),
    subtitle:(row.quantity?Number(row.quantity).toLocaleString()+' '+(row.boost_type||''):'')+(row.target_url?' \u00b7 '+row.target_url:''),
    amount:row.amount||0,
    status:status,
    date:row.created_at
  };
}

function goBack(){
  if(window.history.length>1&&document.referrer.indexOf(window.location.origin)===0){
    window.history.back();
  }else{
    window.location.href='index.html?page=myorders';
  }
}

(async function init(){
  try{
    var res=await sb.auth.getSession();
    var session=res.data&&res.data.session;
    if(!session||!session.user){window.location.href='index.html';return;}
    currentUser={id:session.user.id};

    var qp=new URLSearchParams(window.location.search);
    var typeParam=qp.get('type');
    if(!typeParam||!TYPE_CONFIG[typeParam]){
      window.location.href='index.html?page=myorders';
      return;
    }
    currentType=typeParam;
    document.getElementById('tbTitle').textContent=TYPE_CONFIG[typeParam].label+' Orders';
    await loadOrders();
    subscribeRealtime();
  }catch(e){
    console.error('init error:',e);
    window.location.href='index.html';
  }
})();

async function loadOrders(){
  var cfg=TYPE_CONFIG[currentType];
  var body=document.getElementById('listBody');
  try{
    var r=await sb.from(cfg.table).select('*').eq('user_id',currentUser.id).order('created_at',{ascending:false}).limit(200);
    if(r.error)throw r.error;
    var rows=r.data||[];
    allRows=rows.map(function(row){
      var n=normalizeRow(currentType,row);
      rawById[n.id]=row;
      return n;
    });
    renderList(allRows);
  }catch(e){
    console.error('loadOrders error:',e);
    body.innerHTML='<div class="errState">Couldn\'t load your orders right now.<br/><button onclick="loadOrders()">Tap to retry</button></div>';
  }
}

// Keeps the list live — an order moving from "Searching…" to "Delivered",
// or a boost moving to "Completed", updates on screen without a manual
// refresh, straight from real database changes.
function subscribeRealtime(){
  var cfg=TYPE_CONFIG[currentType];
  sb.channel('oh_'+cfg.table).on('postgres_changes',
    {event:'*',schema:'public',table:cfg.table,filter:'user_id=eq.'+currentUser.id},
    function(){loadOrders();}
  ).subscribe();
}

function renderList(rows){
  var cfg=TYPE_CONFIG[currentType];
  var body=document.getElementById('listBody');
  if(!rows.length){
    body.innerHTML='<div class="emptyState"><div class="eIcon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+cfg.icon+'</svg></div>'+
      '<h3>'+cfg.emptyTitle+'</h3><p>'+cfg.emptyText+'</p></div>';
    return;
  }
  var todayStr=fmtDate(new Date());
  var yestStr=fmtDate(new Date(Date.now()-86400000));
  var groups=[],groupMap={};
  rows.forEach(function(row){
    var d=fmtDate(row.date);
    var label=d===todayStr?'Today':(d===yestStr?'Yesterday':d);
    if(!groupMap[label]){groupMap[label]={label:label,items:[]};groups.push(groupMap[label]);}
    groupMap[label].items.push(row);
  });
  body.innerHTML=groups.map(function(g){
    return '<div class="dateGroupLabel">'+g.label+'</div>'+g.items.map(ordCardHtml).join('');
  }).join('');
}

function ordCardHtml(row){
  var cfg=TYPE_CONFIG[currentType];
  return '<div class="ordCard" onclick="openOrder(\''+row.id+'\')">'+
    '<div class="ordIco" style="background:'+accentBg(cfg.accent)+';color:'+accentFg(cfg.accent)+'"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+cfg.icon+'</svg></div>'+
    '<div class="ordMain"><div class="ordTitle">'+escapeHtml(row.title)+'</div>'+
      '<div class="ordMeta">'+fmtDate(row.date)+' \u00b7 '+fmtTime(row.date)+(row.subtitle?' \u00b7 '+escapeHtml(row.subtitle):'')+'</div></div>'+
    '<div class="ordRight"><div class="ordAmt">\u20a6'+Number(row.amount).toLocaleString()+'</div>'+
      '<span class="ordBadge '+row.status+'">'+cap(row.status)+'</span></div></div>';
}
function accentBg(a){return{blue:'#e8f0ff',purple:'#f4ecff',teal:'#e6fbf7'}[a]||'#e8f0ff';}
function accentFg(a){return{blue:'#1a56db',purple:'#8b5cf6',teal:'#0d9488'}[a]||'#1a56db';}

var searchTimer=null;
function handleSearch(){
  clearTimeout(searchTimer);
  var val=document.getElementById('searchInput').value.trim();
  document.getElementById('searchClearBtn').classList.toggle('hidden',!val);
  searchTimer=setTimeout(function(){
    if(!val){renderList(allRows);return;}
    var q=val.toLowerCase();
    var filtered=allRows.filter(function(row){
      var raw=rawById[row.id];
      return orderSearchText(currentType,raw).indexOf(q)!==-1||
        (row.title&&row.title.toLowerCase().indexOf(q)!==-1)||
        (row.status&&row.status.toLowerCase().indexOf(q)!==-1);
    });
    renderList(filtered);
  },200);
}
function clearSearch(){
  document.getElementById('searchInput').value='';
  document.getElementById('searchClearBtn').classList.add('hidden');
  renderList(allRows);
}

function openOrder(id){
  window.location.href='view-order.html?id='+encodeURIComponent(id)+'&type='+encodeURIComponent(currentType);
}
</script>
</body>
</html>
