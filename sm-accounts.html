<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#1a56db"/>
<title>SM Accounts — Global Digits</title>
<meta name="robots" content="noindex"/>
<link rel="icon" type="image/x-icon" href="favicon.ico"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --brand:#1a56db;--brand-dk:#1342b0;--brand-lt:#e8f0ff;
  --danger:#ef4444;--warn:#f59e0b;--success:#10b981;
  --bg:#f6f9ff;--surface:#fff;--surface2:#eef5ff;--border:#dbe9fd;
  --text:#0d1321;--text2:#5a6580;--text3:#9aa3b8;
  --topbar-h:52px;--r:10px;--r-sm:7px;--r-lg:18px;--r-xl:24px;
  --shadow:0 2px 12px rgba(15,25,50,.06);--shadow-md:0 6px 28px rgba(15,25,50,.1);
  --font:'Plus Jakarta Sans',sans-serif;--font-d:'Syne',sans-serif;--t:.18s ease;
  --grad-premium:linear-gradient(135deg,#2f6feb 0%,#1a56db 100%);
  --ring:#bfdbfe;--ring-lt:#eaf2ff;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);font-size:11px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5,h6{font-weight:600!important}
button{cursor:pointer;font-family:var(--font);border:none;background:none}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.hidden{display:none!important}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
/* ── LOADING ── */
#loadingScreen{position:fixed;inset:0;background:var(--brand);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .35s ease}
#loadingScreen .lsLogoImg{width:68px;height:68px;object-fit:contain;margin-bottom:14px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.25))}
#loadingScreen .lsLogo{font-family:var(--font-d);font-size:22px;font-weight:600;color:#fff;margin-bottom:20px}
#loadingScreen .lsSpinner{width:30px;height:30px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
/* ── TOPBAR ── */
#topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);background:var(--surface);border-bottom:none;box-shadow:0 2px 10px rgba(15,25,50,.06);display:flex;align-items:center;padding:0 14px;gap:10px;z-index:200}
.tbMenuBtn,.tbIconBtn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--brand);flex-shrink:0;position:relative;transition:background var(--t)}
.tbMenuBtn:hover,.tbIconBtn:hover{background:var(--brand-lt)}
#topbarTitle{font-family:var(--font-d);font-size:16px;font-weight:600;flex:1}
.tbRight{display:flex;align-items:center;gap:4px;margin-left:auto}
.notifDot{position:absolute;top:3px;right:3px;min-width:14px;height:14px;padding:0 3px;background:var(--danger);border-radius:999px;border:1.5px solid var(--surface);display:none;align-items:center;justify-content:center;font-size:8.5px;font-weight:800;color:#fff}
#mainContent{margin-top:var(--topbar-h);min-height:calc(100vh - var(--topbar-h));padding-bottom:28px}
.pageArea{width:100%;max-width:640px;margin:0 auto;box-sizing:border-box;padding:12px 16px 24px}
/* ── BACK ROW ── */
.backRow{display:flex;align-items:center;gap:6px;padding:8px 2px 10px;color:var(--brand);font-size:12.5px;font-weight:600;cursor:pointer;width:fit-content}
.backRow svg{flex-shrink:0}
/* ── PAGE HEAD / CHIPS ── */
.pgHead{margin-bottom:10px}
.pgHead h2{font-family:var(--font-d);font-size:16px;font-weight:600}
.pgHead p{font-size:10.5px;color:var(--text2);margin-top:3px}
.chipRow{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:7px;margin-bottom:12px;scrollbar-width:none;-ms-overflow-style:none}
.chipRow::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:6px 13px;border-radius:100px;font-size:10.5px;font-weight:600;background:var(--surface2);color:var(--text2);border:1.5px solid var(--border);transition:all var(--t);cursor:pointer}
.chip.active{background:var(--grad-premium);color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(26,86,219,.22)}
/* ── BADGES ── */
.badge{display:inline-block;padding:2.5px 8px;border-radius:100px;font-size:9.5px;font-weight:600}
.badge.active{background:#dcfce7;color:#15803d}
.badge.cancelled{background:#fee2e2;color:#991b1b}
/* ── ACCOUNT CARDS ── */
#accountsList{display:flex;flex-direction:column;gap:9px}
.empty{text-align:center;color:var(--text3);padding:28px 0;font-size:12px}
.accCard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:11px;box-shadow:var(--shadow);transition:box-shadow var(--t)}
.accCardTop{display:flex;align-items:flex-start;gap:10px}
.accPlatIcon{width:36px;height:36px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(26,86,219,.2)}
.accCardInfo{min-width:0;flex:1}
.accCardName{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.accCardPlat{font-size:10px;color:var(--text2);margin-top:1px}
.accCardBottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;padding-top:9px;border-top:1px solid var(--border)}
.accCardPrice{font-family:var(--font-d);font-size:13.5px;font-weight:700;color:var(--brand);flex-shrink:0}
.accCardBtns{display:flex;align-items:center;gap:6px;flex-shrink:0}
.pillBtn{padding:6.5px 12px;border-radius:100px;font-size:10px;font-weight:600;white-space:nowrap;transition:transform var(--t),opacity var(--t)}
.pillBtn:active{transform:scale(.94)}
.pillBtnGhost{background:var(--brand-lt);color:var(--brand);border:1px solid var(--border)}
.pillBtnSolid{background:var(--grad-premium);color:#fff;box-shadow:0 3px 10px rgba(26,86,219,.22)}
.pillBtnSolid:disabled{background:var(--surface2);color:var(--text3);box-shadow:none;cursor:not-allowed}
.pillBtnSolid.wide{width:100%;padding:11px 14px;font-size:12.5px}
.pillBtnOutline{width:100%;padding:10px 14px;font-size:12px;border-radius:100px;background:none;border:1.5px solid var(--border);color:var(--brand);display:flex;align-items:center;justify-content:center;gap:6px}
/* ── DESCRIPTION PAGE ── */
#accDescView{display:none}
#accDescView.active{display:block;animation:fadeUp .2s ease}
#accListView.hiddenView{display:none}
.accDescHead{text-align:center;padding:6px 0 16px}
.accDescIcon{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;box-shadow:0 5px 16px rgba(26,86,219,.24)}
.accDescName{font-family:var(--font-d);font-size:16px;font-weight:600;margin-bottom:2px}
.accDescPlat{font-size:11.5px;color:var(--text2);margin-bottom:9px}
.accDescPrice{font-family:var(--font-d);font-size:21px;font-weight:700;color:var(--brand);margin-top:8px}
.dCard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:13px;box-shadow:var(--shadow);margin-bottom:11px}
.dCardTitle{font-family:var(--font-d);font-size:13px;font-weight:600;margin-bottom:10px}
.dCheckRow{display:flex;align-items:flex-start;gap:9px;padding:6px 0;font-size:11.5px;color:var(--text2);line-height:1.4}
.dCheckIcon{width:18px;height:18px;border-radius:50%;background:var(--brand-lt);color:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.infoRow{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:11.5px;border-bottom:1px solid var(--border)}
.infoRow:last-child{border-bottom:none}
.infoRow span:first-child{color:var(--text2)}
.infoRow span:last-child{font-weight:600;display:flex;align-items:center;gap:6px}
.secNotice{display:flex;align-items:flex-start;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 11px;margin-top:10px;font-size:10.5px;color:var(--text2);line-height:1.4}
.secNotice svg{flex-shrink:0;color:var(--brand);margin-top:1px}
.shareBtn{display:flex;align-items:center;gap:5px;flex-shrink:0}
.upgradedBadge{display:inline-flex;align-items:center;gap:3px;padding:2.5px 8px 2.5px 6px;border-radius:100px;font-size:9.5px;font-weight:600;background:var(--brand-lt);color:var(--brand);border:1px solid var(--border)}
.badgeRow{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.ordersNote{display:flex;align-items:flex-start;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;margin-top:12px;font-size:11px;color:var(--text2);line-height:1.45}
.ordersNote svg{flex-shrink:0;color:var(--brand);margin-top:1px}
.ordersNote a{color:var(--brand);font-weight:700}
.viewDetailsHint{font-size:9.5px;color:var(--text3);text-align:center;margin-top:6px}
/* ── TOAST ── */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#0d1321;color:#fff;padding:10px 18px;border-radius:100px;font-size:12.5px;font-weight:600;opacity:0;transition:all .22s ease;pointer-events:none;z-index:9000;white-space:nowrap;max-width:calc(100vw - 28px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ── BOTTOM SHEET / QTY MODAL ── */
.gdSheetOv{position:fixed;inset:0;background:rgba(5,10,25,.55);backdrop-filter:blur(2px);z-index:9500;opacity:0;pointer-events:none;transition:opacity .22s ease}
.gdSheetOv.show{opacity:1;pointer-events:auto}
.gdSheet{position:fixed;left:0;right:0;bottom:0;max-width:540px;margin:0 auto;height:auto;max-height:80vh;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.25);z-index:9600;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;overflow:hidden}
.gdSheetOv.show .gdSheet{transform:translateY(0)}
.gdSheetHandle{width:36px;height:4px;border-radius:3px;background:var(--border);margin:10px auto 4px;flex-shrink:0}
.gdSheetHead{padding:6px 18px 12px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
.gdSheetHead h3{font-family:var(--font-d);font-size:15.5px;font-weight:700}
.gdSheetClose{width:30px;height:30px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--text2)}
.gdSheetBody{flex:1;overflow-y:auto;padding:4px 18px 22px}
.qtyModalProduct{margin-bottom:14px}
.qtyModalName{font-family:var(--font-d);font-size:14px;font-weight:700;margin-bottom:6px}
.qtyModalUnitPrice{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--text2)}
.qtyModalUnitPrice strong{color:var(--brand);font-family:var(--font-d);font-size:12.5px}
.qtyModalStepper{display:flex;align-items:center;justify-content:center;gap:20px;margin:16px 0}
.qtyModalBtn{width:36px;height:36px;border-radius:50%;background:var(--brand-lt);color:var(--brand);display:flex;align-items:center;justify-content:center;transition:transform var(--t),opacity var(--t)}
.qtyModalBtn:active{transform:scale(.9)}
.qtyModalBtn:disabled{opacity:.35;cursor:not-allowed}
.qtyModalQtyVal{font-family:var(--font-d);font-size:20px;font-weight:700;min-width:34px;text-align:center}
.qtyModalTotalRow{display:flex;align-items:center;justify-content:space-between;background:var(--brand-lt);border-radius:var(--r-sm);padding:10px 13px;margin-bottom:11px}
.qtyModalTotalRow span{font-size:11px;font-weight:600;color:var(--text2)}
.qtyModalTotalRow strong{font-family:var(--font-d);font-size:15px;font-weight:700;color:var(--brand)}
.qtyModalConfirmMsg{text-align:center;font-size:11px;color:var(--text2);margin-bottom:12px}
.walletPaySel{display:flex;flex-direction:column;gap:8px}
.walletPayRow{display:flex;align-items:center;gap:9px;padding:10px 12px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-sm);cursor:pointer;transition:border-color .2s,background .2s}
.walletPayRow.active{border-color:var(--brand);background:var(--brand-lt)}
.walletPayCheck{width:17px;height:17px;flex-shrink:0}
.walletPayLbl{flex:1;font-size:12px;font-weight:600;display:flex;flex-direction:column;line-height:1.5}
.qtyWalletBal{font-size:9px;color:var(--text3);margin-top:1px;display:block;font-weight:500}
.fG{margin-bottom:2px}
.fG label{display:block;font-size:10.5px;font-weight:700;color:var(--text2);margin-bottom:7px;text-transform:uppercase;letter-spacing:.02em}
</style>
</head>
<body>

<div id="loadingScreen">
  <img src="logo.png" alt="Global Digits" class="lsLogoImg" onerror="this.style.display='none'"/>
  <div class="lsLogo">GlobalDigits</div>
  <div class="lsSpinner"></div>
</div>

<header id="topbar" class="hidden">
  <button class="tbMenuBtn" onclick="location.href='index.html'" aria-label="Back to Dashboard">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <span id="topbarTitle">Global Digits</span>
  <div class="tbRight">
    <button class="tbIconBtn" onclick="location.href='index.html'" aria-label="Notifications">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
      <span class="notifDot"></span>
    </button>
    <button class="tbIconBtn" onclick="location.href='index.html?page=settings'" aria-label="Account">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 10-16 0"/></svg>
    </button>
  </div>
</header>

<main id="mainContent" class="hidden">
  <div class="pageArea">

    <!-- ══ LIST VIEW ══ -->
    <div id="accListView">
      <div class="backRow" onclick="location.href='index.html'">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><polyline points="15 18 9 12 15 6"/></svg>
        Back to Dashboard
      </div>
      <div class="pgHead"><h2>SM Accounts</h2><p>Buy ready-made social media accounts</p></div>
      <div class="chipRow" id="accPlatTabs">
        <button class="chip active" data-plat="" onclick="filterAccounts('',this)">All</button>
        <button class="chip" data-plat="Instagram" onclick="filterAccounts('Instagram',this)">Instagram</button>
        <button class="chip" data-plat="TikTok" onclick="filterAccounts('TikTok',this)">TikTok</button>
        <button class="chip" data-plat="Facebook" onclick="filterAccounts('Facebook',this)">Facebook</button>
        <button class="chip" data-plat="Twitter/X" onclick="filterAccounts('Twitter/X',this)">Twitter/X</button>
      </div>
      <div id="accountsList"></div>
    </div>

    <!-- ══ ACCOUNT DESCRIPTION VIEW ══ -->
    <div id="accDescView">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div class="backRow" onclick="backToList()" style="padding-right:0">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><polyline points="15 18 9 12 15 6"/></svg>
          Back to SM Accounts
        </div>
        <button class="pillBtn pillBtnGhost shareBtn" onclick="shareDescLink()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/></svg>
          Share
        </button>
      </div>
      <div id="accDescBody"><!-- populated dynamically --></div>
    </div>

  </div>
</main>

<!-- Quantity / wallet selection modal (SM Accounts) -->
<div class="gdSheetOv" id="qtyModalOv" onclick="if(event.target===this)closeQtyModal()">
  <div class="gdSheet" id="qtyModalSheet">
    <div class="gdSheetHandle"></div>
    <div class="gdSheetHead">
      <h3>Confirm Purchase</h3>
      <button class="gdSheetClose" onclick="closeQtyModal()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="gdSheetBody" style="padding-bottom:20px">
      <div class="qtyModalProduct">
        <div class="qtyModalName" id="qtyModalName">—</div>
        <div class="qtyModalUnitPrice"><span>Unit Price</span><strong id="qtyModalUnitPrice">₦0</strong></div>
      </div>
      <div class="qtyModalStepper" id="qtyModalStepperWrap">
        <button class="qtyModalBtn" id="qtyModalMinus" onclick="changeQtyModal(-1)" title="Decrease quantity">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <span class="qtyModalQtyVal" id="qtyModalQty">1</span>
        <button class="qtyModalBtn" id="qtyModalPlus" onclick="changeQtyModal(1)" title="Increase quantity">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
      <div class="qtyModalTotalRow"><span>Total Amount</span><strong id="qtyModalTotal">₦0</strong></div>
      <div class="fG" id="qtyModalWalletWrap" style="margin-top:2px">
        <label>Pay With</label>
        <div class="walletPaySel" id="qtyModalWalletSel">
          <div class="walletPayRow active" data-w="ngn" onclick="selectSmWallet('ngn')">
            <span id="qtyWCheckNgn" style="display:flex;align-items:center"></span>
            <span class="walletPayLbl">NGN Wallet<span class="qtyWalletBal" id="qtyWBalNgn">Balance: ₦0</span></span>
          </div>
          <div class="walletPayRow" data-w="usd" onclick="selectSmWallet('usd')">
            <span id="qtyWCheckUsd" style="display:flex;align-items:center"></span>
            <span class="walletPayLbl">USD Wallet<span class="qtyWalletBal" id="qtyWBalUsd">Balance: $0.00</span></span>
          </div>
        </div>
      </div>
      <div class="qtyModalConfirmMsg">Is this the account you want to buy?</div>
      <button class="pillBtnSolid wide" id="qtyModalPayBtn" onclick="confirmQtyModalPay()">Pay</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ══ CONFIG — same project as the main app; anon key is safe client-side,
   access is governed by Supabase RLS, unchanged here. ══ */
const SUPA_URL='https://pzronmbvusjwrcizxwef.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6cm9ubWJ2dXNqd3JjaXp4d2VmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNTE0MjUsImV4cCI6MjA5NDYyNzQyNX0.v6bz5YeLWKzRN4g09QYTY0x-ur5KGfeXupglKfTVKwA';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);

var currentUser=null;
var allAccTypes=[];
var gdCfg={usd_to_ngn_rate:0};
var toastTimer=null;
var cameFromListView=false; // true once we've pushed a history entry for the description view

/* ══ TOAST ══ */
function toast(msg){
  clearTimeout(toastTimer);
  var el=document.getElementById('toast');if(!el)return;
  el.textContent=msg;el.classList.add('show');
  toastTimer=setTimeout(function(){el.classList.remove('show');},3200);
}

/* ══ SESSION / PROFILE — same auth gate pattern used by the rest of the
   app's standalone pages (e.g. order-history.html). Not logged in →
   login.html, same as everywhere else. ══ */
async function checkSession(){
  try{
    var userRes=await sb.auth.getUser();
    var user=userRes.data&&userRes.data.user;
    if(!user){window.location.href='login.html';return;}
    var pr=await sb.from('profiles').select('balance,balance_usd,status').eq('id',user.id).single();
    if(pr.data&&pr.data.status==='deactivated'){
      await sb.auth.signOut();
      window.location.href='login.html';
      return;
    }
    currentUser={id:user.id,balance:(pr.data&&pr.data.balance)||0,balanceUsd:(pr.data&&pr.data.balance_usd)||0,balanceLoaded:true,balanceUsdLoaded:true};
    launch();
  }catch(e){
    console.error('checkSession error:',e);
    window.location.href='login.html';
  }
}
async function loadGdCfg(){
  try{
    var r=await sb.from('admin_config').select('key,value').eq('key','usd_to_ngn_rate').single();

function ngnToUsd(ngn){
  if(!gdCfg.usd_to_ngn_rate)return null;

async function launch(){

/* ══ REALTIME — admin edits to price/stock/description/account_link/
   is_upgraded reflect here immediately, same pattern used across the
   rest of the app (row-level Postgres changes via Supabase Realtime). ══ */
function setupRealtime(){
  try{
    sb.channel('sm_types_ch').on('postgres_changes',
      {event:'*',schema:'public',table:'sm_account_types'},
      async function(){
        await loadSmAccTypesQuiet();
        var descActive=document.getElementById('accDescView').classList.contains('active');
        if(descActive&&window._currentDescAcc){
          var id=window._currentDescAcc.id;
          var updated=allAccTypes.find(function(x){return String(x.id)===String(id);});
          if(updated)renderDescription(updated);
          else{toast('This account is no longer available');backToList();}
        }else{
          var activeChip=document.querySelector('#accPlatTabs .chip.active');
          filterAccounts(activeChip?activeChip.dataset.plat:'',activeChip);
        }
      }
    ).subscribe();
  }catch(e){console.error('setupRealtime error:',e);}
}

function legacyCopy(text){
  try{
    var ta=document.createElement('textarea');
    ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.focus();ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('Link copied');
  }catch(e){toast('Could not copy link');}
}

/* ══ PURCHASE — identical RPCs/tables to the main app's buySmAcc /
   buySmAccUsd, so stock, wallet, RLS and order-creation logic are exactly
   the same as everywhere else the account is bought from. First-order
   coupon discounts are handled on the main dashboard only and are not
   duplicated here. ══ */
async function buySmAcc(typeId,platform,type,price,qty,wallet){
  qty=Math.max(1,parseInt(qty,10)||1);
  wallet=wallet==='usd'?'usd':'ngn';
  if(wallet==='usd'){await buySmAccUsd(typeId,platform,type,price,qty);return;}
  var finalTotal=Math.round(price*qty);
  if((currentUser.balance||0)<finalTotal){toast('Insufficient balance');location.href='index.html?page=addfunds';return;}
  try{
    var r=await sb.rpc('purchase_sm_batch',{
      p_user_id:currentUser.id,p_type_id:typeId,p_platform:platform,p_type:type,
      p_qty:qty,p_unit_price:price,p_total_price:finalTotal
    });
    if(r.error){
      console.error('purchase_sm_batch failed:',r.error);
      var msg=(r.error.message||'').toLowerCase();
      if(msg.indexOf('insufficient_stock')>-1){toast(qty>1?'Not enough stock for that quantity':'Out of stock');await loadSmAccTypes();return;}
      if(msg.indexOf('insufficient_balance')>-1){toast('Insufficient balance');location.href='index.html?page=addfunds';return;}
      if(msg.indexOf('invalid_quantity')>-1){toast('Invalid quantity selected');return;}
      toast('Order failed: '+(r.error.message||'unknown error')+' — please contact support if this continues');
      return;
    }
    var freshBal=await sb.from('profiles').select('balance').eq('id',currentUser.id).single();
    if(freshBal.data){currentUser.balance=freshBal.data.balance;}
    toast('Order placed! Account details coming shortly.');
    location.href='index.html?page=accorder';
  }catch(e){
    console.error('buySmAcc unexpected error:',e);
    toast('Order failed: '+(e.message||'unexpected error')+' — please contact support if this continues');
  }
}
async function buySmAccUsd(typeId,platform,type,unitPriceNgn,qty){
  if(!gdCfg.usd_to_ngn_rate){toast('USD pricing is not available right now');return;}
  var totalNgn=Math.round(unitPriceNgn*qty);
  var totalUsd=ngnToUsd(totalNgn);
  if(totalUsd===null){toast('USD pricing is not available right now');return;}
  totalUsd=Math.round(totalUsd*100)/100;
  if((currentUser.balanceUsd||0)<totalUsd){toast('Insufficient USD balance');location.href='index.html?page=addfunds';return;}
  var stockR=await sb.from('sm_account_types').select('stock').eq('id',typeId).single();
  var availStock=(stockR.data&&stockR.data.stock)||0;
  if(availStock<qty){toast(qty>1?'Not enough stock for that quantity':'Out of stock');await loadSmAccTypes();return;}
  var d=await debitUsdForPurchase(totalUsd,'purchase',platform+' '+type+' x'+qty);
  if(!d.success){toast(d.message);return;}
  try{
    var stockUpd=await sb.from('sm_account_types').update({stock:availStock-qty}).eq('id',typeId).eq('stock',availStock).select();
    if(!stockUpd.data||!stockUpd.data.length){
      await refundUsdPurchase(totalUsd,d.clientRef,'Refund — item sold out');
      toast('That item just sold out — you have been refunded');await loadSmAccTypes();return;
    }
    var oR=await sb.from('acc_orders').insert({
      user_id:currentUser.id,platform:platform,type:type,
      price:totalNgn,unit_price:unitPriceNgn,total_price:totalNgn,
      batch_qty:qty,status:'pending'
    }).select().single();
    if(!oR.data){
      console.error('acc_orders insert failed (USD SM purchase):',oR.error);
      await sb.from('sm_account_types').update({stock:availStock}).eq('id',typeId).eq('stock',availStock-qty);
      await refundUsdPurchase(totalUsd,d.clientRef,'Refund — SM order could not be created');
      toast('Order failed — you have been refunded');return;
    }
    currentUser.balanceUsd=d.newBalance;
    toast('Order placed! Account details coming shortly.');
    location.href='index.html?page=accorder';
  }catch(e){
    console.error('buySmAccUsd unexpected error:',e);
    toast('Order failed: '+(e.message||'unexpected error')+' — please contact support if this continues');
  }
}
async function debitUsdForPurchase(amount,category,title){
  var clientRef=category+'_usd_'+currentUser.id+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
  try{
    var dR=await sb.rpc('debit_usd_wallet_for_purchase',{p_user_id:currentUser.id,p_amount:amount,p_category:category,p_title:title,p_client_ref:clientRef});
    var dRow=Array.isArray(dR.data)?dR.data[0]:dR.data;
    if(dR.error||!dRow||!dRow.success)return{success:false,message:(dRow&&dRow.message)||(dR.error&&dR.error.message)||'Could not process payment',clientRef:clientRef};
    return{success:true,newBalance:dRow.new_balance,clientRef:clientRef};
  }catch(e){return{success:false,message:e.message||'Could not process payment',clientRef:clientRef};}
}
async function refundUsdPurchase(amount,clientRef,title){
  try{
    var rR=await sb.rpc('credit_usd_wallet_refund',{p_user_id:currentUser.id,p_amount:amount,p_category:'refund',p_title:title,p_client_ref:'refund_'+clientRef});
    var rRow=Array.isArray(rR.data)?rR.data[0]:rR.data;
    if(rRow&&rRow.new_balance!==undefined&&currentUser)currentUser.balanceUsd=rRow.new_balance;
  }catch(e){console.error('refundUsdPurchase:',e.message);}
}

checkSession();
</script>
