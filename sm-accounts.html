<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#1a56db"/>
<title>SM Accounts — Global Digits</title>
<meta name="description" content="SM Accounts is now available on our dedicated platform. Continue there to browse and buy social media accounts."/>
<meta name="robots" content="noindex, follow"/>
<link rel="icon" type="image/x-icon" href="favicon.ico"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --brand:#1a56db;--brand-dk:#1342b0;--brand-lt:#e8f0ff;
  --bg:#f6f9ff;--surface:#fff;--border:#dbe9fd;
  --text:#0d1321;--text2:#5a6580;--text3:#9aa3b8;
  --r:14px;--r-sm:10px;
  --shadow:0 2px 12px rgba(15,25,50,.06);
  --shadow-md:0 10px 34px rgba(15,25,50,.1);
  --font:'Plus Jakarta Sans',sans-serif;--font-d:'Syne',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  overflow-x:hidden;
}
button{cursor:pointer;font-family:var(--font);border:none;background:none}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}

/* ── TOP BAR ── */
.topbar{
  position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));
  background:rgba(246,249,255,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.backBtn{
  width:34px;height:34px;border-radius:10px;background:var(--surface);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  color:var(--text);flex-shrink:0;transition:background .15s ease;
}
.backBtn:hover{background:var(--brand-lt)}
.topbarTitle{font-size:14px;font-weight:600;color:var(--text2)}

/* ── MAIN ── */
main{
  flex:1;width:100%;max-width:460px;margin:0 auto;
  padding:24px 20px 40px;display:flex;flex-direction:column;align-items:center;
}

.moveIconWrap{
  width:64px;height:64px;border-radius:18px;background:var(--brand-lt);color:var(--brand);
  display:flex;align-items:center;justify-content:center;margin-bottom:20px;flex-shrink:0;
}

h1{
  font-family:var(--font-d);font-weight:700;font-size:20px;line-height:1.3;
  text-align:center;margin-bottom:10px;max-width:340px;
}
.desc{
  font-size:13.5px;line-height:1.65;color:var(--text2);text-align:center;
  max-width:340px;margin-bottom:26px;
}

/* ── FEATURE STRIP (keeps the page from feeling empty, without being loud) ── */
.featRow{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-bottom:28px;
}
.featCard{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:14px 8px;text-align:center;box-shadow:var(--shadow);
}
.featCard svg{color:var(--brand);margin:0 auto 8px;display:block}
.featCard span{font-size:10.5px;font-weight:600;color:var(--text2);line-height:1.35;display:block}

/* ── CARD ── */
.card{
  width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:20px;box-shadow:var(--shadow-md);text-align:center;
}
.card .plat{
  display:flex;align-items:center;justify-content:center;gap:7px;
  font-size:11.5px;font-weight:600;color:var(--text3);margin-bottom:14px;
  word-break:break-word;
}
.card .plat svg{flex-shrink:0}

.btnContinue{
  width:100%;padding:13px 18px;border-radius:11px;background:var(--brand);color:#fff;
  font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:background .15s ease,transform .1s ease;
}
.btnContinue:hover{background:var(--brand-dk)}
.btnContinue:active{transform:scale(.98)}
.btnContinue svg{flex-shrink:0}
.btnContinue[disabled]{background:var(--text3);cursor:not-allowed}

.helperNote{font-size:11px;color:var(--text3);margin-top:12px;line-height:1.5}

.skeleton{
  background:linear-gradient(90deg,var(--border) 25%,#eef5ff 37%,var(--border) 63%);
  background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:6px;
}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.skTitle{height:18px;width:220px;margin:0 auto 10px}
.skDesc{height:12px;width:280px;margin:0 auto 8px}
.skDesc.short{width:200px;margin-bottom:0}

@media (max-width:360px){
  main{padding:20px 14px 32px}
  .featRow{gap:6px}
  .featCard{padding:11px 6px}
}
@media (min-width:640px){
  body{background:linear-gradient(180deg,var(--bg) 0%,#eef4ff 100%)}
  main{padding-top:48px}
  .card{padding:26px}
}
</style>
</head>
<body>
<div class="topbar">
  <button class="backBtn" onclick="goBack()" aria-label="Back to Global Digits">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <span class="topbarTitle">Global Digits</span>
</div>

<main>
  <div class="moveIconWrap">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
      <polyline points="15 3 21 3 21 9"/>
      <line x1="10" y1="14" x2="21" y2="3"/>
    </svg>
  </div>

  <div id="textArea">
    <div class="skeleton skTitle"></div>
    <div class="skeleton skDesc"></div>
    <div class="skeleton skDesc short"></div>
  </div>

  <div class="featRow">
    <div class="featCard">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      <span>Secure Checkout</span>
    </div>
    <div class="featCard">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
      <span>Fast Delivery</span>
    </div>
    <div class="featCard">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      <span>Same Support Team</span>
    </div>
  </div>

  <div class="card">
    <div class="plat" id="platformLine">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 010 20 15.3 15.3 0 010-20z"/></svg>
      <span id="platformHost">globaldigits</span>
    </div>
    <button class="btnContinue" id="continueBtn" onclick="continueToPlatform()" disabled>
      <span id="continueLabel">Loading…</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </button>
    <div class="helperNote" id="helperNote">Fetching the latest details…</div>
  </div>
</main>

<script>
const SUPA_URL='https://pzronmbvusjwrcizxwef.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6cm9ubWJ2dXNqd3JjaXp4d2VmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNTE0MjUsImV4cCI6MjA5NDYyNzQyNX0.v6bz5YeLWKzRN4g09QYTY0x-ur5KGfeXupglKfTVKwA';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);

var platformUrl=null;

function goBack(){
  // Same-app back, never leaves the user stranded if they arrived here
  // with no history (e.g. a fresh tab / deep link).
  if(document.referrer&&document.referrer.indexOf(window.location.origin)===0){
    window.history.back();
  }else{
    window.location.href='index.html';
  }
}

function escHtml(s){
  return (s||'').replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function renderText(title,desc){
  var wrap=document.getElementById('textArea');
  var h1=document.createElement('h1');h1.textContent=title;
  var p=document.createElement('p');p.className='desc';p.textContent=desc;
  wrap.innerHTML='';
  wrap.appendChild(h1);
  wrap.appendChild(p);
}

function setContinueState(url){
  var btn=document.getElementById('continueBtn');
  var label=document.getElementById('continueLabel');
  var note=document.getElementById('helperNote');
  var hostEl=document.getElementById('platformHost');
  if(url){
    try{hostEl.textContent=new URL(url).hostname;}catch(e){hostEl.textContent=url;}
    platformUrl=url;
    btn.disabled=false;
    label.textContent='Continue to Platform';
    note.textContent="You'll be taken to our partner site to complete your purchase.";
  }else{
    hostEl.textContent='Link not set up yet';
    btn.disabled=true;
    label.textContent='Platform link unavailable';
    note.textContent="This link hasn't been configured yet — please check back shortly, or contact support if this persists.";
  }
}

function continueToPlatform(){
  if(!platformUrl)return;
  window.location.href=platformUrl;
}

async function loadRedirectConfig(){
  var DEFAULT_TITLE='SM Accounts has moved';
  var DEFAULT_DESC="We've moved Social Media Accounts to a dedicated platform so we can offer a wider selection, faster delivery and a better buying experience. Tap below to continue there.";
  try{
    var r=await sb.from('admin_config').select('key,value')
      .in('key',['sm_redirect_title','sm_redirect_description','sm_redirect_url']);
    if(r.error)throw r.error;
    var byKey={};(r.data||[]).forEach(function(row){byKey[row.key]=row.value;});
    var title=(byKey.sm_redirect_title&&String(byKey.sm_redirect_title).trim())||DEFAULT_TITLE;
    var desc=(byKey.sm_redirect_description&&String(byKey.sm_redirect_description).trim())||DEFAULT_DESC;
    var url=(byKey.sm_redirect_url&&String(byKey.sm_redirect_url).trim())||null;
    document.title=title+' — Global Digits';
    renderText(title,desc);
    setContinueState(url&&/^https?:\/\//i.test(url)?url:null);
  }catch(e){
    console.error('loadRedirectConfig error:',e);
    renderText(DEFAULT_TITLE,DEFAULT_DESC);
    setContinueState(null);
    document.getElementById('helperNote').textContent="Couldn't load the platform link right now — please try again shortly.";
  }
}
loadRedirectConfig();
</script>
</body>
</html>
