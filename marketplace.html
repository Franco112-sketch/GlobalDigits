<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"/>
<title>Global Marketplace — Global Digits</title>
<meta name="theme-color" content="#f3f5fa"/><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--brand:#1a56db;--brand2:#1342b0;--soft:#eef3ff;--bg:#f5f7fb;--panel:#fff;--line:#e3e8f2;--ink:#0f1a2e;--ink2:#54627c;--ink3:#8591a8;--ok:#0e9f6e;--warn:#b7791f;--bad:#d64545}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.hide{display:none!important}
.bar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:env(safe-area-inset-top) 0 0}
.bar-in{max-width:1100px;margin:auto;height:46px;display:flex;align-items:center;gap:8px;padding:0 12px}
.ib{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}.ib:active{background:var(--soft)}
.ib svg,.ic{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand{font-weight:600;font-size:14px}
.search{flex:1;display:flex;align-items:center;gap:7px;height:32px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:0 10px;min-width:0}
.search input{flex:1;border:0;background:none;outline:0;font-size:13px;min-width:0}
.wrap{max-width:1100px;margin:auto;padding:12px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:28px;padding:0 11px;border:1px solid var(--line);background:var(--panel);border-radius:99px;font-size:12px;color:var(--ink2)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 8px}.sh h2{font-size:14px;font-weight:600}.sh small{color:var(--ink3);font-size:11.5px}
.hs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.hs::-webkit-scrollbar{display:none}.hs .card{width:168px;flex-shrink:0}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sel,.num{height:30px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:0 8px;font-size:12px;color:var(--ink);outline:0}.num{width:78px}
.sel:focus,.num:focus{border-color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:box-shadow .15s}
.card:hover{box-shadow:0 8px 22px -14px rgba(16,24,40,.3)}
.ph{aspect-ratio:4/3;background:var(--soft);display:grid;place-items:center;color:var(--ink3);position:relative}
.ph img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;left:6px;top:6px;font-size:10.5px;background:#fff;border-radius:6px;padding:1px 6px;color:var(--ok)}.tag.out{color:var(--bad)}
.cb{padding:8px 9px 9px;display:flex;flex-direction:column;gap:3px;flex:1}
.nm{font-weight:600;font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ds{color:var(--ink2);font-size:11.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{font-weight:700;color:var(--brand);font-size:13.5px;margin-top:auto}
.vr{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink2);min-width:0}.vr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:18px;height:18px;border-radius:50%;background:var(--soft);color:var(--brand);display:grid;place-items:center;font-size:9.5px;font-weight:600;overflow:hidden;flex-shrink:0}.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:56px;height:56px;font-size:20px;border:3px solid #fff}
.vb{width:13px;height:13px;color:var(--brand);flex-shrink:0}
.st{color:#d9971b}
.row{display:flex;gap:6px;margin-top:5px}
.btn{height:30px;padding:0 12px;border-radius:9px;background:var(--brand);color:#fff;font-size:12px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:5px}.btn:active{background:var(--brand2)}
.btn.gh{background:var(--panel);color:var(--ink);border:1px solid var(--line)}.btn.sm{flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.det{display:grid;gap:12px}@media(min-width:800px){.det{grid-template-columns:1.1fr 1fr}}
.gal .main{aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--soft);display:grid;place-items:center}.gal .main img{width:100%;height:100%;object-fit:cover}
.th{display:flex;gap:6px;margin-top:6px;overflow-x:auto}.th img{width:48px;height:48px;border-radius:8px;object-fit:cover;border:2px solid transparent;cursor:pointer}.th img.on{border-color:var(--brand)}
h1{font-size:17px;font-weight:600}
.big{font-size:20px;font-weight:700;color:var(--brand);margin:4px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12px;margin-top:8px}.kv dt{color:var(--ink3)}
.desc{white-space:pre-wrap;color:var(--ink2);margin-top:6px;font-size:12.5px}
.banner{height:96px;border-radius:12px;background:linear-gradient(135deg,#1a56db,#6aa0ff) center/cover}
.vh{margin-top:-28px;padding:0 12px;display:flex;gap:10px;align-items:flex-end}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.stats div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px;text-align:center}.stats b{display:block;font-size:14px}.stats small{color:var(--ink3);font-size:10.5px}
.empty{text-align:center;color:var(--ink3);padding:34px 10px}.empty .ic{width:30px;height:30px;margin-bottom:6px}
.sk{background:linear-gradient(90deg,#eceff6 25%,#f6f8fc 37%,#eceff6 63%);background-size:400% 100%;animation:sk 1.3s infinite;border-radius:12px;height:210px}
@keyframes sk{0%{background-position:100% 0}100%{background-position:0 0}}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#1d2740;color:#fff;font-size:12px;padding:7px 12px;border-radius:9px;opacity:0;pointer-events:none;transition:.2s;z-index:50}#toast.on{opacity:1;transform:translate(-50%,0)}
.vgrid .vc{width:132px;flex-shrink:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.vc .av{width:40px;height:40px;font-size:15px}.vc b{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.fi{width:100%;height:34px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:0 10px;font-size:13px;color:var(--ink);outline:0;margin:4px 0 9px}textarea.fi{height:64px;padding:8px 10px;resize:vertical}.fi:focus{border-color:var(--brand)}.lb{font-size:11.5px;color:var(--ink2)}.cp{display:inline-flex;align-items:center;gap:4px;color:var(--brand);font-size:11.5px}.msg{padding:9px 11px;border-radius:10px;background:var(--soft);color:var(--ink2);font-size:12px;margin-bottom:10px}.msg.bad{background:#fdecec;color:var(--bad)}
.bd{font-size:10.5px;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--brand)}.bd.completed,.bd.delivered{background:#e3f6ee;color:var(--ok)}.bd.cancelled,.bd.disputed,.bd.refunded{background:#fdecec;color:var(--bad)}
.mb{position:relative}.bdg{position:absolute;top:-1px;right:-1px;min-width:15px;height:15px;border-radius:99px;background:var(--bad);color:#fff;font-size:9.5px;display:grid;place-items:center;padding:0 3px}
.cr{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}.cr .av{width:38px;height:38px;font-size:14px}.cr .t{flex:1;min-width:0}.cr b{font-size:13px}.cr .p{color:var(--ink2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cr small{color:var(--ink3);font-size:10.5px}
.unb{min-width:18px;height:18px;border-radius:99px;background:var(--brand);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 5px;margin-top:3px;margin-left:auto}
.chatpage{position:fixed;left:0;right:0;bottom:0;top:calc(47px + env(safe-area-inset-top));display:flex;flex-direction:column;background:var(--bg)}
.chh{display:flex;align-items:center;gap:9px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);max-width:1100px;width:100%;margin:auto}.chh .av{width:30px;height:30px;font-size:12px}.chh .n{flex:1;min-width:0}.chh b{font-size:13px;display:block}.chh small{color:var(--ink3);font-size:11px}
.msgs{flex:1;overflow-y:auto;padding:10px 12px;max-width:1100px;width:100%;margin:auto;display:flex;flex-direction:column;gap:4px}
.ds2{align-self:center;font-size:10.5px;color:var(--ink3);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:1px 10px;margin:6px 0}
.bub{max-width:80%;padding:6px 10px;border-radius:14px;background:var(--panel);border:1px solid var(--line);align-self:flex-start;white-space:pre-wrap;word-break:break-word;font-size:13px;cursor:pointer}
.bub.me{align-self:flex-end;background:var(--brand);border-color:var(--brand);color:#fff}
.bub .mt{display:block;font-size:10px;opacity:.7;text-align:right;margin-top:2px}
.bub.del{font-style:italic;opacity:.65}
.rq{border-left:3px solid var(--brand);background:rgba(26,86,219,.08);border-radius:6px;padding:2px 7px;margin-bottom:4px;font-size:11.5px;opacity:.9}.bub.me .rq{border-color:#fff;background:rgba(255,255,255,.18)}
.pc{background:var(--soft);color:var(--ink);border-radius:10px;padding:7px 9px;margin:-2px 0 2px}.pc a{color:var(--brand);font-size:12px}
.cmp{display:flex;gap:8px;align-items:flex-end;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);max-width:1100px;width:100%;margin:auto}
.cmp textarea{flex:1;max-height:110px;min-height:34px;border:1px solid var(--line);border-radius:12px;padding:7px 10px;font:inherit;outline:0;resize:none;background:var(--bg)}
.rpb{display:flex;justify-content:space-between;align-items:center;padding:5px 14px;background:var(--soft);font-size:12px;color:var(--ink2);max-width:1100px;width:100%;margin:auto}
.sheet{position:fixed;inset:0;background:rgba(15,26,46,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center}.sheet>div{background:var(--panel);width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:8px 8px calc(10px + env(safe-area-inset-bottom))}
.sheet button{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:9px;font-size:13px}.sheet button:active{background:var(--soft)}.sheet .dg{color:var(--bad)}
.mi{max-width:min(230px,100%);max-height:260px;border-radius:10px;display:block;cursor:zoom-in;background:var(--soft);min-height:60px;min-width:90px}
.vp{display:flex;align-items:center;gap:6px;min-width:210px}.vb2{width:28px;height:28px;border-radius:50%;background:rgba(127,127,127,.22);flex-shrink:0;font-size:11px}.vr2{flex:1;min-width:60px;accent-color:currentColor}.vt{font-size:11px;min-width:30px}.vs{font-size:10.5px;border:1px solid currentColor;border-radius:99px;padding:0 6px;opacity:.8}
.fc{display:flex;gap:8px;align-items:center;min-width:200px}.fc b{display:block;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}.fc small{opacity:.7;font-size:10.5px}
.rx{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}.rx span{font-size:11px;background:rgba(127,127,127,.18);border-radius:99px;padding:0 6px}
.fw{font-size:10.5px;opacity:.7;margin-bottom:2px}

/* ── messages upgrade ── */
.ms-s{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:40px}.ms-s:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(26,86,219,.12)}
.ms-s input{flex:1;border:0;background:none;outline:0;font-size:13.5px;min-width:0}
.seg{display:flex;gap:6px;margin:12px 0 8px;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg .chip{height:30px;display:inline-flex;align-items:center;gap:5px}.seg .chip i{font-style:normal;font-size:10.5px;background:rgba(127,127,127,.18);border-radius:99px;padding:0 6px}.seg .chip.on i{background:rgba(255,255,255,.28)}
.clist{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.crow{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}.crow:last-child{border-bottom:0}.crow:hover,.crow:active{background:var(--soft)}
.crow .av{width:46px;height:46px;font-size:17px;flex-shrink:0}
.crow .t{flex:1;min-width:0}.crow .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.crow .top b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.crow .top small{font-size:11px;color:var(--ink3);flex-shrink:0}
.crow .bt{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:2px}.crow .p{color:var(--ink2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.crow.un .p{color:var(--ink);font-weight:600}.crow.un .top small{color:var(--brand);font-weight:600}
.crow .unb{margin:0;flex-shrink:0}.crow .mo{width:26px;height:26px;border-radius:8px;color:var(--ink3);font-size:16px;line-height:1;flex-shrink:0}.crow .mo:hover{background:var(--line)}
.emp2{text-align:center;padding:44px 20px}.emp2 .ci{width:64px;height:64px;border-radius:20px;background:var(--soft);color:var(--brand);display:grid;place-items:center;margin:0 auto 12px}.emp2 .ci .ic{width:28px;height:28px}.emp2 b{font-size:15px;display:block}.emp2 p{color:var(--ink2);margin:4px 0 14px}
.crow.sk2{pointer-events:none}.crow.sk2 .a,.crow.sk2 .l{background:linear-gradient(90deg,#eceff6 25%,#f6f8fc 37%,#eceff6 63%);background-size:400% 100%;animation:sk 1.3s infinite}.crow.sk2 .a{width:46px;height:46px;border-radius:50%}.crow.sk2 .l{height:10px;margin:6px 0;border-radius:6px}
.chatpage{background:linear-gradient(180deg,var(--bg),#eef2fa)}
.chh{box-shadow:0 1px 0 var(--line),0 6px 16px -14px rgba(16,24,40,.4)}.chh b{font-size:14px}.chh .n{cursor:pointer}
.bub{border-radius:18px 18px 18px 6px;padding:7px 12px;box-shadow:0 1px 1px rgba(16,24,40,.05);animation:pop .14s ease-out}.bub.me{border-radius:18px 18px 6px 18px;background:linear-gradient(135deg,#1a56db,#2f6bf0)}
.bub.cont{margin-top:-1px}.bub.cont:not(.me){border-top-left-radius:6px}.bub.cont.me{border-top-right-radius:6px}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.cmp{gap:6px;box-shadow:0 -6px 16px -14px rgba(16,24,40,.4)}.cmp textarea{border-radius:20px;padding:8px 14px}.cmp textarea:focus{border-color:var(--brand);background:#fff}
#sd{border-radius:50%;width:36px;height:36px;padding:0}
.fab{position:absolute;right:14px;bottom:76px;width:36px;height:36px;border-radius:50%;background:var(--panel);border:1px solid var(--line);box-shadow:0 6px 16px -6px rgba(16,24,40,.35);font-size:16px;color:var(--ink2);z-index:5}

/* ── custom dropdown ── */
.dd-native{display:none!important}
.dd-btn{display:inline-flex;align-items:center;justify-content:space-between;gap:8px;height:30px;padding:0 9px 0 11px;border:1px solid var(--line);background:var(--panel);border-radius:9px;font-size:12px;color:var(--ink);cursor:pointer;max-width:100%;text-align:left;transition:border-color .15s,box-shadow .15s}
.dd-btn.dd-full{display:flex;width:100%;height:34px;font-size:13px;margin:4px 0 9px}
.dd-btn:hover{border-color:#c9d3e6}.dd-btn:focus-visible,.dd-btn[aria-expanded=true]{border-color:var(--brand);box-shadow:0 0 0 3px rgba(26,86,219,.14);outline:0}
.dd-btn:disabled{opacity:.55;cursor:not-allowed}
.dd-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-ch{width:14px;height:14px;flex-shrink:0;fill:none;stroke:var(--ink3);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}
.dd-btn[aria-expanded=true] .dd-ch{transform:rotate(180deg)}
.dd-back{position:fixed;inset:0;z-index:90;background:transparent}
.dd-menu{position:fixed;z-index:91;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px -10px rgba(16,24,40,.35);padding:5px;max-height:280px;overflow-y:auto;animation:ddin .12s ease-out;overscroll-behavior:contain}
.dd-o{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:8px;font-size:13px;color:var(--ink);background:none;border:0;cursor:pointer}
.dd-o:hover,.dd-o:focus{background:var(--soft);outline:0}.dd-o[aria-selected=true]{color:var(--brand);font-weight:600}.dd-o:disabled{opacity:.45;cursor:not-allowed}
.dd-o svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.dd-title{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;font-weight:700;padding:8px 10px 4px}
@media(max-width:560px){.dd-back{background:rgba(15,26,46,.4)}.dd-menu.dd-sheet{left:0!important;right:0;bottom:0;top:auto!important;width:100%!important;max-height:62vh;border-radius:18px 18px 0 0;border:0;padding:8px 8px calc(12px + env(safe-area-inset-bottom));animation:ddup .18s ease-out}.dd-sheet .dd-o{padding:13px 12px;font-size:14px}}
@keyframes ddin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}@keyframes ddup{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}

/* ── 2026 compact pass ── */
:root{--h-ctl:32px;--h-btn:30px;--r-ctl:9px;--r-card:12px;--ic:16px;--vvh:100dvh;--vvt:0px}
.ib svg,.ic{width:var(--ic);height:var(--ic)}
.card:hover{box-shadow:none;border-color:#cfd8ea}
.cb{padding:7px 9px 9px;gap:2px}.pr{font-size:13px}
.banner{height:72px}.vh{margin-top:-22px}.av.lg{width:48px;height:48px;font-size:17px;border-width:2px}
.vh h1{font-size:15px!important}.stats b{font-size:13px}.stats div{padding:6px}
.emp2{padding:32px 16px}.emp2 .ci{width:48px;height:48px;border-radius:14px}.emp2 .ci .ic{width:22px;height:22px}.emp2 b{font-size:14px}.emp2 p{font-size:12px}
.ms-s{height:36px;border-radius:11px}.ms-s input{font-size:13px}
.clist{border-radius:12px}.crow{gap:10px;padding:9px 11px}.crow .av{width:38px;height:38px;font-size:14px}.crow .top b{font-size:13px}.crow .p{font-size:12px}
.chh{padding:6px 10px;gap:8px;box-shadow:none}.chh .av{width:28px;height:28px;font-size:11px}.chh b{font-size:13px}
.msgs{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scroll-padding-bottom:8px}
.bub{max-width:82%;padding:5px 10px;font-size:13px;line-height:1.4;box-shadow:none;overflow-wrap:anywhere}
.bub.me{background:var(--brand)}
.ds2{margin:4px 0;font-size:10px}
.cmp{padding:6px 10px calc(6px + env(safe-area-inset-bottom));gap:4px;box-shadow:none;flex-shrink:0}
.cmp .ib{width:34px;height:34px}

const SORT={new:['created_at',false],sales:['sales_count',false],rated:['rating_avg',false],lo:['price',true],hi:['price',false]};
function query(o){
  let q=sb.from('mp_product_public').select(PCOLS,{count:'exact'});
  if(o.partner)q=q.eq('partner_id',o.partner);
  if(S.cat)q=q.eq('category_id',S.cat);
  const t=clean(S.q);
  if(t&&!o.partner)q=q.or(['name','description','shop_name','username','category_name'].map(c=>c+'.ilike.%'+t+'%').join(','));
  if(S.min!=='')q=q.gte('price',+S.min);
  if(S.max!=='')q=q.lte('price',+S.max);
  if(S.stock)q=q.or('stock.is.null,stock.gt.0');
  if(S.rate)q=q.gte('rating_avg',S.rate);
  const [col,asc]=SORT[S.sort]||SORT.new;
  return q.order(col,{ascending:asc,nullsFirst:false}).range(S.page*PAGE,S.page*PAGE+PAGE-1);
}

  +'<span class="tag'+(out?' out':'')+'">'+(out?'Out of stock':p.stock==null?'Available':p.stock+' left')+'</span></div><div class="cb">'
  +'<div class="nm">'+esc(p.name)+'</div><div class="ds">'+esc(p.description||'')+'</div>'

async function partner(){

  if(i.partner_status==='active'){app.innerHTML='<div class="panel" style="text-align:center"><h1>You’re a Marketplace Partner</h1><p class="lb" style="margin:6px 0 12px">Manage your shop from your partner dashboard.</p><a class="btn" href="partner-dashboard.html">Open dashboard</a></div>';return}

  +'<button class="btn" id="go" style="width:100%;height:36px">Submit for verification</button></div>';

    const d=i.pay[cur],rows=cur==='NGN'?[['Bank',d.bank],['Account number',d.account],['Account name',d.name]]:[['Network',d.network],['Wallet address',d.address]];
    $('#pay').innerHTML=rows.every(r=>!r[1])?'<div class="msg">Payment details aren’t available yet. Please contact support.</div>':'<div class="panel" style="background:var(--soft);margin-bottom:10px"><dl class="kv">'+rows.filter(r=>r[1]).map(r=>'<dt>'+r[0]+'</dt><dd>'+esc(r[1])+' <button class="cp" data-cp="'+esc(r[1])+'">Copy</button></dd>').join('')+'</dl></div>'};
  drawCur();
  $('#cur').onclick=e=>{const b=e.target.closest('[data-cur]');if(b){cur=b.dataset.cur;drawCur()}};
  $('#pay').onclick=e=>{const b=e.target.closest('[data-cp]');if(b)navigator.clipboard.writeText(b.dataset.cp).then(()=>toast('Copied'),()=>toast('Copy failed'))};
  $('#go').onclick=async()=>{
    const btn=$('#go'),f=$('#pf').files[0],sn=$('#sn').value.trim(),rf=$('#rf').value.trim();

/* ═════ CUSTOM DROPDOWN (replaces native <select>; keeps the select in the DOM so .value / onchange still work) ═════ */
(function(){
  const CH='<svg class="dd-ch" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>',CK='<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
  const x=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let cur=null;
  function close(focus){
    if(!cur)return;const c=cur;cur=null;c.menu.remove();c.back.remove();c.btn.setAttribute('aria-expanded','false');
    document.removeEventListener('keydown',c.key,true);window.removeEventListener('resize',c.rs);window.removeEventListener('scroll',c.sc,true);if(focus)c.btn.focus();
  }
  function openMenu(sel,btn){
    close();const mobile=window.matchMedia('(max-width:560px)').matches;
    const back=document.createElement('div');back.className='dd-back';
    const menu=document.createElement('div');menu.className='dd-menu'+(mobile?' dd-sheet':'');menu.setAttribute('role','listbox');
    const ttl=sel.getAttribute('aria-label')||sel.dataset.title||'';
    menu.innerHTML=(mobile&&ttl?'<div class="dd-title">'+x(ttl)+'</div>':'')+[...sel.options].map((o,i)=>o.hidden?'':'<button type="button" class="dd-o" role="option" data-i="'+i+'" aria-selected="'+(i===sel.selectedIndex)+'"'+(o.disabled?' disabled':'')+'><span>'+x(o.textContent)+'</span>'+(i===sel.selectedIndex?CK:'')+'</button>').join('');
    document.body.append(back,menu);btn.setAttribute('aria-expanded','true');
    const place=()=>{if(mobile)return;const r=btn.getBoundingClientRect();menu.style.minWidth=r.width+'px';menu.style.maxWidth='min(320px,94vw)';
      const mh=menu.offsetHeight,below=innerHeight-r.bottom-8,up=below<mh&&r.top>below;
      menu.style.top=(up?Math.max(8,r.top-mh-4):r.bottom+4)+'px';menu.style.left=Math.max(8,Math.min(r.left,innerWidth-menu.offsetWidth-8))+'px'};
    place();
    const items=()=>[...menu.querySelectorAll('.dd-o:not(:disabled)')];
    const pick=i=>{sel.selectedIndex=+i;sel.dispatchEvent(new Event('input',{bubbles:true}));sel.dispatchEvent(new Event('change',{bubbles:true}));close(true)};
    menu.onclick=e=>{const o=e.target.closest('.dd-o');if(o)pick(o.dataset.i)};
    back.onclick=()=>close();
    const key=e=>{
      if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close(true);return}
      const it=items(),k=it.indexOf(document.activeElement);
      if(e.key==='ArrowDown'){e.preventDefault();(it[k+1]||it[0]).focus()}
      else if(e.key==='ArrowUp'){e.preventDefault();(it[k-1]||it[it.length-1]).focus()}
      else if(e.key==='Home'){e.preventDefault();it[0]&&it[0].focus()}
      else if(e.key==='End'){e.preventDefault();it[it.length-1]&&it[it.length-1].focus()}
      else if(e.key==='Tab'){close()}
      else if(e.key.length===1&&/\S/.test(e.key)){const m=it.find(b=>b.textContent.trim().toLowerCase().startsWith(e.key.toLowerCase()));if(m)m.focus()}
    };
    const sc=e=>{if(!menu.contains(e.target))close()},rs=()=>close();
    document.addEventListener('keydown',key,true);window.addEventListener('resize',rs);window.addEventListener('scroll',sc,true);
    cur={menu,back,btn,key,sc,rs};
    const sI=menu.querySelector('[aria-selected=true]')||items()[0];if(sI){sI.focus({preventScroll:true});sI.scrollIntoView({block:'nearest'})}
  }
  function enhance(sel){
    if(sel._dd||sel.multiple||sel.hasAttribute('data-native'))return;sel._dd=1;
    const btn=document.createElement('button');btn.type='button';btn.className='dd-btn'+(sel.classList.contains('fi')?' fi dd-full':'');
    btn.setAttribute('aria-haspopup','listbox');btn.setAttribute('aria-expanded','false');
    const lb=sel.id&&document.querySelector('label[for="'+sel.id+'"]');if(lb)btn.setAttribute('aria-label',lb.textContent.trim());
    sel.classList.add('dd-native');sel.tabIndex=-1;sel.setAttribute('aria-hidden','true');sel.after(btn);
    const lab=()=>{const o=sel.options[sel.selectedIndex];btn.innerHTML='<span class="dd-l">'+x(o?o.textContent:'Select')+'</span>'+CH;btn.disabled=sel.disabled};
    const d=Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,'value');
    Object.defineProperty(sel,'value',{get(){return d.get.call(this)},set(v){d.set.call(this,v);lab()},configurable:true});
    sel.addEventListener('change',lab);lab();
    btn.onclick=()=>cur&&cur.btn===btn?close():openMenu(sel,btn);
  }
  const scan=r=>{if(r.nodeType!==1)return;if(r.tagName==='SELECT')enhance(r);r.querySelectorAll&&r.querySelectorAll('select').forEach(enhance)};
  new MutationObserver(m=>m.forEach(r=>r.addedNodes.forEach(scan))).observe(document.body,{childList:true,subtree:true});
  scan(document.body);
  window.enhanceSelects=scan;
})();

/* keyboard-aware viewport: keeps the composer above the on-screen keyboard */
(function(){
  const vv=window.visualViewport,r=document.documentElement;let kbOpen=false,raf=0;
  function apply(){
    raf=0;const h=vv?vv.height:innerHeight,t=vv?vv.offsetTop:0;
    r.style.setProperty('--vvh',Math.round(h)+'px');r.style.setProperty('--vvt',Math.round(t)+'px');
    const open=vv?(innerHeight-vv.height>120):false;
    if(open!==kbOpen){kbOpen=open;document.body.classList.toggle('kb',open&&!!document.querySelector('.chatpage'));
      const ms=document.getElementById('ms');if(ms&&open)requestAnimationFrame(()=>{ms.scrollTop=ms.scrollHeight})}
    else if(open){const ms=document.getElementById('ms');if(ms&&ms.dataset.stick==='1')ms.scrollTop=ms.scrollHeight}
    if(open&&document.querySelector('.chatpage'))window.scrollTo(0,0);
  }
  const q=()=>{if(!raf)raf=requestAnimationFrame(apply)};
  if(vv){vv.addEventListener('resize',q);vv.addEventListener('scroll',q)}
  addEventListener('resize',q);addEventListener('orientationchange',()=>setTimeout(q,250));
  new MutationObserver(()=>{const c=!!document.querySelector('.chatpage');document.body.classList.toggle('chatting',c);if(!c)document.body.classList.remove('kb');q()}).observe(document.body,{childList:true,subtree:true});
  q();
})();
