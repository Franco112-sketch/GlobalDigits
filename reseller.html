<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#1a56db"/>
<title>Global Digits — Reseller Program</title>
<meta name="description" content="Become a Global Digits reseller — your own storefront selling virtual numbers, social media accounts, boosting, gift cards, eSIMs and VTU."/>

<style>
:root{
  --brand:#1a56db;--brand-dk:#1342b0;--brand-lt:#e8f0ff;
  --danger:#ef4444;--warn:#f59e0b;--success:#10b981;
  --bg:#f4f6fb;--surface:#fff;--surface2:#eef1f8;--border:#e1e6f0;
  --text:#0d1321;--text2:#5a6580;--text3:#9aa3b8;
  --sidebar-bg:#0d1321;
  --topbar-h:52px;--sidebar-w:240px;--bnav-h:56px;
  --r:10px;--r-sm:7px;
  --shadow:0 2px 12px rgba(15,25,50,.07);
  --shadow-md:0 6px 28px rgba(15,25,50,.12);
  --font:'Plus Jakarta Sans',sans-serif;
  --font-d:'Syne',sans-serif;
  --t:.18s ease;
  --grad-premium:linear-gradient(135deg,#1a56db 0%,#1e3a8a 100%);
  --r-lg:18px;--r-xl:24px;
  --shadow-glow:0 10px 34px rgba(29,66,176,.28);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-d)}
a{color:inherit;text-decoration:none}
button{font-family:var(--font);cursor:pointer;border:none;background:none}
input,select,textarea{font-family:var(--font);font-size:13.5px}
.hidden{display:none!important}
img{max-width:100%;display:block}

/* ===== layout shell ===== */
#appShell{min-height:100vh;display:flex;flex-direction:column}
#topbar{height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:40}
.brandMark{display:flex;align-items:center;gap:8px;font-family:var(--font-d);font-weight:800;font-size:15px}
.brandMark .dot{width:9px;height:9px;border-radius:50%;background:var(--grad-premium)}
#topbarRight{display:flex;align-items:center;gap:10px}
.pillBtn{padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--brand-lt);color:var(--brand)}
.avatarDot{width:30px;height:30px;border-radius:50%;background:var(--grad-premium);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}

#main{flex:1;max-width:920px;width:100%;margin:0 auto;padding:18px 16px 90px}

/* ===== cards / common ===== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.cardTight{padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:560px){.grid3{grid-template-columns:1fr 1fr}}
.statCard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px}
.statCard .lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--text3)}
.statCard .val{font-family:var(--font-d);font-size:20px;font-weight:700;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:var(--r);font-weight:700;font-size:13.5px;transition:var(--t)}
.btnP{background:var(--grad-premium);color:#fff;box-shadow:var(--shadow-glow)}
.btnP:active{transform:scale(.98)}
.btnO{background:var(--surface);border:1.5px solid var(--border);color:var(--text)}
.btnDanger{background:#fef2f2;color:var(--danger)}
.btnSm{padding:7px 12px;font-size:12px;border-radius:8px}
.btnBlock{width:100%}
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.02em}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:var(--r-sm);background:var(--surface2);color:var(--text)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);background:var(--surface)}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.badge.active,.badge.approved,.badge.paid,.badge.completed{background:#dcfce7;color:#16a34a}
.badge.pending,.badge.processing{background:#fef3c7;color:#b45309}
.badge.rejected,.badge.failed,.badge.suspended{background:#fee2e2;color:#dc2626}
.badge.expired{background:var(--surface2);color:var(--text3)}
.empty{padding:36px 10px;text-align:center;color:var(--text3);font-size:13px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0d1321;color:#fff;padding:11px 20px;border-radius:999px;font-size:13px;font-weight:600;z-index:200;box-shadow:var(--shadow-md);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.loadSpin{width:20px;height:20px;border:2.5px solid var(--brand-lt);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.centerScreen{min-height:60vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px}

/* tabs (dashboard) */
#dashTabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:16px;scrollbar-width:none}
#dashTabs::-webkit-scrollbar{display:none}
.dTab{padding:9px 14px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--surface);border:1.5px solid var(--border);color:var(--text2)}
.dTab.active{background:var(--text);color:#fff;border-color:var(--text)}

.rowItem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
.rowItem:last-child{border-bottom:none}
.rowItem .t1{font-weight:700;font-size:13px}
.rowItem .t2{font-size:11.5px;color:var(--text2);margin-top:2px}

.planCard{border:2px solid var(--border);border-radius:var(--r-lg);padding:18px;position:relative}
.planCard.rec{border-color:var(--brand)}
.planCard h3{font-size:16px}
.planCard .price{font-family:var(--font-d);font-size:24px;font-weight:800;color:var(--brand);margin:8px 0}
.planCard ul{list-style:none;margin:12px 0;font-size:12.5px;color:var(--text2)}
.planCard li{padding:4px 0;display:flex;gap:7px;align-items:flex-start}

/* storefront product grid */
.prodCard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.prodGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.catChip{padding:8px 14px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface);border:1.5px solid var(--border);white-space:nowrap}
.catChip.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.storeHero{background:var(--grad-premium);border-radius:var(--r-xl);padding:26px 20px;color:#fff;margin-bottom:18px}
.storeHero h1{font-size:20px}
.storeHero p{font-size:12.5px;opacity:.85;margin-top:4px}
.poweredBy{text-align:center;font-size:11px;color:var(--text3);padding:16px 0 4px}

/* modal */
.modalOverlay{position:fixed;inset:0;background:rgba(10,14,25,.55);z-index:300;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.modalOverlay{align-items:center}}
.modalBox{background:var(--surface);width:100%;max-width:440px;border-radius:20px 20px 0 0;padding:20px;max-height:88vh;overflow-y:auto}
@media(min-width:640px){.modalBox{border-radius:var(--r-xl)}}
.modalHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modalHead h3{font-size:16px}
.xBtn{width:30px;height:30px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center}

.svgIco{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
</style>
</head>

<script>
/* ══════════════════════ CONFIG ══════════════════════ */

/* ══════════════════════ STATE ══════════════════════ */

/* ══════════════════════ UTIL ══════════════════════ */
function toast(msg){
  var t=document.getElementById('toastEl');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer=setTimeout(function(){t.classList.remove('show');},2600);
}
function fmtN(n){return '₦'+Math.round(n||0).toLocaleString();}
function fmtDate(d){if(!d)return '—';var dt=new Date(d);return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function qs(name){var u=new URL(window.location.href);return u.searchParams.get(name);}

    cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/>',
    settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 007.09 4.6c.36.16.75.24 1.14.24H9a2 2 0 014 0v.09c0 .39.08.78.24 1.14a1.65 1.65 0 001.82.33h.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82c.16.36.24.75.24 1.14V12a2 2 0 010 4h-.09c-.39 0-.78.08-1.14.24z"/>',

function generateUUID(){

/* ══════════════════════ BOOT / ROUTER ══════════════════════ */
// withTimeout wraps any Supabase/fetch promise so a slow or dead network
// connection surfaces a clear, actionable error instead of leaving the page
// stuck on the loading spinner forever ("stuck on Check connection").
function withTimeout(promise,ms,label){
  ms=ms||12000;
  return Promise.race([
    promise,
    new Promise(function(_,reject){setTimeout(function(){reject(new Error((label||'Request')+' timed out — check your connection and try again'));},ms);})
  ]);
}
function renderConnectionError(msg,retryFn){
  document.getElementById('main').innerHTML=
    '<div class="centerScreen">'+
      '<div style="width:52px;height:52px;border-radius:14px;background:#fef2f2;color:var(--danger);display:flex;align-items:center;justify-content:center">'+icon('signal',24)+'</div>'+
      '<h2 style="font-size:16px">Couldn\'t load this page</h2>'+
      '<p style="color:var(--text2);font-size:12.5px;text-align:center;max-width:320px">'+esc(msg||'Check your internet connection and try again.')+'</p>'+
      '<button class="btn btnP" onclick="('+retryFn+')()">Retry</button>'+
    '</div>';
}
async function boot(){
  try{
    storeParam=qs('store');
    if(storeParam && (storeParam.toLowerCase()==='www' || storeParam.toLowerCase()==='reseller')){storeParam=null;}
    var host=window.location.hostname;
    var m=host.match(/^([a-z0-9-]+)\.globaldigits\.shop$/i);
    if(!storeParam && m && m[1]!=='www' && m[1]!=='reseller'){storeParam=m[1];}

    var sess=await withTimeout(sb.auth.getSession(),12000,'Session check');
    var user=sess.data && sess.data.session ? sess.data.session.user : null;

    if(storeParam){
      // Public storefront mode — load the reseller by username, doesn't require login.
      await loadPublicStorefront(storeParam);
      if(user){try{await loadCurrentUser(user);}catch(e){console.warn('loadCurrentUser (shopper) failed, continuing as guest browsing:',e);}}
      renderTopbar();
      return;
    }

    if(!user){
      renderTopbar();
      renderLoginScreen();
      return;
    }
    await loadCurrentUser(user);
    renderTopbar();
    await routePortal();
  }catch(e){
    console.error('boot() failed:',e);
    renderConnectionError(e.message,'boot');
  }
}
window.addEventListener('unhandledrejection',function(ev){
  // Last-resort safety net: if anything anywhere throws an unhandled promise
  // rejection while the page is still showing its initial loading spinner,
  // replace it with a retry screen instead of leaving it stuck forever.
  var mainEl=document.getElementById('main');
  if(mainEl && mainEl.querySelector('.loadSpin')){
    console.error('Unhandled error during load:',ev.reason);
    renderConnectionError((ev.reason&&ev.reason.message)||'Something went wrong loading this page.','boot');
  }
});

sb.auth.onAuthStateChange(function(event,session){
  if(event==='SIGNED_OUT'){currentUser=null;myApplication=null;myReseller=null;myActiveSub=null;renderTopbar();renderLoginScreen();}
});

async function loadCurrentUser(authUser){
  var pr=await sb.from('profiles').select('*').eq('id',authUser.id).single();
  currentUser={id:authUser.id,email:authUser.email,profile:pr.data||{}};

  var appR=await sb.from('reseller_applications').select('*').eq('user_id',authUser.id).order('created_at',{ascending:false}).limit(1).maybeSingle();
  myApplication=appR.data||null;

  var rR=await sb.from('resellers').select('*').eq('user_id',authUser.id).maybeSingle();
  myReseller=rR.data||null;

  if(myReseller){
    var subR=await sb.from('reseller_active_subscription').select('*').eq('reseller_id',myReseller.id).maybeSingle();
    myActiveSub=(subR.data && new Date(subR.data.expires_at)>new Date())?subR.data:null;
    if(myActiveSub){
      var planR=await sb.from('reseller_plans').select('*').eq('id',myActiveSub.plan_id).single();
      myPlan=planR.data||null;
      var permR=await sb.from('reseller_plan_permissions').select('product_category').eq('plan_id',myActiveSub.plan_id);
      myPermittedCats=(permR.data||[]).map(function(p){return p.product_category;});
    }
  }
}

async function routePortal(){
  if(!myApplication){renderApplyScreen();return;}
  if(myApplication.status==='pending'){renderApplicationPending();return;}
  if(myApplication.status==='rejected'){renderApplicationRejected();return;}
  // approved or suspended from here on — myReseller should exist
  if(!myReseller){renderApplicationPending();return;}
  if(myReseller.status==='suspended'){renderSuspended();return;}
  if(!myActiveSub){renderPlanSelect();return;}
  renderDashboard('overview');
}

/* ══════════════════════ TOPBAR ══════════════════════ */
function renderTopbar(){
  var el=document.getElementById('topbarRight');
  if(!currentUser){
    el.innerHTML='<a class="pillBtn" href="'+MAIN_SITE_URL+'">Main site</a>';
    return;
  }
  var initials=(currentUser.profile.name||currentUser.email||'?').trim().charAt(0).toUpperCase();
  el.innerHTML=
    (myReseller?'<button class="pillBtn" onclick="routePortal()">Dashboard</button>':'')+
    '<button class="avatarDot" onclick="doLogout()" title="Sign out — '+esc(currentUser.email)+'">'+initials+'</button>';
}
async function doLogout(){
  await sb.auth.signOut();
}

/* ══════════════════════ AUTH SCREENS ══════════════════════ */
function renderLoginScreen(){
  document.getElementById('main').innerHTML=
    '<div class="centerScreen" style="min-height:70vh">'+
      '<div style="width:56px;height:56px;border-radius:16px;background:var(--grad-premium);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-glow)">'+icon('store',26)+'</div>'+
      '<div style="text-align:center"><h1 style="font-size:19px">Reseller Portal</h1><p style="color:var(--text2);font-size:12.5px;margin-top:4px">Sign in with your Global Digits account</p></div>'+

function toggleAuthMode(){
  _authMode=_authMode==='login'?'signup':'login';

  document.getElementById('authToggleTxt').textContent=_authMode==='login'?'New here?':'Already have an account?';

async function doAuthSubmit(){
  var email=(document.getElementById('authEmail').value||'').trim();
  var pass=document.getElementById('authPass').value||'';
  if(!email||!pass){toast('Enter your email and password');return;}
  var btn=document.getElementById('authSubmitBtn');btn.disabled=true;btn.textContent='Please wait…';
  try{
    if(_authMode==='login'){
      var r=await sb.auth.signInWithPassword({email:email,password:pass});
      if(r.error){toast(r.error.message||'Sign in failed');return;}
    }else{
      if(pass.length<6){toast('Password must be at least 6 characters');return;}
      var r2=await sb.auth.signUp({email:email,password:pass});
      if(r2.error){toast(r2.error.message||'Sign up failed');return;}
      if(r2.data.user && !r2.data.session){toast('Account created — check your email to confirm, then sign in');_authMode='login';toggleAuthMode();toggleAuthMode();return;}
    }
    await loadCurrentUser((await sb.auth.getSession()).data.session.user);
    renderTopbar();
    await routePortal();
  }catch(e){
    toast(e.message||'Something went wrong');
  }finally{
    btn.disabled=false;btn.textContent=_authMode==='login'?'Sign In':'Create Account';
  }
}

var _cooldownInterval=null;
function renderApplicationRejected(){
  clearInterval(_cooldownInterval);
  var reviewedAt=myApplication.reviewed_at?new Date(myApplication.reviewed_at):null;
  var cooldownEnd=reviewedAt?new Date(reviewedAt.getTime()+24*60*60*1000):null;
  var stillCoolingDown=cooldownEnd&&cooldownEnd.getTime()>Date.now();
  document.getElementById('main').innerHTML=
    '<div class="centerScreen">'+
      '<div class="badge rejected" style="font-size:12px;padding:6px 16px">Application Rejected</div>'+
      (myApplication.admin_note?'<p style="color:var(--text2);font-size:12.5px;text-align:center;max-width:340px">'+esc(myApplication.admin_note)+'</p>':'')+
      '<p style="color:var(--text3);font-size:11.5px">Contact support if you have questions.</p>'+
      (stillCoolingDown?
        '<div style="text-align:center;margin-top:8px">'+
          '<div id="cooldownTimer" style="font-family:var(--font-d);font-size:22px;font-weight:800;color:var(--brand)">--:--:--</div>'+
          '<div style="font-size:11px;color:var(--text3);margin-top:2px">until you can reapply</div>'+
        '</div>'
        :'<button class="btn btnP" style="margin-top:8px" onclick="myApplication=null;routePortal()">Apply Again</button>')+
    '</div>';
  if(stillCoolingDown){
    var tick=function(){
      var remain=cooldownEnd.getTime()-Date.now();
      var timerEl=document.getElementById('cooldownTimer');
      if(remain<=0){
        clearInterval(_cooldownInterval);
        renderApplicationRejected(); // re-render — cooldown just expired, shows "Apply Again"
        return;
      }
      if(!timerEl)return;
      var h=Math.floor(remain/3600000),m=Math.floor((remain%3600000)/60000),s=Math.floor((remain%60000)/1000);
      timerEl.textContent=(h<10?'0':'')+h+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
    };
    tick();
    _cooldownInterval=setInterval(tick,1000);
  }
}

  document.getElementById('main').innerHTML=

      '<div class="badge suspended" style="font-size:12px;padding:6px 16px">Storefront Suspended</div>'+

async function submitWithdrawalRequest(){
  var amount=parseFloat((document.getElementById('wdAmount')||{}).value||0)||0;
  var bank=(document.getElementById('wdBank')||{}).value.trim()||'';
  var accNum=(document.getElementById('wdAccNum')||{}).value.trim()||'';
  var accName=(document.getElementById('wdAccName')||{}).value.trim()||'';
  if(!amount||amount<WD_MIN_AMOUNT){toast('Minimum withdrawal amount is '+fmtN(WD_MIN_AMOUNT));return;}
  if(!bank||!accNum||!accName){toast('Fill in all account details');return;}
  var btn=document.getElementById('wdSubmitBtn');
  if(btn){btn.disabled=true;btn.textContent='Submitting…';}
  try{
    var profR=await sb.from('profiles').select('balance').eq('id',currentUser.id).single();
    var balance=(profR.data&&profR.data.balance)||0;
    if(balance<amount)throw new Error('Insufficient balance');
    var fee=computeWithdrawalFee(amount);
    var netAmount=amount-fee;
    var reference=genWithdrawalRef();
    var newBal=balance-amount;
    await sb.from('profiles').update({balance:newBal}).eq('id',currentUser.id);
    await sb.from('withdrawals').insert({user_id:currentUser.id,amount:amount,bank:bank,
      acc_num:accNum,acc_name:accName,status:'pending',fee:fee,net_amount:netAmount,reference:reference});
    await sb.from('transactions').insert({user_id:currentUser.id,category:'withdrawal',
      title:'Withdrawal — '+bank,amount:-amount,direction:'db',status:'pending'});
    closeModal();
    toast('Withdrawal request submitted');
    renderDashWithdrawals();
  }catch(e){
    toast(e.message||'Withdrawal failed');
    if(btn){btn.disabled=false;btn.textContent='Submit Request';}
  }
}

// VTU helper — mirrors callRapidBills in main site exactly
async function storeCallRapidBills(action,payload){
  try{
    var opts={method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':generateUUID()},
      body:JSON.stringify({action,payload})};
    var res=await fetch(PROXY_URL,opts);
    var data=await res.json();
    if(res.ok&&(action==='catalog'||data.status===true||data.status==='true'||data.status==='success'||data.success===true))
      return{success:true,ref:data.tx_ref||data.reference||'',token:data.token||(data.data&&data.data.token)||'',data};
    return{success:false,message:data.message||data.error||'Transaction failed'};
  }catch(e){return{success:false,message:e.message||'Network error'};}
}
async function storeSmmCall(action,payload){
  try{
    var res=await fetch(SMM_PROXY_URL,{method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY},
      body:JSON.stringify({action,payload:payload||{}})});
    var data=await res.json();
    if(!res.ok||data.error)return{success:false,message:data.error||'Provider error',data};
    return{success:true,data};
  }catch(e){return{success:false,message:e.message||'Network error'};}
}
async function loadVtuCatalog(){
  if(_vtuCatalog)return _vtuCatalog;
  if(_vtuCatalogLoading)return null;
  _vtuCatalogLoading=true;
  try{
    var r=await storeCallRapidBills('catalog',{});
    _vtuCatalogLoading=false;
    if(r.success&&r.data){_vtuCatalog=buildVtuBuckets(r.data);return _vtuCatalog;}
    return null;
  }catch(e){_vtuCatalogLoading=false;return null;}
}
function buildVtuBuckets(raw){
  var buckets={};
  function isRec(x){return x&&typeof x==='object'&&!Array.isArray(x);}
  function hasFields(x){
    var keys=Object.keys(x).map(function(k){return k.toLowerCase();});
    return keys.some(function(k){return['name','provider','network','label','plan','size','bundle'].indexOf(k)!==-1;})&&
           keys.some(function(k){return['price','amount','id','bundle_id','plan_id'].indexOf(k)!==-1;});
  }
  function walk(node,path){
    if(Array.isArray(node)){
      if(node.length&&isRec(node[0])&&hasFields(node[0])){if(!buckets[path])buckets[path]=[];buckets[path]=buckets[path].concat(node);}
      else node.forEach(function(x){if(isRec(x))walk(x,path);});
    }else if(isRec(node)){Object.keys(node).forEach(function(k){walk(node[k],path?path+' > '+k:k);});}
  }
  walk(raw,'');return buckets;
}
function vtuFindProvider(catalog,kind,name){
  if(!catalog)return null;
  var nu=name.toUpperCase();
  var keys=Object.keys(catalog);
  var pref=keys.filter(function(k){return k.toLowerCase().indexOf(kind.toLowerCase())!==-1;});
  var search=pref.length?pref:keys;
  for(var bi=0;bi<search.length;bi++){
    var items=catalog[search[bi]]||[];
    for(var i=0;i<items.length;i++){
      var p=items[i];
      var fields=[p.name,p.provider,p.network,p.label,p.title,p.disco].filter(Boolean);
      for(var f=0;f<fields.length;f++){if(fields[f].toString().toUpperCase().indexOf(nu)!==-1)return p.id||p.provider_id||p.ID;}
    }
  }
  return null;
}
function parseSizeMB(s){
  if(!s)return null;
  var m=s.toString().toUpperCase().match(/([\d.]+)\s*(MB|GB)/);
  if(!m)return null;
  var n=parseFloat(m[1]);return isNaN(n)?null:(m[2]==='GB'?n*1024:n);
}
function vtuDataBundles(catalog,net){
  if(!catalog)return[];
  var all=[];
  Object.keys(catalog).filter(function(k){var l=k.toLowerCase();return l.indexOf('bundle')!==-1||l.indexOf('data')!==-1;})
    .forEach(function(k){all=all.concat(catalog[k]);});
  return all.filter(function(p){
    var fields=[p.network,p.provider,p.network_name,p.service_provider];
    return fields.some(function(f){return f&&f.toString().toUpperCase().indexOf(net)!==-1;});
  });
}
function vtuClassifyDur(plan){
  var v=(plan.validity||plan.duration||'').toString().toLowerCase();
  if(v.indexOf('month')!==-1)return 'monthly';
  if(v.indexOf('week')!==-1)return 'weekly';
  var nm=v.match(/(\d+)/);var n=nm?parseInt(nm[1]):null;
  if(n===null)return 'monthly';
  if(n<=3)return 'daily';if(n<30)return 'weekly';return 'monthly';
}

  if(_smmCatalogCache&&(Date.now()-_smmCatalogTime)<10*60*1000)return _smmCatalogCache;
  var r=await storeSmmCall('services',{});

async function resolveBoostService(platform,boostType,refillType){
  var catalog=await getSmmCatalog();if(!catalog)return null;
  var pKeys={Instagram:['instagram','insta'],TikTok:['tiktok'],Facebook:['facebook'],YouTube:['youtube'],Twitter:['twitter','x.com']};
  var tKeys={Followers:['follower'],Likes:['like'],Views:['view'],Comments:['comment'],Shares:['share']};
  var pk=pKeys[platform]||[platform.toLowerCase()];
  var tk=tKeys[boostType]||[boostType.toLowerCase()];
  var wantRefill=refillType==='refill';
  function txt(s){return((s.name||'')+' '+(s.category||'')).toLowerCase();}
  var matches=catalog.filter(function(s){return pk.some(function(k){return txt(s).indexOf(k)>-1;})&&tk.some(function(k){return txt(s).indexOf(k)>-1;});});
  if(!matches.length)return null;
  var pool=matches.filter(function(s){return wantRefill?(s.refill||txt(s).indexOf('refill')>-1):(!s.refill&&txt(s).indexOf('refill')===-1);});
  if(!pool.length)pool=matches;
  return pool[0];
}

function getBoostRate(prices,type,refill){
  var key=type+'|'+refill;if(prices[key]!==undefined)return prices[key];
  var def={Followers:5,Likes:3,Views:1.5,Comments:8,Shares:4};
  var base=def[type]||5;return refill==='refill'?Math.round(base*1.3*100)/100:base;
}

async function submitStoreBoost(){
  if(!currentUser){showSignInModal();return;}
  var target=(document.getElementById('storeBoostTarget')||{}).value||'';
  target=target.trim();
  if(!target){toast('Enter the profile URL or username');return;}
  _boostState.qty=parseInt((document.getElementById('storeBoostQty')||{}).value||500);
  var markup=Number(viewingReseller.default_markup_percent||0);
  var rate=getBoostRate(_boostState.prices||{},_boostState.type,_boostState.refill);
  var baseCost=Math.round(rate*_boostState.qty/1000);
  var custCost=Math.round(baseCost*(1+markup/100));
  var btn=document.querySelector('#storeProdArea .btn.btnP[onclick="submitStoreBoost()"]');
  if(btn){btn.disabled=true;btn.textContent='Placing order…';}
  try{
    var prR=await sb.from('profiles').select('balance').eq('id',currentUser.id).single();
    if(!prR.data||prR.data.balance<custCost){toast('Insufficient balance — add funds on the main site');return;}
    var customerId=await ensureStoreCustomer();
    var resR=await sb.rpc('place_reseller_order',{
      p_reseller_id:viewingReseller.id,p_customer_id:customerId,
      p_product_category:'boost',p_product_ref:_boostState.plat+'|'+_boostState.type+'|'+_boostState.refill,
      p_base_price:baseCost,p_markup_percent:markup
    });
    if(resR.error){toast(resR.error.message||'Could not place order');return;}
    var resellerOrderId=resR.data;
    // Debit wallet + create boost_orders row mirroring main site
    await sb.from('profiles').update({balance:prR.data.balance-custCost}).eq('id',currentUser.id);
    var boR=await sb.from('boost_orders').insert({
      user_id:currentUser.id,platform:_boostState.plat,boost_type:_boostState.type,
      quantity:_boostState.qty,target_url:target,amount:custCost,
      status:'pending',refill_type:_boostState.refill
    }).select().single();
    if(boR.error){
      await sb.rpc('fail_reseller_order',{p_order_id:resellerOrderId,p_reason:boR.error.message});
      toast('Order failed: '+boR.error.message);return;
    }
    await sb.rpc('complete_reseller_order',{
      p_order_id:resellerOrderId,p_provider_reference:boR.data.id,
      p_underlying_table:'boost_orders',p_underlying_id:boR.data.id
    });
    toast('Boost order placed! Processing starts within 1–6 hours.');
    document.getElementById('storeBoostTarget').value='';
  }catch(e){toast(e.message||'Something went wrong');}
  finally{if(btn){btn.disabled=false;btn.textContent='Place Order';}}
}

    var markup=Number(viewingReseller.default_markup_percent||0);
    var customerId=await ensureStoreCustomer();
    var resR=await sb.rpc('place_reseller_order',{
      p_reseller_id:viewingReseller.id,p_customer_id:customerId,
      p_product_category:'esim',p_product_ref:planId,
      p_base_price:basePrice,p_markup_percent:markup
    });

    var ref='ESIM-'+Date.now();

      user_id:currentUser.id,plan_id:planId,plan_name:planName,country:country,

function renderStoreDataPlans(){
  var el=document.getElementById('storeDataPlansGrid');if(!el)return;
  if(!_vtuCatalog){el.innerHTML='<p class="empty" style="grid-column:1/-1">Loading plans…</p>';loadVtuCatalog().then(renderStoreDataPlans);return;}
  var markup=Number(viewingReseller.default_markup_percent||0);
  var all=vtuDataBundles(_vtuCatalog,_vtuDataNet.toUpperCase());
  var plans=all.filter(function(p){return vtuClassifyDur(p)===_vtuDataDur&&(+(p.price||p.amount||0))>=50;});
  var seen={};plans=plans.filter(function(p){var k=(p.size||p.bundle||p.name||'')+'|'+(+(p.price||p.amount||0));if(seen[k])return false;seen[k]=true;return true;});
  plans.sort(function(a,b){var aM=parseSizeMB(a.size||a.bundle||a.name||'')||0,bM=parseSizeMB(b.size||b.bundle||b.name||'')||0;return aM!==bM?aM-bM:(+(a.price||a.amount||0))-(+(b.price||b.amount||0));});
  if(!plans.length){el.innerHTML='<p class="empty" style="grid-column:1/-1">No '+_vtuDataDur+' plans for '+_vtuDataNet+'</p>';el._plans=[];return;}
  el.innerHTML=plans.map(function(p,i){
    var lbl=p.size||p.bundle||p.label||p.name||'Plan';
    var rawPrice=+(p.price||p.amount||0);
    var custPrice=Math.round((rawPrice+10)*(1+markup/100));
    var sel=(_vtuDataPlan&&_vtuDataPlan===p);
    return '<div class="prodCard'+(sel?' active':'')+'" onclick="setStoreDataPlan('+i+',this)" style="'+(sel?'border-color:var(--brand);':'')+'cursor:pointer">'+
      '<div style="font-weight:700;font-size:12.5px">'+esc(lbl)+'</div>'+
      (p.validity?'<div style="font-size:11px;color:var(--text2)">'+esc(p.validity)+'</div>':'')+
      '<div style="font-family:var(--font-d);font-weight:800;color:var(--brand);font-size:15px">'+fmtN(custPrice)+'</div>'+
    '</div>';
  }).join('');
  el._plans=plans;
}
function setStoreDataPlan(idx,el){
  var grid=document.getElementById('storeDataPlansGrid');
  _vtuDataPlan=(grid&&grid._plans)?grid._plans[idx]:null;
  document.querySelectorAll('#storeDataPlansGrid .prodCard').forEach(function(c){c.classList.remove('active');c.style.borderColor='';});
  if(el){el.classList.add('active');el.style.borderColor='var(--brand)';}
}
function renderStoreCablePlans(){
  var sel=document.getElementById('storeVtuCablePlan');if(!sel)return;
  if(!_vtuCatalog){sel.innerHTML='<option value="">-- Loading... --</option>';return;}
  var markup=Number(viewingReseller.default_markup_percent||0);
  var prov=_vtuCable.toUpperCase();
  var all=[];
  Object.keys(_vtuCatalog).filter(function(k){return k.toLowerCase().indexOf('cable')!==-1||k.toLowerCase().indexOf(prov.toLowerCase())!==-1;})
    .forEach(function(k){all=all.concat(_vtuCatalog[k]);});
  var plans=all.filter(function(p){return(p.provider||p.network||p.name||'').toString().toUpperCase().indexOf(prov)!==-1;});
  if(!plans.length&&all.length)plans=all;
  var seen={};plans=plans.filter(function(p){var k=(p.name||p.plan||p.label||'')+'|'+(+(p.price||p.amount||0));if(seen[k])return false;seen[k]=true;return true;});
  plans.sort(function(a,b){return(+(a.price||a.amount||0))-(+(b.price||b.amount||0));});
  if(!plans.length){sel.innerHTML='<option value="">-- No packages found --</option>';sel._plans=[];return;}
  sel.innerHTML='<option value="">-- Select Package --</option>'+plans.map(function(p,i){
    var name=p.name||p.plan||p.label||'Package';
    var custPrice=Math.round((+(p.price||p.amount||0)+10)*(1+markup/100));
    return '<option value="'+i+'">'+esc(name)+' — '+fmtN(custPrice)+'</option>';
  }).join('');
  sel._plans=plans;calcStoreCable();
}
function calcStoreCable(){
  var sel=document.getElementById('storeVtuCablePlan');
  var plans=(sel&&sel._plans)||[];
  var idx=sel?parseInt(sel.value):NaN;
  var el=document.getElementById('storeCableCost');
  if(!isNaN(idx)&&plans[idx]&&el){
    var markup=Number(viewingReseller.default_markup_percent||0);
    var custPrice=Math.round((+(plans[idx].price||plans[idx].amount||0)+10)*(1+markup/100));
    el.textContent=fmtN(custPrice);
  }else if(el)el.textContent='—';
}

// VTU submit functions — all debit shopper wallet, call real API proxy, record transaction
async function submitStoreAirtime(){
  if(!currentUser){showSignInModal();return;}
  var phone=(document.getElementById('storeVtuPhone')||{}).value||'';
  var chip=document.querySelector('#storeAirtimeChips .catChip.active');
  var custom=parseFloat((document.getElementById('storeAirtimeAmt')||{}).value||0)||0;
  var amount=chip?parseInt(chip.textContent.replace(/\D/g,'')):custom;
  if(!phone||phone.length<11){toast('Enter a valid 11-digit phone number');return;}
  if(!amount||amount<100){toast('Minimum airtime is ₦100');return;}
  var markup=Number(viewingReseller.default_markup_percent||0);
  var custAmt=Math.round((amount+10)*(1+markup/100));
  var prR=await sb.from('profiles').select('balance').eq('id',currentUser.id).single();
  if(!prR.data||prR.data.balance<custAmt){toast('Insufficient balance');return;}
  var catalog=await loadVtuCatalog();
  var providerId=catalog?vtuFindProvider(catalog,'airtime',_vtuNet):null;
  if(!providerId){toast('Could not find '+_vtuNet+' provider — try again shortly');return;}
  var btn=document.querySelector('#storeVtuBody .btn.btnP[onclick="submitStoreAirtime()"]');
  if(btn){btn.disabled=true;btn.textContent='Buying…';}
  try{
    var customerId=await ensureStoreCustomer();
    var resR=await sb.rpc('place_reseller_order',{p_reseller_id:viewingReseller.id,p_customer_id:customerId,p_product_category:'vtu',p_product_ref:'airtime|'+_vtuNet,p_base_price:amount+10,p_markup_percent:markup});
    if(resR.error){toast(resR.error.message||'Order error');return;}
    var r=await storeCallRapidBills('buy-airtime',{provider_id:providerId,number:phone,amount,wallet:'main'});
    if(!r.success){await sb.rpc('fail_reseller_order',{p_order_id:resR.data,p_reason:r.message});toast('❌ '+r.message);return;}
    await sb.from('profiles').update({balance:prR.data.balance-custAmt}).eq('id',currentUser.id);
    await sb.from('vtu_transactions').insert({user_id:currentUser.id,type:'airtime',description:_vtuNet+' Airtime ₦'+amount+' → '+phone,amount:custAmt,network:_vtuNet,phone,status:'successful',api_ref:r.ref||''});
    await sb.rpc('complete_reseller_order',{p_order_id:resR.data,p_provider_reference:r.ref||generateUUID(),p_underlying_table:'vtu_transactions',p_underlying_id:null});
    toast('✅ Airtime purchase successful!');
    document.getElementById('storeVtuPhone').value='';
    document.querySelectorAll('#storeAirtimeChips .catChip').forEach(function(c){c.classList.remove('active');});
  }catch(e){toast(e.message||'Something went wrong');}
  finally{if(btn){btn.disabled=false;btn.textContent='Buy Airtime';}}
}

  try{
    var customerId=await ensureStoreCustomer();
    var resR=await sb.rpc('place_reseller_order',{p_reseller_id:viewingReseller.id,p_customer_id:customerId,p_product_category:cat,p_product_ref:String(p.ref),p_base_price:totalBase,p_markup_percent:markup});
    if(resR.error){toast(resR.error.message||'Could not place order');return;}
    var resellerOrderId=resR.data;
    var real;
    if(cat==='numbers'){
      real=await sb.rpc('purchase_number_batch',{p_user_id:currentUser.id,p_tier_id:p.ref,p_tier_name:p.name,p_country:p.sub,p_flag:'',p_qty:qty,p_unit_price:unitCust,p_total_price:totalCust});
    }else if(cat==='accounts'){
      real=await sb.rpc('purchase_sm_batch',{p_user_id:currentUser.id,p_type_id:p.ref,p_platform:p.sub,p_type:p.name,p_qty:qty,p_unit_price:unitCust,p_total_price:totalCust});
    }
    if(real&&real.error){
      await sb.rpc('fail_reseller_order',{p_order_id:resellerOrderId,p_reason:real.error.message||'provider error'});
      toast(real.error.message||'Order failed');return;
    }
    var underlyingId=null;
    if(real&&real.data){
      if(real.data.id)underlyingId=real.data.id;
      else if(Array.isArray(real.data)&&real.data[0])underlyingId=real.data[0].id||null;
    }
    await sb.rpc('complete_reseller_order',{p_order_id:resellerOrderId,p_provider_reference:generateUUID(),p_underlying_table:cat==='numbers'?'orders':'acc_orders',p_underlying_id:underlyingId});
    closeModal();toast('Order placed! Check the main site for delivery.');
  }catch(e){toast(e.message||'Something went wrong');}
  finally{if(btn){btn.disabled=false;btn.textContent='Confirm Purchase';}}
}

function showSignInModal(){
  showModal('<div class="modalHead"><h3>Sign In Required</h3><button class="xBtn" onclick="closeModal()">✕</button></div>'+
    '<p style="font-size:12.5px;color:var(--text2);margin-bottom:14px">Sign in with your Global Digits account to check out. Purchases are paid from your wallet balance.</p>'+
    '<button class="btn btnP btnBlock" onclick="closeModal();renderLoginScreen()">Sign In</button>');
}
async function ensureStoreCustomer(){
  var ex=await sb.from('reseller_customers').select('id').eq('reseller_id',viewingReseller.id).eq('auth_user_id',currentUser.id).maybeSingle();
  if(ex.data)return ex.data.id;
  var cr=await sb.from('reseller_customers').insert({reseller_id:viewingReseller.id,auth_user_id:currentUser.id,name:currentUser.profile.name||null,email:currentUser.email}).select('id').single();
  return cr.data?cr.data.id:null;
}

boot();
