<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#1a56db"/>
<meta name="robots" content="noindex"/>
<title>Transaction History — Global Digits</title>
<link rel="icon" type="image/x-icon" href="favicon.ico"/>
<link rel="manifest" href="site.webmanifest"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --brand:#1a56db;--brand-dk:#1342b0;--brand-lt:#e8f0ff;
  --danger:#ef4444;--warn:#f59e0b;--success:#10b981;
  --bg:#f4f7fd;--surface:#fff;--surface2:#eef3fc;--border:#e3eaf6;
  --text:#0d1321;--text2:#586180;--text3:#94a0b8;
  --r:12px;--r-sm:8px;--r-lg:16px;
  --shadow:0 1px 2px rgba(15,25,50,.04),0 8px 18px -14px rgba(26,86,219,.28);
  --shadow-md:0 10px 32px rgba(26,86,219,.22);
  --font:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--font-d:var(--font);
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --t:.18s ease;--ease:cubic-bezier(.32,.72,0,1);
  --grad-premium:linear-gradient(135deg,#3b7bf2 0%,#1a56db 60%,#1342b0 100%);
  --ring-lt:#eaf2ff;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);font-size:12px;line-height:1.4;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3{font-weight:600!important;letter-spacing:-.01em}
button{cursor:pointer;font-family:var(--font);border:none;background:none;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
input{font-family:var(--font);font-size:13px}
.hidden{display:none!important}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
#appShell{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}

/* top bar */
#tb{position:sticky;top:0;z-index:20;height:48px;background:rgba(255,255,255,.82);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 12px}
#tbBack{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--text);transition:background var(--t);flex-shrink:0}
#tbBack:hover,#tbBack:active{background:var(--surface2)}
#tbTitle{font-size:14px;font-weight:600;letter-spacing:-.01em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:12px}

/* search */
.searchBar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:0 12px;height:40px;margin-bottom:12px;transition:border-color var(--t),box-shadow var(--t)}
.searchBar:focus-within{border-color:#b9cdf5;box-shadow:0 0 0 3px rgba(26,86,219,.10)}
.searchBar svg{flex-shrink:0;color:var(--text3)}
.searchBar input{flex:1;min-width:0;border:none;outline:none;background:none;color:var(--text)}
.searchBar input::placeholder{color:var(--text3)}
.searchClear{flex-shrink:0;color:var(--text3);padding:4px;border-radius:8px}

/* currency filter — segmented */
.curFilterBar{display:flex;gap:2px;margin:-2px 0 12px;padding:3px;background:var(--surface2);border-radius:12px;width:max-content;max-width:100%}
.curFilterPill{padding:6px 14px;border-radius:9px;color:var(--text2);font-size:11px;font-weight:600;transition:background var(--t),color var(--t),box-shadow var(--t)}
.curFilterPill.active{background:var(--surface);color:var(--brand);box-shadow:0 1px 2px rgba(15,25,50,.08),0 0 0 1px rgba(26,86,219,.08)}

/* date group */
.dateGroupLabel{font-size:11px;font-weight:600;color:var(--text2);margin:16px 2px 8px}
.dateGroupLabel:first-child{margin-top:0}

/* transaction card */
.histCard{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:10px 12px;margin-bottom:7px;box-shadow:var(--shadow);transition:transform .2s var(--ease),background var(--t);cursor:pointer;-webkit-tap-highlight-color:transparent}
.histCard:active{transform:scale(.985);background:#f9fbff}
@media (hover:hover){.histCard:hover{border-color:#cfdcf5}}
.histIco{flex-shrink:0;width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.histIco svg{width:17px;height:17px}
.histIco.cr{background:linear-gradient(150deg,#e7faee,#d3f4e0);color:#16a34a;box-shadow:inset 0 0 0 1px rgba(22,163,74,.12)}
.histIco.db{background:linear-gradient(150deg,#f1f6ff,#dfeaff);color:var(--brand);box-shadow:inset 0 0 0 1px rgba(26,86,219,.12)}
.histMain{flex:1;min-width:0}
.histTitle{font-size:12px;font-weight:600;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.histMeta{font-size:10px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.histRight{flex-shrink:0;text-align:right}
.histAmt{font-size:12.5px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.histAmt.cr{color:#16a34a}
.histAmt.db{color:var(--text)}
.histBadge{display:inline-block;margin-top:3px;padding:2px 7px;border-radius:100px;font-size:9.5px;font-weight:600;line-height:1.35}
.histBadge.success,.histBadge.successful,.histBadge.approved,.histBadge.completed,.histBadge.active{background:#dcfce7;color:#15803d}
.histBadge.pending,.histBadge.processing,.histBadge.reviewing{background:#fef3c7;color:#92400e}
.histBadge.failed,.histBadge.rejected,.histBadge.cancelled{background:#fee2e2;color:#991b1b}

/* skeleton / empty */
.skel{background:linear-gradient(90deg,var(--surface2) 25%,var(--border) 37%,var(--surface2) 63%);background-size:400% 100%;animation:skel 1.4s ease infinite;border-radius:var(--r-lg)}
@keyframes skel{0%{background-position:100% 50%}100%{background-position:0 50%}}
.emptyState{text-align:center;padding:52px 20px}
.emptyState .eIcon{width:56px;height:56px;border-radius:18px;background:linear-gradient(150deg,#f1f6ff,#dfeaff);box-shadow:inset 0 0 0 1px rgba(26,86,219,.12);color:var(--brand);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.emptyState h3{font-size:13px;font-weight:600}
.emptyState p{font-size:11px;color:var(--text2);margin-top:4px}
.errState{text-align:center;padding:36px 20px;color:var(--danger);font-size:11.5px}
.errState button{margin-top:8px;color:var(--brand);font-weight:600;text-decoration:underline}

/* ══ RECEIPT — shared invoice design system (every receipt type renders through this) ══ */
#appShell:has(#view-receipt:not(.hidden)){max-width:920px}
#appShell:has(#view-receipt:not(.hidden)) main{background:linear-gradient(180deg,#f7faff 0%,var(--bg) 100%)}
.rcptWrap{max-width:860px;margin:0 auto;--navy:#0a1f5c}
.rcptInvoice{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:16px;box-shadow:0 1px 2px rgba(15,25,50,.04),0 18px 40px -20px rgba(26,86,219,.28);color:var(--navy)}
.invHead{display:flex;flex-direction:column;gap:14px;padding:6px 4px 14px}
.invBrand{display:flex;align-items:center;gap:10px;min-width:0}
.invLogo{width:44px;height:44px;object-fit:contain;flex-shrink:0;display:block}
.invBrandName{font-size:19px;font-weight:700;letter-spacing:-.02em;color:var(--navy);white-space:nowrap}
.invMeta{display:flex;flex-direction:column;gap:5px}
.invKicker{font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text2)}
.invRefRow{display:flex;align-items:center;gap:6px;min-width:0}
.invRef{font-size:14px;font-weight:700;color:var(--brand);letter-spacing:-.01em;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcptCopyBtn{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text2);flex-shrink:0;transition:background var(--t),color var(--t)}
.rcptCopyBtn:active{background:var(--surface2)}
.rcptCopyBtn.done{color:#15803d;border-color:#bbf7d0;background:#f0fdf4}
.invDate{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)}
.invDate svg{flex-shrink:0;color:var(--text3)}
.invTypeTag{align-self:flex-start;background:var(--brand-lt);color:var(--brand);font-size:10px;font-weight:600;padding:3px 9px;border-radius:100px}

.invStatus{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#f1f6ff;border:1px solid #e1ebfd;border-radius:16px;padding:12px 14px;margin-bottom:16px}
.invStatusIco{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--brand);color:#fff;box-shadow:0 8px 16px -8px rgba(26,86,219,.6)}
.invStatusIco svg{width:21px;height:21px}
.invStatusTxt{flex:1;min-width:160px}
.invStatusTitle{font-size:15px;font-weight:700;letter-spacing:-.015em;color:var(--navy)}
.invStatusMsg{font-size:11.5px;color:var(--text2);margin-top:2px;word-break:break-word}
.invStatus.warn{background:#fffaf0;border-color:#fde8bd}.invStatus.warn .invStatusIco{background:var(--warn);box-shadow:0 8px 16px -8px rgba(245,158,11,.7)}
.invStatus.err{background:#fff5f5;border-color:#fcd5d5}.invStatus.err .invStatusIco{background:var(--danger);box-shadow:0 8px 16px -8px rgba(239,68,68,.65)}
.invStatus.neutral{background:#f6f7fb;border-color:var(--border)}.invStatus.neutral .invStatusIco{background:var(--text3);box-shadow:none}
.invPill{padding:5px 14px;border-radius:100px;font-size:11.5px;font-weight:600;background:#dcfce7;color:#15803d}
.invStatus.warn .invPill{background:#fef3c7;color:#92400e}
.invStatus.err .invPill{background:#fee2e2;color:#991b1b}
.invStatus.neutral .invPill{background:#e5e9f2;color:var(--text2)}

.invGrid{display:grid;grid-template-columns:1fr;gap:18px}
.invSecHead{font-size:14px;font-weight:700;letter-spacing:-.015em;color:var(--navy);margin-bottom:4px}
.invSecHead.sub{margin-top:18px}
.rcptRow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:12px}
.rcptRow:last-child{border-bottom:none}
.rcptRow .rIco{width:18px;height:18px;color:var(--text3);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.rcptRow .rIco svg{width:17px;height:17px}
.rcptRow .rLbl{color:var(--text2);font-weight:500;flex:1;min-width:0}
.rcptRow .rVal{color:var(--navy);font-weight:600;text-align:right;word-break:break-word;max-width:62%;font-variant-numeric:tabular-nums}
.rcptRow .rVal.mono{font-family:var(--mono);font-size:11px;font-weight:500}
.invSummary{background:linear-gradient(180deg,#f7faff,#f1f6ff);border:1px solid #e1ebfd;border-radius:16px;padding:16px;align-self:start}
.invBig{font-size:34px;font-weight:700;letter-spacing:-.035em;line-height:1.1;color:var(--navy);margin-top:6px;font-variant-numeric:tabular-nums;word-break:break-word}
.invBigLbl{font-size:12.5px;font-weight:600;color:var(--navy);margin-top:8px}
.invState{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;margin-top:6px;color:#15803d}
.invState i{width:7px;height:7px;border-radius:50%;background:currentColor;display:block}
.invState.warn{color:#b45309}.invState.err{color:#b91c1c}.invState.neutral{color:var(--text2)}
.invSumLines{border-top:1px solid var(--border);margin-top:14px;padding-top:4px}
.invSumNote{margin-top:12px;font-size:11.5px;color:var(--text2);text-align:center;line-height:1.5}
.invFoot{margin-top:18px;background:#f4f8ff;border:1px solid #e6eefc;border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.invFoot .invLogo{width:30px;height:30px}
.invFoot .invBrandName{font-size:14px}
.invFootTxt{font-size:11px;color:var(--text2);line-height:1.45}
.invThanks{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:14px;font-size:11.5px;color:var(--text2);text-align:center}
.invThanks::before,.invThanks::after{content:"";height:1px;width:28px;background:var(--border);flex-shrink:0}
.rcptActions{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.rcptDownloadBtn{width:100%;background:var(--grad-premium);color:#fff;border:none;border-radius:999px;height:50px;padding:0 16px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 12px 22px -12px rgba(26,86,219,.75);transition:transform .2s var(--ease),opacity var(--t)}
.rcptDownloadBtn:active{transform:scale(.98)}
.rcptDownloadBtn[disabled]{opacity:.7}
.rcptDownloadBtn svg{width:17px;height:17px}
.rcptVisitBtn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:999px;border:1.5px solid #bcd0f7;background:var(--surface);color:var(--brand);font-size:13.5px;font-weight:600}
.rcptVisitBtn:active{background:var(--brand-lt)}
@media (min-width:720px){
  main{padding:20px}
  .rcptInvoice{padding:28px 30px}
  .invHead{flex-direction:row;justify-content:space-between;align-items:flex-start}
  .invMeta{align-items:flex-end;text-align:right}
  .invTypeTag{align-self:flex-end}
  .invLogo{width:52px;height:52px}
  .invBrandName{font-size:23px}
  .invGrid{grid-template-columns:1.35fr 1fr;gap:26px}
  .rcptActions{flex-direction:row}
  .rcptActions>*{flex:1}
}
@media print{
  body *{visibility:hidden}
  #view-receipt,#view-receipt *{visibility:visible}
  #view-receipt{position:absolute;left:0;top:0;width:100%}
  .rcptActions,#tb,.rcptCopyBtn{display:none!important}
  .rcptInvoice{box-shadow:none}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="appShell">
  <header id="tb">
    <button id="tbBack" onclick="goBack()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span id="tbTitle">History</span>
  </header>

  <main>
    <!-- ══ LIST VIEW ══ -->
    <div id="view-list" class="view hidden">
      <div class="searchBar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search by title, reference or amount" oninput="handleSearch()"/>
        <button class="searchClear hidden" id="searchClearBtn" onclick="clearSearch()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="curFilterBar" class="curFilterBar hidden">
        <button class="curFilterPill active" data-cur="" onclick="setCurrencyFilter('')">All</button>
        <button class="curFilterPill" data-cur="ngn" onclick="setCurrencyFilter('ngn')">NGN</button>
        <button class="curFilterPill" data-cur="usd" onclick="setCurrencyFilter('usd')">USD</button>
        <button class="curFilterPill" data-cur="usdt" onclick="setCurrencyFilter('usdt')">USDT</button>
      </div>
      <div id="listBody">
        <div class="skel" style="height:66px;margin-bottom:9px"></div>
        <div class="skel" style="height:66px;margin-bottom:9px"></div>
        <div class="skel" style="height:66px;margin-bottom:9px"></div>
      </div>
    </div>

    <!-- ══ RECEIPT VIEW ══ -->
    <div id="view-receipt" class="view hidden"></div>
  </main>

</div>

<script>
const SUPA_URL='https://pzronmbvusjwrcizxwef.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6cm9ubWJ2dXNqd3JjaXp4d2VmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNTE0MjUsImV4cCI6MjA5NDYyNzQyNX0.v6bz5YeLWKzRN4g09QYTY0x-ur5KGfeXupglKfTVKwA';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
var currentUser=null;

// One config object drives everything about each history type — the table
// it reads from, any fixed filter, its icon/color, and copy. Nothing about
// individual transactions is ever hardcoded here; only *how to query and
// label the category* is configured, the actual rows always come from
// Supabase.
var TYPE_CONFIG={
  vtu:{
    label:'VTU History',
    table:'vtu_transactions',
    filter:null,
    accent:'indigo',
    emptyTitle:'No VTU transactions yet',
    emptyText:'Your airtime, data, cable and electricity purchases will show up here.',
    icon:'<rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/>'
  },
  purchase:{
    label:'Purchase History',
    table:'transactions',
    filter:{category:'purchase'},
    accent:'blue',
    emptyTitle:'No purchases yet',
    emptyText:'Numbers, boosts, social accounts and other orders will show up here.',
    icon:'<path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/>'
  },
  refund:{
    label:'Refund History',
    table:'transactions',
    filter:{category:'refund'},
    accent:'amber',
    emptyTitle:'No refunds yet',
    emptyText:'Refunds from failed or cancelled purchases will show up here.',
    icon:'<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>'
  },
  deposit:{
    label:'Deposit History',
    table:'deposits',
    filter:null,
    accent:'teal',
    emptyTitle:'No deposits yet',
    emptyText:'Your wallet funding requests and their approval status will show up here.',
    icon:'<polyline points="18 15 12 9 6 15"/>'
  },
  conversion:{
    label:'Conversion History',
    table:'transactions',
    filter:{category:'usd_to_ngn_conversion'},
    accent:'blue',
    emptyTitle:'No conversions yet',
    emptyText:'Your USD to NGN conversions will show up here.',
    icon:'<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 014-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 01-4 4H3"/>'
  }
};

var currentType=null;
var currencyFilter='';  // '', 'ngn', 'usd', 'usdt' — deposit list only
var allRows=[];       // normalized rows for the current type
var rawRowsById={};   // id -> raw db row, for the receipt view

function cap(s){return s?String(s).charAt(0).toUpperCase()+String(s).slice(1):s;}
function fmtDate(d){try{return new Date(d).toLocaleDateString('en-NG',{day:'numeric',month:'short',year:'numeric'});}catch(e){return d||'';}}
function fmtTime(d){try{return new Date(d).toLocaleTimeString('en-NG',{hour:'2-digit',minute:'2-digit'});}catch(e){return'';}}
function fmtMoney(n){return(+n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});}
function copyText(t){
  try{navigator.clipboard.writeText(t);}catch(e){}
}

// Currency-aware amount formatting — used everywhere an amount is shown,
// so NGN/USD/USDT deposits and USD-wallet purchases never all get
// stamped with a ₦ sign regardless of what currency they're actually in.
// currency defaults to 'ngn' for rows that predate multi-currency support.
// Maps any stored currency spelling to one canonical code: 'ngn' | 'usd' | 'usdt' (or the row's own
// code, lower-cased, if it is something else — never silently turned into NGN).
function canonCur(v){
  if(v===undefined||v===null)return '';
  var c=String(v).trim().toLowerCase();
  if(!c)return '';
  if(c==='ngn'||c==='naira'||c==='\u20a6'||c==='nigerian naira')return 'ngn';
  if(c==='usd'||c==='$'||c==='dollar'||c==='us dollar')return 'usd';
  if(c.indexOf('usdt')===0||c==='tether'||c==='trc20'||c==='bep20'||c==='erc20')return 'usdt';
  return c;
}
// Currency of a real DB row.
// 1) Strong USDT evidence anywhere on the row (a usdt/tether/crypto column with a value, or a
//    usdt/tether/TRC20/BEP20/ERC20 mention in any text field) wins even over a default 'ngn'
//    stored in the currency column — that column is often just the wallet default.
// 2) Otherwise the explicit currency columns decide.
// 3) Rows with nothing at all predate multi-currency support and are NGN.
var USDT_RE=/usdt|tether|trc-?20|bep-?20|erc-?20/i;
function usdtEvidence(row){
  for(var k in row){
    if(!Object.prototype.hasOwnProperty.call(row,k))continue;
    var v=row[k];
    if(v===undefined||v===null||v==='')continue;
    if(/usdt|tether|crypto|trc-?20|bep-?20|erc-?20/i.test(k)&&v!==false&&v!==0&&v!=='0')return true;
    if(typeof v==='string'&&v.length<300&&USDT_RE.test(v))return true;
  }
  return false;
}
function detectCur(row){
  if(!row)return 'ngn';
  var keys=['currency','currency_code','wallet_currency','coin','asset','token_symbol'];
  var explicit='';
  for(var i=0;i<keys.length&&!explicit;i++)explicit=canonCur(row[keys[i]]);
  if(explicit&&explicit!=='ngn')return explicit;       // usd / usdt / other stay as stored
  return usdtEvidence(row)?'usdt':'ngn';
}
function curSym(currency){currency=canonCur(currency)||'ngn';return currency==='usdt'?'':(currency==='usd'?'$':(currency==='ngn'?'\u20a6':''));}
function fmtCur(amount,currency){
  var n=Math.abs(+amount||0);
  currency=canonCur(currency)||'ngn';
  if(currency==='usdt')return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:4})+' USDT';
  if(currency==='usd')return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  if(currency==='ngn')return '\u20a6'+n.toLocaleString('en-NG',{minimumFractionDigits:0,maximumFractionDigits:2});
  return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:4})+' '+currency.toUpperCase();
}
function typeBadgeLabel(currency){currency=canonCur(currency)||'ngn';return currency==='usd'?'USD':(currency==='usdt'?'USDT':(currency==='ngn'?'NGN':currency.toUpperCase()));}

/* ── Normalizes each table's real shape into one common display object.
   Every value here is read straight off the actual DB row — nothing is
   invented. Different tables simply have different real column names for
   the same concept (e.g. a VTU row has no separate "title" column, so its
   display title falls back to its own description/type columns — still
   100% real data, just from a different real field). ── */
function normalizeRow(type,row){
  if(type==='vtu'){
    var labels={airtime:'Airtime',data:'Data Bundle',cable:'Cable TV',electricity:'Electricity'};
    return{
      id:row.id,
      title:row.description||labels[row.type]||cap(row.type||'VTU'),
      subtitle:row.network||row.phone||'',
      amount:row.amount||0,
      currency:detectCur(row),
      direction:'db',
      status:row.status||'successful',
      date:row.created_at
    };
  }
  if(type==='deposit'){
    var cur=detectCur(row);
    return{
      id:row.id,
      title:typeBadgeLabel(cur)+' Deposit'+(row.tx_ref?' — '+row.tx_ref:''),
      subtitle:row.amount_paid?('Paid '+fmtCur(row.amount_paid,cur)):'',
      amount:row.amount||0,
      currency:cur,
      direction:'cr',
      status:row.status||'pending',
      date:row.created_at
    };
  }
  if(type==='conversion'){
    // USD → NGN conversion — also lives in the transactions table
    // (category:'usd_to_ngn_conversion'), but reads its own extra
    // columns (usd_amount/ngn_amount/exchange_rate) instead of the
    // generic purchase shape.
    var ngnAmt=row.ngn_amount!==undefined&&row.ngn_amount!==null?row.ngn_amount:(row.amount||0);
    return{
      id:row.id,
      title:'USD \u2192 NGN Conversion',
      subtitle:row.exchange_rate?('Rate: \u20a6'+fmtMoney(row.exchange_rate)+' / USD'):'',
      amount:ngnAmt,
      currency:'ngn',
      direction:'cr',
      status:row.status||'approved',
      date:row.created_at
    };
  }
  // purchase / refund — both read from the transactions table
  return{
    id:row.id,
    title:row.title||cap(row.category||'Transaction'),
    subtitle:row.network||row.platform||'',
    amount:row.amount||0,
    currency:detectCur(row),
    direction:row.direction||(type==='refund'?'cr':'db'),
    status:row.status||'pending',
    date:row.created_at
  };
}

function goBack(){
  var viewReceipt=document.getElementById('view-receipt');
  if(!viewReceipt.classList.contains('hidden')&&currentType){
    // From a receipt reached via the list, go back to the list, not away
    // from the page entirely.
    showList();
    return;
  }
  if(window.history.length>1&&document.referrer.indexOf(window.location.origin)===0){
    window.history.back();
  }else{
    window.location.href='index.html?page=transactions';
  }
}

(async function init(){
  try{
    var res=await sb.auth.getSession();
    var session=res.data&&res.data.session;
    if(!session||!session.user){window.location.href='index.html';return;}
    currentUser={id:session.user.id};

    var qp=new URLSearchParams(window.location.search);
    var receiptParam=qp.get('receipt');
    var typeParam=qp.get('type');

    if(receiptParam){
      // Direct receipt deep link (e.g. from the dashboard's Recent
      // Transactions widget) — render straight into the receipt view,
      // no list needed.
      var tx;
      try{tx=JSON.parse(decodeURIComponent(receiptParam));}catch(e){tx=null;}
      if(!tx){window.location.href='index.html?page=transactions';return;}
      // The dashboard widget pulls raw rows from the transactions table
      // across every category — detect the real category on the row
      // itself (funding → deposit-shaped receipt, refund → refund-shaped,
      // everything else → purchase-shaped) rather than assuming one type.
      var deepLinkType=tx.category==='funding'?'deposit':(tx.category==='refund'?'refund':(tx.category==='usd_to_ngn_conversion'?'conversion':'purchase'));
      document.getElementById('tbTitle').textContent='Transaction Receipt';
      renderReceipt(deepLinkType,normalizeRow(deepLinkType==='deposit'?'purchase':deepLinkType,tx),tx);
      document.getElementById('view-receipt').classList.remove('hidden');
      return;
    }

    if(!typeParam||!TYPE_CONFIG[typeParam]){
      window.location.href='index.html?page=transactions';
      return;
    }
    currentType=typeParam;
    document.getElementById('tbTitle').textContent=TYPE_CONFIG[typeParam].label;
    document.getElementById('view-list').classList.remove('hidden');
    
    await loadHistory();
    var idParam=qp.get('id');
    if(idParam&&rawRowsById[idParam])openReceiptById(idParam);
  }catch(e){
    console.error('init error:',e);
    window.location.href='index.html';
  }
})();

async function loadHistory(){
  var cfg=TYPE_CONFIG[currentType];
  var body=document.getElementById('listBody');
  try{
    var q=sb.from(cfg.table).select('*').eq('user_id',currentUser.id).order('created_at',{ascending:false}).limit(200);
    if(cfg.filter){
      Object.keys(cfg.filter).forEach(function(k){q=q.eq(k,cfg.filter[k]);});
    }
    var r=await q;
    if(r.error)throw r.error;
    var rows=r.data||[];
    allRows=rows.map(function(row){
      var n=normalizeRow(currentType,row);
      rawRowsById[n.id]=row;
      return n;
    });
    updateCurBar();
    renderList(currencyFilter?currentlyVisibleRows():allRows);
  }catch(e){
    console.error('loadHistory error:',e);
    body.innerHTML='<div class="errState">Couldn\'t load your history right now.<br/><button onclick="loadHistory()">Tap to retry</button></div>';
  }
}

function renderList(rows){
  var cfg=TYPE_CONFIG[currentType];
  var body=document.getElementById('listBody');
  if(!rows.length){
    body.innerHTML='<div class="emptyState"><div class="eIcon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+cfg.icon+'</svg></div>'+
      '<h3>'+cfg.emptyTitle+'</h3><p>'+cfg.emptyText+'</p></div>';
    return;
  }
  // Group by real calendar date (Today / Yesterday / an exact date),
  // derived from each row's actual created_at — never a fabricated bucket.
  var todayStr=fmtDate(new Date());
  var yestStr=fmtDate(new Date(Date.now()-86400000));
  var groups=[];
  var groupMap={};
  rows.forEach(function(row){
    var d=fmtDate(row.date);
    var label=d===todayStr?'Today':(d===yestStr?'Yesterday':d);
    if(!groupMap[label]){groupMap[label]={label:label,items:[]};groups.push(groupMap[label]);}
    groupMap[label].items.push(row);
  });
  body.innerHTML=groups.map(function(g){
    return '<div class="dateGroupLabel">'+g.label+'</div>'+
      g.items.map(function(row){return histCardHtml(row);}).join('');
  }).join('');
}

function histCardHtml(row){
  var cr=row.direction==='cr';

  var typeBadge=(currentType==='deposit')?'<span class="histBadge" style="background:var(--brand-lt);color:var(--brand);margin-left:5px">'+typeBadgeLabel(row.currency)+'</span>':(row.currency&&row.currency!=='ngn'?'<span class="histBadge" style="background:var(--brand-lt);color:var(--brand);margin-left:5px">'+typeBadgeLabel(row.currency)+'</span>':'');
  return '<div class="histCard" onclick="openReceiptById(\''+row.id+'\')">'+
    '<div class="histIco '+(cr?'cr':'db')+'">'+
      (cr?'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>':
         '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>')+
    '</div>'+
    '<div class="histMain"><div class="histTitle">'+escapeHtml(row.title)+'</div>'+
      '<div class="histMeta">'+fmtDate(row.date)+' \u00b7 '+fmtTime(row.date)+(row.subtitle?' \u00b7 '+escapeHtml(row.subtitle):'')+'</div></div>'+
    '<div class="histRight"><div class="histAmt '+(cr?'cr':'db')+'">'+amtStr+'</div>'+
      '<div><span class="histBadge '+row.status+'">'+cap(row.status)+'</span>'+typeBadge+'</div></div></div>';
}
function escapeHtml(s){
  var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;
}

/* ── Search — filters the already-fetched real rows client-side by
   title, subtitle, status, id/reference, or amount. No re-query, no
   fabricated results, just a filter over real data already on screen. ── */
var searchTimer=null;
function currentlyVisibleRows(){
  var rows=currencyFilter?allRows.filter(function(r){return r.currency===currencyFilter;}):allRows;
  var val=(document.getElementById('searchInput')||{}).value;
  val=val?val.trim().toLowerCase():'';
  if(!val)return rows;
  return rows.filter(function(row){
    return (row.title&&row.title.toLowerCase().indexOf(val)!==-1)||
      (row.subtitle&&row.subtitle.toLowerCase().indexOf(val)!==-1)||
      (row.status&&row.status.toLowerCase().indexOf(val)!==-1)||
      (row.id&&row.id.toString().toLowerCase().indexOf(val)!==-1)||
      String(row.amount).indexOf(val)!==-1;
  });
}
function updateCurBar(){
  var bar=document.getElementById('curFilterBar');if(!bar)return;
  var present={};allRows.forEach(function(r){present[r.currency||'ngn']=1;});
  var multi=Object.keys(present).length>1;
  bar.classList.toggle('hidden',!(currentType==='deposit'||multi));
  bar.querySelectorAll('.curFilterPill').forEach(function(p){
    var c=p.dataset.cur;
    // 'All' always; a currency pill only when the list has it (deposits keep every pill, as before)
    p.classList.toggle('hidden',!!c&&currentType!=='deposit'&&!present[c]);
  });
}
function setCurrencyFilter(cur){
  currencyFilter=cur;
  document.querySelectorAll('.curFilterPill').forEach(function(p){p.classList.toggle('active',p.dataset.cur===cur);});
  renderList(currentlyVisibleRows());
}
function handleSearch(){
  clearTimeout(searchTimer);
  var val=document.getElementById('searchInput').value.trim();
  document.getElementById('searchClearBtn').classList.toggle('hidden',!val);
  searchTimer=setTimeout(function(){renderList(currentlyVisibleRows());},200);
}
function clearSearch(){
  document.getElementById('searchInput').value='';
  document.getElementById('searchClearBtn').classList.add('hidden');
  renderList(currentlyVisibleRows());
}

function showList(){
  document.getElementById('view-receipt').classList.add('hidden');
  document.getElementById('view-list').classList.remove('hidden');
  document.getElementById('tbTitle').textContent=TYPE_CONFIG[currentType].label;
  window.scrollTo(0,0);
}

function openReceiptById(id){
  var raw=rawRowsById[id];
  if(!raw)return;
  var normalized=normalizeRow(currentType,raw);
  document.getElementById('view-list').classList.add('hidden');
  document.getElementById('tbTitle').textContent='Transaction Receipt';
  renderReceipt(currentType,normalized,raw);
  document.getElementById('view-receipt').classList.remove('hidden');
  window.scrollTo(0,0);
}

function rIco(k){return '<span class="rIco"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(RI[k]||RI.dot)+'</svg></span>';}

// Renders a row only when the real DB row carries that field.
function rcptFieldRow(raw,candidateKeys,label,isMono,icon){
  for(var i=0;i<candidateKeys.length;i++){
    var v=raw[candidateKeys[i]];
    if(v!==undefined&&v!==null&&v!==''){return rcptRowHtml(icon||'dot',label,escapeHtml(v),isMono);}
  }
  return '';
}
function hasVal(v){return v!==undefined&&v!==null&&v!=='';}

// Status → tone/title/message. Success is only ever shown for a status
// the real row actually carries.
function rcptStatusMeta(row,raw,ctx){
  var s=String(row.status||'').toLowerCase();
  var ICON={
    ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12.5 10 17.5 19 7.5"/></svg>',
    warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>',
    err:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>',
    neutral:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h13"/><polyline points="12 7 17 12 12 17"/></svg>'
  };
  var noun=ctx.noun;
  if(['successful','success','approved','completed'].indexOf(s)>-1){
    var msg=ctx.isConversion?'Your NGN wallet has been credited.':(ctx.isDeposit?'Your '+(ctx.cur==='ngn'?'':typeBadgeLabel(ctx.cur)+' ')+'wallet has been credited successfully.':(ctx.cr?'Your wallet has been credited.':'Your purchase was completed successfully.'));
    return{tone:'ok',icon:ICON.ok,label:cap(s),title:noun+' '+(ctx.isDeposit?'Approved':(ctx.isConversion||ctx.cr?'Completed':'Successful')),msg:msg,state:'Completed'};
  }
  if(['pending','processing','reviewing'].indexOf(s)>-1){
    return{tone:'warn',icon:ICON.warn,label:cap(s),title:noun+' '+cap(s),msg:ctx.isDeposit?'Awaiting verification by our team.':'This transaction is still processing.',state:cap(s)};
  }
  if(['rejected','failed','cancelled'].indexOf(s)>-1){
    return{tone:'err',icon:ICON.err,label:cap(s),title:noun+' '+cap(s),msg:hasVal(raw.rejection_reason)?escapeHtml(raw.rejection_reason):'This transaction was not completed.',state:cap(s)};
  }
  if(s==='refunded'){
    return{tone:'neutral',icon:ICON.neutral,label:'Refunded',title:noun+' Refunded',msg:'This transaction has been refunded.',state:'Refunded'};
  }
  return{tone:'neutral',icon:ICON.neutral,label:cap(s)||'Unknown',title:noun,msg:'',state:cap(s)||''};
}

function copyRef(btn){
  var t=btn.getAttribute('data-ref')||'';
  function ok(){btn.classList.add('done');setTimeout(function(){btn.classList.remove('done');},1400);}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(ok,function(){fallbackCopy(t)&&ok();});
  }else if(fallbackCopy(t)){ok();}
}
function fallbackCopy(t){
  try{var a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();var r=document.execCommand('copy');document.body.removeChild(a);return r;}catch(e){return false;}
}

// Download = an image of the exact invoice on screen (so it always matches
// the design and the real data). Falls back to the print dialog if the
// capture library can't load.
function loadScript(src){
  return new Promise(function(res,rej){
    if(window.html2canvas)return res();
    var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);
  });
}
async function downloadReceipt(btn){
  var node=document.getElementById('rcptInvoice');
  if(!node)return;
  var label=btn.querySelector('span');var orig=label.textContent;
  btn.disabled=true;label.textContent='Preparing\u2026';
  try{
    await loadScript('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js');
    var canvas=await html2canvas(node,{scale:2,backgroundColor:'#ffffff',useCORS:true});
    var blob=await new Promise(function(r){canvas.toBlob(r,'image/png');});
    if(!blob)throw new Error('empty');
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download='receipt-'+(btn.getAttribute('data-name')||'transaction')+'.png';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},4000);
  }catch(e){
    console.error('download error:',e);
    window.print();
  }
  btn.disabled=false;label.textContent=orig;
}

function renderReceipt(type,row,raw){
  var el=document.getElementById('view-receipt');
  var cr=row.direction==='cr';
  var isDeposit=type==='deposit';
  var isConversion=type==='conversion';
  var cur=canonCur(row.currency)||detectCur(raw);
  // A deposit can be paid in one currency and credited to another wallet — only if the row says so.
  var cCur=isDeposit?(canonCur(raw.credited_currency||raw.credit_currency||raw.wallet_currency)||cur):cur;
  var brand=rcptBrand();
  var refId=row.id?row.id.toString():'';
  var refShort=refId?refId.substring(0,18):'';

  var noun=isConversion?'Conversion':(isDeposit?'Deposit':(type==='refund'?'Refund':'Purchase'));
  var typeLabel=isConversion?'USD \u2192 NGN Conversion':(isDeposit?typeBadgeLabel(cur)+' Deposit':(type==='refund'?'Refund':(hasVal(raw.category)||hasVal(raw.type)?cap(String(raw.category||raw.type).replace(/_/g,' ')):'Purchase')));
  var ctx={noun:noun,isDeposit:isDeposit,isConversion:isConversion,cr:cr,cur:cCur};
  var st=rcptStatusMeta(row,raw,ctx);

  // Real amounts, read straight off the row (same sources as before).
  var credited=hasVal(raw.credited_amount)?raw.credited_amount:(hasVal(raw.approved_amount)?raw.approved_amount:row.amount);
  var usdAmt=hasVal(raw.usd_amount)?raw.usd_amount:0;
  var ngnAmt=hasVal(raw.ngn_amount)?raw.ngn_amount:row.amount;
  var rateUsed=hasVal(raw.exchange_rate)?raw.exchange_rate:0;
  var primaryAmt,primaryLbl,primaryCur;
  if(isConversion){primaryAmt=ngnAmt;primaryCur='ngn';primaryLbl='NGN Received';}
  else if(isDeposit){primaryAmt=credited;primaryCur=cCur;primaryLbl='Amount Credited';}
  else{primaryAmt=row.amount;primaryCur=cur;primaryLbl=cr?'Total Credited':'Total Paid';}

  var calSvg='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+RI.cal+'</svg>';
  var logoImg=brand.logo?'<img class="invLogo" src="'+escapeHtml(brand.logo)+'" alt="'+escapeHtml(brand.name)+'" onerror="this.style.display=\'none\'"/>':'';

  var html='<div class="rcptWrap"><article class="rcptInvoice" id="rcptInvoice">';

  // Header
  html+='<header class="invHead"><div class="invBrand">'+logoImg+'<span class="invBrandName">'+escapeHtml(brand.name)+'</span></div>'+
    '<div class="invMeta"><div class="invKicker">Transaction Receipt</div>';
  if(refId){
    html+='<div class="invRefRow"><span class="invRef">#'+escapeHtml(refShort)+'</span>'+
      '<button class="rcptCopyBtn" data-ref="'+escapeHtml(refId)+'" onclick="copyRef(this)" aria-label="Copy transaction reference" data-html2canvas-ignore="true">'+
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></button></div>';
  }
  html+='<div class="invDate">'+calSvg+'<span>'+fmtDate(row.date)+' \u00b7 '+fmtTime(row.date)+'</span></div>'+
    '<span class="invTypeTag">'+escapeHtml(typeLabel)+'</span></div></header>';

  // Status panel
  html+='<section class="invStatus '+st.tone+'"><div class="invStatusIco">'+st.icon+'</div>'+
    '<div class="invStatusTxt"><div class="invStatusTitle">'+escapeHtml(st.title)+'</div>'+(st.msg?'<div class="invStatusMsg">'+st.msg+'</div>':'')+'</div>'+
    '<span class="invPill">'+escapeHtml(st.label)+'</span></section>';

  html+='<div class="invGrid"><section class="invDetails"><h3 class="invSecHead">Transaction Details</h3>';
  html+=rcptRowHtml('status','Status','<span class="histBadge '+escapeHtml(row.status)+'">'+escapeHtml(st.label)+'</span>');

  if(isDeposit){
    html+=rcptRowHtml('wallet','Deposit Type',escapeHtml(typeBadgeLabel(cur))+' Deposit');
    html+=rcptRowHtml('coin','Amount',fmtCur(row.amount,cur));
    if(hasVal(raw.fee))html+=rcptRowHtml('tag','Fee',fmtCur(raw.fee,cur));
    var totalPaid=hasVal(raw.amount_paid)?raw.amount_paid:(row.amount+(raw.fee||0));
    html+=rcptRowHtml('wallet','Total Payment',fmtCur(totalPaid,cur));
    html+=rcptRowHtml('swap','Amount Credited',fmtCur(credited,cCur));
  }else if(isConversion){
    html+=rcptRowHtml('coin','USD Converted',fmtCur(usdAmt,'usd'));
    html+=rcptRowHtml('swap','Exchange Rate','\u20a6'+fmtMoney(rateUsed)+' / USD');
    html+=rcptRowHtml('wallet','NGN Received',fmtCur(ngnAmt,'ngn'));
  }else{
    html+=rcptRowHtml('coin',cr?'Amount Credited':'Amount Debited',fmtCur(row.amount,cur));
    html+=rcptRowHtml('box','Product/Service',escapeHtml(row.title));
  }
  html+=rcptRowHtml('cal','Date',fmtDate(row.date));
  html+=rcptRowHtml('clock','Time',fmtTime(row.date));
  if(refShort)html+=rcptRowHtml('hash','Transaction ID',escapeHtml(refShort),true);
  html+=rcptFieldRow(raw,['previous_balance','balance_before','prev_balance'],'Previous Balance',false,'wallet');
  html+=rcptFieldRow(raw,['new_balance','balance_after'],'New Balance',false,'wallet');
  html+=rcptFieldRow(raw,['payment_method','method','payment_channel','channel','bank'],'Payment Method',false,'card');
  if(isDeposit){
    html+=rcptFieldRow(raw,['tx_ref'],'Deposit Reference',true,'hash');
    html+=rcptFieldRow(raw,['payment_time'],'Payment Time',false,'clock');
  }

  if(isConversion){
    html+='<h3 class="invSecHead sub">Wallets</h3>'+
      rcptRowHtml('wallet','From','USD Wallet \u00b7 <span style="color:var(--danger)">\u2212'+fmtCur(usdAmt,'usd')+'</span>')+
      rcptRowHtml('wallet','To','NGN Wallet \u00b7 <span style="color:#16a34a">+'+fmtCur(ngnAmt,'ngn')+'</span>');
  }
  if(!isDeposit&&!isConversion){
    var productRows=
      rcptFieldRow(raw,['product_name'],'Product Name',false,'box')+
      rcptFieldRow(raw,['platform'],'Platform',false,'box')+
      rcptFieldRow(raw,['boost_type','service_type'],'Service Type',false,'tag')+
      rcptFieldRow(raw,['network'],'Network',false,'phone')+
      rcptFieldRow(raw,['plan','plan_name'],'Plan',false,'tag')+
      rcptFieldRow(raw,['quantity'],'Quantity',false,'hash')+
      rcptFieldRow(raw,['country'],'Country',false,'dot')+
      rcptFieldRow(raw,['tier_name'],'Tier',false,'tag')+
      rcptFieldRow(raw,['phone','phone_number'],'Phone Number',false,'phone')+
      rcptFieldRow(raw,['meter','meter_number'],'Meter Number',false,'hash')+
      rcptFieldRow(raw,['card','card_number'],'Card Number',false,'card')+
      rcptFieldRow(raw,['token'],'Token',true,'hash')+
      rcptFieldRow(raw,['target_url'],'Target Link',true,'link')+
      rcptFieldRow(raw,['api_ref'],'Provider Reference',true,'hash')+
      rcptFieldRow(raw,['order_id','external_order_id','client_ref'],'Order Reference',true,'hash');
    if(productRows)html+='<h3 class="invSecHead sub">Product Details</h3>'+productRows;
  }
  html+='</section>';

  // Payment summary
  html+='<aside class="invSummary"><h3 class="invSecHead">Payment Summary</h3>'+
    '<div class="invBigLbl" style="margin-top:6px;font-weight:500;color:var(--text2)">'+primaryLbl+'</div>'+
    '<div class="invBig">'+fmtCur(primaryAmt,primaryCur)+'</div>'+
    '<div class="invBigLbl">'+escapeHtml(typeLabel)+'</div>'+
    '<div class="invState '+st.tone+'"><i></i>'+escapeHtml(st.state)+'</div>';
  var lines='';
  if(isDeposit){
    lines+=rcptRowHtml('coin','Deposited',fmtCur(row.amount,cur));
    if(hasVal(raw.fee))lines+=rcptRowHtml('tag','Fee',fmtCur(raw.fee,cur));
    lines+=rcptRowHtml('swap','Credited',fmtCur(credited,cCur));
  }else if(isConversion){
    lines+=rcptRowHtml('coin','USD Converted',fmtCur(usdAmt,'usd'));
    lines+=rcptRowHtml('swap','Rate','\u20a6'+fmtMoney(rateUsed));
  }
  if(lines)html+='<div class="invSumLines">'+lines+'</div>';
  html+='</aside></div>';

  // Footer
  html+='<div class="invFoot"><div class="invFootTxt">'+escapeHtml(brand.name)+'<br/>Official transaction receipt</div>'+
    '<div class="invBrand">'+logoImg+'<span class="invBrandName">'+escapeHtml(brand.name)+'</span></div></div>'+
    '<div class="invThanks">Thank you for choosing '+escapeHtml(brand.name)+'</div>';
  html+='</article>';

  // Actions (outside the captured invoice)
  html+='<div class="rcptActions">'+
    '<button class="rcptDownloadBtn" data-name="'+escapeHtml(refShort||'transaction')+'" onclick="downloadReceipt(this)">'+
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span>Download Receipt</span></button>'+
    '<a class="rcptVisitBtn" href="'+RCPT_SITE_URL+'" target="_blank" rel="noopener">'+
    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>Visit '+escapeHtml(brand.name)+'</a></div>';
  html+='</div>';
  el.innerHTML=html;
}
</script>
</body>
</html>
