<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#1a56db"/>
<meta name="robots" content="noindex"/>
<title>Transaction History — Global Digits</title>
<link rel="icon" type="image/x-icon" href="favicon.ico"/>
<link rel="manifest" href="site.webmanifest"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --brand:#1a56db;--brand-dk:#1342b0;--brand-lt:#e8f0ff;
  --danger:#ef4444;--warn:#f59e0b;--success:#10b981;
  --bg:#f6f9ff;--surface:#fff;--surface2:#eef5ff;--border:#dbe9fd;
  --text:#0d1321;--text2:#5a6580;--text3:#9aa3b8;
  --bnav-h:60px;--r:10px;--r-sm:7px;--r-lg:18px;
  --shadow:0 2px 12px rgba(15,25,50,.06);
  --shadow-md:0 10px 32px rgba(26,86,219,.22);
  --font:'Plus Jakarta Sans',sans-serif;--font-d:'Syne',sans-serif;--t:.18s ease;
  --grad-premium:linear-gradient(135deg,#2f6feb 0%,#1a56db 100%);
  --ring-lt:#eaf2ff;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);font-size:11px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:600!important}
button{cursor:pointer;font-family:var(--font);border:none;background:none}
a{color:inherit;text-decoration:none}
input{font-family:var(--font);font-size:13px}
.hidden{display:none!important}
#appShell{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(var(--bnav-h) + 26px)}
#tb{position:sticky;top:0;z-index:20;height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 14px}
#tbBack{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text);transition:var(--t);flex-shrink:0}
#tbBack:hover{background:var(--surface2)}
#tbTitle{font-family:var(--font-d);font-size:15px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:14px}
/* search */
.searchBar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--border);border-radius:100px;padding:10px 14px;margin-bottom:16px;box-shadow:var(--shadow)}
.searchBar svg{flex-shrink:0;color:var(--text3)}
.searchBar input{flex:1;border:none;outline:none;background:none;color:var(--text)}
.searchBar input::placeholder{color:var(--text3)}
.searchClear{flex-shrink:0;color:var(--text3);padding:2px}
/* date group */
.dateGroupLabel{font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin:18px 2px 9px}
.dateGroupLabel:first-child{margin-top:0}
/* transaction card */
.histCard{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:13px;margin-bottom:9px;box-shadow:var(--shadow);transition:transform var(--t),box-shadow var(--t);cursor:pointer}
.histCard:active{transform:scale(.98)}
.histIco{flex-shrink:0;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.histIco.cr{background:#dcfce7;color:#16a34a}
.histIco.db{background:var(--brand-lt);color:var(--brand)}
.histMain{flex:1;min-width:0}
.histTitle{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.histMeta{font-size:10px;color:var(--text3);margin-top:2px}
.histRight{flex-shrink:0;text-align:right}
.histAmt{font-family:var(--font-d);font-size:13px;font-weight:700}
.histAmt.cr{color:#16a34a}
.histAmt.db{color:var(--text)}
.histBadge{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:100px;font-size:9px;font-weight:700}
.histBadge.success,.histBadge.successful,.histBadge.approved,.histBadge.completed,.histBadge.active{background:#dcfce7;color:#15803d}
.histBadge.pending,.histBadge.processing,.histBadge.reviewing{background:#fef3c7;color:#92400e}
.histBadge.failed,.histBadge.rejected,.histBadge.cancelled{background:#fee2e2;color:#991b1b}
/* skeleton / empty */
.skel{background:linear-gradient(90deg,var(--surface2) 25%,var(--border) 37%,var(--surface2) 63%);background-size:400% 100%;animation:skel 1.4s ease infinite;border-radius:var(--r-lg)}
@keyframes skel{0%{background-position:100% 50%}100%{background-position:0 50%}}
.emptyState{text-align:center;padding:60px 20px}
.emptyState .eIcon{width:64px;height:64px;border-radius:50%;background:var(--brand-lt);color:var(--brand);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.emptyState h3{font-size:14px;font-weight:700}
.emptyState p{font-size:11.5px;color:var(--text2);margin-top:5px}
.errState{text-align:center;padding:40px 20px;color:var(--danger);font-size:12px}
.errState button{margin-top:10px;color:var(--brand);font-weight:700;text-decoration:underline}
/* ══ RECEIPT ══ */
.rcptWrap{max-width:460px;margin:0 auto}
.rcptTop{text-align:center;padding:14px 16px 20px}
.rcptIcon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:var(--shadow)}
.rcptIcon.cr{background:#dcfce7;color:#16a34a}
.rcptIcon.db{background:var(--brand-lt);color:var(--brand)}
.rcptAmount{font-family:var(--font-d);font-size:30px;font-weight:700;letter-spacing:-.01em}
.rcptAmount.cr{color:var(--success)}
.rcptAmount.db{color:var(--text)}
.rcptTitle{font-size:13.5px;color:var(--text2);margin-top:6px;font-weight:500}
.rcptBadgeRow{margin-top:12px;display:flex;justify-content:center}
.rcptOrderRow{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;font-size:12px;color:var(--text2)}
.rcptOrderRow b{color:var(--text);font-family:monospace;font-weight:600;letter-spacing:.02em}
.rcptCopyBtn{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text2);flex-shrink:0}
.rcptCopyBtn:active{background:var(--surface2)}
.rcptSuccessBanner{display:flex;align-items:center;gap:9px;background:rgba(16,185,129,.09);border:1px solid rgba(16,185,129,.28);border-radius:var(--r);padding:12px 14px;margin:16px 0;font-size:12.5px;font-weight:600;color:#0d7a5f}
.rcptSuccessBanner.warn{background:rgba(245,158,11,.09);border-color:rgba(245,158,11,.3);color:#92400e}
.rcptSuccessBanner.err{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.28);color:#991b1b}
.rcptSuccessBanner svg{flex-shrink:0}
.rcptCard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px 18px 14px;margin-bottom:16px}
.rcptCardHead{font-family:var(--font-d);font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
.rcptRow{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px dashed var(--border);font-size:13px}
.rcptRow:last-child{border-bottom:none;padding-bottom:0}
.rcptRow span:first-child{color:var(--text3);font-weight:500;flex-shrink:0}
.rcptRow span:last-child{color:var(--text);font-weight:600;text-align:right;word-break:break-word}
.rcptRow .mono{font-family:monospace;font-size:11.5px;color:var(--text2);font-weight:500}
.rcptTotalCard{background:var(--grad-premium);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 6px 20px rgba(26,86,219,.22)}
.rcptTotalCard span:first-child{color:rgba(255,255,255,.85);font-size:12.5px;font-weight:600}
.rcptTotalCard span:last-child{color:#fff;font-family:var(--font-d);font-size:19px;font-weight:700}
.rcptDownloadBtn{width:100%;background:var(--brand);color:#fff;border:none;border-radius:var(--r);padding:14px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 14px rgba(26,86,219,.25);transition:var(--t);margin-bottom:22px}
.rcptDownloadBtn:active{transform:scale(.98);background:var(--brand-dk)}
/* footer required by spec */
.rcptFooter{text-align:center;padding-bottom:6px}
.rcptFooter .rcptFootThanks{font-size:11.5px;color:var(--text2);font-weight:500}
.rcptVisitBtn{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:var(--brand-lt);color:var(--brand);font-size:11px;font-weight:700;padding:8px 16px;border-radius:100px;transition:var(--t)}
.rcptVisitBtn:active{transform:scale(.95)}
@media print{
  body *{visibility:hidden}
  #view-receipt,#view-receipt *{visibility:visible}
  #view-receipt{position:absolute;left:0;top:0;width:100%}
  .rcptDownloadBtn,#bnav,#tb{display:none!important}
}
/* bottom nav — exact match to index.html's floating premium nav */
#bnav{
  position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  max-width:492px;margin:0 auto;height:60px;background:var(--surface);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-radius:22px;border:1px solid var(--border);
  display:flex;align-items:stretch;
  z-index:200;box-shadow:0 10px 32px rgba(15,25,50,.14);
}
.bnItem{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text3);font-size:10px;font-weight:500;transition:color var(--t);border:none;background:none;cursor:pointer;position:relative}
.bnItem.active,.bnItem:hover{color:var(--brand)}
.bnItem svg{width:20px;height:20px;transition:transform var(--t)}
.bnItem.active svg{transform:translateY(-2px)}
.bnItem.active::after{content:'';position:absolute;top:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--grad-premium)}
.bnavFab{position:absolute;top:-24px;left:50%;transform:translateX(-50%);width:54px;height:54px;border-radius:50%;background:var(--grad-premium);border:3px solid var(--surface);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(26,86,219,.4),0 0 0 4px rgba(26,86,219,.12);cursor:pointer;z-index:5;transition:transform var(--t)}
.bnavFab:active{transform:translateX(-50%) scale(.93)}
</style>
</head>
<body>
<div id="appShell">
  <header id="tb">
    <button id="tbBack" onclick="goBack()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span id="tbTitle">History</span>
  </header>

  <main>
    <!-- ══ LIST VIEW ══ -->
    <div id="view-list" class="view hidden">
      <div class="searchBar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search by title, reference or amount" oninput="handleSearch()"/>
        <button class="searchClear hidden" id="searchClearBtn" onclick="clearSearch()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="listBody">
        <div class="skel" style="height:66px;margin-bottom:9px"></div>
        <div class="skel" style="height:66px;margin-bottom:9px"></div>
        <div class="skel" style="height:66px;margin-bottom:9px"></div>
      </div>
    </div>

    <!-- ══ RECEIPT VIEW ══ -->
    <div id="view-receipt" class="view hidden"></div>
  </main>

  <nav id="bnav">
    <a class="bnItem" href="index.html?page=dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Home
    </a>
    <a class="bnItem" href="index.html?page=vtu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>VTU
    </a>
    <a class="bnavFab" href="index.html?page=addfunds" aria-label="Add Funds">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </a>
    <a class="bnItem" href="index.html?page=boost">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/></svg>Boost
    </a>
    <a class="bnItem active" href="index.html?page=transactions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>Transactions
    </a>
  </nav>
</div>

<script>
const SUPA_URL='https://pzronmbvusjwrcizxwef.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6cm9ubWJ2dXNqd3JjaXp4d2VmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNTE0MjUsImV4cCI6MjA5NDYyNzQyNX0.v6bz5YeLWKzRN4g09QYTY0x-ur5KGfeXupglKfTVKwA';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
var currentUser=null;

// One config object drives everything about each history type — the table
// it reads from, any fixed filter, its icon/color, and copy. Nothing about
// individual transactions is ever hardcoded here; only *how to query and
// label the category* is configured, the actual rows always come from
// Supabase.
var TYPE_CONFIG={
  vtu:{
    label:'VTU History',
    table:'vtu_transactions',
    filter:null,
    accent:'indigo',
    emptyTitle:'No VTU transactions yet',
    emptyText:'Your airtime, data, cable and electricity purchases will show up here.',
    icon:'<rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/>'
  },
  purchase:{
    label:'Purchase History',
    table:'transactions',
    filter:{category:'purchase'},
    accent:'blue',
    emptyTitle:'No purchases yet',
    emptyText:'Numbers, boosts, social accounts and other orders will show up here.',
    icon:'<path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/>'
  },
  refund:{
    label:'Refund History',
    table:'transactions',
    filter:{category:'refund'},
    accent:'amber',
    emptyTitle:'No refunds yet',
    emptyText:'Refunds from failed or cancelled purchases will show up here.',
    icon:'<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>'
  },
  deposit:{
    label:'Deposit History',
    table:'deposits',
    filter:null,
    accent:'teal',
    emptyTitle:'No deposits yet',
    emptyText:'Your wallet funding requests and their approval status will show up here.',
    icon:'<polyline points="18 15 12 9 6 15"/>'
  }
};

var currentType=null;
var allRows=[];       // normalized rows for the current type
var rawRowsById={};   // id -> raw db row, for the receipt view

function cap(s){return s?String(s).charAt(0).toUpperCase()+String(s).slice(1):s;}
function fmtDate(d){try{return new Date(d).toLocaleDateString('en-NG',{day:'numeric',month:'short',year:'numeric'});}catch(e){return d||'';}}
function fmtTime(d){try{return new Date(d).toLocaleTimeString('en-NG',{hour:'2-digit',minute:'2-digit'});}catch(e){return'';}}
function fmtMoney(n){return(+n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});}
function copyText(t){
  try{navigator.clipboard.writeText(t);}catch(e){}
}

/* ── Normalizes each table's real shape into one common display object.
   Every value here is read straight off the actual DB row — nothing is
   invented. Different tables simply have different real column names for
   the same concept (e.g. a VTU row has no separate "title" column, so its
   display title falls back to its own description/type columns — still
   100% real data, just from a different real field). ── */
function normalizeRow(type,row){
  if(type==='vtu'){
    var labels={airtime:'Airtime',data:'Data Bundle',cable:'Cable TV',electricity:'Electricity'};
    return{
      id:row.id,
      title:row.description||labels[row.type]||cap(row.type||'VTU'),
      subtitle:row.network||row.phone||'',
      amount:row.amount||0,
      direction:'db',
      status:row.status||'successful',
      date:row.created_at
    };
  }
  if(type==='deposit'){
    return{
      id:row.id,
      title:'Deposit Request'+(row.tx_ref?' — '+row.tx_ref:''),
      subtitle:row.amount_paid?('Paid \u20a6'+Number(row.amount_paid).toLocaleString()):'',
      amount:row.amount||0,
      direction:'cr',
      status:row.status||'pending',
      date:row.created_at
    };
  }
  // purchase / refund — both read from the transactions table
  return{
    id:row.id,
    title:row.title||cap(row.category||'Transaction'),
    subtitle:row.network||row.platform||'',
    amount:row.amount||0,
    direction:row.direction||(type==='refund'?'cr':'db'),
    status:row.status||'pending',
    date:row.created_at
  };
}

function goBack(){
  var viewReceipt=document.getElementById('view-receipt');
  if(!viewReceipt.classList.contains('hidden')&&currentType){
    // From a receipt reached via the list, go back to the list, not away
    // from the page entirely.
    showList();
    return;
  }
  if(window.history.length>1&&document.referrer.indexOf(window.location.origin)===0){
    window.history.back();
  }else{
    window.location.href='index.html?page=transactions';
  }
}

(async function init(){
  try{
    var res=await sb.auth.getSession();
    var session=res.data&&res.data.session;
    if(!session||!session.user){window.location.href='index.html';return;}
    currentUser={id:session.user.id};

    var qp=new URLSearchParams(window.location.search);
    var receiptParam=qp.get('receipt');
    var typeParam=qp.get('type');

    if(receiptParam){
      // Direct receipt deep link (e.g. from the dashboard's Recent
      // Transactions widget) — render straight into the receipt view,
      // no list needed.
      var tx;
      try{tx=JSON.parse(decodeURIComponent(receiptParam));}catch(e){tx=null;}
      if(!tx){window.location.href='index.html?page=transactions';return;}
      // The dashboard widget pulls raw rows from the transactions table
      // across every category — detect the real category on the row
      // itself (funding → deposit-shaped receipt, refund → refund-shaped,
      // everything else → purchase-shaped) rather than assuming one type.
      var deepLinkType=tx.category==='funding'?'deposit':(tx.category==='refund'?'refund':'purchase');
      document.getElementById('tbTitle').textContent='Transaction Receipt';
      renderReceipt(deepLinkType,normalizeRow(deepLinkType==='deposit'?'purchase':deepLinkType,tx),tx);
      document.getElementById('view-receipt').classList.remove('hidden');
      return;
    }

    if(!typeParam||!TYPE_CONFIG[typeParam]){
      window.location.href='index.html?page=transactions';
      return;
    }
    currentType=typeParam;
    document.getElementById('tbTitle').textContent=TYPE_CONFIG[typeParam].label;
    document.getElementById('view-list').classList.remove('hidden');
    await loadHistory();
  }catch(e){
    console.error('init error:',e);
    window.location.href='index.html';
  }
})();

async function loadHistory(){
  var cfg=TYPE_CONFIG[currentType];
  var body=document.getElementById('listBody');
  try{
    var q=sb.from(cfg.table).select('*').eq('user_id',currentUser.id).order('created_at',{ascending:false}).limit(200);
    if(cfg.filter){
      Object.keys(cfg.filter).forEach(function(k){q=q.eq(k,cfg.filter[k]);});
    }
    var r=await q;
    if(r.error)throw r.error;
    var rows=r.data||[];
    allRows=rows.map(function(row){
      var n=normalizeRow(currentType,row);
      rawRowsById[n.id]=row;
      return n;
    });
    renderList(allRows);
  }catch(e){
    console.error('loadHistory error:',e);
    body.innerHTML='<div class="errState">Couldn\'t load your history right now.<br/><button onclick="loadHistory()">Tap to retry</button></div>';
  }
}

function renderList(rows){
  var cfg=TYPE_CONFIG[currentType];
  var body=document.getElementById('listBody');
  if(!rows.length){
    body.innerHTML='<div class="emptyState"><div class="eIcon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+cfg.icon+'</svg></div>'+
      '<h3>'+cfg.emptyTitle+'</h3><p>'+cfg.emptyText+'</p></div>';
    return;
  }
  // Group by real calendar date (Today / Yesterday / an exact date),
  // derived from each row's actual created_at — never a fabricated bucket.
  var todayStr=fmtDate(new Date());
  var yestStr=fmtDate(new Date(Date.now()-86400000));
  var groups=[];
  var groupMap={};
  rows.forEach(function(row){
    var d=fmtDate(row.date);
    var label=d===todayStr?'Today':(d===yestStr?'Yesterday':d);
    if(!groupMap[label]){groupMap[label]={label:label,items:[]};groups.push(groupMap[label]);}
    groupMap[label].items.push(row);
  });
  body.innerHTML=groups.map(function(g){
    return '<div class="dateGroupLabel">'+g.label+'</div>'+
      g.items.map(function(row){return histCardHtml(row);}).join('');
  }).join('');
}

function histCardHtml(row){
  var cr=row.direction==='cr';
  var amtStr=(cr?'+':'\u2212')+'\u20a6'+Math.abs(row.amount).toLocaleString();
  return '<div class="histCard" onclick="openReceiptById(\''+row.id+'\')">'+
    '<div class="histIco '+(cr?'cr':'db')+'">'+
      (cr?'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>':
         '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>')+
    '</div>'+
    '<div class="histMain"><div class="histTitle">'+escapeHtml(row.title)+'</div>'+
      '<div class="histMeta">'+fmtDate(row.date)+' \u00b7 '+fmtTime(row.date)+(row.subtitle?' \u00b7 '+escapeHtml(row.subtitle):'')+'</div></div>'+
    '<div class="histRight"><div class="histAmt '+(cr?'cr':'db')+'">'+amtStr+'</div>'+
      '<span class="histBadge '+row.status+'">'+cap(row.status)+'</span></div></div>';
}
function escapeHtml(s){
  var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;
}

/* ── Search — filters the already-fetched real rows client-side by
   title, subtitle, status, id/reference, or amount. No re-query, no
   fabricated results, just a filter over real data already on screen. ── */
var searchTimer=null;
function handleSearch(){
  clearTimeout(searchTimer);
  var val=document.getElementById('searchInput').value.trim();
  document.getElementById('searchClearBtn').classList.toggle('hidden',!val);
  searchTimer=setTimeout(function(){
    if(!val){renderList(allRows);return;}
    var q=val.toLowerCase();
    var filtered=allRows.filter(function(row){
      return (row.title&&row.title.toLowerCase().indexOf(q)!==-1)||
        (row.subtitle&&row.subtitle.toLowerCase().indexOf(q)!==-1)||
        (row.status&&row.status.toLowerCase().indexOf(q)!==-1)||
        (row.id&&row.id.toString().toLowerCase().indexOf(q)!==-1)||
        String(row.amount).indexOf(q)!==-1;
    });
    renderList(filtered);
  },200);
}
function clearSearch(){
  document.getElementById('searchInput').value='';
  document.getElementById('searchClearBtn').classList.add('hidden');
  renderList(allRows);
}

function showList(){
  document.getElementById('view-receipt').classList.add('hidden');
  document.getElementById('view-list').classList.remove('hidden');
  document.getElementById('tbTitle').textContent=TYPE_CONFIG[currentType].label;
  window.scrollTo(0,0);
}

function openReceiptById(id){
  var raw=rawRowsById[id];
  if(!raw)return;
  var normalized=normalizeRow(currentType,raw);
  document.getElementById('view-list').classList.add('hidden');
  document.getElementById('tbTitle').textContent='Transaction Receipt';
  renderReceipt(currentType,normalized,raw);
  document.getElementById('view-receipt').classList.remove('hidden');
  window.scrollTo(0,0);
}

// Renders only the rows whose field actually exists on this raw DB row —
// candidateKeys is checked in order and only a present/truthy value is
// ever shown, so nothing here is ever invented for a transaction type it
// doesn't apply to.
function rcptFieldRow(raw,candidateKeys,label,isMono){
  for(var i=0;i<candidateKeys.length;i++){
    var v=raw[candidateKeys[i]];
    if(v!==undefined&&v!==null&&v!==''){
      return '<div class="rcptRow"><span>'+label+'</span><span'+(isMono?' class="mono"':'')+'>'+escapeHtml(v)+'</span></div>';
    }
  }
  return '';
}

function renderReceipt(type,row,raw){
  var el=document.getElementById('view-receipt');
  var cr=row.direction==='cr';
  var isDeposit=type==='deposit';
  var icon=cr
    ?'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>'
    :'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>';
  var amountStr=(cr?'+':'\u2212')+'\u20a6'+Math.abs(row.amount).toLocaleString();
  var refId=row.id?row.id.toString():'';
  var refShort=refId?refId.substring(0,18):'';

  var html='<div class="rcptWrap">';
  html+='<div class="rcptTop">'+
    '<div class="rcptIcon '+(cr?'cr':'db')+'">'+icon+'</div>'+
    '<div class="rcptAmount '+(cr?'cr':'db')+'">'+amountStr+'</div>'+
    '<div class="rcptTitle">'+escapeHtml(row.title)+'</div>'+
    '<div class="rcptBadgeRow"><span class="histBadge '+row.status+'" style="font-size:11px;padding:4px 12px">'+cap(row.status)+'</span></div>';
  if(refId){
    html+='<div class="rcptOrderRow">Reference: <b>'+refShort+'</b>'+
      '<button class="rcptCopyBtn" onclick="copyText(\''+refId+'\')" aria-label="Copy reference">'+
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>'+
      '</button></div>';
  }
  html+='</div>';

  // Status banner — wording matches the real status, never assumes success.
  if(row.status==='successful'||row.status==='success'||row.status==='approved'||row.status==='completed'){
    html+='<div class="rcptSuccessBanner">'+
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="8 12 11 15 16 9"/></svg>'+
      (isDeposit?'Deposit approved — your wallet has been credited':(cr?'Refund completed — your wallet has been credited':'Purchase successful'))+'</div>';
  }else if(row.status==='pending'||row.status==='processing'||row.status==='reviewing'){
    html+='<div class="rcptSuccessBanner warn">'+
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>'+
      (isDeposit?'Awaiting verification by our team':'This transaction is still processing')+'</div>';
  }else if(row.status==='rejected'||row.status==='failed'||row.status==='cancelled'){
    html+='<div class="rcptSuccessBanner err">'+
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'+
      cap(row.status)+(raw.rejection_reason?': '+escapeHtml(raw.rejection_reason):'')+'</div>';
  }

  // ── Transaction Details ──
  html+='<div class="rcptCard"><div class="rcptCardHead">Transaction Details</div>';
  html+='<div class="rcptRow"><span>Status</span><span><span class="histBadge '+row.status+'">'+cap(row.status)+'</span></span></div>';
  html+='<div class="rcptRow"><span>'+(cr?'Amount Credited':'Amount Debited')+'</span><span>\u20a6'+Math.abs(row.amount).toLocaleString()+'</span></div>';
  if(!isDeposit)html+='<div class="rcptRow"><span>Product/Service</span><span>'+escapeHtml(row.title)+'</span></div>';
  html+='<div class="rcptRow"><span>Date</span><span>'+fmtDate(row.date)+'</span></div>';
  html+='<div class="rcptRow"><span>Time</span><span>'+fmtTime(row.date)+'</span></div>';
  if(refShort)html+='<div class="rcptRow"><span>Transaction ID</span><span class="mono">'+refShort+'</span></div>';
  // Previous / new balance — only ever shown if the row actually carries
  // these columns (some deployments store them, some don't); never
  // computed or guessed here.
  html+=rcptFieldRow(raw,['previous_balance','balance_before','prev_balance'],'Previous Balance');
  html+=rcptFieldRow(raw,['new_balance','balance_after'],'New Balance');
  html+=rcptFieldRow(raw,['payment_method','method','payment_channel','channel','bank'],'Payment Method');
  if(isDeposit){
    html+=rcptFieldRow(raw,['tx_ref'],'Deposit Reference',true);
    html+=rcptFieldRow(raw,['amount_paid'],'Amount Paid');
    html+=rcptFieldRow(raw,['payment_time'],'Payment Time');
  }
  html+='</div>';

  // ── Product/Service Details (VTU + purchases + refunds only) ──
  if(!isDeposit){
    var productRows=
      rcptFieldRow(raw,['product_name'],'Product Name')+
      rcptFieldRow(raw,['platform'],'Platform')+
      rcptFieldRow(raw,['boost_type','service_type'],'Service Type')+
      rcptFieldRow(raw,['network'],'Network')+
      rcptFieldRow(raw,['plan','plan_name'],'Plan')+
      rcptFieldRow(raw,['quantity'],'Quantity')+
      rcptFieldRow(raw,['country'],'Country')+
      rcptFieldRow(raw,['tier_name'],'Tier')+
      rcptFieldRow(raw,['phone','phone_number'],'Phone Number')+
      rcptFieldRow(raw,['meter','meter_number'],'Meter Number')+
      rcptFieldRow(raw,['card','card_number'],'Card Number')+
      rcptFieldRow(raw,['token'],'Token',true)+
      rcptFieldRow(raw,['target_url'],'Target Link',true)+
      rcptFieldRow(raw,['api_ref'],'Provider Reference',true)+
      rcptFieldRow(raw,['order_id','external_order_id','client_ref'],'Order Reference',true);
    if(productRows){
      html+='<div class="rcptCard"><div class="rcptCardHead">Product Details</div>'+productRows+'</div>';
    }
  }

  html+='<div class="rcptTotalCard"><span>'+(cr?'Total Credited':'Total Paid')+'</span><span>\u20a6'+Math.abs(row.amount).toLocaleString()+'</span></div>';

  html+='<button class="rcptDownloadBtn" onclick="window.print()">'+
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>'+
    'Download Receipt</button>';

  html+='<div class="rcptFooter"><div class="rcptFootThanks">Thank you for choosing Global-Digits</div>'+
    '<a class="rcptVisitBtn" href="https://globaldigits.shop" target="_blank" rel="noopener">'+
    '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>'+
    'Visit Global-Digits</a></div>';

  html+='</div>';
  el.innerHTML=html;
}
</script>
</body>
</html>
