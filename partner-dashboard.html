    const s=pid?await sb.rpc('mp_set_slots',{p_product:pid,p_enabled:slot,p_total:slot?tot:null,p_plan:slot?v('#spl'):null,p_period:slot?v('#sper'):null,p_active:slot?v('#sact')!=='0':true}):{error:{message:'Could not find the saved listing.'}};
    if(s.error){done();$('#err').innerHTML='<div class="msg">The listing was saved, but its slot settings were not applied: '+e(s.error.message)+(pid?' Fix it and save again.':'')+'</div>';if(pid){history.replaceState(null,'','#edit='+pid)}window.scrollTo(0,0);return}
  }

}

      if(st==='payment_submitted')acts='<button class="btn sm" data-oa="confirm_payment" data-id="'+e(o.id)+'">Confirm payment received</button><button class="btn gh sm" data-oa="reject_payment" data-id="'+e(o.id)+'">Payment not received</button>';
      else if(st==='payment_confirmed')acts='<button class="btn sm" data-oa="deliver" data-id="'+e(o.id)+'">Deliver</button><button class="btn gh sm" data-oa="process" data-id="'+e(o.id)+'">Start processing</button><button class="btn gh sm" data-oa="cancel" data-id="'+e(o.id)+'">Cancel</button>';
      else if(st==='processing')acts='<button class="btn sm" data-oa="deliver" data-id="'+e(o.id)+'">Deliver</button><button class="btn gh sm" data-oa="cancel" data-id="'+e(o.id)+'">Cancel</button>';
      else if(st==='delivered'||st==='completed')acts='<button class="btn gh sm" data-dv="'+e(o.id)+'">View delivery</button>';
    }
    return '<div class="c" data-oi="'+e((o.product_name+' '+(o.buyer_username||'')+' '+o.id).toLowerCase())+'"><div class="oh"><b>'+e(o.product_name)+' ×'+o.quantity+'</b><span class="bd '+e(st)+'">'+e(OS[st]||st)+'</span></div>'
     +'<div class="om">@'+e(o.buyer_username||'buyer')+' · '+money(o.amount,'NGN')+' · '+e(new Date(o.created_at).toLocaleString())+' · #'+e(String(o.id).slice(0,8))+'</div>'
     +(o.buyer_note?'<div class="lb" style="margin-top:6px">Buyer note: '+e(o.buyer_note)+'</div>':'')+(o.payment_note?'<div class="lb" style="margin-top:4px">Note: '+e(o.payment_note)+'</div>':'')+(o.dispute_reason?'<div class="msg" style="margin:8px 0 0">Dispute: '+e(o.dispute_reason)+'</div>':'')
     +(legacy?'<div class="lb" style="margin-top:6px">This order used the old wallet checkout. Contact support to manage it.</div>':'')
     +'<div class="oacts">'+(o.receipt_path?'<button class="btn gh sm" data-rc="'+e(o.receipt_path)+'">View receipt</button>':'')+acts+'<a class="btn gh sm" href="marketplace.html#oc='+e(o.id)+'">Message buyer</a></div></div>'};
  $('#w').innerHTML=chips+'<div class="olist" id="ol">'+data.map(card).join('')+'</div><div id="onone" class="hide"></div>';
  const filt=()=>{const t=OQ.trim().toLowerCase();let n=0;document.querySelectorAll('#ol [data-oi]').forEach(c=>{const ok=!t||c.dataset.oi.includes(t);c.style.display=ok?'':'none';if(ok)n++});$('#onone').innerHTML=n?'':emptyBox('No matching orders','Try a different search.');$('#onone').classList.toggle('hide',!!n)};
  $('#oq').oninput=ev=>{OQ=ev.target.value;filt()};filt();
}
function deliverModal(){return new Promise(res=>{
  const s=document.createElement('div');s.style.cssText='position:fixed;inset:0;background:rgba(15,26,46,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:14px';
  s.innerHTML='<div style="background:var(--panel);color:var(--ink);border-radius:14px;padding:16px;box-shadow:0 20px 50px -20px rgba(0,0,0,.4);width:100%;max-width:460px"><b>Deliver order</b><p class="lb" style="margin:3px 0 8px">Enter what the buyer receives: account details, codes, links, instructions or any other text. Only the buyer can see it.</p><textarea class="fi" id="dvt" maxlength="5000" style="height:150px"></textarea><div class="row"><button class="btn gh f1" id="dvx">Cancel</button><button class="btn f1" id="dvs">Deliver</button></div></div>';
  document.body.appendChild(s);s.querySelector('#dvx').onclick=()=>{s.remove();res(null)};s.querySelector('#dvs').onclick=()=>{const v=s.querySelector('#dvt').value.trim();if(v.length<3)return toast('Enter the delivery details');s.remove();res(v)};

function showText(title,text){const s=document.createElement('div');s.style.cssText='position:fixed;inset:0;background:rgba(15,26,46,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:14px';
  s.innerHTML='<div style="background:var(--panel);color:var(--ink);border-radius:14px;padding:16px;box-shadow:0 20px 50px -20px rgba(0,0,0,.4);width:100%;max-width:460px;max-height:80vh;overflow:auto"><b>'+e(title)+'</b><div style="white-space:pre-wrap;word-break:break-word;margin:8px 0;padding:10px;background:var(--bg);border-radius:14px">'+e(text)+'</div><div class="row"><button class="btn gh f1" id="tc">Copy</button><button class="btn f1" id="tx2">Close</button></div></div>';
  document.body.appendChild(s);s.querySelector('#tx2').onclick=()=>s.remove();s.querySelector('#tc').onclick=()=>navigator.clipboard.writeText(text).then(()=>toast('Copied'),()=>toast('Copy failed'))}
$('#w').addEventListener('click',async ev=>{
  const f=ev.target.closest('[data-of]');if(f){OF=f.dataset.of;orders();return}
  const rc=ev.target.closest('[data-rc]');if(rc){const {data}=await sb.storage.from('mp-receipts').createSignedUrl(rc.dataset.rc,300);if(data)window.open(data.signedUrl,'_blank','noopener');else toast('Could not open receipt');return}
  const dv=ev.target.closest('[data-dv]');if(dv){const r=await sb.rpc('mp_get_delivery',{p_order:dv.dataset.dv});if(r.error)return toast(r.error.message);showText('Delivered to buyer',r.data);return}
  const b=ev.target.closest('[data-oa]');if(!b)return;const a=b.dataset.oa;let note=null;
  if(a==='deliver'){note=await deliverModal();if(note===null)return}
  else if(a==='reject_payment'){note=prompt('Tell the buyer why (for example: payment not received):');if(note===null)return}
  else if(a==='cancel'){note=prompt('Reason for cancelling (shown to the buyer). Arrange any refund directly with them:');if(note===null)return}
  else if(a==='confirm_payment'&&!confirm('Confirm that this payment has reached your bank account? Check your bank app — a receipt alone is not proof of payment.'))return;
  b.disabled=true;const r=await sb.rpc('mp_vendor_order_action',{p_order:b.dataset.id,p_action:a,p_note:note});toast(r.error?r.error.message:'Updated');orders();
});

/* ═════ CUSTOM DROPDOWN (replaces native <select>; keeps the select in the DOM so .value / onchange still work) ═════ */
(function(){
  const CH='<svg class="dd-ch" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>',CK='<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
  const x=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let cur=null;
  function close(focus){
    if(!cur)return;const c=cur;cur=null;c.menu.remove();c.back.remove();c.btn.setAttribute('aria-expanded','false');
    document.removeEventListener('keydown',c.key,true);window.removeEventListener('resize',c.rs);window.removeEventListener('scroll',c.sc,true);if(focus)c.btn.focus();
  }
  function openMenu(sel,btn){
    close();const mobile=window.matchMedia('(max-width:560px)').matches;
    const back=document.createElement('div');back.className='dd-back';
    const menu=document.createElement('div');menu.className='dd-menu'+(mobile?' dd-sheet':'');menu.setAttribute('role','listbox');
    const ttl=sel.getAttribute('aria-label')||sel.dataset.title||'';
    menu.innerHTML=(mobile&&ttl?'<div class="dd-title">'+x(ttl)+'</div>':'')+[...sel.options].map((o,i)=>o.hidden?'':'<button type="button" class="dd-o" role="option" data-i="'+i+'" aria-selected="'+(i===sel.selectedIndex)+'"'+(o.disabled?' disabled':'')+'><span>'+x(o.textContent)+'</span>'+(i===sel.selectedIndex?CK:'')+'</button>').join('');
    document.body.append(back,menu);btn.setAttribute('aria-expanded','true');
    const place=()=>{if(mobile)return;const r=btn.getBoundingClientRect();menu.style.minWidth=r.width+'px';menu.style.maxWidth='min(320px,94vw)';
      const mh=menu.offsetHeight,below=innerHeight-r.bottom-8,up=below<mh&&r.top>below;
      menu.style.top=(up?Math.max(8,r.top-mh-4):r.bottom+4)+'px';menu.style.left=Math.max(8,Math.min(r.left,innerWidth-menu.offsetWidth-8))+'px'};
    place();
    const items=()=>[...menu.querySelectorAll('.dd-o:not(:disabled)')];
    const pick=i=>{sel.selectedIndex=+i;sel.dispatchEvent(new Event('input',{bubbles:true}));sel.dispatchEvent(new Event('change',{bubbles:true}));close(true)};
    menu.onclick=e=>{const o=e.target.closest('.dd-o');if(o)pick(o.dataset.i)};
    back.onclick=()=>close();
    const key=e=>{
      if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close(true);return}
      const it=items(),k=it.indexOf(document.activeElement);
      if(e.key==='ArrowDown'){e.preventDefault();(it[k+1]||it[0]).focus()}
      else if(e.key==='ArrowUp'){e.preventDefault();(it[k-1]||it[it.length-1]).focus()}
      else if(e.key==='Home'){e.preventDefault();it[0]&&it[0].focus()}
      else if(e.key==='End'){e.preventDefault();it[it.length-1]&&it[it.length-1].focus()}
      else if(e.key==='Tab'){close()}
      else if(e.key.length===1&&/\S/.test(e.key)){const m=it.find(b=>b.textContent.trim().toLowerCase().startsWith(e.key.toLowerCase()));if(m)m.focus()}
    };
    const sc=e=>{if(!menu.contains(e.target))close()},rs=()=>close();
    document.addEventListener('keydown',key,true);window.addEventListener('resize',rs);window.addEventListener('scroll',sc,true);
    cur={menu,back,btn,key,sc,rs};
    const sI=menu.querySelector('[aria-selected=true]')||items()[0];if(sI){sI.focus({preventScroll:true});sI.scrollIntoView({block:'nearest'})}
  }
  function enhance(sel){
    if(sel._dd||sel.multiple||sel.hasAttribute('data-native'))return;sel._dd=1;
    const btn=document.createElement('button');btn.type='button';btn.className='dd-btn'+(sel.classList.contains('fi')?' fi dd-full':'');
    btn.setAttribute('aria-haspopup','listbox');btn.setAttribute('aria-expanded','false');
    const lb=sel.id&&document.querySelector('label[for="'+sel.id+'"]');if(lb)btn.setAttribute('aria-label',lb.textContent.trim());
    sel.classList.add('dd-native');sel.tabIndex=-1;sel.setAttribute('aria-hidden','true');sel.after(btn);
    const lab=()=>{const o=sel.options[sel.selectedIndex];btn.innerHTML='<span class="dd-l">'+x(o?o.textContent:'Select')+'</span>'+CH;btn.disabled=sel.disabled};
    const d=Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,'value');
    Object.defineProperty(sel,'value',{get(){return d.get.call(this)},set(v){d.set.call(this,v);lab()},configurable:true});
    sel.addEventListener('change',lab);lab();
    btn.onclick=()=>cur&&cur.btn===btn?close():openMenu(sel,btn);
  }
  const scan=r=>{if(r.nodeType!==1)return;if(r.tagName==='SELECT')enhance(r);r.querySelectorAll&&r.querySelectorAll('select').forEach(enhance)};
  new MutationObserver(m=>m.forEach(r=>r.addedNodes.forEach(scan))).observe(document.body,{childList:true,subtree:true});
  scan(document.body);
  window.enhanceSelects=scan;
})();
init();
