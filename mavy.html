<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#1a56db"/>
<title>Mavy — GlobalDigits Support</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ══════════════════════════ TOKENS ══════════════════════════
   Light mode only, by design (see task #2) — no [data-theme="dark"]
   block anymore, no toggle anywhere in this file. */
:root{
  --brand:#1a56db;--brand-dk:#123fa8;--brand-lt:#eaf1ff;
  --danger:#ef4444;--warn:#f59e0b;--success:#10b981;--purple:#7c5cff;
  --bg:#f5f8ff;--surface:#fff;--surface2:#f0f5ff;--border:#e1eafc;
  --text:#0d1321;--text2:#5a6580;--text3:#9aa3b8;
  --grad-brand:linear-gradient(135deg,var(--brand),var(--brand-dk));
  --r:12px;--r-sm:8px;--r-lg:18px;--r-xl:24px;
  --shadow:0 1px 3px rgba(15,25,50,.06),0 4px 16px rgba(15,25,50,.05);
  --shadow-md:0 8px 28px rgba(20,50,140,.12);
  --font:'Plus Jakarta Sans',sans-serif;--font-d:'Syne',sans-serif;
  --t:.18s cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}
.hidden{display:none!important}
@keyframes mFadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ══════════════════════════ LAYOUT ══════════════════════════ */
#mavyApp{display:flex;flex-direction:column;height:100dvh;max-width:640px;margin:0 auto;background:var(--bg);position:relative}
.mScreen{flex:1;min-height:0;display:flex;flex-direction:column;animation:mFadeUp .25s ease}

/* ── Sparkle icon (replaces the old robot avatar everywhere) ── */
.mSparkle{display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ── Shared top bar (Home / More screens) ── */
.mTopBar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 12px;
  background:var(--surface);border-bottom:1px solid var(--border);
}
.mBrandLogo{width:34px;height:34px;border-radius:10px;flex-shrink:0;object-fit:cover}
.mBrandText{flex:1;min-width:0}
.mBrandText h1{font-family:var(--font-d);font-size:14px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.mBrandText span{display:block;font-size:9px;color:var(--text2);margin-top:1px;font-weight:500}
.mMavyPill{
  display:flex;align-items:center;gap:5px;background:var(--brand-lt);color:var(--brand);
  border-radius:999px;padding:5px 10px 5px 8px;font-size:10.5px;font-weight:700;flex-shrink:0;
}
.mMoreTitle{font-family:var(--font-d);font-size:16px;font-weight:800}

/* ── Chat header (distinct from the top bar — back/avatar/title/clear) ── */
.mChatHead{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 11px;
  background:var(--surface);border-bottom:1px solid var(--border);
}
.mHeadBtn{
  width:32px;height:32px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:var(--t);color:var(--text2);
}
.mHeadBtn:active{background:var(--border);transform:scale(.93)}
.mHeadAvatar{
  width:34px;height:34px;border-radius:11px;flex-shrink:0;background:var(--grad-brand);color:#fff;
  display:flex;align-items:center;justify-content:center;
}
.mHeadText{flex:1;min-width:0}
.mHeadText h1{font-family:var(--font-d);font-size:13.5px;font-weight:800;line-height:1.15}
.mHeadText span{display:block;font-size:10px;color:var(--text2);margin-top:1px}

/* ── Hub (Home) scroll area ── */
#mHubView{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 16px 26px}

/* ── Welcome block ── */
.mHubIconWrap{
  width:62px;height:62px;border-radius:19px;background:var(--grad-brand);color:#fff;
  display:flex;align-items:center;justify-content:center;margin:4px auto 14px;
  box-shadow:0 10px 22px -8px rgba(26,86,219,.45);
}
.mHubGreeting{text-align:center;font-family:var(--font-d);font-size:18px;font-weight:800;color:var(--text);margin-bottom:7px}
.mHubDesc{text-align:center;font-size:11.5px;color:var(--text2);line-height:1.55;max-width:280px;margin:0 auto 20px}

/* ── "Chat with Mavy" premium card ── */
.mChatCard{
  width:100%;display:flex;align-items:center;gap:12px;text-align:left;
  background:var(--brand-lt);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:14px 14px 14px 15px;margin-bottom:22px;transition:var(--t);
}
.mChatCard:active{transform:scale(.98)}
.mChatCardIcon{width:40px;height:40px;border-radius:12px;background:var(--surface);color:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--shadow)}
.mChatCardBody{flex:1;min-width:0}
.mChatCardBody b{display:block;font-size:12.5px;font-weight:800;color:var(--text)}
.mChatCardBody span{display:block;font-size:10px;color:var(--text2);margin-top:2px;line-height:1.4}
.mChatCardArrow{width:36px;height:36px;border-radius:50%;background:var(--grad-brand);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ── 2×2 feature cards ── */
.mFeatGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.mFeatCard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.mFeatIcon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.mFeatIcon.blue{background:var(--brand-lt);color:var(--brand)}
.mFeatIcon.purple{background:#f1ecff;color:var(--purple)}
.mFeatIcon.green{background:#e3f9ec;color:#16a34a}
.mFeatIcon.indigo{background:#eaf1ff;color:#3355c9}
.mFeatCard b{display:block;font-size:11.5px;font-weight:800;color:var(--text);margin-bottom:2px}
.mFeatCard span{display:block;font-size:9.5px;color:var(--text2);line-height:1.4}

/* ── Popular questions ── */
.mSecHead{display:flex;align-items:center;justify-content:space-between;padding:0 1px 9px}
.mSecHead b{font-family:var(--font-d);font-size:12.5px;font-weight:800;color:var(--text)}
.mSeeAll{display:flex;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--brand)}
.mPopularCard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:8px}
.mPopularRow{
  width:100%;display:flex;align-items:center;gap:10px;padding:12px;text-align:left;
  border-bottom:1px solid var(--border);transition:var(--t);animation:mFadeUp .25s ease backwards;
}
.mPopularRow:last-child{border-bottom:none}
.mPopularRow:active{background:var(--surface2)}
.mPopularIcon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mPop-blue{background:var(--brand-lt);color:var(--brand)}
.mPop-green{background:#e3f9ec;color:#16a34a}
.mPop-red{background:#fdeaea;color:#e5484d}
.mPop-indigo{background:#e9e7ff;color:#5b52e5}
.mPop-purple{background:#f1ecff;color:var(--purple)}
.mPop-amber{background:#fef3e0;color:#c9820a}
.mPopularText{flex:1;min-width:0}
.mPopularText b{display:block;font-size:11.5px;font-weight:700;color:var(--text);line-height:1.3}
.mPopularText span{display:block;font-size:10px;color:var(--text3);margin-top:1px}
.mPopularRow svg.chev{flex-shrink:0;color:var(--text3)}

/* ══════════════════════════ CHAT SCREEN ══════════════════════════ */
#mConvo{flex:1;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:3px;background:var(--bg)}

/* ── Empty-state (shown until the user sends their first message) ── */
.mEmptyState{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 30px;animation:mFadeUp .3s ease}
.mEmptyIcon{width:70px;height:70px;border-radius:50%;background:var(--brand-lt);color:var(--brand);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.mEmptyState h2{font-family:var(--font-d);font-size:16.5px;font-weight:800;margin-bottom:7px}
.mEmptyState p{font-size:11.5px;color:var(--text2);line-height:1.55;max-width:260px}

/* ── Message rows ── */
.mRow{display:flex;gap:8px;max-width:100%;animation:mFadeUp .22s ease}
.mRow.user{justify-content:flex-end}
.mAvatarSm{
  width:24px;height:24px;border-radius:8px;background:var(--grad-brand);color:#fff;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;margin-top:2px;
}
.mMsgCol{display:flex;flex-direction:column;max-width:83%}
.mRow.user .mMsgCol{align-items:flex-end}
.mBubble{
  padding:9px 12px;border-radius:15px;font-size:12px;line-height:1.55;
  white-space:pre-wrap;word-break:break-word;
}
.mRow.bot .mBubble{background:var(--surface);border:1px solid var(--border);border-top-left-radius:4px;color:var(--text);box-shadow:var(--shadow)}
.mRow.user .mBubble{background:var(--grad-brand);color:#fff;border-top-right-radius:4px}
.mRow.user .mBubble img{max-width:100%;border-radius:9px;margin-top:6px;display:block}
.mMsgMeta{display:flex;align-items:center;gap:4px;margin:4px 3px 10px;font-size:9.5px;color:var(--text3)}
.mMsgMeta svg{flex-shrink:0}

/* ── Action buttons under a bot message ── */
.mActions{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 10px 32px;max-width:83%}
.mActionBtn{
  border-radius:999px;padding:8px 14px;font-size:11px;font-weight:700;
  display:flex;align-items:center;gap:5px;border:1px solid transparent;transition:var(--t);
}
.mActionBtn:active{transform:scale(.97)}
.mActionBtn.primary{background:var(--brand);color:#fff}
.mActionBtn.secondary{background:var(--surface);color:var(--text);border-color:var(--border)}
.mActionBtn.wa{background:#e7f9f1;color:#0e9f5f;border-color:#c9f0dd}
.mActionBtn svg{flex-shrink:0}

/* ── Thinking indicator ── */
.mThinking{display:flex;align-items:center;gap:7px;margin:2px 0 10px 32px}
.mThinkDots{display:flex;gap:3px;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:10px 14px;box-shadow:var(--shadow)}
.mThinkDots span{width:5px;height:5px;border-radius:50%;background:var(--brand);animation:mBounce 1.1s infinite ease-in-out}
.mThinkDots span:nth-child(2){animation-delay:.15s}
.mThinkDots span:nth-child(3){animation-delay:.3s}
@keyframes mBounce{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-4px);opacity:1}}
.mToastRow{display:flex;justify-content:center;margin:4px 0 8px;animation:mFadeUp .2s ease}
.mToastChip{background:var(--surface2);color:var(--text2);font-size:10.5px;font-weight:600;padding:6px 12px;border-radius:999px}

/* ── Compact pill quick actions above the composer ── */
.mPillsWrap{flex:0 0 auto;padding:2px 14px 8px;overflow-x:auto;white-space:nowrap}
.mPillsWrap::-webkit-scrollbar{display:none}
.mPillBtn{
  display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);
  border-radius:999px;padding:8px 14px;font-size:11.5px;font-weight:700;color:var(--text);
  margin-right:8px;transition:var(--t);box-shadow:var(--shadow);
}
.mPillBtn:active{transform:scale(.96);background:var(--surface2)}
.mPillBtn svg{flex-shrink:0;color:var(--brand)}

/* ── Composer ── */
.mComposerWrap{
  flex:0 0 auto;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 10px);
  background:var(--surface);
}
.mImgPreview{display:flex;align-items:center;gap:8px;margin:0 2px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:6px 8px}
.mImgPreview img{width:32px;height:32px;border-radius:6px;object-fit:cover}
.mImgPreview span{flex:1;font-size:10.5px;color:var(--text2)}
.mImgPreview button{color:var(--text3);padding:4px}
.mComposer{
  display:flex;align-items:flex-end;gap:2px;
  background:var(--surface);border:1.5px solid var(--border);border-radius:24px;padding:4px 4px 4px 6px;
  box-shadow:0 4px 16px rgba(15,25,50,.06);transition:var(--t);
}
.mComposer.focused{border-color:var(--brand);box-shadow:0 0 0 3px rgba(26,86,219,.1)}
#mAttachBtn,#mSendBtn{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:var(--t);
}
#mAttachBtn{background:transparent;color:var(--text3)}
#mAttachBtn:active{background:var(--surface2);transform:scale(.92)}
#mSendBtn{background:var(--grad-brand);color:#fff}
#mSendBtn:active{transform:scale(.92)}
#mSendBtn:disabled{background:var(--border);color:var(--text3)}
#mSendBtn .mSpin{animation:mSpin .7s linear infinite}
@keyframes mSpin{to{transform:rotate(360deg)}}
#mInput{
  flex:1;background:transparent;resize:none;font-size:12.5px;line-height:1.45;
  max-height:90px;padding:8px 4px;outline:none;color:var(--text);
}
#mInput::placeholder{color:var(--text3)}
.mDisclaimer{display:flex;align-items:center;justify-content:center;gap:4px;text-align:center;font-size:9px;color:var(--text3);margin-top:8px;font-weight:500}
.mDisclaimer svg{flex-shrink:0;opacity:.8}

/* ══════════════════════════ MORE SCREEN ══════════════════════════ */
#mMoreView{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 26px}
.mMoreGroupLbl{font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;padding:0 2px 8px;margin-top:18px}
.mMoreGroupLbl:first-child{margin-top:0}
.mMoreCard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.mMoreRow{width:100%;display:flex;align-items:center;gap:11px;padding:13px;text-align:left;border-bottom:1px solid var(--border);transition:var(--t)}
.mMoreRow:last-child{border-bottom:none}
.mMoreRow:active{background:var(--surface2)}
.mMoreIcon{width:34px;height:34px;border-radius:10px;background:var(--brand-lt);color:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mMoreText{flex:1;min-width:0}
.mMoreText b{display:block;font-size:12.5px;font-weight:700;color:var(--text)}
.mMoreText span{display:block;font-size:10px;color:var(--text2);margin-top:1px}

/* ══════════════════════════ BOTTOM NAV ══════════════════════════
   Matches the main site's floating pill nav (#bnav/.bnItem in
   index.html) exactly: floating margins, rounded pill, soft shadow,
   small dot above the active icon, icon lifts slightly when active —
   rather than a filled/boxed nav bar. */
.mBottomNavWrap{flex:0 0 auto;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 12px);margin-top:8px}
.mBottomNav{
  height:58px;background:var(--surface);border-radius:20px;border:1px solid var(--border);
  display:flex;align-items:stretch;box-shadow:0 10px 28px rgba(15,25,50,.12);
}
.mNavBtn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--text3);font-size:9.5px;font-weight:600;transition:color var(--t);position:relative;
}
.mNavBtn svg,.mNavBtn .mSparkle svg{transition:transform var(--t)}
.mNavBtn.active{color:var(--brand)}
.mNavBtn.active svg,.mNavBtn.active .mSparkle svg{transform:translateY(-2px)}
.mNavBtn.active::after{
  content:'';position:absolute;top:4px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--brand);
}
</style>
</head>
<body>
<div id="mavyApp">

  <!-- ══ HOME ══ -->
  <div id="mScreenHome" class="mScreen">
    <div class="mTopBar">
      <img class="mBrandLogo" src="android-chrome-192x192.png" alt="GlobalDigits"/>
      <div class="mBrandText">
        <h1>GlobalDigits</h1>
        <span>Your Trusted Plug for Online Services.</span>
      </div>
      <div class="mMavyPill"><span class="mSparkle" data-sparkle="14"></span>Mavy</div>
    </div>
    <div id="mHubView"></div>
  </div>

  <!-- ══ CHAT ══ -->
  <div id="mScreenChat" class="mScreen hidden">
    <div class="mChatHead">
      <button class="mHeadBtn" aria-label="Back" onclick="mavyBack()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="mHeadAvatar"><span class="mSparkle" data-sparkle="18"></span></div>
      <div class="mHeadText">
        <h1>Mavy</h1>
        <span>AI Assistant</span>
      </div>
      <button class="mHeadBtn" id="mNewChatBtn" aria-label="New conversation" title="New conversation" onclick="mavyResetChat()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
      </button>
    </div>

    <div id="mConvo"></div>

    <div class="mPillsWrap" id="mPillsWrap"></div>

    <div class="mComposerWrap">
      <div class="mImgPreview hidden" id="mImgPreviewWrap">
        <img id="mImgPreviewThumb" alt="Attached screenshot"/>
        <span>Screenshot attached</span>
        <button onclick="mavyRemoveImage()" aria-label="Remove image">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="mComposer" id="mComposer">
        <button id="mAttachBtn" aria-label="Attach a photo or file" title="Attach" onclick="document.getElementById('mFileInput').click()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <input type="file" id="mFileInput" accept="image/*" class="hidden" onchange="mavyHandleFile(event)"/>
        <textarea id="mInput" rows="1" placeholder="Type your message..." onkeydown="mavyOnKeydown(event)" oninput="mavyAutoGrow(this)" onfocus="document.getElementById('mComposer').classList.add('focused')" onblur="document.getElementById('mComposer').classList.remove('focused')"></textarea>
        <button id="mSendBtn" aria-label="Send" onclick="mavySend()">
          <svg id="mSendIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div class="mDisclaimer">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        Mavy can make mistakes sometimes. Please double-check important info.
      </div>
    </div>
  </div>

  <!-- ══ MORE ══ -->
  <div id="mScreenMore" class="mScreen hidden">
    <div class="mTopBar"><div class="mMoreTitle">More</div></div>
    <div id="mMoreView"></div>
  </div>

  <!-- ══ BOTTOM NAV ══ -->
  <div class="mBottomNavWrap">
    <div class="mBottomNav">
      <button class="mNavBtn active" id="mNavHome" onclick="mavySetTab('home')">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 001 1h4a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1h4a1 1 0 001-1V10"/></svg>
        <span>Home</span>
      </button>
      <button class="mNavBtn" id="mNavChat" onclick="mavySetTab('chat')">

/* ── 4. NORMALIZATION (typos + Nigerian informal English) ─────── */
// Used for fast local pattern checks (small talk, explicit human-support
// requests) and as light pre-cleaning before a message goes to the AI.
// It is a helper, not the thing doing the actual understanding — the AI
// call below handles genuine intent/typo/pidgin/context reasoning.
var SLANG_MAP={
  'abeg':'please','pls':'please','plz':'please','wetin':'what','wat':'what',
  'howfar':'how are you','how far':'how are you','nowahala':'no problem','no wahala':'no problem',
  'dey':'is','na':'is','fit':'can','abi':'right','wia':'where','dis':'this','dat':'that',
  'dem':'them','una':'you all','sha':'','sef':'','wan':'want','oga':'',
  'walet':'wallet','fon':'phone','depost':'deposit','accnt':'account','passwrd':'password',
  'incorret':'incorrect','tikok':'tiktok','folower':'follower','folowers':'followers',
  'laik':'like','laiks':'likes','instagrm':'instagram','fesbook':'facebook','hotmial':'hotmail',
  'yh':'yes','yhh':'yes','tnx':'thanks','thanx':'thanks','k':'ok','kk':'ok','aight':'alright'
};
function mavyNormalize(raw){
  var s=(' '+raw.toLowerCase().trim()+' ').replace(/[^\w\s'?!.]/g,' ').replace(/\s+/g,' ');
  Object.keys(SLANG_MAP).forEach(function(k){
    var re=new RegExp('\\b'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','g');
    s=s.replace(re,SLANG_MAP[k]);
  });
  return s.trim();
}

// question with Boosting information: both topics are right there for it
// to tell apart, rather than Mavy pre-guessing and sending only one.
var mKnowledgeCache=null;
function mavyBuildKnowledgeContext(){
  if(mKnowledgeCache)return mKnowledgeCache;
  var blocks=Object.keys(KB).map(function(id){
    var t=KB[id];
    var lines=['### '+t.label+(t.route?' (route key: '+t.route+')':'')];
    if(t.summary)lines.push(t.summary);
    if(t.steps&&t.steps.length)lines.push('How to / details: '+t.steps.join(' | '));
    if(t.problems){
      Object.keys(t.problems).forEach(function(p){lines.push('If the problem is "'+p+'": '+t.problems[p]);});
    }
    return lines.join('\n');
  });
  var r=MAVY_CONFIG.resources;
  blocks.push(
    '### Resources (never show these raw URLs as text — only via a "link" action button)\n'+
    'Email login / account recovery tutorial video URL: '+r.loginTutorialUrl+'\n'+

    'addfunds = Add Funds page | vtu = Airtime & Data page (also covers Cable TV and Electricity as tabs on that same page) | boost = Boost Social Media page | '+

/* ── 8. LIVE USER CONTEXT (read-only, minimal PII sent to the AI) ─ */
var mOrdersCache=null,mDepositsCache=null,mOrdersCacheAt=0;
var ORDERS_CACHE_TTL_MS=45000; // refetch periodically so a new order placed mid-conversation shows up without needing a page reload
async function mavyBuildUserContext(){
  if(!mUser)return 'No authenticated user session detected. If the question needs personal account/order/deposit data, ask the user to make sure they are logged in.';
  var stale=mOrdersCache===null||(Date.now()-mOrdersCacheAt)>ORDERS_CACHE_TTL_MS;
  if(stale){
    // Runs on every message automatically — the user never has to tap the
    // Orders quick action for Mavy to know about their recent activity.
    // Uses the signed-in Supabase session only, scoped by RLS to this
    // user's own rows (see mavyGetRecentOrders/mavyGetRecentDeposits).
    var results=await Promise.all([mavyGetRecentOrders(),mavyGetRecentDeposits()]);
    mOrdersCache=results[0];mDepositsCache=results[1];mOrdersCacheAt=Date.now();
  }
  var lines=[];
  lines.push('First name: '+(mUser.name?mUser.name.split(' ')[0]:'Unknown'));
  lines.push('Wallet balance: \u20a6'+Number(mUser.balance||0).toLocaleString());
  if(mOrdersCache.length){
    lines.push('Recent orders (most recent first):');
    mOrdersCache.forEach(function(o){lines.push('- '+o.kind+' ('+o.label+'): '+(o.status||'pending'));});
  }else{ lines.push('Recent orders: none yet.'); }
  if(mDepositsCache.length){
    lines.push('Recent deposits (most recent first):');
    mDepositsCache.forEach(function(d){lines.push('- \u20a6'+Number(d.amount||0).toLocaleString()+': '+(d.status||'pending')+(d.rejection_reason?' ('+d.rejection_reason+')':''));});
  }else{ lines.push('Recent deposits: none yet.'); }
  return lines.join('\n');
}

var ALLOWED_NAV_PAGES=['addfunds','vtu','boost','numbers','accounts','myorders','myaccorders','transactions','settings','support'];
function mavySanitizeActions(actions){
  if(!Array.isArray(actions))return[];
  var allowedLinks=Object.keys(MAVY_CONFIG.resources).map(function(k){return MAVY_CONFIG.resources[k];}).filter(Boolean);
  var out=[];
  actions.forEach(function(a){
    if(!a||!a.type)return;
    if(a.type==='nav'&&ALLOWED_NAV_PAGES.indexOf(a.page)!==-1){
      out.push({type:'nav',page:a.page,label:a.label});
    }else if(a.type==='reseller'){
      out.push({type:'reseller',label:a.label||'View Reseller Plans'});
    }else if(a.type==='whatsapp'){
      out.push({type:'whatsapp',label:a.label});
    }else if(a.type==='link'&&a.url&&allowedLinks.indexOf(a.url)!==-1){
      // Only ever render a link the AI reproduced exactly from configured
      // resources — this is enforced here in code, not just by the prompt,
      // so the AI can never redirect a user anywhere we didn't configure.
      out.push({type:'link',label:a.label,url:a.url});
    }
  });
  return out.slice(0,2);
}
// Defense-in-depth: the backend (supabase/functions/mavy-ai) already
// guarantees this never happens, but if a reply ever somehow still looks
// like a raw JSON blob instead of plain text, don't show it — extract the
// real message if possible, otherwise show a clean fallback. This is a
// last-resort safety net, not the primary fix (that lives server-side).
function mavyCleanReplyText(text){
  if(typeof text!=='string')return 'I\'m not able to help with that right now.';
  var t=text.trim();
  var looksLikeJson=/^\{[\s\S]*\}$/.test(t)&&/"reply"/i.test(t);
  if(!looksLikeJson)return t;
  try{
    var parsed=JSON.parse(t);
    if(parsed&&typeof parsed.reply==='string'&&parsed.reply.trim())return parsed.reply.trim();
  }catch(e){/* fall through to regex extraction */}
  var m=t.match(/"reply"\s*:\s*"([\s\S]*?)"\s*,\s*"actions"/i);
  if(m&&m[1])return m[1].replace(/\\n/g,'\n').replace(/\\"/g,'"').replace(/\\\\/g,'\\').trim();
  return 'Sorry, I had trouble putting that answer together. Could you try asking again?';
}
// ════════════════════════════════════════════════════════════════
// BUG FIX (task #18-21): this used to wrap the ENTIRE function body in
// one try/catch and show the same "reasoning engine" message for every
// single failure — a plain JS bug building the request, a network error
// that never reached the server, an edge-function HTTP error, AND a
// genuine OpenRouter failure all looked identical, both to the user and
// in the console. That's fixed below by handling each stage separately:
//
//  1. Building the request (knowledge/user context) — a failure here is
//     a JS bug in THIS file, not the reasoning engine.
//  2. The network call itself throwing — never even reached the server.
//  3. supabase-js's functions.invoke() returning res.error — this is the
//     part that was silently losing information. On a non-2xx response,
//     supabase-js only puts a generic "Edge Function returned a non-2xx
//     status code" in res.error.message — the edge function's OWN error
//     detail (the actual reason: bad auth, rate limit, OpenRouter error,
//     malformed request, etc.) lives in res.error.context, which is the
//     raw Response object, and was never being read. That's very likely
//     the real root cause of these showing up as a generic, unexplained
//     "reasoning engine" failure with nothing useful in the console to
//     debug from — this now reads and logs that real detail, and gives
//     a more specific message for the cases that call for one
//     (expired session, rate limited).
//  4. A 2xx response with an unexpected body shape — a response-parser
//     mismatch, not a reasoning-engine failure.
//
// Only case 3 (and a genuine empty/failed reply from case 4) is ever
// described to the user as a reasoning-engine problem now.
// ════════════════════════════════════════════════════════════════
async function mavyAskAI(userMessage,imageDataUrl){
  if(!mSb){
    console.error('Mavy: Supabase client failed to initialize — check MAVY_CONFIG and the supabase-js script tag.');
    return {text:'Mavy\'s reasoning engine isn\'t available right now. You can reach human support directly.',actions:[{type:'whatsapp'}]};
  }

  var knowledge,userContext;
  try{
    knowledge=mavyBuildKnowledgeContext();
    userContext=await mavyBuildUserContext();
  }catch(setupErr){
    console.error('Mavy: failed to build the request context — a JavaScript bug in this file, not a reasoning-engine failure:',setupErr);
    return {text:'Something went wrong on my end before I could even ask. Please try again, or reach human support.',actions:[{type:'whatsapp'}]};
  }

  var historyPayload=mHistory.slice(-10);
  var body={knowledge:knowledge,history:historyPayload,message:userMessage||'',userContext:userContext};
  if(imageDataUrl)body.image=imageDataUrl; // base64 data URL — backend forwards it to the vision model, never the frontend

  var res;
  try{
    res=await mSb.functions.invoke(MAVY_CONFIG.aiFunctionName,{body:body});
  }catch(networkErr){
    console.error('Mavy: network error calling the edge function — request never reached the server:',networkErr);
    return {text:'I couldn\u2019t reach the server just now \u2014 please check your connection and try again.',actions:[{type:'whatsapp'}]};
  }

  if(res.error){
    var status=null,detail=null;
    try{
      if(res.error.context&&typeof res.error.context.clone==='function'){
        status=res.error.context.status;
        var errBody=await res.error.context.clone().json().catch(function(){return null;});
        detail=errBody&&(errBody.error||errBody.message);
      }
    }catch(parseErr){ /* fall through — still log what we have below */ }
    console.error('Mavy AI edge function error — status:',status,'detail:',detail||res.error.message,'raw:',res.error);
    if(status===401||status===403){
      return {text:'Your session looks like it may have expired \u2014 please refresh the page and try again.',actions:[{type:'whatsapp'}]};
    }
    if(status===429){
      return {text:'Mavy is getting a lot of requests right now \u2014 please try again in a moment.',actions:[{type:'whatsapp'}]};
    }
    return {text:'I\'m having trouble reaching my reasoning engine right now. You can try again in a moment, or reach human support directly.',actions:[{type:'whatsapp'}]};
  }

  var data=res.data;
  if(!data||typeof data.reply==='undefined'){
    console.error('Mavy: unexpected response shape from the edge function (expected an object with a "reply" field):',data);
    return {text:'I got an unexpected response just now \u2014 please try asking again.',actions:[{type:'whatsapp'}]};
  }
  return {text:mavyCleanReplyText(data.reply||'I\'m not able to help with that right now.'),actions:mavySanitizeActions(data.actions)};
}

/* ── Tab switching (Home / Chat / More) ── */
var mActiveTab='home';
function mavySetTab(name){
  mActiveTab=name;
  ['home','chat','more'].forEach(function(t){
    document.getElementById('mScreen'+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle('hidden',t!==name);
    document.getElementById('mNav'+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle('active',t===name);
  });
  if(name==='chat'&&mConvoEl&&!mConvoEl.children.length){ mavyRenderWelcome(); }
  if(name==='more'){ mavyRenderMore(); }
}

function mavyAppendUserMessage(text,imageDataUrl){
  var emptyState=document.getElementById('mEmptyState');if(emptyState)emptyState.remove();
  var row=document.createElement('div');row.className='mRow user';
  var col=document.createElement('div');col.className='mMsgCol';

  var meta=document.createElement('div');meta.className='mMsgMeta';
  meta.innerHTML='<span>'+mavyTimeNow()+'</span>'+mavyIconSvg('checkdbl');
  meta.style.color='var(--brand)';
  col.appendChild(b);col.appendChild(meta);
  row.appendChild(col);mConvoEl.appendChild(row);mavyScrollDown();
}
function mavyAppendBotMessage(text,actions){
  var row=document.createElement('div');row.className='mRow bot';
  var av=document.createElement('div');av.className='mAvatarSm';
  av.innerHTML=mavySparkleSvg(13);
  var col=document.createElement('div');col.className='mMsgCol';
  var b=document.createElement('div');b.className='mBubble';b.innerHTML=mavyEscape(text).replace(/\n/g,'<br>');
  var meta=document.createElement('div');meta.className='mMsgMeta';meta.textContent=mavyTimeNow();
  col.appendChild(b);col.appendChild(meta);
  row.appendChild(av);row.appendChild(col);mConvoEl.appendChild(row);

  if(actions&&actions.length){
    var aw=document.createElement('div');aw.className='mActions';
    actions.forEach(function(a,idx){
      var btn=document.createElement('button');
      if(a.type==='nav'){
        btn.className='mActionBtn '+(idx===0?'primary':'secondary');btn.innerHTML=(a.label||'Open')+mavyIconSvg('nav');
        btn.onclick=function(){mavyGoTo(a.page);};
      }else if(a.type==='reseller'){
        btn.className='mActionBtn '+(idx===0?'primary':'secondary');btn.innerHTML=(a.label||'View Reseller Plans')+mavyIconSvg('crown');
        btn.onclick=function(){mavyOpenReseller();};
      }else if(a.type==='whatsapp'){
        btn.className='mActionBtn wa';btn.innerHTML=(a.label||'Chat with Human Support on WhatsApp')+mavyIconSvg('wa');
        btn.onclick=function(){mavyOpenWhatsApp();};
      }else if(a.type==='link'){
        btn.className='mActionBtn '+(idx===0?'primary':'secondary');btn.innerHTML=(a.label||'Watch Tutorial')+mavyIconSvg('play');
        btn.onclick=function(){window.open(a.url,'_blank');};
      }
      aw.appendChild(btn);
    });
    mConvoEl.appendChild(aw);
  }
  mavyScrollDown();
}

/* ── 12. EVENT HANDLERS ────────────────────────────────────────── */
function mavyOnKeydown(ev){
  if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();mavySend();}
}
function mavyAutoGrow(el){ el.style.height='auto';el.style.height=Math.min(el.scrollHeight,90)+'px'; }

// Resizes/compresses the image client-side before it's sent anywhere —
// keeps the request small and fast regardless of how large the original
// phone photo/screenshot was.
function mavyCompressImage(file){
  return new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onload=function(){
      var img=new Image();
      img.onload=function(){
        var maxDim=1280;
        var scale=Math.min(1,maxDim/Math.max(img.width,img.height));
        var w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
        var canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        var ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.75));
      };
      img.onerror=function(){reject(new Error('Could not read image'));};
      img.src=reader.result;
    };
    reader.onerror=function(){reject(new Error('Could not read file'));};
    reader.readAsDataURL(file);
  });
}
async function mavyHandleFile(ev){
  var f=ev.target.files&&ev.target.files[0];if(!f)return;
  try{
    var compressed=await mavyCompressImage(f);
    mAttachedImage=compressed;
    document.getElementById('mImgPreviewThumb').src=mAttachedImage;
    document.getElementById('mImgPreviewWrap').classList.remove('hidden');
  }catch(e){
    console.error('Image processing failed:',e);
    mavyToast('Couldn\'t read that image — please try a different file.');
  }
}
function mavyRemoveImage(){
  mAttachedImage=null;
  document.getElementById('mFileInput').value='';
  document.getElementById('mImgPreviewWrap').classList.add('hidden');
}
// Quick-question buttons and any other caller route through here, which
// puts the question through the exact same pipeline as manually typed
// messages (history included) — nothing shortcuts past the AI call.
function mavySendText(text){
  mInputEl.value=text;
  mavyAutoGrow(mInputEl);
  mavySend();
}
// The "Email Tutorial" quick action is an explicit, unambiguous tap —
// so it skips the ask-then-confirm chat flow and shows the button right
// away, using the same real, whitelisted resource URL as everything else.
function mavySendTutorial(){
  var reply='Sure — here\'s the step-by-step video for logging in / recovering account access.';
  mHistory.push({role:'user',text:'[tapped Email Tutorial quick action]'});
  mHistory.push({role:'assistant',text:reply});
  mavyAppendBotMessage(reply,[{type:'link',label:'Watch Login Tutorial',url:MAVY_CONFIG.resources.loginTutorialUrl}]);
}

async function mavySend(){
  var text=(mInputEl.value||'').trim();
  var img=mAttachedImage;
  if(!text&&!img)return;
  mavyAppendUserMessage(text||'(screenshot attached)',img);
  mHistory.push({role:'user',text:img?(text?text+' [attached a screenshot]':'[attached a screenshot]'):text});
  mInputEl.value='';mavyAutoGrow(mInputEl);
  var imageToSend=img;
  mavyRemoveImage();
  mavySetSending(true);

  // Screenshots go straight to the vision-capable model on the backend —
  // small-talk/human-support shortcuts only apply to plain text messages,
  // since an attached image always needs an actual look.
  if(imageToSend){
    mavyShowThinking();
    var imgStartedAt=Date.now();
    var imgResult=await mavyAskAI(text,imageToSend);
    var imgElapsed=Date.now()-imgStartedAt;
    setTimeout(function(){
      mavyHideThinking();
      mHistory.push({role:'assistant',text:imgResult.text});
      mavyAppendBotMessage(imgResult.text,imgResult.actions);
      mavySetSending(false);
    },Math.max(0,MAVY_CONFIG.minThinkingMs-imgElapsed));
    return;
  }

  var norm=mavyNormalize(text);

  // Explicit human-support request: escalate immediately, no automated
  // troubleshooting (or even an AI round trip) forced in between.
  if(HUMAN_REQUEST_RE.test(norm)){
    var waReply='Sure — I\'ll connect you with our human support team on WhatsApp.';
    mHistory.push({role:'assistant',text:waReply});
    mavyAppendBotMessage(waReply,[{type:'whatsapp',label:'Chat with Human Support on WhatsApp'}]);
    mavySetSending(false);
    return;
  }

  // Everything else — including greetings, casual chat, and general
  // GlobalDigits questions — goes through Mavy AI (OpenRouter via the
  // secure edge function), grounded in the local knowledge base + live
  // signed-in user data, so replies sound natural instead of scripted.
  mavyShowThinking();
  var startedAt=Date.now();
  var result=await mavyAskAI(text);
  var elapsed=Date.now()-startedAt;
  setTimeout(function(){
    mavyHideThinking();
    mHistory.push({role:'assistant',text:result.text});
    mavyAppendBotMessage(result.text,result.actions);
    mavySetSending(false);
  },Math.max(0,MAVY_CONFIG.minThinkingMs-elapsed));
}
function mavyResetChat(){
  mHistory=[];
  mavyRenderWelcome();
}
