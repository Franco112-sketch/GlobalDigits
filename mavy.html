<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#1a56db"/>
<title>Mavy — GlobalDigits Support</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ══════════════════════════ TOKENS ══════════════════════════ */
:root{
  --brand:#1a56db;--brand-dk:#123fa8;--brand-lt:#eaf1ff;
  --danger:#ef4444;--warn:#f59e0b;--success:#10b981;--purple:#7c5cff;
  --bg:#f5f8ff;--surface:#fff;--surface2:#f0f5ff;--border:#e1eafc;
  --text:#0d1321;--text2:#5a6580;--text3:#9aa3b8;
  --glass-bg:rgba(255,255,255,.62);--glass-border:rgba(255,255,255,.5);
  --glass-head:linear-gradient(135deg,rgba(26,86,219,.88),rgba(18,63,168,.88));
  --r:12px;--r-sm:8px;--r-lg:18px;--r-xl:24px;
  --shadow:0 1px 3px rgba(15,25,50,.06),0 4px 16px rgba(15,25,50,.05);
  --shadow-md:0 8px 28px rgba(20,50,140,.12);
  --font:'Plus Jakarta Sans',sans-serif;--font-d:'Syne',sans-serif;
  --t:.18s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  --bg:#0a0f1c;--surface:#111a2c;--surface2:#17223a;--border:#1f2c47;
  --text:#e8edf8;--text2:#7f8bab;--text3:#42506e;--brand-lt:#122347;
  --glass-bg:rgba(17,26,44,.62);--glass-border:rgba(255,255,255,.08);
  --glass-head:linear-gradient(135deg,rgba(18,35,80,.9),rgba(10,20,50,.92));
  --shadow:0 1px 3px rgba(0,0,0,.3);--shadow-md:0 8px 32px rgba(0,0,0,.5);
}
[data-theme="dark"] .mPop-blue{background:rgba(26,86,219,.22);color:#7ba3ff}
[data-theme="dark"] .mPop-green{background:rgba(16,163,74,.18);color:#4ade80}
[data-theme="dark"] .mPop-red{background:rgba(229,72,77,.18);color:#f87171}
[data-theme="dark"] .mPop-indigo{background:rgba(91,82,229,.2);color:#a5a0ff}
[data-theme="dark"] .mPop-purple{background:rgba(124,92,255,.2);color:#b8a6ff}
[data-theme="dark"] .mPop-amber{background:rgba(201,130,10,.2);color:#fbbf5c}
[data-theme="dark"] .mStatItem.smart svg{color:#b8a6ff}
[data-theme="dark"] .mStatItem.fast svg{color:#4ade80}
[data-theme="dark"] .mStatItem.helpful svg{color:#7ba3ff}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}
.hidden{display:none!important}

/* ══════════════════════════ LAYOUT ══════════════════════════ */
#mavyApp{display:flex;flex-direction:column;height:100dvh;max-width:640px;margin:0 auto;background:var(--bg);position:relative}

/* ── Screen containers (Support Hub vs Chat) ── */
#mHubView{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 14px 26px}
#mChatView{flex:1;display:flex;flex-direction:column;min-height:0}
.mScreenAnim{animation:mFadeUp .28s ease}

/* ── Header ── */
.mHead{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 11px) 14px 11px;
  background:linear-gradient(135deg,var(--brand),var(--brand-dk));
  border-bottom:1px solid rgba(255,255,255,.1);
  position:sticky;top:0;z-index:5;
}
.mHeadBtn{
  width:29px;height:29px;border-radius:50%;border:none;background:rgba(255,255,255,.13);
  color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:var(--t);
}
.mHeadBtn:active{background:rgba(255,255,255,.24);transform:scale(.93)}
.mHeadAvatar{
  width:38px;height:38px;border-radius:12px;flex-shrink:0;
  background:#fff;color:var(--brand);
  display:flex;align-items:center;justify-content:center;
}
.mHeadText{flex:1;min-width:0}
.mHeadNameRow{display:flex;align-items:center;gap:5px}
.mHeadNameRow h1{font-family:var(--font-d);font-size:15px;font-weight:800;color:#fff;line-height:1.15}
.mVerifiedBadge{flex-shrink:0;color:#fff;display:flex}
.mHeadStatus{display:flex;align-items:center;gap:5px;margin-top:2px}
.mHeadStatus .dot{width:6px;height:6px;border-radius:50%;background:#34e58f}
.mHeadStatus span{font-size:10px;color:rgba(255,255,255,.8);font-weight:500}
.mHeadActions{display:flex;align-items:center;gap:6px;flex-shrink:0}

/* ── Conversation area ── */
#mConvo{flex:1;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:3px;background:var(--bg)}
.mDateChip{align-self:center;background:var(--surface);border:1px solid var(--border);color:var(--text2);
  font-size:10.5px;font-weight:600;padding:5px 13px;border-radius:999px;margin:6px 0 12px;box-shadow:var(--shadow)}

/* ── Welcome ── */
.mWelcome{padding:6px 4px 4px;text-align:center;animation:mFadeUp .3s ease}
.mWelcomeIcon{
  width:50px;height:50px;border-radius:16px;background:var(--surface);color:var(--brand);
  display:flex;align-items:center;justify-content:center;margin:4px auto 12px;
  box-shadow:var(--shadow);border:1px solid var(--border);
}
.mWelcome h2{font-family:var(--font-d);font-size:18px;font-weight:800;margin-bottom:5px;color:var(--text)}
.mWelcome p{font-size:12px;color:var(--text2);line-height:1.5;max-width:340px;margin:0 auto 16px}

/* ── Stat strip ── */
.mStatRow{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:18px;padding:8px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.mStatItem{display:flex;align-items:center;gap:5px}
.mStatItem svg{flex-shrink:0}
.mStatItem.smart svg{color:var(--purple)}
.mStatItem.fast svg{color:#16a34a}
.mStatItem.helpful svg{color:var(--brand)}
.mStatItem b{font-size:10.5px;font-weight:700;color:var(--text2)}

/* ── Support Hub (first screen) ── */
.mHubAvatarWrap{
  width:76px;height:76px;border-radius:50%;background:var(--brand-lt);color:var(--brand);
  display:flex;align-items:center;justify-content:center;margin:8px auto 14px;position:relative;
}
.mHubAvatarWrap::before{content:'';position:absolute;inset:-7px;border-radius:50%;border:1.5px solid var(--border)}
.mHubGreeting{text-align:center;font-family:var(--font-d);font-size:19px;font-weight:800;color:var(--text);margin-bottom:6px}
.mHubDesc{text-align:center;font-size:12px;color:var(--text2);line-height:1.55;max-width:300px;margin:0 auto 18px}
.mHubCta{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:linear-gradient(135deg,var(--brand),var(--brand-dk));color:#fff;border:none;
  border-radius:999px;padding:13px 20px;font-size:13.5px;font-weight:700;font-family:inherit;
  box-shadow:0 8px 20px rgba(26,86,219,.28);transition:var(--t);margin-bottom:20px;
}
.mHubCta:active{transform:scale(.98)}
.mHubCta svg{flex-shrink:0}
.mHubFeatures{display:flex;align-items:flex-start;justify-content:space-between;gap:2px;padding:14px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:22px}
.mHubFeature{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:0 2px}
.mHubFeature .ic{width:28px;height:28px;border-radius:9px;background:var(--brand-lt);color:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mHubFeature span{font-size:8.8px;font-weight:700;color:var(--text2);line-height:1.25}
.mHubQuickGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:22px}
.mHubQuickTile{
  display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 3px;text-align:center;
  transition:var(--t);font-family:inherit;
}
.mHubQuickTile:active{transform:scale(.95);background:var(--surface2)}
.mHubQuickTile .ic{width:28px;height:28px;border-radius:9px;background:var(--brand-lt);color:var(--brand);display:flex;align-items:center;justify-content:center}
.mHubQuickTile span{font-size:8.3px;font-weight:700;color:var(--text);line-height:1.2}
.mHubTrust{
  width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:var(--brand-lt);
  border:1px solid var(--border);border-radius:var(--r);padding:12px;transition:var(--t);font-family:inherit;
}
.mHubTrust:active{transform:scale(.98)}
.mHubTrust .ic{width:32px;height:32px;border-radius:10px;background:var(--surface);color:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mHubTrust b{display:block;font-size:11.5px;font-weight:700;color:var(--text)}
.mHubTrust span{display:block;font-size:10px;color:var(--text2);margin-top:2px;line-height:1.4}
.mHubTrust svg.chev{margin-left:auto;flex-shrink:0;color:var(--text3)}

/* ── Popular questions card list ── */
.mPopularHead{display:flex;align-items:center;justify-content:space-between;padding:0 2px 7px;text-align:left}
.mPopularHead b{font-size:12px;font-weight:800;color:var(--text)}
.mPopularSeeAll{background:none;border:none;font-size:11px;font-weight:700;color:var(--brand);padding:2px}
.mPopularCard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.mPopularRow{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;text-align:left;border:none;background:none;border-bottom:1px solid var(--border);transition:var(--t);animation:mFadeUp .25s ease backwards}
.mPopularRow:nth-child(1){animation-delay:.02s}
.mPopularRow:nth-child(2){animation-delay:.05s}
.mPopularRow:nth-child(3){animation-delay:.08s}
.mPopularRow:nth-child(4){animation-delay:.11s}
.mPopularRow:nth-child(5){animation-delay:.14s}
.mPopularRow:nth-child(6){animation-delay:.17s}
.mPopularRow:last-child{border-bottom:none}
.mPopularRow:active{background:var(--surface2)}
.mPopularIcon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mPop-blue{background:var(--brand-lt);color:var(--brand)}
.mPop-green{background:#e3f9ec;color:#16a34a}
.mPop-red{background:#fdeaea;color:#e5484d}
.mPop-indigo{background:#e9e7ff;color:#5b52e5}
.mPop-purple{background:#f1ecff;color:var(--purple)}
.mPop-amber{background:#fef3e0;color:#c9820a}
.mPopularText{flex:1;min-width:0}
.mPopularText b{display:block;font-size:11.5px;font-weight:700;color:var(--text);line-height:1.3}
.mPopularText span{display:block;font-size:9.5px;color:var(--text3);margin-top:1px}
.mPopularRow svg.chev{flex-shrink:0;color:var(--text3)}

/* ── Message rows ── */
@keyframes mFadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.mRow{display:flex;gap:7px;max-width:100%;animation:mFadeUp .22s ease}
.mRow.user{justify-content:flex-end}
.mAvatarSm{
  width:23px;height:23px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--brand-dk));color:#fff;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;margin-top:2px;
}
.mMsgCol{display:flex;flex-direction:column;max-width:83%}
.mRow.user .mMsgCol{align-items:flex-end}
.mBubble{
  padding:9px 12px;border-radius:15px;font-size:12.5px;line-height:1.5;
  white-space:pre-wrap;word-break:break-word;
}
.mRow.bot .mBubble{background:var(--surface);border:1px solid var(--border);border-top-left-radius:4px;color:var(--text)}
.mRow.user .mBubble{background:linear-gradient(135deg,var(--brand),var(--brand-dk));color:#fff;border-top-right-radius:4px}
.mRow.user .mBubble img{max-width:100%;border-radius:9px;margin-top:6px;display:block}
.mMsgMeta{display:flex;align-items:center;gap:4px;margin:3px 3px 8px;font-size:9.5px;color:var(--text3)}
.mMsgMeta svg{flex-shrink:0}

/* ── Action buttons ── */
.mActions{display:flex;flex-wrap:wrap;gap:6px;margin:-3px 0 9px 30px;max-width:83%}
.mActionBtn{
  border-radius:999px;padding:7px 13px;font-size:11px;font-weight:700;
  display:flex;align-items:center;gap:5px;border:1px solid transparent;transition:var(--t);
}
.mActionBtn:active{transform:scale(.97)}
.mActionBtn.primary{background:var(--brand);color:#fff}
.mActionBtn.secondary{background:var(--surface);color:var(--text);border-color:var(--border)}
.mActionBtn.wa{background:#e7f9f1;color:#0e9f5f;border-color:#c9f0dd}
.mActionBtn svg{flex-shrink:0}

/* ── Thinking indicator ── */
.mThinking{display:flex;align-items:center;gap:7px;margin:2px 0 9px 30px}
.mThinkDots{display:flex;gap:3px;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:9px 13px}
.mThinkDots span{width:5px;height:5px;border-radius:50%;background:var(--brand);animation:mBounce 1.1s infinite ease-in-out}
.mThinkDots span:nth-child(2){animation-delay:.15s}
.mThinkDots span:nth-child(3){animation-delay:.3s}
@keyframes mBounce{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-4px);opacity:1}}
.mToastRow{display:flex;justify-content:center;margin:4px 0 8px;animation:mFadeUp .2s ease}
.mToastChip{background:var(--surface2);color:var(--text2);font-size:10.5px;font-weight:600;padding:6px 12px;border-radius:999px}

/* ── Quick actions ── */
.mQuickWrap{flex:0 0 auto;padding:2px 0 8px;position:relative}
.mQuickLbl{font-size:9.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;padding:0 14px 6px}
.mQuickRow{display:flex;gap:7px;overflow-x:auto;padding:0 12px 3px;scroll-snap-type:x proximity}
.mQuickRow::-webkit-scrollbar{display:none}
.mQuickCard{
  scroll-snap-align:start;flex:0 0 auto;width:78px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:8px 6px;text-align:center;transition:var(--t);
}
.mQuickCard:active{transform:scale(.96);background:var(--surface2)}
.mQuickIcon{width:25px;height:25px;border-radius:7px;background:var(--brand-lt);color:var(--brand);display:flex;align-items:center;justify-content:center;margin:0 auto 6px}
.mQuickIcon svg{width:12px;height:12px}
.mQuickCard b{display:block;font-size:9.5px;font-weight:700;color:var(--text);line-height:1.2}
.mQuickCard span{display:block;font-size:8px;color:var(--text3);margin-top:1px}

/* ── "More" services panel ── */
.mMorePanel{
  position:absolute;bottom:calc(100% + 4px);right:12px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);box-shadow:var(--shadow-md);min-width:190px;padding:6px;z-index:8;
  opacity:0;transform:translateY(6px) scale(.97);pointer-events:none;transition:var(--t);
}
.mMorePanel.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.mMorePanel button{
  width:100%;display:flex;align-items:center;gap:9px;padding:9px 10px;border:none;background:none;
  border-radius:var(--r-sm);font-size:12px;font-weight:600;color:var(--text);text-align:left;
}
.mMorePanel button:active{background:var(--surface2)}
.mMorePanel svg{flex-shrink:0;color:var(--brand)}

/* ── Composer ── */
.mComposerWrap{
  flex:0 0 auto;padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 8px);
  position:sticky;bottom:0;z-index:5;
  background:linear-gradient(to top,var(--bg) 65%,transparent);
}
.mImgPreview{display:flex;align-items:center;gap:8px;margin:0 2px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:6px 8px}
.mImgPreview img{width:34px;height:34px;border-radius:6px;object-fit:cover}
.mImgPreview span{flex:1;font-size:11px;color:var(--text2)}
.mImgPreview button{background:none;border:none;color:var(--text3);padding:4px}
.mComposer{
  display:flex;align-items:flex-end;gap:3px;
  background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:5px 5px 5px 7px;
  box-shadow:var(--shadow);transition:var(--t);
}
.mComposer.focused{border-color:var(--brand);box-shadow:0 0 0 3px rgba(26,86,219,.12)}
#mAttachBtn,#mImageBtn,#mSendBtn{
  width:33px;height:33px;border-radius:50%;border:none;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:var(--t);
}
#mAttachBtn,#mImageBtn{background:transparent;color:var(--text2)}
#mAttachBtn:active,#mImageBtn:active{background:var(--border);transform:scale(.92)}
#mSendBtn{background:var(--brand);color:#fff}
#mSendBtn:active{transform:scale(.92)}
#mSendBtn:disabled{background:var(--border);color:var(--text3)}
#mSendBtn .mSpin{animation:mSpin .7s linear infinite}
@keyframes mSpin{to{transform:rotate(360deg)}}
#mInput{
  flex:1;border:none;background:transparent;resize:none;font-size:13px;line-height:1.4;
  max-height:90px;padding:9px 4px;outline:none;color:var(--text);
}
#mInput::placeholder{color:var(--text3)}
.mDisclaimer{display:flex;align-items:center;justify-content:center;gap:4px;text-align:center;font-size:9.5px;color:var(--text3);margin-top:8px;font-weight:500}
.mDisclaimer svg{flex-shrink:0;opacity:.8}
</style>
</head>
<body>
<div id="mavyApp">

  <div class="mHead">
    <button class="mHeadBtn" id="mBackBtn" aria-label="Back" onclick="mavyBack()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <div class="mHeadAvatar">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="8" width="14" height="12" rx="4"/><path d="M12 8V4"/><circle cx="12" cy="3" r="1.3" fill="currentColor" stroke="none"/>
        <circle cx="9" cy="14" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="14" r="1.3" fill="currentColor" stroke="none"/>
        <path d="M9 17.5c1 .7 5 .7 6 0"/><path d="M2 13h2"/><path d="M20 13h2"/>
      </svg>
    </div>
    <div class="mHeadText">
      <div class="mHeadNameRow">
        <h1>Mavy</h1>
        <span class="mVerifiedBadge" title="Official GlobalDigits assistant">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 1.1 2.6-.4 1.4 2.3 2.3 1.4-.4 2.6L21.4 11l-1.1 2.4.4 2.6-2.3 1.4-1.4 2.3-2.6-.4L12 21.4l-2.4-1.1-2.6.4-1.4-2.3-2.3-1.4.4-2.6L2.6 11l1.1-2.4-.4-2.6 2.3-1.4L7 2.3l2.6.4L12 2z" opacity=".001"/><path fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 12.5l2 2 4-4.5"/><path d="M12 2.5l2.1 1 2.3-.4 1.2 2 2 1.2-.4 2.3 1 2.1-1 2.1.4 2.3-2 1.2-1.2 2-2.3-.4-2.1 1-2.1-1-2.3.4-1.2-2-2-1.2.4-2.3-1-2.1 1-2.1-.4-2.3 2-1.2 1.2-2 2.3.4z" opacity=".18" fill="#fff"/></svg>
        </span>
      </div>
      <div class="mHeadStatus"><span class="dot"></span><span>AI Assistant • Online</span></div>
    </div>
    <div class="mHeadActions">
      <button class="mHeadBtn hidden" id="mNewChatBtn" aria-label="New conversation" title="New conversation" onclick="mavyResetChat()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
      </button>
      <button class="mHeadBtn" id="mThemeBtn" aria-label="Toggle dark mode" title="Dark mode" onclick="mavyToggleTheme()">
        <svg id="mThemeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>

// Used for fast local pattern checks (small talk, explicit human-support
// requests) and as light pre-cleaning before a message goes to the AI.
// It is a helper, not the thing doing the actual understanding — the AI
// call below handles genuine intent/typo/pidgin/context reasoning.
var SLANG_MAP={
  'abeg':'please','pls':'please','plz':'please','wetin':'what','wat':'what',
  'howfar':'how are you','how far':'how are you','nowahala':'no problem','no wahala':'no problem',
  'dey':'is','na':'is','fit':'can','abi':'right','wia':'where','dis':'this','dat':'that',
  'dem':'them','una':'you all','sha':'','sef':'','wan':'want','oga':'',
  'walet':'wallet','fon':'phone','depost':'deposit','accnt':'account','passwrd':'password',
  'incorret':'incorrect','tikok':'tiktok','folower':'follower','folowers':'followers',
  'laik':'like','laiks':'likes','instagrm':'instagram','fesbook':'facebook','hotmial':'hotmail',
  'yh':'yes','yhh':'yes','tnx':'thanks','thanx':'thanks','k':'ok','kk':'ok','aight':'alright'
};
function mavyNormalize(raw){
  var s=(' '+raw.toLowerCase().trim()+' ').replace(/[^\w\s'?!.]/g,' ').replace(/\s+/g,' ');
  Object.keys(SLANG_MAP).forEach(function(k){
    var re=new RegExp('\\b'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','g');
    s=s.replace(re,SLANG_MAP[k]);
  });
  return s.trim();
}

/* ── 7. KNOWLEDGE CONTEXT (sent to the AI, never edited by it) ──── */
// Serializes the whole KB into plain text so the AI always has the full
// picture — this is what stops it from, say, answering an SM Account
// question with Boosting information: both topics are right there for it
// to tell apart, rather than Mavy pre-guessing and sending only one.
var mKnowledgeCache=null;
function mavyBuildKnowledgeContext(){
  if(mKnowledgeCache)return mKnowledgeCache;
  var blocks=Object.keys(KB).map(function(id){
    var t=KB[id];
    var lines=['### '+t.label+(t.route?' (route key: '+t.route+')':'')];
    if(t.summary)lines.push(t.summary);
    if(t.steps&&t.steps.length)lines.push('How to / details: '+t.steps.join(' | '));
    if(t.problems){
      Object.keys(t.problems).forEach(function(p){lines.push('If the problem is "'+p+'": '+t.problems[p]);});
    }
    return lines.join('\n');
  });
  var r=MAVY_CONFIG.resources;
  blocks.push(
    '### Resources (never show these raw URLs as text — only via a "link" action button)\n'+
    'Email login / account recovery tutorial video URL: '+r.loginTutorialUrl+'\n'+
    'Recovery email website URL: '+r.recoveryEmailSiteUrl+'\n'+
    'Recovery email Telegram bot URL: '+r.recoveryEmailTelegramUrl
  );
  blocks.push(
    '### Real navigation routes (only ever use these exact keys for a "nav" action)\n'+
    'addfunds = Add Funds page | vtu = Airtime & Data page | boost = Boost Social Media page | '+
    'numbers = Virtual Numbers page | accounts = SM Accounts page | myorders = My Orders page | '+
    'myaccorders = SM Account Orders page | transactions = Transactions page | settings = Settings page | '+
    'support = in-app Support/ticket page.\n'+
    'The Reseller Program is a separate page (not one of the nav keys above) — use action type "reseller" for it instead.'
  );
  mKnowledgeCache=blocks.join('\n\n');
  return mKnowledgeCache;
}

/* ── 8. LIVE USER CONTEXT (read-only, minimal PII sent to the AI) ─ */
var mOrdersCache=null,mDepositsCache=null,mOrdersCacheAt=0;
var ORDERS_CACHE_TTL_MS=45000; // refetch periodically so a new order placed mid-conversation shows up without needing a page reload
async function mavyBuildUserContext(){
  if(!mUser)return 'No authenticated user session detected. If the question needs personal account/order/deposit data, ask the user to make sure they are logged in.';
  var stale=mOrdersCache===null||(Date.now()-mOrdersCacheAt)>ORDERS_CACHE_TTL_MS;
  if(stale){
    // Runs on every message automatically — the user never has to tap the
    // Orders quick action for Mavy to know about their recent activity.
    // Uses the signed-in Supabase session only, scoped by RLS to this
    // user's own rows (see mavyGetRecentOrders/mavyGetRecentDeposits).
    var results=await Promise.all([mavyGetRecentOrders(),mavyGetRecentDeposits()]);
    mOrdersCache=results[0];mDepositsCache=results[1];mOrdersCacheAt=Date.now();
  }
  var lines=[];
  lines.push('First name: '+(mUser.name?mUser.name.split(' ')[0]:'Unknown'));
  lines.push('Wallet balance: \u20a6'+Number(mUser.balance||0).toLocaleString());
  if(mOrdersCache.length){
    lines.push('Recent orders (most recent first):');
    mOrdersCache.forEach(function(o){lines.push('- '+o.kind+' ('+o.label+'): '+(o.status||'pending'));});
  }else{ lines.push('Recent orders: none yet.'); }
  if(mDepositsCache.length){
    lines.push('Recent deposits (most recent first):');
    mDepositsCache.forEach(function(d){lines.push('- \u20a6'+Number(d.amount||0).toLocaleString()+': '+(d.status||'pending')+(d.rejection_reason?' ('+d.rejection_reason+')':''));});
  }else{ lines.push('Recent deposits: none yet.'); }
  return lines.join('\n');
}

var ALLOWED_NAV_PAGES=['addfunds','vtu','boost','numbers','accounts','myorders','myaccorders','transactions','settings','support'];
function mavySanitizeActions(actions){
  if(!Array.isArray(actions))return[];
  var allowedLinks=Object.keys(MAVY_CONFIG.resources).map(function(k){return MAVY_CONFIG.resources[k];}).filter(Boolean);
  var out=[];
  actions.forEach(function(a){
    if(!a||!a.type)return;
    if(a.type==='nav'&&ALLOWED_NAV_PAGES.indexOf(a.page)!==-1){
      out.push({type:'nav',page:a.page,label:a.label});
    }else if(a.type==='reseller'){
      out.push({type:'reseller',label:a.label||'View Reseller Plans'});
    }else if(a.type==='whatsapp'){
      out.push({type:'whatsapp',label:a.label});
    }else if(a.type==='link'&&a.url&&allowedLinks.indexOf(a.url)!==-1){
      // Only ever render a link the AI reproduced exactly from configured
      // resources — this is enforced here in code, not just by the prompt,
      // so the AI can never redirect a user anywhere we didn't configure.
      out.push({type:'link',label:a.label,url:a.url});
    }
  });
  return out.slice(0,2);
}
// Defense-in-depth: the backend (supabase/functions/mavy-ai) already
// guarantees this never happens, but if a reply ever somehow still looks
// like a raw JSON blob instead of plain text, don't show it — extract the
// real message if possible, otherwise show a clean fallback. This is a
// last-resort safety net, not the primary fix (that lives server-side).
function mavyCleanReplyText(text){
  if(typeof text!=='string')return 'I\'m not able to help with that right now.';
  var t=text.trim();
  var looksLikeJson=/^\{[\s\S]*\}$/.test(t)&&/"reply"/i.test(t);
  if(!looksLikeJson)return t;
  try{
    var parsed=JSON.parse(t);
    if(parsed&&typeof parsed.reply==='string'&&parsed.reply.trim())return parsed.reply.trim();
  }catch(e){/* fall through to regex extraction */}
  var m=t.match(/"reply"\s*:\s*"([\s\S]*?)"\s*,\s*"actions"/i);
  if(m&&m[1])return m[1].replace(/\\n/g,'\n').replace(/\\"/g,'"').replace(/\\\\/g,'\\').trim();
  return 'Sorry, I had trouble putting that answer together. Could you try asking again?';
}
async function mavyAskAI(userMessage,imageDataUrl){
  if(!mSb){
    return {text:'Mavy\'s reasoning engine isn\'t available right now. You can reach human support directly.',actions:[{type:'whatsapp'}]};
  }
  try{
    var knowledge=mavyBuildKnowledgeContext();
    var userContext=await mavyBuildUserContext();
    var historyPayload=mHistory.slice(-10);
    var body={
      knowledge:knowledge,
      history:historyPayload,
      message:userMessage||'',
      userContext:userContext
    };
    if(imageDataUrl)body.image=imageDataUrl; // base64 data URL — backend forwards it to the vision model, never the frontend
    var res=await mSb.functions.invoke(MAVY_CONFIG.aiFunctionName,{body:body});
    if(res.error)throw res.error;
    var data=res.data||{};
    return {text:mavyCleanReplyText(data.reply||'I\'m not able to help with that right now.'),actions:mavySanitizeActions(data.actions)};
  }catch(e){
    console.error('Mavy AI error:',e);
    return {text:'I\'m having trouble reaching my reasoning engine right now. You can try again in a moment, or reach human support directly.',actions:[{type:'whatsapp'}]};
  }
}

    // Tapping a quick action opens the chat screen (per spec) and then
    // runs that action's own existing behavior unchanged — real
    // navigation, WhatsApp, the Reseller page, or the More panel all
    // continue to work exactly as they already do elsewhere in the app.
    tile.addEventListener('click',function(ev){
      ev.stopPropagation();
      mavyShowChat();
      q.onTap(ev);
    });
    grid.appendChild(tile);
  });
  hub.appendChild(grid);

  var trust=document.createElement('button');trust.type='button';trust.className='mHubTrust';
  trust.innerHTML='<div class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>'+
    '<div style="flex:1;min-width:0"><b>You\'re in safe hands</b><span>Mavy is here 24/7 to help — real human support is always available too.</span></div>'+
    mavyIconSvg('chev');
  trust.addEventListener('click',function(){ mavyOpenWhatsApp(); });
  hub.appendChild(trust);
}

/* ── Chat screen: initial greeting message ── */
function mavyRenderWelcome(){
  mConvoEl.innerHTML='';
  var chip=document.createElement('div');chip.className='mDateChip';
  chip.textContent=new Date().toLocaleDateString('en-NG',{day:'numeric',month:'long',year:'numeric'});
  mConvoEl.appendChild(chip);

  var firstName=mUser&&mUser.name?mUser.name.split(' ')[0]:'';
  var greetLine=firstName?('Hi '+firstName+'! \uD83D\uDC4B'):'Hi there! \uD83D\uDC4B';
  var text=greetLine+'\n\nI\'m Mavy, your GlobalDigits support assistant.\n\nHow can I help you today?';
  mavyAppendBotMessage(text);
}

/* ── Screen switching (Support Hub ⇄ Chat) ── */
var mScreen='hub';
function mavySetScreen(name){
  mScreen=name;
  var hubEl=document.getElementById('mHubView');
  var chatEl=document.getElementById('mChatView');
  var newChatBtn=document.getElementById('mNewChatBtn');
  if(name==='chat'){
    hubEl.classList.add('hidden');
    chatEl.classList.remove('hidden');
    if(newChatBtn)newChatBtn.classList.remove('hidden');
  }else{
    chatEl.classList.add('hidden');
    hubEl.classList.remove('hidden');
    if(newChatBtn)newChatBtn.classList.add('hidden');
  }
  var shown=name==='chat'?chatEl:hubEl;
  shown.classList.remove('mScreenAnim');
  void shown.offsetWidth; // restart the fade-in animation
  shown.classList.add('mScreenAnim');
}
function mavyShowHub(){
  mavySetScreen('hub');
}
function mavyShowChat(){
  mavySetScreen('chat');
  // Only render the greeting if the conversation is genuinely empty —
  // going hub → chat → hub → chat must never wipe an ongoing conversation.
  if(mConvoEl&&!mConvoEl.children.length){ mavyRenderWelcome(); }
}
function mavyBack(){
  if(mScreen==='chat'){ mavyShowHub(); }
  else{ mavyClose(); }
}
function mavyEscape(s){
  var d=document.createElement('div');d.textContent=s;return d.innerHTML;
}
function mavyTimeNow(){
  return new Date().toLocaleTimeString('en-NG',{hour:'numeric',minute:'2-digit'});
}
function mavyAppendUserMessage(text,imageDataUrl){
  var row=document.createElement('div');row.className='mRow user';
  var col=document.createElement('div');col.className='mMsgCol';
  var b=document.createElement('div');b.className='mBubble';
  b.innerHTML=mavyEscape(text).replace(/\n/g,'<br>')+(imageDataUrl?'<img src="'+imageDataUrl+'"/>':'');
  var meta=document.createElement('div');meta.className='mMsgMeta';
  meta.innerHTML='<span>'+mavyTimeNow()+'</span>'+mavyIconSvg('checkdbl');
  meta.style.color='var(--brand)';
  col.appendChild(b);col.appendChild(meta);
  row.appendChild(col);mConvoEl.appendChild(row);mavyScrollDown();
}
function mavyAppendBotMessage(text,actions){
  var row=document.createElement('div');row.className='mRow bot';
  var av=document.createElement('div');av.className='mAvatarSm';
  av.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="14" height="12" rx="4"/><path d="M12 8V4"/><circle cx="9" cy="14" r="1.3" fill="currentColor" stroke="none"/><circle cx="15" cy="14" r="1.3" fill="currentColor" stroke="none"/></svg>';
  var col=document.createElement('div');col.className='mMsgCol';
  var b=document.createElement('div');b.className='mBubble';b.innerHTML=mavyEscape(text).replace(/\n/g,'<br>');
  var meta=document.createElement('div');meta.className='mMsgMeta';meta.textContent=mavyTimeNow();
  col.appendChild(b);col.appendChild(meta);
  row.appendChild(av);row.appendChild(col);mConvoEl.appendChild(row);

  if(actions&&actions.length){
    var aw=document.createElement('div');aw.className='mActions';
    actions.forEach(function(a,idx){
      var btn=document.createElement('button');
      if(a.type==='nav'){
        btn.className='mActionBtn '+(idx===0?'primary':'secondary');btn.innerHTML=(a.label||'Open')+mavyIconSvg('nav');
        btn.onclick=function(){mavyGoTo(a.page);};
      }else if(a.type==='reseller'){
        btn.className='mActionBtn '+(idx===0?'primary':'secondary');btn.innerHTML=(a.label||'View Reseller Plans')+mavyIconSvg('crown');
        btn.onclick=function(){mavyOpenReseller();};
      }else if(a.type==='whatsapp'){
        btn.className='mActionBtn wa';btn.innerHTML=(a.label||'Chat with Human Support on WhatsApp')+mavyIconSvg('wa');
        btn.onclick=function(){mavyOpenWhatsApp();};
      }else if(a.type==='link'){
        btn.className='mActionBtn '+(idx===0?'primary':'secondary');btn.innerHTML=(a.label||'Watch Tutorial')+mavyIconSvg('play');
        btn.onclick=function(){window.open(a.url,'_blank');};
      }
      aw.appendChild(btn);
    });
    mConvoEl.appendChild(aw);
  }
  mavyScrollDown();
}
function mavyShowThinking(){
  var row=document.createElement('div');row.className='mThinking';row.id='mThinkingRow';
  row.innerHTML='<div class="mThinkDots"><span></span><span></span><span></span></div>';
  mConvoEl.appendChild(row);mavyScrollDown();
}
function mavyHideThinking(){
  var el=document.getElementById('mThinkingRow');if(el)el.remove();
}
function mavyToast(msg){
  var row=document.createElement('div');row.className='mToastRow';
  row.innerHTML='<div class="mToastChip"></div>';
  row.querySelector('.mToastChip').textContent=msg;
  mConvoEl.appendChild(row);mavyScrollDown();
  setTimeout(function(){row.remove();},2500);
}
function mavyScrollDown(){ mConvoEl.scrollTop=mConvoEl.scrollHeight; }
function mavySetSending(isSending){
  mSendBtnEl.disabled=isSending;
  document.getElementById('mSendIcon').innerHTML=isSending
    ?'<circle cx="12" cy="12" r="9" stroke-dasharray="42" stroke-dashoffset="14" fill="none"/>'
    :'<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>';
  document.getElementById('mSendIcon').setAttribute('class',isSending?'mSpin':'');
}

/* ── 11. "MORE" SERVICES PANEL ─────────────────────────────────── */
function mavyToggleMorePanel(){
  document.getElementById('mMorePanel').classList.toggle('show');
}
document.addEventListener('click',function(ev){
  var wrap=document.getElementById('mQuickWrap');
  var panel=document.getElementById('mMorePanel');
  if(wrap&&panel&&!wrap.contains(ev.target))panel.classList.remove('show');

/* ── 12. EVENT HANDLERS ────────────────────────────────────────── */
function mavyOnKeydown(ev){
  if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();mavySend();}
}
function mavyAutoGrow(el){ el.style.height='auto';el.style.height=Math.min(el.scrollHeight,90)+'px'; }

// Resizes/compresses the image client-side before it's sent anywhere —
// keeps the request small and fast regardless of how large the original
// phone photo/screenshot was.
function mavyCompressImage(file){
  return new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onload=function(){
      var img=new Image();
      img.onload=function(){
        var maxDim=1280;
        var scale=Math.min(1,maxDim/Math.max(img.width,img.height));
        var w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
        var canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        var ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.75));
      };
      img.onerror=function(){reject(new Error('Could not read image'));};
      img.src=reader.result;
    };
    reader.onerror=function(){reject(new Error('Could not read file'));};
    reader.readAsDataURL(file);
  });
}
async function mavyHandleFile(ev){
  var f=ev.target.files&&ev.target.files[0];if(!f)return;
  try{
    var compressed=await mavyCompressImage(f);
    mAttachedImage=compressed;
    document.getElementById('mImgPreviewThumb').src=mAttachedImage;
    document.getElementById('mImgPreviewWrap').classList.remove('hidden');
  }catch(e){
    console.error('Image processing failed:',e);
    mavyToast('Couldn\'t read that image — please try a different file.');
  }
}
function mavyRemoveImage(){
  mAttachedImage=null;
  document.getElementById('mFileInput').value='';
  document.getElementById('mImgPreviewWrap').classList.add('hidden');
}
// Quick-question buttons and any other caller route through here, which
// puts the question through the exact same pipeline as manually typed
// messages (history included) — nothing shortcuts past the AI call.
function mavySendText(text){
  mInputEl.value=text;
  mavyAutoGrow(mInputEl);
  mavySend();
}
// The "Email Tutorial" quick action is an explicit, unambiguous tap —
// so it skips the ask-then-confirm chat flow and shows the button right
// away, using the same real, whitelisted resource URL as everything else.
function mavySendTutorial(){
  var reply='Sure — here\'s the step-by-step video for logging in / recovering account access.';
  mHistory.push({role:'user',text:'[tapped Email Tutorial quick action]'});
  mHistory.push({role:'assistant',text:reply});
  mavyAppendBotMessage(reply,[{type:'link',label:'Watch Login Tutorial',url:MAVY_CONFIG.resources.loginTutorialUrl}]);
}

async function mavySend(){
  var text=(mInputEl.value||'').trim();
  var img=mAttachedImage;
  if(!text&&!img)return;
  mavyAppendUserMessage(text||'(screenshot attached)',img);
  mHistory.push({role:'user',text:img?(text?text+' [attached a screenshot]':'[attached a screenshot]'):text});
  mInputEl.value='';mavyAutoGrow(mInputEl);
  var imageToSend=img;
  mavyRemoveImage();
  mavySetSending(true);

  // Screenshots go straight to the vision-capable model on the backend —
  // small-talk/human-support shortcuts only apply to plain text messages,
  // since an attached image always needs an actual look.
  if(imageToSend){
    mavyShowThinking();
    var imgStartedAt=Date.now();
    var imgResult=await mavyAskAI(text,imageToSend);
    var imgElapsed=Date.now()-imgStartedAt;
    setTimeout(function(){
      mavyHideThinking();
      mHistory.push({role:'assistant',text:imgResult.text});
      mavyAppendBotMessage(imgResult.text,imgResult.actions);
      mavySetSending(false);
    },Math.max(0,MAVY_CONFIG.minThinkingMs-imgElapsed));
    return;
  }

  var norm=mavyNormalize(text);

  // Explicit human-support request: escalate immediately, no automated
  // troubleshooting (or even an AI round trip) forced in between.
  if(HUMAN_REQUEST_RE.test(norm)){
    var waReply='Sure — I\'ll connect you with our human support team on WhatsApp.';
    mHistory.push({role:'assistant',text:waReply});
    mavyAppendBotMessage(waReply,[{type:'whatsapp',label:'Chat with Human Support on WhatsApp'}]);
    mavySetSending(false);
    return;
  }

  // Everything else — including greetings, casual chat, and general
  // GlobalDigits questions — goes through Mavy AI (OpenRouter via the
  // secure edge function), grounded in the local knowledge base + live
  // signed-in user data, so replies sound natural instead of scripted.
  mavyShowThinking();
  var startedAt=Date.now();
  var result=await mavyAskAI(text);
  var elapsed=Date.now()-startedAt;
  setTimeout(function(){
    mavyHideThinking();
    mHistory.push({role:'assistant',text:result.text});
    mavyAppendBotMessage(result.text,result.actions);
    mavySetSending(false);
  },Math.max(0,MAVY_CONFIG.minThinkingMs-elapsed));
}
function mavyResetChat(){
  mHistory=[];
  mavyRenderWelcome();
}

(async function mavyInit(){
  mavyInitTheme();
  mConvoEl=document.getElementById('mConvo');
  mInputEl=document.getElementById('mInput');
  mSendBtnEl=document.getElementById('mSendBtn');
  mQuickRowEl=document.getElementById('mQuickRow');
  mMorePanelEl=document.getElementById('mMorePanel');
  mavyRenderQuickActions();
  await mavyLoadUser();
  mavyRenderHub();
  mavySetScreen('hub');
})();
</script>
