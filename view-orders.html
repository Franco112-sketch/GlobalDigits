<!-- ═══ 1. CSS STYLING ═══ -->
<style>
:root{
  --brand:#1a56db;--brand-dk:#1342b0;--brand-lt:#e8f0ff;--brand-xl:#f3f7ff;
  --ink:#0d1321;--ink2:#55607a;--ink3:#8a94ab;
  --line:#e3ebf8;--line2:#cfdcf2;--bg:#f6f9ff;--surface:#fff;
  --ok:#067647;--ok-bg:#ecfdf3;--warn:#b54708;--warn-bg:#fffaeb;--bad:#b42318;--bad-bg:#fef3f2;--neu:#55607a;--neu-bg:#eef2f9;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  --pop:0 10px 28px rgba(15,35,90,.15),0 1px 4px rgba(15,35,90,.06);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:12.5px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,p,ul,dl,dd{margin:0;padding:0}
ul{list-style:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg{display:block;flex-shrink:0}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.i.s{width:14px;height:14px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topbar-in{max-width:760px;margin:0 auto;height:46px;display:flex;align-items:center;gap:6px;padding:0 10px}
.ibtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);transition:background .15s,color .15s}
.ibtn:hover{background:var(--brand-xl);color:var(--brand)}
.topbar h1{font-size:14.5px;font-weight:600;flex:1;min-width:0}
.live{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink3);padding:0 4px}
.live i{width:6px;height:6px;border-radius:50%;background:var(--ink3)}
.live[data-s="live"] i{background:#12b76a}
.live[data-s="connecting"] i{background:#f79009;animation:pulse 1.2s ease-in-out infinite}
.live[data-s="down"] i{background:#f04438}
.live[data-s="down"]{color:var(--bad)}
@keyframes pulse{50%{opacity:.35}}
.spin{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* layout */
main{max-width:760px;margin:0 auto;padding:10px 10px calc(24px + env(safe-area-inset-bottom,0px))}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin:0 -10px 10px;padding:0 10px}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:6px;height:34px;padding:0 10px;font-size:12.5px;font-weight:500;color:var(--ink2);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s}
.tab:hover{color:var(--brand)}
.tab[aria-selected="true"]{color:var(--brand);font-weight:600;border-color:var(--brand)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.search{grid-column:1/-1;position:relative}
.search .i{position:absolute;left:9px;top:9px;color:var(--ink3);pointer-events:none}
.search input{width:100%;height:32px;border:1px solid var(--line2);border-radius:8px;background:#fff;padding:0 30px 0 29px;font-size:12.5px;transition:border-color .15s,box-shadow .15s}
.search input::placeholder{color:var(--ink3)}
.search input:hover{border-color:#a9c0ea}
.search input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(26,86,219,.12)}
.search .clr{position:absolute;right:3px;top:3px;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--ink3)}
.search .clr:hover{background:var(--brand-xl);color:var(--ink)}
@supports (-webkit-touch-callout:none){.search input{font-size:16px}}  /* iOS Safari zooms inputs under 16px */
@media(min-width:640px){.tools{grid-template-columns:1fr 150px 160px}.search{grid-column:auto}}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:20px;margin:2px 2px 6px;font-size:11.5px;color:var(--ink2)}
.meta .hint{color:var(--ink3);text-align:right}
.banner{display:flex;align-items:center;gap:8px;padding:7px 10px;margin-bottom:8px;border:1px solid #fedf89;background:var(--warn-bg);color:var(--warn);border-radius:8px;font-size:12px}
.banner span{flex:1;min-width:0}
.banner button{font-weight:600;color:inherit;text-decoration:underline}

/* custom dropdown (compact) */
.dd{position:relative}
.dd-trigger{width:100%;height:32px;display:flex;align-items:center;gap:6px;padding:0 7px 0 9px;border:1px solid var(--line2);border-radius:8px;background:#fff;font-size:12.5px;text-align:left;transition:border-color .15s,box-shadow .15s}
.dd-trigger:hover:not(:disabled){border-color:#a9c0ea}
.dd-trigger:focus-visible,.dd.is-open .dd-trigger{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(26,86,219,.12)}
.dd-trigger:disabled{background:var(--brand-xl);color:var(--ink3);cursor:not-allowed}
.dd-val{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-chev{width:14px;height:14px;color:var(--ink3);transition:transform .16s var(--ease)}
.dd.is-open .dd-chev{transform:rotate(180deg);color:var(--brand)}
.dd-menu{position:fixed;z-index:1000;min-width:150px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--pop);display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:translateY(-3px) scale(.985);transform-origin:top center;transition:opacity .12s ease,transform .14s var(--ease);pointer-events:none}
.dd-menu.up{transform-origin:bottom center;transform:translateY(3px) scale(.985)}
.dd-menu.open{opacity:1;transform:none;pointer-events:auto}
.dd-list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px;outline:none}
.dd-opt{display:flex;align-items:center;gap:8px;min-height:32px;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:12.5px}
.dd-opt .o-lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-opt .o-meta{font-size:11px;color:var(--ink3)}
.dd-opt .o-chk{width:14px;height:14px;color:var(--brand);visibility:hidden}
.dd-opt.is-active{background:var(--brand-xl)}
.dd-opt[aria-selected="true"]{color:var(--brand);font-weight:600}
.dd-opt[aria-selected="true"] .o-chk{visibility:visible}

/* order rows */
.list{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.row{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;text-align:left;min-height:52px;transition:background .12s}
.row:hover{background:var(--brand-xl)}
.row:active{background:var(--brand-lt)}
.ric{width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.ric.blue{background:var(--brand-lt);color:var(--brand)}
.ric.purple{background:#f4ecff;color:#7a3fe0}
.ric.teal{background:#e6fbf7;color:#0d8a7e}
.rmain{flex:1;min-width:0;display:grid;gap:1px}
.rtitle{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden}
.rsub>*{overflow:hidden;text-overflow:ellipsis}
.rsub .mono,.rsub .sep{flex-shrink:0}
.rsub .xtra{display:none}
@media(min-width:520px){.rsub .xtra{display:inline;overflow:hidden;text-overflow:ellipsis}}
.rsub .sep{width:2px;height:2px;border-radius:50%;background:var(--line2);flex-shrink:0}
.rend{display:grid;justify-items:end;gap:3px;flex-shrink:0}
.ramt{font-size:13px;font-weight:600}
.chev{color:var(--line2)}
.row:hover .chev{color:var(--brand)}
.pill{display:inline-flex;align-items:center;gap:5px;height:18px;padding:0 7px;border-radius:999px;font-size:10.5px;font-weight:600;white-space:nowrap}
.pill i{width:5px;height:5px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.neu{background:var(--neu-bg);color:var(--neu)}
.skel-row{display:flex;align-items:center;gap:10px;padding:11px 10px;min-height:52px}
.sk{background:linear-gradient(90deg,#eaf1fd 25%,#f6f9ff 50%,#eaf1fd 75%);background-size:200% 100%;animation:shimmer 1.2s linear infinite;border-radius:6px}
@keyframes shimmer{to{background-position:-200% 0}}
.more{display:flex;justify-content:center;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;font-size:12.5px;font-weight:600;border:1px solid var(--line2);background:#fff;color:var(--ink);transition:border-color .15s,color .15s,background .15s}
.btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover:not(:disabled){background:var(--brand-dk);border-color:var(--brand-dk);color:#fff}
.btn.dng{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.dng:hover:not(:disabled){background:#912018;border-color:#912018;color:#fff}
.btn.soft-dng{color:var(--bad);border-color:#fecdca;background:var(--bad-bg)}
.btn.soft-dng:hover:not(:disabled){border-color:var(--bad);color:var(--bad)}
.state{text-align:center;padding:30px 16px;background:#fff;border:1px solid var(--line);border-radius:12px}
.state .i{width:20px;height:20px;margin:0 auto 8px;color:var(--ink3)}
.state h2{font-size:13px;font-weight:600}
.state p{color:var(--ink2);margin:2px auto 10px;max-width:320px}
.state .acts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}

/* bottom nav (mobile) */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);display:none}
.bnav-in{display:flex;max-width:520px;margin:0 auto}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 5px;font-size:10.5px;color:var(--ink3)}
.bnav a[aria-current="page"]{color:var(--brand);font-weight:600}
@media(max-width:699px){.bnav{display:block}main{padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}}

/* detail drawer */
#scrim{position:fixed;inset:0;background:rgba(13,19,33,.32);opacity:0;transition:opacity .2s;z-index:55}
#scrim.open{opacity:1}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;z-index:60;transform:translateX(100%);transition:transform .22s var(--ease);display:flex;flex-direction:column;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);box-shadow:var(--pop)}
#drawer.open{transform:none}
.d-head{display:flex;align-items:center;gap:6px;height:46px;padding:0 10px;border-bottom:1px solid var(--line);flex-shrink:0}
.d-head h2{font-size:14px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dBody{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:12px 12px calc(16px + env(safe-area-inset-bottom,0px))}
.d-top{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.d-top .ric{width:34px;height:34px}
.d-top .tt{flex:1;min-width:0}
.d-top .t1{font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
.d-top .t2{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink3);margin-top:1px}
.d-amt{font-size:16px;font-weight:600;white-space:nowrap}
.box{border:1px solid var(--line);border-radius:10px;padding:2px 10px;margin-bottom:10px}
.box.pad{padding:10px}
.box-h{font-size:11.5px;font-weight:600;color:var(--ink2);padding:8px 0 2px}
.kv{display:grid;grid-template-columns:104px 1fr;gap:8px;align-items:start;padding:7px 0;border-top:1px solid var(--line)}
.kv:first-of-type,.box-h+.kv{border-top:0}
.kv dt{color:var(--ink3);font-size:12px}
.kv dd{display:flex;gap:6px;align-items:flex-start;min-width:0;font-size:12.5px;overflow-wrap:anywhere}
.kv dd>span{flex:1;min-width:0}
.cp{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--ink3);flex-shrink:0;margin:-3px 0}
.cp:hover{background:var(--brand-xl);color:var(--brand)}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--brand-xl);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px}
.steps{display:flex;align-items:flex-start;margin:2px 0 10px}
.stp{display:grid;justify-items:center;gap:3px;width:70px;flex-shrink:0;font-size:10.5px;color:var(--ink3);text-align:center}
.stp i{width:8px;height:8px;border-radius:50%;background:var(--line2)}
.stp.done{color:var(--brand)}
.stp.done i{background:var(--brand);box-shadow:0 0 0 3px var(--brand-lt)}
.stl{flex:1;height:2px;background:var(--line);margin:3px -10px 0}
.stl.done{background:var(--brand)}
.val{display:flex;align-items:center;gap:8px;border-radius:8px;padding:8px 10px;margin-bottom:8px}
.val.num-v{background:var(--brand-xl);border:1px solid var(--brand-lt)}
.val.code-v{background:var(--ok-bg);border:1px solid #abefc6}
.val b{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600;font-size:14px;letter-spacing:.03em}
.val.num-v b{color:var(--brand)}
.val.code-v b{color:var(--ok);letter-spacing:.12em}
.val small{display:block;font-size:10.5px;font-weight:500;letter-spacing:0;color:var(--ink2)}
.wait{display:flex;align-items:center;gap:8px;color:var(--ink2);padding:6px 0 10px}
.wait .ring{width:14px;height:14px;border-radius:50%;border:2px solid var(--brand-lt);border-top-color:var(--brand)}
.livebar{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px dashed var(--line2);padding-top:9px;margin-top:2px}
.cd{display:flex;align-items:center;gap:5px;font-weight:600;color:var(--brand);font-size:13px}
.confirm{display:flex;gap:6px}

/* misc */
#boot{position:fixed;inset:0;z-index:2000;background:#fff;display:grid;place-items:center;transition:opacity .2s}
#boot.hide{opacity:0;pointer-events:none}
.boot-w{display:grid;justify-items:center;gap:10px;color:var(--ink2)}
.boot-r{width:30px;height:30px;border-radius:50%;border:3px solid var(--brand-lt);border-top-color:var(--brand);animation:rot .8s linear infinite}
.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);max-width:min(92vw,380px);background:#0d1321;color:#fff;padding:8px 12px;border-radius:9px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .16s,transform .18s var(--ease);z-index:1200}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:700px){.toast{bottom:22px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<!-- ═══ 2. HTML STRUCTURE ═══ -->
<div id="boot" role="status" aria-live="polite"><div class="boot-w"><div class="boot-r"></div><span id="bootMsg">Loading…</span></div></div>

<div id="app">
  <header class="topbar">
    <div class="topbar-in">
      <button class="ibtn" id="backBtn" type="button" aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h1>Orders</h1>
      <span class="live" id="liveInd" data-s="connecting" title="Live updates"><i></i><span id="liveTxt">Connecting</span></span>
      <button class="ibtn" id="refreshBtn" type="button" aria-label="Refresh orders"><svg class="i" id="refreshIco" viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-2.6-6.4"/><path d="M21 4v5h-5"/></svg></button>
    </div>
  </header>

  <main id="main">
    <div class="tabs" id="tabs" role="tablist" aria-label="Order type"></div>

    <div class="tools">
      <div class="search">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search orders" aria-label="Search loaded orders"/>
        <button class="clr" id="qClear" type="button" aria-label="Clear search" hidden><svg class="i s" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
      <div id="ddStatus"></div>
      <div id="ddSort"></div>
    </div>

    <div class="meta" aria-live="polite"><span id="count"></span><span class="hint" id="hint"></span></div>
    <div id="banner" hidden></div>
    <div id="content"></div>
    <div class="more" id="more" hidden><button class="btn" id="moreBtn" type="button">Load more</button></div>
  </main>

  <nav class="bnav" aria-label="Main">
    <div class="bnav-in">
      <a href="index.html"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>Home</a>
      <a href="index.html?page=vtu"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>VTU</a>
      <a href="add-funds.html"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Add funds</a>
      <a href="boosting.html"><svg class="i" viewBox="0 0 24 24"><path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/></svg>Boost</a>
      <a href="orders.html" aria-current="page"><svg class="i" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 01-8 0"/></svg>Orders</a>
    </div>
  </nav>
</div>

<div id="scrim" hidden></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" hidden>
  <div class="d-head">
    <button class="ibtn" id="dClose" type="button" aria-label="Close order details"><svg class="i" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    <h2 id="dTitle">Order details</h2>
  </div>

var hayCache=new WeakMap();
function haystack(r){

  hayCache.set(r,h);return h;

function ngnValue(r){

function viewRows(){

var ddSeq=0,openDD=null;

function Dropdown(host,cfg){
  var self=this;
  this.host=host;this.cfg=cfg;this.id='dd'+(++ddSeq);
  this.options=[];this.value=null;this.isOpen=false;this.active=-1;this.typeBuf='';
  host.classList.add('dd');
  host.innerHTML='<button type="button" class="dd-trigger" aria-haspopup="listbox" aria-expanded="false" aria-controls="'+this.id+'-l" aria-label="'+esc(cfg.label)+'"><span class="dd-val"></span>'+CHEV+'</button>';
  this.btn=host.firstChild;this.valEl=this.btn.querySelector('.dd-val');
  var m=document.createElement('div');m.className='dd-menu';m.hidden=true;
  m.innerHTML='<div class="dd-list" id="'+this.id+'-l" role="listbox" tabindex="-1" aria-label="'+esc(cfg.label)+'"></div>';
  document.body.appendChild(m);this.menu=m;this.list=m.firstChild;
  this.btn.addEventListener('click',function(){self.isOpen?self.close(true):self.open();});
  this.btn.addEventListener('keydown',function(e){if(e.key==='ArrowDown'||e.key==='ArrowUp'||e.key==='Enter'||e.key===' '){e.preventDefault();if(!self.isOpen)self.open();}});
  m.addEventListener('keydown',function(e){self.onKey(e);});
  this.list.addEventListener('mousedown',function(e){e.preventDefault();});
  this.list.addEventListener('click',function(e){var o=e.target.closest('.dd-opt');if(o)self.choose(+o.getAttribute('data-i'));});
  this.list.addEventListener('mousemove',function(e){var o=e.target.closest('.dd-opt');if(o&&+o.getAttribute('data-i')!==self.active)self.setActive(+o.getAttribute('data-i'),false);});
  this.paint();
}
Dropdown.prototype.setOptions=function(o){this.options=o||[];this.paint();if(this.isOpen){this.renderList();}};
Dropdown.prototype.setValue=function(v){this.value=v;this.paint();};
Dropdown.prototype.setDisabled=function(d){this.btn.disabled=!!d;};
Dropdown.prototype.cur=function(){for(var i=0;i<this.options.length;i++)if(String(this.options[i].value)===String(this.value))return this.options[i];return null;};
Dropdown.prototype.paint=function(){var c=this.cur();this.valEl.textContent=c?c.label:(this.cfg.placeholder||'Select');};
Dropdown.prototype.renderList=function(){
  var self=this;
  this.list.innerHTML=this.options.map(function(o,i){
    var sel=String(o.value)===String(self.value);
    return '<div class="dd-opt'+(i===self.active?' is-active':'')+'" role="option" id="'+self.id+'-o'+i+'" data-i="'+i+'" aria-selected="'+sel+'"><span class="o-lbl">'+esc(o.label)+'</span>'+(o.meta!=null?'<span class="o-meta num">'+esc(o.meta)+'</span>':'')+CHECK+'</div>';
  }).join('');
  if(this.active>-1)this.list.setAttribute('aria-activedescendant',this.id+'-o'+this.active);
};
Dropdown.prototype.setActive=function(i,scroll){
  var old=this.list.querySelector('.is-active');if(old)old.classList.remove('is-active');
  this.active=i;var el=this.list.querySelector('[data-i="'+i+'"]');
  if(el){el.classList.add('is-active');if(scroll!==false)el.scrollIntoView({block:'nearest'});}
  if(i>-1)this.list.setAttribute('aria-activedescendant',this.id+'-o'+i);
};
Dropdown.prototype.position=function(){
  var r=this.btn.getBoundingClientRect(),vh=window.innerHeight,vw=window.innerWidth,m=this.menu;
  if(r.bottom<0||r.top>vh){this.close(false);return;}
  var w=Math.min(Math.max(r.width,150),vw-16),left=Math.min(Math.max(8,r.left),vw-w-8);
  m.style.width=w+'px';m.style.left=left+'px';m.style.maxHeight='';
  var natural=Math.min(m.scrollHeight,260),below=vh-r.bottom-10,above=r.top-10;
  var up=below<Math.min(natural,160)&&above>below;
  m.style.maxHeight=Math.max(100,Math.min(260,up?above:below))+'px';

};
Dropdown.prototype.open=function(){
  if(this.isOpen||this.btn.disabled)return;
  if(openDD&&openDD!==this)openDD.close(false);
  openDD=this;this.isOpen=true;clearTimeout(this.hideT);
  var idx=-1;for(var i=0;i<this.options.length;i++)if(String(this.options[i].value)===String(this.value)){idx=i;break;}
  this.active=idx<0?0:idx;
  this.menu.hidden=false;this.renderList();this.position();
  this.host.classList.add('is-open');this.btn.setAttribute('aria-expanded','true');
  var self=this;requestAnimationFrame(function(){self.menu.classList.add('open');self.list.focus({preventScroll:true});var a=self.list.querySelector('.is-active');if(a)a.scrollIntoView({block:'nearest'});});
};
Dropdown.prototype.close=function(refocus){
  if(!this.isOpen)return;var self=this;
  this.isOpen=false;if(openDD===this)openDD=null;
  this.menu.classList.remove('open');this.host.classList.remove('is-open');this.btn.setAttribute('aria-expanded','false');
  clearTimeout(this.hideT);this.hideT=setTimeout(function(){if(!self.isOpen)self.menu.hidden=true;},REDUCED?0:150);
  if(refocus)this.btn.focus({preventScroll:true});
};
Dropdown.prototype.choose=function(i){
  var o=this.options[i];if(!o)return;
  var changed=String(o.value)!==String(this.value);
  this.value=o.value;this.paint();this.close(true);
  if(changed&&this.cfg.onChange)this.cfg.onChange(o.value);
};
Dropdown.prototype.onKey=function(e){
  var k=e.key,self=this,n=this.options.length;
  if(k==='Escape'){e.preventDefault();e.stopPropagation();this.close(true);return;}
  if(k==='Tab'){this.close(false);return;}
  if(k==='ArrowDown'||k==='ArrowUp'){e.preventDefault();this.setActive(Math.min(n-1,Math.max(0,this.active+(k==='ArrowDown'?1:-1))));return;}
  if(k==='Home'||k==='End'){e.preventDefault();this.setActive(k==='Home'?0:n-1);return;}
  if(k==='Enter'||k===' '){e.preventDefault();if(this.active>-1)this.choose(this.active);return;}
  if(k.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    this.typeBuf+=k.toLowerCase();clearTimeout(this.typeT);this.typeT=setTimeout(function(){self.typeBuf='';},600);
    for(var i=0;i<n;i++)if(this.options[i].label.toLowerCase().indexOf(this.typeBuf)===0){this.setActive(i);break;}
  }
};

var reqSeq=0;

async function loadOrders(mode){
  var cfg=TYPES[S.type],type=S.type;
  if(mode==='more'&&S.loading!=='idle')return;
  var token=++reqSeq,from=mode==='more'?S.rows.length:0;
  S.loading=mode;
  if(mode==='initial'){S.rows=[];S.total=null;S.hasMore=false;S.error=null;S.stale=null;}
  render();
  try{
    var r=await sb.from(cfg.table).select('*',{count:'exact'}).eq('user_id',uid)
      .order('created_at',{ascending:S.sort==='old'}).range(from,from+PAGE_SIZE-1);
    if(token!==reqSeq||type!==S.type)return;
    if(r.error)throw r.error;
    var data=r.data||[];
    if(mode==='more'){
      var seen={};S.rows.forEach(function(x){seen[x.id]=1;});
      data.forEach(function(x){if(!seen[x.id])S.rows.push(x);});
    }else S.rows=data.slice();
    S.total=typeof r.count==='number'?r.count:null;
    S.hasMore=S.total!==null?S.rows.length<S.total:data.length===PAGE_SIZE;
    S.error=null;S.stale=null;
  }catch(e){
    if(token!==reqSeq||type!==S.type)return;
    var kind=classify(e);
    console.warn('loadOrders failed:',e&&e.message||e);
    if(S.rows.length){S.stale={kind:kind};if(mode==='more')toast('Couldn\u2019t load more orders');}
    else S.error={kind:kind};
  }finally{
    if(token===reqSeq){S.loading='idle';render();ensureRate();}
  }
}

function statusOptions(){
  var counts={},order=[];
  S.rows.forEach(function(r){var s=effStatus(r);if(!counts[s]){counts[s]=0;order.push(s);}counts[s]++;});
  if(S.status!=='all'&&!counts[S.status]){counts[S.status]=0;order.push(S.status);}
  order.sort();
  var o=[{value:'all',label:'All statuses',meta:S.rows.length}];
  order.forEach(function(s){o.push({value:s,label:humanize(s),meta:counts[s]});});
  return o;
}

    '<span class="rsub"><span class="mono">#'+esc(shortId(r.id))+'</span>'+(when?'<i class="sep"></i><span>'+esc(when)+'</span>':'')+(extra?'<i class="sep xtra"></i><span class="xtra">'+esc(extra)+'</span>':'')+'</span></span>'+
    '<span class="rend"><span class="ramt num">'+esc(fmtAmount(r))+'</span>'+pill(st)+'</span>'+
    ico('<path d="M9 18l6-6-6-6"/>','s chev')+'</button></li>';

function render(){
  var cfg=TYPES[S.type];
  // tabs
  $('tabs').innerHTML=TYPE_KEYS.map(function(k){
    var on=k===S.type;
    return '<button class="tab" role="tab" type="button" data-t="'+k+'" aria-selected="'+on+'" tabindex="'+(on?0:-1)+'">'+ico(TYPES[k].icon,'s')+esc(TYPES[k].label)+'</button>';
  }).join('');
  // dropdowns
  ddStatus.setOptions(statusOptions());ddStatus.setValue(S.status);
  ddSort.setOptions(SORTS);ddSort.setValue(S.sort);
  var busy=S.loading==='initial';
  ddStatus.setDisabled(busy||!S.rows.length&&S.status==='all');ddSort.setDisabled(busy);
  $('qClear').hidden=!S.q;
  // refresh indicator
  var spin=S.loading==='refresh'||S.loading==='initial'||S.loading==='silent';
  $('refreshIco').classList.toggle('spin',spin);$('refreshBtn').disabled=S.loading==='initial';
  // live indicator
  var li=$('liveInd');li.setAttribute('data-s',S.rt);
  $('liveTxt').textContent=S.rt==='live'?'Live':S.rt==='down'?'Offline':'Connecting';
  li.title=S.rt==='live'?'Live updates on':S.rt==='down'?'Live updates paused \u2014 reconnecting':'Connecting to live updates';

  var list=viewRows(),filtered=!!S.q.trim()||S.status!=='all';
  // banner (refresh failed but rows still shown)
  var bn=$('banner');
  if(S.stale&&S.rows.length){
    var msg=S.stale.kind==='auth'?'Your session has expired. Showing the last loaded orders.':S.stale.kind==='network'?'You\u2019re offline. Showing the last loaded orders.':'Couldn\u2019t refresh. Showing the last loaded orders.';
    bn.hidden=false;bn.className='banner';
    bn.innerHTML=ico(ICON_ALERT,'s')+'<span>'+esc(msg)+'</span>'+(S.stale.kind==='auth'?'<a href="login.html" style="font-weight:600;text-decoration:underline">Sign in</a>':'<button type="button" id="bannerRetry">Retry</button>');
  }else{bn.hidden=true;bn.innerHTML='';}

  // count + hint
  var cnt='';
  if(S.loading==='initial')cnt='Loading orders\u2026';
  else if(!S.error){
    var total=S.total!==null?S.total:S.rows.length;
    cnt=filtered?list.length+' of '+S.rows.length+' loaded':total.toLocaleString()+(total===1?' order':' orders');
  }
  $('count').textContent=cnt;
  var hint='';
  if(S.hasMore&&(filtered||S.sort==='hi'||S.sort==='lo'))hint='Applies to loaded orders. Load more to include older ones.';
  $('hint').textContent=hint;

  // content

/* ═══ 6. REALTIME SUBSCRIPTIONS ═══
   One channel for the selected order table, filtered to this user (same filter style as index.html).
   Replaced when the tab changes; removed on page hide. Events are merged by id so nothing renders twice. */
var channel=null,rtSeq=0,rtWasDown=false;
function setRt(s){S.rt=s;var li=$('liveInd');if(li){li.setAttribute('data-s',s);}render();}
function subscribeRealtime(){
  unsubscribeRealtime();
  var cfg=TYPES[S.type];
  rtWasDown=false;S.rt='connecting';
  var my=sb.channel('gd_orders_'+cfg.table+'_'+(++rtSeq)).on('postgres_changes',
    {event:'*',schema:'public',table:cfg.table,filter:'user_id=eq.'+uid},onRealtime
  ).subscribe(function(status){
    if(channel!==my)return;
    if(status==='SUBSCRIBED'){var re=rtWasDown;rtWasDown=false;setRt('live');if(re)loadOrders('silent');}
    else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){rtWasDown=true;setRt('down');}
  });
  channel=my;render();
}
function unsubscribeRealtime(){
  if(!channel)return;
  var c=channel;channel=null;
  try{sb.removeChannel(c);}catch(e){}
}
function idxOf(id){for(var i=0;i<S.rows.length;i++)if(S.rows[i].id===id)return i;return -1;}
function onRealtime(p){
  var ev=p&&p.eventType,n=p&&p.new,o=p&&p.old;
  if((ev==='INSERT'||ev==='UPDATE')&&n&&n.id){
    if(n.user_id&&n.user_id!==uid)return;
    var i=idxOf(n.id);
    if(i>-1)S.rows[i]=Object.assign({},S.rows[i],n);
    else if(ev==='INSERT'){S.rows.unshift(n);if(S.total!==null)S.total++;}
    if(S.detail&&S.detail.id===n.id&&S.detail.fetched)S.detail.fetched=Object.assign({},S.detail.fetched,n);
  }else if(ev==='DELETE'&&o&&o.id){
    var j=idxOf(o.id);
    if(j>-1){S.rows.splice(j,1);if(S.total!==null)S.total=Math.max(0,S.total-1);}
    if(S.detail&&S.detail.id===o.id){S.detail.fetched=null;S.detail.st='missing';}
  }else return;
  render();
  if(S.detail&&n&&S.detail.id===n.id||S.detail&&o&&S.detail.id===o.id)renderDetail();
  ensureRate();
}

async function fetchDetailRow(id){
  var cfg=TYPES[S.type],type=S.type;
  try{
    var r=await sb.from(cfg.table).select('*').eq('id',id).eq('user_id',uid).single();
    if(!S.detail||S.detail.id!==id||type!==S.type)return;
    if(r.error&&r.error.code!=='PGRST116')throw r.error;
    if(!r.data){S.detail.st='missing';}
    else{S.detail.fetched=r.data;S.detail.st='ready';var i=idxOf(id);if(i>-1)S.rows[i]=r.data;}
  }catch(e){
    if(!S.detail||S.detail.id!==id)return;
    console.warn('fetchDetailRow failed:',e&&e.message||e);
    S.detail.st=classify(e)==='auth'?'auth':'error';
  }
  render();renderDetail();
}
async function refreshDetailRow(id){
  if(!S.detail||S.detail.id!==id)return;
  var cfg=TYPES[S.type];
  try{
    var r=await sb.from(cfg.table).select('*').eq('id',id).eq('user_id',uid).single();
    if(r.data){var i=idxOf(id);if(i>-1)S.rows[i]=r.data;if(S.detail&&S.detail.id===id)S.detail.fetched=r.data;}
  }catch(e){console.warn('refreshDetailRow failed:',e&&e.message);}
  render();renderDetail();
}

function renderDetail(){

function wireTimer(){
  var el=$('liveTimer');if(!el)return;
  var dl=+el.dataset.deadline;
  function tick(){
    var rem=dl-Date.now();
    if(rem<=0){clearInterval(timer);timer=null;el.textContent='00:00';expireOrder();return;}
    var m=Math.floor(rem/60000),s=Math.floor(rem%60000/1000);
    el.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }
  tick();if(el.isConnected&&timer===null&&dl-Date.now()>0)timer=setInterval(tick,1000);
}

/* Number-order actions — same contract as view-order.html: re-check the row, set status, then credit the
   wallet through the existing credit_wallet_refund RPC with the order-based client_ref (idempotency key).
   Differences: the status update's error is checked BEFORE refunding, and refund failures are reported. */
async function refundToWallet(id,amount,reason){
  try{
    var res=await sb.rpc('credit_wallet_refund',{p_user_id:uid,p_amount:amount,p_category:'refund',p_title:'Auto Refund: '+reason,p_client_ref:'order_'+id});
    var row=Array.isArray(res.data)?res.data[0]:res.data;
    if(res.error||(row&&row.success===false)){console.error('refund failed:',res.error||row);return false;}
    return true;
  }catch(e){console.error('refund failed:',e);return false;}
}
async function endActivation(newStatus,okMsg,reasonPrefix,silentIfSettled){
  if(busy||!S.detail)return;
  var id=S.detail.id;busy=true;S.confirmCancel=false;renderDetail();
  try{
    var r=await sb.from('orders').select('status,otp,price,tier_name,country').eq('id',id).eq('user_id',uid).single();
    if(r.error||!r.data)throw (r.error||new Error('Order not found'));
    var o=r.data;
    if(NUM_TERMINAL.indexOf(o.status)>-1||o.otp){if(!silentIfSettled)toast('This order can no longer be cancelled');return;}
    var u=await sb.from('orders').update({status:newStatus}).eq('id',id).eq('user_id',uid);
    if(u.error)throw u.error;
    var ok=await refundToWallet(id,o.price||0,reasonPrefix+(o.tier_name||o.country||'order'));
    toast(ok?okMsg:'Order updated, but the refund failed. Contact support.');
  }catch(e){
    console.error(newStatus+' failed:',e&&e.message||e);
    toast(newStatus==='cancelled'?'Couldn\u2019t cancel. Try again.':'Couldn\u2019t update this order.');
  }finally{
    busy=false;await refreshDetailRow(id);
  }
}
function cancelOrder(){return endActivation('cancelled','Activation cancelled and refunded','Activation cancelled by user \u2014 ',false);}
function expireOrder(){return endActivation('expired','Activation expired and refunded','Number activation expired \u2014 ',true);}

function radioKeys(container,sel,activate){
  container.addEventListener('keydown',function(e){
    var k=e.key;if(['ArrowRight','ArrowLeft','Home','End'].indexOf(k)<0)return;
    var items=Array.prototype.slice.call(container.querySelectorAll(sel)),i=items.indexOf(document.activeElement);if(i<0)return;
    e.preventDefault();
    var n=k==='Home'?items[0]:k==='End'?items[items.length-1]:items[(i+(k==='ArrowRight'?1:-1)+items.length)%items.length];
    n.focus();activate(n);
  });
}
var qTimer=null;
function applyUrl(){
  var p=new URLSearchParams(location.search),type=p.get('type'),id=p.get('id');
  if(type&&TYPES[type]&&type!==S.type){S.type=type;S.status='all';loadOrders('initial');subscribeRealtime();}
  if(id){if(!S.detail||S.detail.id!==id)openDetail(id,false);}
  else if(S.detail)doCloseDetail();

function wireEvents(){
  $('tabs').addEventListener('click',function(e){var b=e.target.closest('.tab');if(b)setType(b.getAttribute('data-t'));});
  radioKeys($('tabs'),'.tab',function(b){setType(b.getAttribute('data-t'));var n=$('tabs').querySelector('[aria-selected="true"]');if(n)n.focus();});
  $('q').addEventListener('input',function(){
    clearTimeout(qTimer);var v=this.value;
    qTimer=setTimeout(function(){S.q=v;render();},120);
    $('qClear').hidden=!v;
  });
  $('q').addEventListener('keydown',function(e){if(e.key==='Escape'&&this.value){this.value='';S.q='';render();}});
  $('qClear').addEventListener('click',function(){$('q').value='';S.q='';render();$('q').focus();});
  $('content').addEventListener('click',function(e){
    var row=e.target.closest('.row');
    if(row){openDetail(row.getAttribute('data-id'),true,row);return;}
    var a=e.target.closest('[data-act]');if(!a)return;
    var act=a.getAttribute('data-act');
    if(act==='retry')loadOrders('initial');
    else if(act==='clear'){S.q='';S.status='all';$('q').value='';render();}
    else if(act==='more')loadOrders('more');
  });
  $('banner').addEventListener('click',function(e){if(e.target.id==='bannerRetry')loadOrders('refresh');});
  $('moreBtn').addEventListener('click',function(){loadOrders('more');});
  $('refreshBtn').addEventListener('click',function(){if(S.loading==='idle')loadOrders('refresh');});
  $('backBtn').addEventListener('click',function(){
    if(window.history.length>1&&document.referrer&&document.referrer.indexOf(location.origin)===0)history.back();
    else location.href='index.html';
  });
  $('dClose').addEventListener('click',closeDetail);
  $('scrim').addEventListener('click',closeDetail);
  $('dBody').addEventListener('click',function(e){
    var c=e.target.closest('[data-copy]');
    if(c){copyText(c.getAttribute('data-copy'));return;}
    var a=e.target.closest('[data-act]');if(!a)return;
    var act=a.getAttribute('data-act');
    if(act==='cancel-ask'){S.confirmCancel=true;renderDetail();}
    else if(act==='keep'){S.confirmCancel=false;renderDetail();}
    else if(act==='cancel-yes')cancelOrder();
    else if(act==='detail-retry'&&S.detail){S.detail.st='loading';renderDetail();fetchDetailRow(S.detail.id);}
    else if(act==='close')closeDetail();
  });
  // Escape / outside press for dropdowns, Escape for the drawer
  document.addEventListener('pointerdown',function(e){
    if(!openDD)return;if(openDD.menu.contains(e.target)||openDD.btn.contains(e.target))return;openDD.close(false);
  },true);
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape')return;
    if(openDD){openDD.close(true);return;}
    if(S.detail)closeDetail();
  });
  window.addEventListener('resize',function(){if(openDD)openDD.position();});
  window.addEventListener('scroll',function(e){if(openDD&&!openDD.menu.contains(e.target))openDD.position();},true);
  window.addEventListener('popstate',applyUrl);
  window.addEventListener('online',function(){if(S.loading==='idle')loadOrders('silent');});
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.rt!=='live'&&S.loading==='idle')loadOrders('silent');});
  window.addEventListener('pagehide',cleanup);
}

function cleanup(){

function fatal(title,msg,showRetry,signIn){
  hideBoot();

    stateHtml(ICON_ALERT,title,msg,(signIn?'<a class="btn pri" href="login.html">Sign in</a>':'')+(showRetry?'<button class="btn pri" type="button" id="fatalRetry">Try again</button>':'')+'<a class="btn" href="index.html">Back to dashboard</a>')+'</main>';

async function boot(){
  if(!window.supabase||!window.supabase.createClient){fatal('Couldn\u2019t load the page','A required script didn\u2019t load. Check your connection and try again.',true);return;}
  try{
    sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
    setBoot('Checking your session\u2026');
    var ur=await sb.auth.getUser();
    var user=ur.data&&ur.data.user;
    if(!user){
      var er=ur.error,transient=er&&(er.name==='AuthRetryableFetchError'||er.status===0||er.status>=500||!navigator.onLine);
      if(transient){fatal('You appear to be offline','We couldn\u2019t verify your session. Check your connection and try again.',true);return;}
      try{await sb.auth.signOut();}catch(e){}
      location.replace('login.html');return;
    }
    uid=user.id;
    try{sessionStorage.setItem('gd_entered_app','1');}catch(e){}
    if(sb.auth.onAuthStateChange)sb.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_OUT')location.replace('login.html');});

    var p=new URLSearchParams(location.search),type=p.get('type'),id=p.get('id');
    if(type&&TYPES[type])S.type=type;
    ddStatus=new Dropdown($('ddStatus'),{label:'Filter by status',onChange:function(v){S.status=v;render();}});
    ddSort=new Dropdown($('ddSort'),{label:'Sort orders',onChange:function(v){
      var prevAsc=S.sort==='old';S.sort=v;
      if((v==='old')!==prevAsc)loadOrders('refresh');else{render();ensureRate();}
    }});
    wireEvents();
    render();
    hideBoot();
    loadOrders('initial');
    subscribeRealtime();
    if(id)openDetail(id,false);
  }catch(e){
    console.error('orders boot failed:',e);
    fatal('Something went wrong','We couldn\u2019t load this page. Please try again.',true);
  }
}
boot();
})();
</script>
</body>
</html>
