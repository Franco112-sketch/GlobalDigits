<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="color-scheme" content="light"/>
<meta name="theme-color" content="#ffffff"/>
<title>Random Mail · Global Digits</title>
<link rel="icon" href="favicon.ico"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --blue:#2563eb;--blue-d:#1d4ed8;--blue-50:#f1f6ff;--blue-100:#dce8ff;
  --ink:#0f172a;--ink2:#475569;--ink3:#74839a;--line:#e2e8f2;--bg:#f6f8fc;--card:#fff;
  --ok:#047857;--ok-bg:#e8f7f0;--warn:#92400e;--warn-bg:#fff4e0;--bad:#b91c1c;--bad-bg:#fdecec;
  --r:12px;--r-sm:8px;--font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);font-size:13px;line-height:1.5;color:var(--ink);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}
.i{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.i.sm{width:13px;height:13px}.i.lg{width:20px;height:20px}

#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:60}
.spin{width:16px;height:16px;border:2px solid var(--blue-100);border-top-color:var(--blue);border-radius:50%;animation:rot .7s linear infinite;flex-shrink:0}
.spin.lg{width:22px;height:22px}
@keyframes rot{to{transform:rotate(360deg)}}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.wrap{max-width:1040px;margin:0 auto;padding:0 14px}
.top-in{height:50px;display:flex;align-items:center;gap:10px}
.sq{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink2);background:#fff;flex-shrink:0}
.sq:hover{background:var(--blue-50);color:var(--blue)}
.ttl{font-size:14px;font-weight:600}
.sp{flex:1}
.live{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink3);font-weight:500}
.live i{width:6px;height:6px;border-radius:50%;background:#c3ccda}
.live.on i{background:#10b981}
.hist{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:8px;font-size:12px;font-weight:500;color:var(--ink2);background:#fff}
.hist:hover{background:var(--blue-50);color:var(--blue)}

/* banners */
.banner{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12px;border-radius:var(--r-sm);margin-bottom:10px}
.banner.bad{background:var(--bad-bg);color:var(--bad)}.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner .grow{flex:1}
.banner a,.banner button{font-weight:600;text-decoration:underline}

/* layout */
.shell{padding-top:12px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.layout{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:860px){.layout{grid-template-columns:330px 1fr;align-items:start}.shell{padding-top:18px}.only-m{display:none!important}}
@media(max-width:859px){.layout .pane-view{display:none}.layout.view-open .pane-view{display:block}.layout.view-open .pane-list{display:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.pane-list{overflow:visible}.tabs{border-radius:var(--r) var(--r) 0 0}

/* tabs */
.tabs{display:flex;align-items:center;gap:4px;padding:8px 8px 0;border-bottom:1px solid var(--line)}
.tab{padding:7px 10px 9px;font-size:12.5px;font-weight:500;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{color:var(--blue-d);border-color:var(--blue);font-weight:600}
.cnt{font-size:10.5px;background:var(--blue-50);color:var(--blue-d);border-radius:99px;padding:0 6px;min-width:18px;text-align:center}.cnt.warn{background:var(--warn-bg);color:var(--warn)}
.tabs .sp{flex:1}
.ib{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--ink3);margin-bottom:4px}
.ib:hover{background:var(--blue-50);color:var(--blue)}
.ib.spinning .i{animation:rot .7s linear infinite}
.ib:disabled{opacity:.5;cursor:default}

/* lists */
.list{display:flex;flex-direction:column;padding:4px 6px 6px}
.row{display:flex;align-items:center;gap:10px;padding:10px 8px;width:100%;text-align:left;border-radius:9px}
.row+.row{margin-top:1px}
.row:hover{background:var(--blue-50)}
.row[aria-current="true"]{background:var(--blue-50);box-shadow:inset 0 0 0 1px var(--blue-100)}
.av{width:32px;height:32px;border-radius:9px;background:var(--blue-50);color:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row-b{flex:1;min-width:0}
.row-t{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-m{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-r{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.row-p{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:500;padding:1px 7px;border-radius:99px;background:var(--bg);color:var(--ink2)}
.badge.waiting{background:var(--warn-bg);color:var(--warn)}
.badge.delivered{background:var(--ok-bg);color:var(--ok)}
.badge.expired,.badge.cancelled,.badge.failed{background:var(--bad-bg);color:var(--bad)}
.more{margin:2px 8px 8px;height:32px;border:1px solid #cdd7e6;border-radius:8px;font-size:12px;font-weight:500;color:var(--ink2);background:#fff;width:calc(100% - 16px)}
.more:hover{background:var(--bg)}.more:disabled{opacity:.6}

.empty{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--ink3);font-size:12px;padding:28px 14px}
.empty .i{width:24px;height:24px;color:#a6b3c8}
.empty b{font-weight:600;color:var(--ink2);font-size:12.5px}
.sk{background:linear-gradient(90deg,#edf1f8 25%,#f6f8fc 37%,#edf1f8 63%);background-size:400% 100%;animation:sh 1.3s ease infinite;border-radius:6px}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
.sk-row{display:flex;gap:10px;align-items:center;padding:10px 8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;font-size:12.5px;font-weight:600;transition:background .15s}
.btn-p{background:var(--blue);color:#fff}.btn-p:hover{background:var(--blue-d)}
.btn-o{background:#fff;color:var(--ink2);border:1px solid #cdd7e6}.btn-o:hover{background:var(--bg)}
.btn-d{background:#fff;color:var(--bad);border:1px solid #f0c4c1}.btn-d:hover{background:var(--bad-bg)}
.btn-sm{height:30px;padding:0 11px;font-size:12px}
.btn-dp{background:var(--bad);color:#fff}.btn-dp:hover{background:#991b1b}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-block{width:100%}

/* viewer */
.pane-view{overflow:hidden}
.v-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.v-head h2{font-size:13.5px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-body{padding:14px;display:flex;flex-direction:column;gap:12px}
.addr{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:7px 8px 7px 11px}
.addr span{flex:1;min-width:0;font-size:12.5px;font-weight:500;overflow-wrap:anywhere;user-select:all}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:11.5px;color:var(--ink3)}
.meta b{font-weight:500;color:var(--ink2)}
.wait{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}
.wait .t{flex:1;font-size:12.5px;font-weight:500}.wait .s{font-size:11.5px;color:var(--ink3);font-weight:400;display:block}
.cd{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--blue-d)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.msg{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.msg-h{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--bg);border-bottom:1px solid var(--line);font-size:12px;color:var(--ink2)}
.msg-h .sp{flex:1}
.otp{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line)}
.otp .l{font-size:11px;color:var(--ink3)}
.otp .v{font-size:18px;font-weight:600;letter-spacing:2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;user-select:all}
.otp .g{flex:1;min-width:0}
.msg-b{padding:12px;font-size:12.5px;color:var(--ink2);white-space:pre-wrap;overflow-wrap:anywhere;max-height:320px;overflow:auto;line-height:1.6}
.note{display:flex;gap:8px;font-size:12px;border-radius:var(--r-sm);padding:10px 12px}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.tips{border:1px solid var(--line);border-radius:var(--r-sm);font-size:12px;color:var(--ink2)}
.tips summary{cursor:pointer;padding:9px 12px;font-weight:500;display:flex;align-items:center;gap:6px;list-style:none}
.tips summary::-webkit-details-marker{display:none}
.tips ul{padding:0 12px 10px 28px;display:flex;flex-direction:column;gap:5px}
.tips strong{font-weight:600;color:var(--bad)}

/* new inbox panel */
.newp{padding:14px;display:flex;flex-direction:column;gap:14px;min-height:460px}
.np-h{display:flex;gap:10px;align-items:flex-start}
.np-h h2{font-size:13px;font-weight:600}.np-h p{font-size:11.5px;color:var(--ink3);margin-top:1px}
.fl{font-size:11.5px;font-weight:500;color:var(--ink2);margin-bottom:6px;display:block}
.av.sm{width:24px;height:24px;border-radius:7px}
.dd{position:relative}
.dd-btn{width:100%;height:40px;display:flex;align-items:center;gap:9px;padding:0 10px;border:1px solid #cdd7e6;border-radius:var(--r-sm);background:#fff;text-align:left;transition:border-color .15s,box-shadow .15s}
.dd-btn:hover{border-color:#b3c2da}
.dd-btn[aria-expanded="true"]{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.dd-btn .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;font-size:13px}
.dd-btn .ph{color:var(--ink3);font-weight:400}
.dd-btn .px,.dd-opt .px{font-size:12px;font-weight:600;color:var(--blue-d);font-variant-numeric:tabular-nums}
.dd-btn .chv{color:var(--ink3);display:flex;transition:transform .15s}
.dd-btn[aria-expanded="true"] .chv{transform:rotate(180deg)}
.dd-pop{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 28px rgba(15,23,42,.14);z-index:30;overflow:hidden}
.dd-s{display:flex;align-items:center;gap:7px;padding:8px 10px;border-bottom:1px solid var(--line);color:var(--ink3)}
.dd-s input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:12.5px;background:none;color:var(--ink)}
.dd-list{list-style:none;max-height:236px;overflow:auto;padding:4px}
.dd-opt{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:7px;cursor:pointer}
.dd-opt.act{background:var(--blue-50)}
.dd-opt .nm{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-opt[aria-selected="true"] .nm{color:var(--blue-d);font-weight:600}
.dd-opt .i{color:var(--blue)}
.dd-empty{padding:14px;text-align:center;color:var(--ink3);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--line);border-radius:99px;font-size:12px;font-weight:500;background:#fff;color:var(--ink2)}
.chip:hover{border-color:var(--blue-100);background:var(--blue-50)}
.chip[aria-pressed="true"]{background:var(--blue-50);border-color:var(--blue);color:var(--blue-d)}
.sum{border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:4px 12px}
.sum-r{display:flex;justify-content:space-between;padding:7px 0;font-size:12.5px;color:var(--ink2);border-top:1px solid var(--line)}
.sum-r:first-child{border-top:0}.sum-r b{font-weight:600;color:var(--ink)}.sum-r.t b{color:var(--blue-d)}
.sum-e{display:flex;align-items:center;gap:8px;padding:9px 0;font-size:12px;color:var(--ink3)}
.steps{display:flex;flex-direction:column;gap:8px;padding-top:2px}
.st-h,.rc-h{font-size:11.5px;font-weight:600;color:var(--ink2)}
.st{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--ink2)}
.st span{width:18px;height:18px;border-radius:50%;background:var(--blue-50);color:var(--blue-d);font-size:10.5px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.rc-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.link{font-size:12px;font-weight:500;color:var(--blue);padding:2px 6px;border-radius:6px}.link:hover{background:var(--blue-50)}
.rc{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 6px;border-radius:8px}
.rc:hover{background:var(--blue-50)}
.rc-b{flex:1;min-width:0;display:flex;flex-direction:column}
.rc-t{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-m{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-end;justify-content:center;z-index:70}
.ov.show{display:flex}
.sheet{background:#fff;width:100%;max-width:400px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:up .2s ease}
@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:560px){.ov{align-items:center;padding:16px}.sheet{border-radius:14px}}
.sheet h3{font-size:14px;font-weight:600;margin-bottom:4px}
.sheet p{font-size:12px;color:var(--ink2);margin-bottom:12px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2);margin-bottom:12px}.sheet p{min-height:0}
.kv b{color:var(--blue-d);font-weight:600}
.m-btns{display:flex;gap:8px}.m-btns .btn{flex:1}

#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:#0f172a;color:#fff;font-size:12.5px;padding:9px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:90;max-width:min(92vw,420px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{background:var(--bad)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><polyline points="3 7 12 13 21 7"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3 13l3-8h12l3 8v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6z"/><path d="M3 13h5l1 3h6l1-3h5"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><polyline points="21 4 21 10 15 10"/><polyline points="3 20 3 14 9 14"/><path d="M4.5 9A8 8 0 0118 6l3 4M3 14l3 4a8 8 0 0013.5-3"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><polyline points="5 12 10 17 19 7"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9L2 18a2 2 0 001.7 3h16.6A2 2 0 0022 18L13.7 3.9a2 2 0 00-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></symbol>
  <symbol id="i-hist" viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9 9 0 00-7 3.3M3 4v4h4"/><polyline points="12 8 12 12 15 14"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><line x1="12" y1="8" x2="12.01" y2="8"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.4 8.4 0 01-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.4 8.4 0 013.8-.9h.5a8.5 8.5 0 018 8v.5z"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></symbol>
  <symbol id="i-chev-d" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></symbol>
  <symbol id="i-fb" viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"/></symbol>
  <symbol id="i-ig" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></symbol>
  <symbol id="i-tt" viewBox="0 0 24 24"><path d="M9 12a4 4 0 104 4V4a5 5 0 005 5"/></symbol>
</svg>

<div id="gate" role="status" aria-label="Loading"><div class="spin lg"></div></div>

<div id="app" class="hidden">
  <header class="top">
    <div class="wrap top-in">
      <button class="sq" id="backBtn" type="button" aria-label="Back"><svg class="i"><use href="#i-back"/></svg></button>
      <h1 class="ttl">Random Mail</h1>
      <span class="sp"></span>
      <span class="live" id="live" title="Realtime connection"><i></i><span id="liveTxt">Connecting</span></span>
      <a class="hist" href="view-order.html?type=mail"><svg class="i sm"><use href="#i-hist"/></svg>History</a>
    </div>
  </header>

  <main class="wrap shell">
    <div id="banners"></div>
    <div class="layout" id="layout">
      <!-- list pane -->
      <section class="card pane-list" aria-label="Inboxes">
        <div class="tabs" role="tablist">
          <button class="tab" id="tabNew" role="tab" type="button" aria-selected="true">New inbox</button>
          <button class="tab" id="tabInbox" role="tab" type="button" aria-selected="false">Inboxes <span class="cnt warn hidden" id="cntInbox">0</span></button>
          <span class="sp"></span>
          <button class="ib" id="refreshBtn" type="button" aria-label="Refresh"><svg class="i"><use href="#i-refresh"/></svg></button>
        </div>

async function authedPost(fn,body){

  var data=null;try{data=await res.json();}catch(e){data={};}
  return {ok:res.ok,status:res.status,data:data||{}};
}
function sessionLost(){

/* ---------- data (silent = background refresh: no skeletons, keeps what is on screen on failure) ---------- */
async function loadServices(silent){
  if(!silent&&!services.length){servicesState='loading';if(tab==='new')renderList();}
  try{
    var r=await sb.from('mail_services').select('*').eq('active',true).order('sort_order').order('name');
    if(r.error)throw r.error;
    var next=r.data||[];
    var sig=function(a){return a.map(function(s){return [s.id,s.name,s.price].join(':');}).join('|');};
    var changed=sig(next)!==sig(services)||servicesState!=='ready';
    services=next;servicesState='ready';
    if(dd.picked&&!svcById(dd.picked)){dd.picked=null;toast('That service is no longer available',true);}
    if(changed&&tab==='new')renderList();
  }catch(e){
    console.error('loadServices failed:',e.message||e);
    if(!services.length){servicesState='error';if(tab==='new')renderList();}
  }
}
function mergeOrders(rows){
  rows.forEach(function(row){
    var i=orders.findIndex(function(o){return o.id===row.id;});
    // a finished order never goes back to "waiting" because of a slightly stale read
    if(i>-1&&orders[i].status!=='waiting'&&row.status==='waiting')return;
    if(i>-1)orders[i]=row;else orders.push(row);
  });
  orders.sort(function(a,b){return new Date(b.created_at)-new Date(a.created_at);});
}
async function loadOrders(reset,silent){
  var from=reset?0:orders.length;
  if(reset&&!silent&&!orders.length){ordersState='loading';if(tab==='inbox')renderList();}
  try{
    var r=await sb.from('mail_orders').select(ORDER_COLS).eq('user_id',user.id).order('created_at',{ascending:false}).range(from,from+PAGE-1);
    if(r.error)throw r.error;
    var rows=r.data||[];
    var before=orders.map(function(o){return o.id+o.status+(o.otp||'');}).join('|');
    mergeOrders(rows);
    if(!silent||!orders.length||from>0)hasMore=rows.length===PAGE;
    ordersState='ready';
    var after=orders.map(function(o){return o.id+o.status+(o.otp||'');}).join('|');
    if(!silent||before!==after){renderList();if(selId)renderViewer();}
    if(silent&&before!==after&&waitingOrders().length)startPolling();
  }catch(e){
    console.error('loadOrders failed:',e.message||e);

  }
}
async function refreshOrder(id){
  try{
    var r=await sb.from('mail_orders').select(ORDER_COLS).eq('id',id).single();
    if(r.error||!r.data)throw (r.error||new Error('missing'));
    var prev=byId(id),prevStatus=prev&&prev.status;
    mergeOrders([r.data]);
    var now=byId(id);
    if(prevStatus&&now&&prevStatus!==now.status)onStatusChange(prevStatus,now);
    renderList();if(selId===id)renderViewer();
    if(waitingOrders().length&&!pollTimer)startPolling();
  }catch(e){console.error('refreshOrder failed:',e.message||e);}
}
function onStatusChange(from,o){

}

/* ---------- polling (makes the server check the real inbox) + realtime (pushes the result) ---------- */
function waitingOrders(){return orders.filter(function(o){return o.status==='waiting';}).slice(0,MAX_POLL);}
function startPolling(){stopPolling();if(expired)return;pollTick();}
function stopPolling(){clearTimeout(pollTimer);pollTimer=null;}
async function pollTick(){
  if(expired)return;
  await pollAll();
  if(!waitingOrders().length){pollTimer=null;return;}   // nothing to watch: idle until a new order or a realtime event restarts it
  pollTimer=setTimeout(pollTick,document.hidden?POLL_HIDDEN_MS:POLL_MS);
}
async function pollAll(){
  if(expired||polling)return;
  var list=waitingOrders();
  if(!list.length){failStreak=0;clearBanner('conn');return;}
  polling=true;
  try{
    var results=await Promise.all(list.map(async function(o){
      try{
        var r=await authedPost('poll-mail-inbox',{order_id:o.id});
        if(r.status===401)return 'auth';
        if(!r.ok)return 'fail';
        var d=r.data,cur=byId(o.id);
        if(cur&&d.status&&d.status!==cur.status){
          if(d.otp!=null||d.message!=null){            // show the code the instant the poll returns it...
            var prev=cur.status;cur.status=d.status;if(d.otp!=null)cur.otp=d.otp;if(d.message!=null)cur.message=d.message;
            onStatusChange(prev,cur);renderList();if(selId===cur.id)renderViewer();
          }
          refreshOrder(o.id);                           // ...then confirm against the database
        }
        return 'ok';
      }catch(e){console.error('poll error:',e);return 'fail';}
    }));
    if(results.indexOf('auth')>-1){sessionLost();return;}
    if(results.every(function(x){return x==='fail';})){
      failStreak++;
      if(failStreak>=3)banner('conn','warn',ico('alert','sm')+'<span class="grow">Connection problem. Still trying to reach the inbox\u2026</span>');
    }else{failStreak=0;clearBanner('conn');}
  }finally{polling=false;}
}
function setLive(on){rtLive=on;$('live').classList.toggle('on',on);$('liveTxt').textContent=on?'Live':'Reconnecting';}
function subscribeRealtime(){
  clearTimeout(rtRetry);
  var tok=++rtTok;                                       // callbacks from older channels are ignored
  if(rt){try{sb.removeChannel(rt);}catch(e){}rt=null;}
  rt=sb.channel('random_mail_'+user.id+'_'+tok)
    .on('postgres_changes',{event:'*',schema:'public',table:'mail_orders',filter:'user_id=eq.'+user.id},function(p){
      // only the id is used: the row is re-read with the explicit column list
      var id=(p.new&&p.new.id)||(p.old&&p.old.id);if(id)refreshOrder(id);
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'mail_services'},function(){loadServices(true);})
    .subscribe(function(status){
      if(tok!==rtTok)return;
      if(status==='SUBSCRIBED'){
        setLive(true);
        if(rtEver){loadOrders(true,true);loadServices(true);}   // catch up on anything missed while disconnected
        rtEver=true;
      }else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){
        setLive(false);
        clearTimeout(rtRetry);rtRetry=setTimeout(function(){if(tok===rtTok&&!expired)subscribeRealtime();},3000);
      }
    });
}
function housekeeping(){
  if(expired)return;houseN++;
  if(!rtLive){loadOrders(true,true);}                    // safety net while realtime is down
  if(houseN%2===0)loadServices(true);
  if(tab==='inbox')renderList();else paintRecent();      // keep "5m ago" fresh
  if(!rtLive&&!pollTimer&&waitingOrders().length)startPolling();
}

  var b=$('refreshBtn');if(b.disabled)return;

  b.classList.remove('spinning');b.disabled=false;
}

      '<div class="row-r"><span class="badge '+k+'">'+esc(statusLabel(o.status))+'</span><span class="row-m">'+esc(ago(o.created_at))+'</span></div></button>';
  }).join('')+'</div>'+(hasMore?'<button class="more" type="button" id="moreBtn">Load more</button>':'');

              '<ul class="dd-list" id="ddList" role="listbox" aria-label="Services"></ul>'+
            '</div></div></div>'+
        '<div id="quick"></div>'+

  if(!rows.length){r.innerHTML='';return;}
  r.innerHTML='<div class="rc-h"><span>Recent inboxes</span><button class="link" type="button" id="seeAll">See all</button></div>'+rows.map(function(o){
    return '<button class="rc" type="button" data-o="'+esc(o.id)+'"><span class="av sm">'+ico(svcIcon(o.service_name),'sm')+'</span><span class="rc-b"><span class="rc-t">'+esc(o.email||o.service_name)+'</span><span class="rc-m">'+esc(preview(o))+' \u00b7 '+esc(ago(o.created_at))+'</span></span><span class="badge '+statusKey(o.status)+'">'+esc(statusLabel(o.status))+'</span></button>';
  }).join('');
  r.querySelectorAll('[data-o]').forEach(function(b){b.addEventListener('click',function(){openOrder(b.dataset.o,true);});});
  $('seeAll').addEventListener('click',function(){setTab('inbox');});
}
function bindNew(){
  var btn=$('ddBtn'),q=$('ddQ'),list=$('ddList');
  btn.addEventListener('click',function(){dd.open?closeDD():openDD();});
  btn.addEventListener('keydown',ddKey);
  q.addEventListener('keydown',ddKey);
  q.addEventListener('input',function(){dd.q=q.value;dd.idx=filteredSvc().length?0:-1;paintDD();});
  list.addEventListener('mousedown',function(e){e.preventDefault();});   // keep focus while clicking an option
  list.addEventListener('click',function(e){var li=e.target.closest('[data-id]');if(li)pickService(li.dataset.id);});
  list.addEventListener('mousemove',function(e){var li=e.target.closest('.dd-opt');if(!li)return;var i=Array.prototype.indexOf.call(list.children,li);if(i!==dd.idx){dd.idx=i;[].forEach.call(list.children,function(c,j){c.classList.toggle('act',j===i);});}});
  $('getBtn').addEventListener('click',function(){if(dd.picked)askOrder(dd.picked);});
}
function openDD(){
  dd.open=true;dd.q='';var list=filteredSvc();dd.idx=Math.max(0,list.findIndex(function(s){return s.id===dd.picked;}));
  $('ddQ').value='';$('ddPop').classList.remove('hidden');$('ddBtn').setAttribute('aria-expanded','true');paintDD();
  if(services.length>6)setTimeout(function(){$('ddQ').focus();},0);
}
function closeDD(){
  if(!dd.open)return;dd.open=false;
  var p=$('ddPop'),b=$('ddBtn');if(p)p.classList.add('hidden');if(b){b.setAttribute('aria-expanded','false');b.removeAttribute('aria-activedescendant');if(document.activeElement===$('ddQ'))b.focus();}
}
function ddKey(e){
  var list=filteredSvc(),k=e.key;
  if(!dd.open){if(k==='ArrowDown'||k==='ArrowUp'||k==='Enter'||k===' '){e.preventDefault();openDD();}return;}
  if(k==='ArrowDown'){e.preventDefault();dd.idx=Math.min(list.length-1,dd.idx+1);paintDD();}
  else if(k==='ArrowUp'){e.preventDefault();dd.idx=Math.max(0,dd.idx-1);paintDD();}
  else if(k==='Home'){e.preventDefault();dd.idx=0;paintDD();}
  else if(k==='End'){e.preventDefault();dd.idx=list.length-1;paintDD();}
  else if(k==='Enter'){e.preventDefault();if(list[dd.idx])pickService(list[dd.idx].id);}
  else if(k==='Escape'){e.preventDefault();e.stopPropagation();closeDD();$('ddBtn').focus();}
  else if(k==='Tab'){closeDD();}
}
function pickService(id){
  if(!svcById(id))return;
  dd.picked=id;dd.q='';closeDD();paintNew();
}

/* ---------- viewer ---------- */
function openOrder(id,keepTab){
  selId=id;$('layout').classList.add('view-open');
  if(!keepTab&&tab!=='inbox'){tab='inbox';newBuilt=false;$('tabNew').setAttribute('aria-selected','false');$('tabInbox').setAttribute('aria-selected','true');}
  renderList();renderViewer();window.scrollTo(0,0);
}
function closeViewer(){$('layout').classList.remove('view-open');}
function renderViewer(){
  clearInterval(cdTimer);cdTimer=null;
  var el=$('paneView'),o=sel();
  if(!o){el.innerHTML='<div class="empty" style="padding:56px 14px">'+ico('mail')+'<b>No message selected</b><div>Open an inbox to read its messages. New codes show up here by themselves.</div></div>';return;}
  var k=statusKey(o.status),body='';
  if(o.status==='waiting'){
    body='<div class="wait"><div class="spin"></div><div class="t">Waiting for code<span class="s">Request the code from the app or site now. It will appear here automatically.</span></div><div class="cd" id="cd" aria-label="Time remaining">--:--</div></div>'+
      '<div class="actions"><button class="btn btn-o btn-sm" type="button" id="chkBtn">'+ico('refresh','sm')+'Check now</button><button class="btn btn-d btn-sm" type="button" id="cancelBtn">Cancel &amp; refund</button></div>';
  }else if(o.status==='delivered'){
    body='<div class="msg"><div class="msg-h">'+ico('mail','sm')+'<span>'+esc(o.service_name)+' verification</span><span class="sp"></span><span>'+esc(fmtDT(o.created_at))+'</span></div>'+
      (o.otp?'<div class="otp"><div class="g"><div class="l">Verification code</div><div class="v" id="otpV">'+esc(o.otp)+'</div></div><button class="btn btn-o btn-sm" type="button" id="cpOtp">'+ico('copy','sm')+'Copy</button></div>':'')+
      (o.message?'<div class="msg-b">'+esc(o.message)+'</div>':(o.otp?'':'<div class="msg-b">No message content.</div>'))+'</div>';
  }else{
    var t=o.status==='expired'?'Expired. You have been refunded.':o.status==='cancelled'?'Cancelled. You have been refunded.':'Something went wrong. You have been refunded.';
    body='<div class="note bad">'+ico(o.status==='expired'?'clock':'x','sm')+'<span>'+t+'</span></div>';
  }
  el.innerHTML=
    '<div class="v-head"><button class="sq only-m" id="vBack" type="button" aria-label="Back">'+ico('back')+'</button><h2>'+esc(o.service_name)+'</h2><span class="badge '+k+'">'+esc(statusLabel(o.status))+'</span></div>'+
    '<div class="v-body">'+
      '<div class="addr"><span id="addrV">'+esc(o.email||'')+'</span><button class="btn btn-o btn-sm" type="button" id="cpAddr" '+(o.email?'':'disabled')+'>'+ico('copy','sm')+'Copy</button></div>'+
      '<div class="meta"><span>Created <b>'+esc(fmtDT(o.created_at))+'</b></span>'+(o.status==='waiting'&&o.expires_at?'<span>Expires <b>'+esc(fmtDT(o.expires_at))+'</b></span>':'')+'<span>Price <b>'+esc(naira(o.price))+'</b></span></div>'+
      body+
      '<details class="tips"'+(o.status==='waiting'?' open':'')+'><summary>'+ico('info','sm')+'Before you start</summary><ul>'+
        '<li>After the mail is delivered, request a verification code from the site or app you want to verify and wait for it here. <strong>Keep this page open. Your code appears automatically and can drop fast.</strong></li>'+
        '<li>Use Clone Apps and clone the app you want to use this mail for, so the account you are verifying lasts.</li>'+
        '<li>We are not responsible for bans or restrictions from the app you use. Purchase of this mail is final.</li></ul></details>'+
    '</div>';
  var q=function(id,fn){var b=$(id);if(b)b.addEventListener('click',fn);};
  q('vBack',closeViewer);
  q('cpAddr',function(){copyText(o.email,'Email');});
  q('cpOtp',function(){copyText(o.otp,'Code');});
  q('chkBtn',async function(){var b=$('chkBtn');b.disabled=true;await pollAll();var c=$('chkBtn');if(c)c.disabled=false;});
  q('cancelBtn',function(){askCancel(o.id);});
  if(o.status==='waiting')startCountdown(o);
}
function startCountdown(o){
  var el=$('cd');if(!el)return;
  function tick(){
    var remain=new Date(o.expires_at).getTime()-Date.now();
    if(!(remain>0)){
      el.textContent='00:00';clearInterval(cdTimer);cdTimer=null;
      if(!nudged[o.id]){nudged[o.id]=true;pollAll();}   // ask the server to resolve the expiry (and refund) right now
      return;
    }
    var m=Math.floor(remain/60000),s=Math.floor((remain%60000)/1000);
    el.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }
  tick();cdTimer=setInterval(tick,1000);
}

/* ---------- confirm sheet (one custom sheet for ordering and cancelling; no native dialogs) ---------- */
function openSheet(o){
  $('cName').textContent=o.title;$('cText').textContent=o.text;
  $('cKv').classList.toggle('hidden',!o.price);if(o.price){$('cKvL').textContent=o.priceLabel||'Total';$('cPrice').textContent=o.price;}
  var ok=$('cOk');ok.className='btn '+(o.danger?'btn-dp':'btn-p');ok.disabled=false;ok.textContent=o.okText;
  $('cCancel').disabled=false;$('cCancel').textContent=o.cancelText||'Cancel';
  sheetOk=o.onOk;$('ov').classList.add('show');ok.focus();
}
function closeSheet(){if(sheetBusy)return;$('ov').classList.remove('show');sheetOk=null;}
function askOrder(serviceId){
  var s=svcById(serviceId);if(!s)return;selectedService=s;
  openSheet({title:s.name,text:'A temporary inbox is created instantly and watched automatically for your verification code.',price:naira(s.price),okText:'Order now',onOk:createOrder});
}
function askCancel(id){
  var o=byId(id);if(!o||o.status!=='waiting')return;
  openSheet({title:'Cancel this order?',text:'The order is cancelled and the amount is refunded to your wallet.',price:naira(o.price),priceLabel:'Refund',okText:'Cancel & refund',cancelText:'Keep waiting',danger:true,onOk:function(){cancelAndRefund(id);}});
}
async function createOrder(){
  if(!selectedService||creating)return;
  creating=true;sheetBusy=true;var b=$('cOk');b.disabled=true;$('cCancel').disabled=true;b.textContent='Creating inbox\u2026';
  try{
    var r=await authedPost('create-mail-order',{service_id:selectedService.id});
    if(r.status===401){sessionLost();throw new Error('Your session has expired. Please sign in again.');}
    if(!r.ok){if(r.data.debug)console.error('create-mail-order debug detail:',r.data.debug);throw new Error(r.data.error||'Could not place your order.');}
    if(!r.data.order)throw new Error('The order was created but could not be loaded. Check your history.');
    mergeOrders([r.data.order]);
    sheetBusy=false;$('ov').classList.remove('show');sheetOk=null;
    dd.picked=null;                                      // avoid an accidental second order
    openOrder(r.data.order.id,true);startPolling();
    toast('Inbox ready. Watching for your code');
  }catch(e){
    console.error('createOrder failed:',e);toast(e.message||'Could not place your order.',true);
  }finally{
    creating=false;sheetBusy=false;b.disabled=false;b.textContent='Order now';$('cCancel').disabled=false;
  }
}
// One atomic server-side function: only moves the order out of 'waiting' and only refunds once.
async function cancelAndRefund(id){
  var o=byId(id);
  if(cancelling||!o||o.status!=='waiting')return;
  cancelling=true;sheetBusy=true;var b=$('cOk');b.disabled=true;$('cCancel').disabled=true;b.textContent='Cancelling\u2026';
  try{
    var r=await sb.rpc('cancel_mail_order_and_refund',{p_order_id:id});
    sheetBusy=false;$('ov').classList.remove('show');sheetOk=null;
    if(r.error){toast(r.error.message||'This order can no longer be cancelled.',true);await refreshOrder(id);return;}
    toast('Order cancelled. Refund credited to your wallet');
    await refreshOrder(id);
  }catch(e){
    console.error('cancelAndRefund failed:',e);toast(e.message||'Could not cancel this order right now.',true);
  }finally{cancelling=false;sheetBusy=false;b.disabled=false;b.textContent='Cancel & refund';$('cCancel').disabled=false;}
}
</script>
