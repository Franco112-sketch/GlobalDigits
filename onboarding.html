<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<script src="gd-theme.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<title>Welcome — Global Digits</title>
<link rel="icon" type="image/x-icon" href="favicon.ico"/>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"/>
<link rel="manifest" href="/site.webmanifest"/>
<link rel="preload" href="logo.png" as="image"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap"/>
<script>
/* Onboarding is always the first screen for anyone who is not signed in.
   Signed-in users (cached Supabase session) skip it and go straight to the app.
   After this screen the person picks Log in or Sign up. */
(function(){try{
  try{sessionStorage.setItem('gd_ob_seen','1');}catch(e){}
  var signed=false;
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(/^sb-.*-auth-token$/.test(k)&&localStorage.getItem(k)){signed=true;break;}}}catch(e){}
  var bounced=false;try{bounced=sessionStorage.getItem('gd_auth_bounce')==='1';}catch(e){}
  var preview=new URLSearchParams(location.search).get('preview')==='1';
  if(signed&&!bounced&&!preview)location.replace('index.html');
}catch(e){}})();
</script>
<link rel="stylesheet" href="gd-ui.css"/>
<style>
html,body{height:100%;margin:0}
body{overflow:hidden}
.ob{
  position:relative;isolation:isolate;overflow:hidden;
  min-height:100%;height:100dvh;box-sizing:border-box;
  display:grid;grid-template-rows:1fr auto auto;
  padding:calc(var(--gd-safe-t) + 24px) 28px calc(var(--gd-safe-b) + 28px);
  max-width:520px;margin:0 auto;
}
/* Orbital background: two soft planet rims and two faint orbit paths */
.orb{position:absolute;inset:0;z-index:-1;pointer-events:none}
.orb i{position:absolute;display:block;border-radius:50%}
.orb .rim-a{width:150vw;max-width:780px;aspect-ratio:1;left:-108%;top:-62%;
  box-shadow:inset -2px -2px 0 rgba(var(--gd-tint-rgb),.55),inset -18px -18px 60px -30px rgba(var(--gd-tint-rgb),.22)}
.orb .rim-b{width:150vw;max-width:780px;aspect-ratio:1;right:-96%;bottom:-74%;
  box-shadow:inset 2px 2px 0 rgba(var(--gd-tint-rgb),.5),inset 18px 18px 60px -30px rgba(var(--gd-tint-rgb),.18)}
.orb .path-a{width:210vw;max-width:1100px;aspect-ratio:2.4;left:-60%;top:34%;border:1px solid rgba(var(--gd-tint-rgb),.1);transform:rotate(-24deg)}
.orb .path-b{width:170vw;max-width:900px;aspect-ratio:1.6;left:10%;top:24%;border:1px solid rgba(var(--gd-tint-rgb),.08);transform:rotate(-12deg)}
.orb .glow{width:260px;height:260px;left:50%;top:27%;margin:-130px 0 0 -130px;
  background:radial-gradient(circle,rgba(var(--gd-tint-rgb),.10),transparent 65%)}

html[data-gd-theme] .mark{align-self:center;justify-self:center;width:min(46vw,210px);height:auto;margin-bottom:6vh;
  filter:drop-shadow(0 0 22px rgba(var(--gd-tint-rgb),.28));
  animation:in .9s var(--gd-ease) both}
.copy{animation:in .9s .12s var(--gd-ease) both}
h1{margin:0;font-size:clamp(30px,8.6vw,40px);line-height:1.1;font-weight:700;letter-spacing:-.025em;color:var(--gd-text);max-width:13ch}
.rule{display:block;width:30px;height:3px;border-radius:2px;background:var(--gd-text);margin:22px 0 18px}
.tag{margin:0;font-size:clamp(16px,4.4vw,19px);color:var(--gd-text-2);font-weight:400}
.acts{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:9vh;animation:in .9s .24s var(--gd-ease) both}
.login{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 4px;color:var(--gd-text);font-size:16px;font-weight:600;text-decoration:none}
.signup{display:inline-flex;align-items:center;justify-content:space-between;gap:26px;min-height:50px;min-width:170px;
  padding:0 20px 0 26px;border-radius:999px;background:var(--gd-accent);color:var(--gd-on-accent);
  font-size:16px;font-weight:600;text-decoration:none;transition:transform .15s}
.signup:active{transform:scale(.98)}
.acts svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (max-height:640px){.mark{width:150px;margin-bottom:3vh}.acts{margin-top:5vh}}
</style>
</head>
<body>
<main class="ob">
  <div class="orb" aria-hidden="true"><i class="rim-a"></i><i class="rim-b"></i><i class="path-a"></i><i class="path-b"></i><i class="glow"></i></div>
  <img class="mark" src="logo.png" alt="Global Digits" width="420" height="420" decoding="async"/>
  <div class="copy">
    <h1>Your Trusted Plug for Online Services.</h1>
    <span class="rule" aria-hidden="true"></span>
    <p class="tag">Fast. Secure. Reliable.</p>
  </div>
  <nav class="acts" aria-label="Account">
    <a class="login" href="login.html" data-auth>Log in<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <a class="signup" href="register.html" data-auth>Sign up<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
  </nav>
</main>
<script>
/* Single onboarding screen: once shown, index.html won't redirect here again. */
try{localStorage.setItem('gd_onboarded','1');}catch(e){}
</script>
</body>
</html>
