<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#1a56db"/>
<meta name="robots" content="noindex"/>
<title>Order Details — Global Digits</title>
<link rel="icon" type="image/x-icon" href="favicon.ico"/>
<link rel="manifest" href="site.webmanifest"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --brand:#1a56db;--brand-dk:#1342b0;--brand-lt:#e8f0ff;
  --danger:#ef4444;--warn:#f59e0b;--success:#10b981;
  --bg:#f6f9ff;--surface:#fff;--surface2:#eef5ff;--border:#dbe9fd;
  --text:#0d1321;--text2:#5a6580;--text3:#9aa3b8;
  --bnav-h:60px;--r:10px;--r-sm:7px;--r-lg:18px;
  --shadow:0 2px 12px rgba(15,25,50,.06);
  --shadow-md:0 10px 32px rgba(26,86,219,.22);
  --font:'Plus Jakarta Sans',sans-serif;--font-d:'Syne',sans-serif;--t:.18s ease;
  --grad-premium:linear-gradient(135deg,#2f6feb 0%,#1a56db 100%);
  --ring-lt:#eaf2ff;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);font-size:11px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-weight:600!important}
button{cursor:pointer;font-family:var(--font);border:none;background:none}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
#appShell{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(var(--bnav-h) + 26px)}
#tb{position:sticky;top:0;z-index:20;height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 14px}
#tbBack{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text);transition:var(--t);flex-shrink:0}
#tbBack:hover{background:var(--surface2)}
#tbTitle{font-family:var(--font-d);font-size:15px;font-weight:600;flex:1}
main{padding:14px}
.skel{background:linear-gradient(90deg,var(--surface2) 25%,var(--border) 37%,var(--surface2) 63%);background-size:400% 100%;animation:skel 1.4s ease infinite;border-radius:var(--r-lg)}
@keyframes skel{0%{background-position:100% 50%}100%{background-position:0 50%}}
.errState{text-align:center;padding:60px 20px;color:var(--text2)}
.errState .eIcon{width:60px;height:60px;border-radius:50%;background:#fee2e2;color:var(--danger);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.errState h3{font-size:14px;font-weight:700;color:var(--text)}
.errState a{color:var(--brand);font-weight:700;margin-top:10px;display:inline-block}
/* ══ ORDER DETAIL ══ */
.odWrap{max-width:460px;margin:0 auto}
.odTop{text-align:center;padding:14px 16px 20px}
.odIcon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:var(--shadow)}
.odIcon.blue{background:var(--brand-lt);color:var(--brand)}
.odIcon.purple{background:#f4ecff;color:#8b5cf6}
.odIcon.teal{background:#e6fbf7;color:#0d9488}
.odAmount{font-family:var(--font-d);font-size:26px;font-weight:700;color:var(--text)}
.odTitle{font-size:13.5px;color:var(--text2);margin-top:6px;font-weight:500}
.odBadgeRow{margin-top:12px;display:flex;justify-content:center}
.odBadge{padding:4px 12px;border-radius:100px;font-size:11px;font-weight:700}
.odBadge.completed,.odBadge.delivered,.odBadge.successful,.odBadge.approved{background:#dcfce7;color:#15803d}
.odBadge.pending,.odBadge.processing{background:#fef3c7;color:#92400e}
.odBadge.cancelled,.odBadge.expired,.odBadge.rejected,.odBadge.failed{background:#fee2e2;color:#991b1b}
.odOrderRow{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;font-size:12px;color:var(--text2)}
.odOrderRow b{color:var(--text);font-family:monospace;font-weight:600;letter-spacing:.02em}
.odCopyBtn{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text2);flex-shrink:0}
.odCopyBtn:active{background:var(--surface2)}
/* live delivery block for numbers */
.odTimeline{display:flex;align-items:flex-start;margin:18px 0}
.odTStep{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;width:64px}
.odTDot{width:8px;height:8px;border-radius:50%;background:var(--border);flex-shrink:0}
.odTStep.done .odTDot{background:var(--brand);box-shadow:0 0 0 3px var(--brand-lt)}
.odTLbl{font-size:8px;font-weight:700;color:var(--text3);text-align:center;text-transform:uppercase;letter-spacing:.02em}
.odTStep.done .odTLbl{color:var(--brand)}
.odTLine{flex:1;height:2px;background:var(--border);margin:3px -8px 0}
.odTLine.done{background:var(--brand)}
.odDeliverBox{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.odNumberBox{display:flex;align-items:center;justify-content:space-between;background:var(--brand-lt);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.odNumberVal{font-family:var(--font-d);font-size:16px;font-weight:700;color:var(--brand);letter-spacing:.4px}
.odCodeRow{display:flex;align-items:center;justify-content:space-between;background:#dcfce7;border-radius:var(--r);padding:12px 14px}
.odCodeVal{font-family:var(--font-d);font-size:16px;font-weight:700;color:#15803d;letter-spacing:1.6px}
.odWaitBox{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 10px;color:var(--text2);font-size:11.5px}
.odSpinner{width:26px;height:26px;border:3px solid var(--brand-lt);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.odLiveRow{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)}
.odCountdown{display:flex;align-items:center;gap:5px;font-family:var(--font-d);font-size:13px;font-weight:700;color:var(--brand)}
.odCancelBtn{background:#fef2f2;border:1.5px solid #fecaca;color:var(--danger);font-size:11.5px;font-weight:700;padding:8px 14px;border-radius:var(--r-sm)}
.odCancelBtn:active{transform:scale(.96)}
.odCancelBtn:disabled{opacity:.6}
.odCard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px 18px 14px;margin-bottom:16px}
.odCardHead{font-family:var(--font-d);font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
.odRow{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px dashed var(--border);font-size:13px}
.odRow:last-child{border-bottom:none;padding-bottom:0}
.odRow span:first-child{color:var(--text3);font-weight:500;flex-shrink:0}
.odRow span:last-child{color:var(--text);font-weight:600;text-align:right;word-break:break-word}
.odRow .mono{font-family:monospace;font-size:11.5px;color:var(--text2);font-weight:500}
.odTotalCard{background:var(--grad-premium);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 6px 20px rgba(26,86,219,.22)}
.odTotalCard span:first-child{color:rgba(255,255,255,.85);font-size:12.5px;font-weight:600}
.odTotalCard span:last-child{color:#fff;font-family:var(--font-d);font-size:19px;font-weight:700}
.odFooter{text-align:center;padding-bottom:6px}
.odFooter .odFootThanks{font-size:11.5px;color:var(--text2);font-weight:500}
.odVisitBtn{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:var(--brand-lt);color:var(--brand);font-size:11px;font-weight:700;padding:8px 16px;border-radius:100px}
.odVisitBtn:active{transform:scale(.95)}
#bnav{
  position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  max-width:492px;margin:0 auto;height:60px;background:var(--surface);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-radius:22px;border:1px solid var(--border);
  display:flex;align-items:stretch;
  z-index:200;box-shadow:0 10px 32px rgba(15,25,50,.14);
}
.bnItem{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text3);font-size:10px;font-weight:500;transition:color var(--t);border:none;background:none;cursor:pointer;position:relative}
.bnItem.active,.bnItem:hover{color:var(--brand)}
.bnItem svg{width:20px;height:20px;transition:transform var(--t)}
.bnItem.active svg{transform:translateY(-2px)}
.bnItem.active::after{content:'';position:absolute;top:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--grad-premium)}
.bnavFab{position:absolute;top:-24px;left:50%;transform:translateX(-50%);width:54px;height:54px;border-radius:50%;background:var(--grad-premium);border:3px solid var(--surface);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(26,86,219,.4),0 0 0 4px rgba(26,86,219,.12);cursor:pointer;z-index:5;transition:transform var(--t)}
.bnavFab:active{transform:translateX(-50%) scale(.93)}
</style>
</head>
<body>
<div id="appShell">
  <header id="tb">
    <button id="tbBack" onclick="goBack()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span id="tbTitle">Order Details</span>
  </header>
  <main>
    <div id="body">
      <div class="skel" style="height:220px;margin-bottom:14px"></div>
      <div class="skel" style="height:140px"></div>
    </div>
  </main>
  <nav id="bnav">
    <a class="bnItem" href="index.html?page=dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Home
    </a>
    <a class="bnItem" href="index.html?page=vtu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>VTU
    </a>
    <a class="bnavFab" href="index.html?page=addfunds" aria-label="Add Funds">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </a>
    <a class="bnItem" href="index.html?page=boost">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/></svg>Boost
    </a>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>Orders
    </a>
  </nav>
</div>

<script>
const SUPA_URL='https://pzronmbvusjwrcizxwef.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6cm9ubWJ2dXNqd3JjaXp4d2VmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNTE0MjUsImV4cCI6MjA5NDYyNzQyNX0.v6bz5YeLWKzRN4g09QYTY0x-ur5KGfeXupglKfTVKwA';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
var currentUser=null;

var TYPE_CONFIG={
  numbers:{table:'orders',accent:'blue',label:'Number Order',icon:'<rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="18" x2="8.01" y2="18"/>'},
  sm_accounts:{table:'acc_orders',accent:'purple',label:'SM Account Order',icon:'<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/>'},
  boosting:{table:'boost_orders',accent:'teal',label:'Boost Order',icon:'<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>'}
};
var ORDER_ACTIVATION_WINDOW_MS=20*60*1000;
var NUM_TERMINAL_STATUSES=['completed','cancelled','expired','delivered'];

var currentType=null,orderId=null,rt=null,timerInterval=null,actionInFlight=false;

function cap(s){return s?String(s).charAt(0).toUpperCase()+String(s).slice(1):s;}
function fmtDate(d){try{return new Date(d).toLocaleDateString('en-NG',{day:'numeric',month:'short',year:'numeric'});}catch(e){return d||'';}}
function fmtTime(d){try{return new Date(d).toLocaleTimeString('en-NG',{hour:'2-digit',minute:'2-digit'});}catch(e){return'';}}
function escapeHtml(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function copyText(t){try{navigator.clipboard.writeText(t);}catch(e){}}

function goBack(){
  if(window.history.length>1&&document.referrer.indexOf(window.location.origin)===0){
    window.history.back();
  }else if(currentType){
    window.location.href='order-history.html?type='+encodeURIComponent(currentType);
  }else{
    window.location.href='index.html?page=myorders';
  }
}

(async function init(){
  try{
    var res=await sb.auth.getSession();
    var session=res.data&&res.data.session;
    if(!session||!session.user){window.location.href='index.html';return;}
    currentUser={id:session.user.id};

    var qp=new URLSearchParams(window.location.search);
    orderId=qp.get('id');
    currentType=qp.get('type');
    if(!orderId||!currentType||!TYPE_CONFIG[currentType]){
      showFatal();return;
    }
    await loadOrder();
    subscribeRealtime();
  }catch(e){
    console.error('init error:',e);
    showFatal();
  }
})();

function showFatal(){
  document.getElementById('tbTitle').textContent='Order Not Found';
  document.getElementById('body').innerHTML=
    '<div class="errState"><div class="eIcon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>'+
    '<h3>We couldn\'t find this order</h3><p>It may have been removed, or the link is invalid.</p>'+
    '<a href="index.html?page=myorders">Back to My Orders</a></div>';
}

async function loadOrder(){
  var cfg=TYPE_CONFIG[currentType];
  try{
    var r=await sb.from(cfg.table).select('*').eq('id',orderId).eq('user_id',currentUser.id).single();
    if(r.error||!r.data){showFatal();return;}
    render(r.data);
  }catch(e){
    console.error('loadOrder error:',e);
    showFatal();
  }
}
function subscribeRealtime(){
  var cfg=TYPE_CONFIG[currentType];
  if(rt)sb.removeChannel(rt);
  rt=sb.channel('vo_'+cfg.table+'_'+orderId).on('postgres_changes',
    {event:'UPDATE',schema:'public',table:cfg.table,filter:'id=eq.'+orderId},
    function(){loadOrder();}
  ).subscribe();
}

function effectiveStatus(row){
  var s=row.status||'pending';
  if(currentType==='numbers'&&s==='pending'&&row.otp)s='delivered';
  return s;
}

function render(row){
  var cfg=TYPE_CONFIG[currentType];
  document.getElementById('tbTitle').textContent=cfg.label;
  var status=effectiveStatus(row);
  var amount=currentType==='boosting'?(row.amount||0):(row.price||0);
  var title=currentType==='numbers'?(row.tier_name||row.country||row.service||'Virtual Number')
    :currentType==='sm_accounts'?((row.platform||'')+(row.type?' — '+row.type:'')||'SM Account')
    :((row.platform||'')+' '+(row.boost_type||'Boost'));
  var refId=row.id?row.id.toString():'';
  var refShort=refId?refId.substring(0,18):'';

  var html='<div class="odWrap">';
  html+='<div class="odTop">'+
    '<div class="odIcon '+cfg.accent+'"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+cfg.icon+'</svg></div>'+
    '<div class="odAmount">\u20a6'+Number(amount).toLocaleString()+'</div>'+
    '<div class="odTitle">'+escapeHtml(title)+'</div>'+
    '<div class="odBadgeRow"><span class="odBadge '+status+'">'+cap(status)+'</span></div>';
  if(refId){
    html+='<div class="odOrderRow">Order ID: <b>'+refShort+'</b>'+
      '<button class="odCopyBtn" onclick="copyText(\''+refId+'\')" aria-label="Copy order ID">'+
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>'+
      '</button></div>';
  }
  html+='</div>';

  if(currentType==='numbers')html+=renderNumberDeliveryBlock(row,status);

  // ── Order Details ──
  html+='<div class="odCard"><div class="odCardHead">Order Details</div>';
  html+='<div class="odRow"><span>Status</span><span><span class="odBadge '+status+'">'+cap(status)+'</span></span></div>';
  html+='<div class="odRow"><span>Amount</span><span>\u20a6'+Number(amount).toLocaleString()+'</span></div>';
  html+='<div class="odRow"><span>Date</span><span>'+fmtDate(row.created_at)+'</span></div>';
  html+='<div class="odRow"><span>Time</span><span>'+fmtTime(row.created_at)+'</span></div>';
  if(refShort)html+='<div class="odRow"><span>Order ID</span><span class="mono">'+refShort+'</span></div>';
  html+='</div>';

  // ── Type-specific details — only fields that actually exist on this
  //    real row are ever rendered. ──
  html+=renderTypeSpecificCard(row,status);

  html+='<div class="odTotalCard"><span>Total Paid</span><span>\u20a6'+Number(amount).toLocaleString()+'</span></div>';

  html+='<div class="odFooter"><div class="odFootThanks">Thank you for choosing Global-Digits</div>'+
    '<a class="odVisitBtn" href="https://globaldigits.shop" target="_blank" rel="noopener">'+
    '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>'+
    'Visit Global-Digits</a></div>';
  html+='</div>';

  document.getElementById('body').innerHTML=html;

  if(currentType==='numbers')wireNumberLiveState(row,status);
}

function fieldRow(row,keys,label,isMono){
  for(var i=0;i<keys.length;i++){
    var v=row[keys[i]];
    if(v!==undefined&&v!==null&&v!==''){
      return '<div class="odRow"><span>'+label+'</span><span'+(isMono?' class="mono"':'')+'>'+escapeHtml(v)+'</span></div>';
    }
  }
  return '';
}
function renderTypeSpecificCard(row,status){
  var rows='';
  if(currentType==='numbers'){
    rows+=fieldRow(row,['country'],'Country/Service');
    rows+=fieldRow(row,['service'],'Service');
    rows+=fieldRow(row,['tier_name'],'Tier');
    rows+=fieldRow(row,['number'],'Number Purchased',true);
    rows+=fieldRow(row,['otp'],'Verification Code',true);
    rows+=fieldRow(row,['delivery_method'],'Delivery Method');
  }else if(currentType==='sm_accounts'){
    rows+=fieldRow(row,['platform'],'Platform');
    rows+=fieldRow(row,['type'],'Account Type');
    rows+=fieldRow(row,['account_details'],'Account Details');
  }else{
    rows+=fieldRow(row,['target_url'],'Target Link',true);
    rows+=fieldRow(row,['platform'],'Platform');
    rows+=fieldRow(row,['boost_type'],'Service Type');
    rows+=fieldRow(row,['quantity'],'Quantity');
    rows+=fieldRow(row,['refill_type'],'Refill');
  }
  if(!rows)return'';
  var head=currentType==='numbers'?'Number Details':currentType==='sm_accounts'?'Account Details':'Boost Details';
  return '<div class="odCard"><div class="odCardHead">'+head+'</div>'+rows+'</div>';
}

// ── Live delivery block for number orders — the WhatsApp/other-platform
//    number, the incoming verification code, a 20-minute countdown while
//    still active, and a real Cancel-with-refund action. All state here
//    reflects the real row; nothing is simulated. ──
function renderNumberDeliveryBlock(row,status){
  var isTerminal=NUM_TERMINAL_STATUSES.indexOf(status)!==-1;
  var createdMs=row.created_at?new Date(row.created_at).getTime():Date.now();
  var deadline=createdMs+ORDER_ACTIVATION_WINDOW_MS;
  var isLive=!isTerminal&&Date.now()<deadline;
  var numEsc=(row.number||'').replace(/'/g,"\\'");
  var otpEsc=(row.otp||'').replace(/'/g,"\\'");

  var step2Done=!!row.number,step3Done=!!row.otp||status==='completed'||status==='delivered';
  var showTimeline=status!=='cancelled'&&status!=='expired';

  var html='<div class="odDeliverBox">';
  if(showTimeline){
    html+='<div class="odTimeline">'+
      '<div class="odTStep done"><span class="odTDot"></span><span class="odTLbl">Created</span></div>'+
      '<div class="odTLine'+(step2Done?' done':'')+'"></div>'+
      '<div class="odTStep'+(step2Done?' done':'')+'"><span class="odTDot"></span><span class="odTLbl">Number Assigned</span></div>'+
      '<div class="odTLine'+(step3Done?' done':'')+'"></div>'+
      '<div class="odTStep'+(step3Done?' done':'')+'"><span class="odTDot"></span><span class="odTLbl">Code Received</span></div>'+
    '</div>';
  }
  if(row.number){
    html+='<div class="odNumberBox"><span class="odNumberVal">'+escapeHtml(row.number)+'</span>'+
      '<button class="odCopyBtn" onclick="copyText(\''+numEsc+'\')" aria-label="Copy number"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></button></div>';
  }else if(!isTerminal){
    html+='<div class="odWaitBox"><div class="odSpinner"></div><span>'+(row.delivery_method==='tiger_auto'?'Requesting your number automatically…':'Assigning your number…')+'</span></div>';
  }
  if(row.otp){
    html+='<div class="odCodeRow" style="margin-top:10px"><span class="odCodeVal">'+escapeHtml(row.otp)+'</span>'+
      '<button class="odCopyBtn" onclick="copyText(\''+otpEsc+'\')" aria-label="Copy code"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></button></div>';
  }else if(row.number&&!isTerminal){
    html+='<div class="odWaitBox" style="padding-top:10px"><div class="odSpinner"></div><span>Waiting for your verification code…</span></div>';
  }
  if(isLive){
    html+='<div class="odLiveRow"><div class="odCountdown"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>'+
      '<span id="liveTimerVal" data-deadline="'+deadline+'">20:00</span></div>'+
      '<button class="odCancelBtn" id="cancelBtn" onclick="cancelThisOrder()">Cancel Activation</button></div>';
  }
  html+='</div>';
  return html;
}
function wireNumberLiveState(row,status){
  clearInterval(timerInterval);
  var el=document.getElementById('liveTimerVal');
  if(!el)return;
  timerInterval=setInterval(function(){
    var deadline=parseInt(el.dataset.deadline,10);
    var remain=deadline-Date.now();
    if(remain<=0){
      el.textContent='00:00';
      clearInterval(timerInterval);
      expireThisOrder(row);
      return;
    }
    var m=Math.floor(remain/60000),s=Math.floor((remain%60000)/1000);
    el.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  },1000);
}
async function refundToWallet(amount,reason){
  try{
    await sb.rpc('credit_wallet_refund',{
      p_user_id:currentUser.id,p_amount:amount,p_category:'refund',
      p_title:'Auto Refund: '+reason,p_client_ref:'order_'+orderId
    });
  }catch(e){console.error('refund failed:',e);}
}
async function cancelThisOrder(){
  if(actionInFlight)return;
  var btn=document.getElementById('cancelBtn');
  actionInFlight=true;
  if(btn){btn.disabled=true;btn.textContent='Cancelling…';}
  try{
    var r=await sb.from('orders').select('status,otp,price,tier_name,country').eq('id',orderId).single();
    if(r.error||!r.data){actionInFlight=false;if(btn){btn.disabled=false;btn.textContent='Cancel Activation';}return;}
    var o=r.data;
    if(NUM_TERMINAL_STATUSES.indexOf(o.status)!==-1||o.otp){await loadOrder();actionInFlight=false;return;}
    await sb.from('orders').update({status:'cancelled'}).eq('id',orderId);
    await refundToWallet(o.price||0,'Activation cancelled by user — '+(o.tier_name||o.country||'order'));
    await loadOrder();
  }catch(e){
    console.error('cancel failed:',e);
    if(btn){btn.disabled=false;btn.textContent='Cancel Activation';}
  }finally{
    actionInFlight=false;
  }
}
async function expireThisOrder(row){
  if(actionInFlight)return;
  actionInFlight=true;
  try{
    var r=await sb.from('orders').select('status,otp,price,tier_name,country').eq('id',orderId).single();
    if(r.error||!r.data||NUM_TERMINAL_STATUSES.indexOf(r.data.status)!==-1||r.data.otp){actionInFlight=false;return;}
    await sb.from('orders').update({status:'expired'}).eq('id',orderId);
    await refundToWallet(r.data.price||0,'Number activation expired — '+(r.data.tier_name||r.data.country||'order'));
    await loadOrder();
  }catch(e){
    console.error('expire failed:',e);
  }finally{
    actionInFlight=false;
  }
}
</script>
