<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Global Digits Pet — Voice</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* Same brand tokens as the main site (index.html's :root) — kept in sync
   manually since this is intentionally a separate, standalone file (see
   spec item 4). Nothing here redesigns the palette, it just reuses it. */
:root{
  --brand:#1a56db;--brand-dk:#1342b0;--brand-lt:#e8f0ff;
  --danger:#ef4444;--warn:#f59e0b;--success:#10b981;
  --bg:#f6f9ff;--surface:#fff;--surface2:#eef5ff;--border:#dbe9fd;
  --text:#0d1321;--text2:#5a6580;--text3:#9aa3b8;
  --font:'Plus Jakarta Sans',sans-serif;--font-d:'Syne',sans-serif;
  --t:.18s ease;--grad-premium:linear-gradient(135deg,#2f6feb 0%,#1a56db 100%);
  --r:10px;--r-lg:18px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;min-height:100vh;
  min-height:100dvh;overflow:hidden;
}
.plHead{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0) + 14px) 18px 10px;
  flex-shrink:0;
}
.plCloseBtn{
  width:32px;height:32px;border-radius:50%;background:var(--surface2);
  border:none;display:flex;align-items:center;justify-content:center;
  color:var(--text2);cursor:pointer;
}
.plTitle{font-family:var(--font-d);font-size:13px;font-weight:800;color:var(--text);}
.plLiveBadge{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:var(--text3);}
.plLiveDot{width:7px;height:7px;border-radius:50%;background:var(--text3);}
.plLiveBadge.on .plLiveDot{background:var(--danger);animation:plDotPulse 1.2s ease-in-out infinite;}
.plLiveBadge.on{color:var(--danger);}
@keyframes plDotPulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ── REPOSITIONED / UPGRADED: the old layout showed one static
   "transcript" box and one static "reply" box that just got overwritten
   each turn — there was no sense of an ongoing conversation. This is now
   a real scrolling log (like the chat sheet on the main site) with a
   small live-caption strip pinned above the mic for the in-progress
   utterance, and the mic + typed fallback anchored at the bottom so
   they're always reachable regardless of how long the conversation
   gets. ── */
.plBody{
  flex:1;min-height:0;display:flex;flex-direction:column;
  padding:6px 16px 0;overflow:hidden;
}
.plPetRow{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0 10px;flex-shrink:0;}
.plPetWrap{position:relative;width:64px;height:64px;display:flex;align-items:center;justify-content:center;}
.plPetRing{
  position:absolute;inset:0;border-radius:50%;background:var(--brand-lt);
  transform:scale(1);opacity:.6;
}
.plPetWrap.listening .plPetRing{animation:plRingPulse 1.6s ease-out infinite;}
@keyframes plRingPulse{0%{transform:scale(.9);opacity:.55}100%{transform:scale(1.5);opacity:0}}
.plPetAvatar{
  position:relative;width:52px;height:52px;border-radius:50%;
  background:var(--grad-premium);display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 20px rgba(26,86,219,.3);
}
.plPetAvatar svg{width:30px;height:30px;}
.plPetWrap.listening .plPetAvatar{animation:plBob 1.1s ease-in-out infinite;}
@keyframes plBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.plStateText{font-size:12.5px;font-weight:700;color:var(--text);text-align:center;}
.plSubText{font-size:11px;color:var(--text3);max-width:280px;text-align:center;}

.plLog{
  flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;
  padding:4px 2px 10px;
}
.plLog:empty::before{
  content:'Tap the mic and tell me what you need — e.g. "Buy me a TikTok account" or "Boost my Instagram"';
  color:var(--text3);font-size:12px;text-align:center;display:block;margin:auto;max-width:260px;
}
.plMsg{max-width:82%;padding:9px 13px;font-size:12.5px;line-height:1.35;border-radius:var(--r-lg);}
.plMsg.user{align-self:flex-end;background:var(--grad-premium);color:#fff;border-radius:var(--r-lg) var(--r-lg) 4px var(--r-lg);}
.plMsg.pet{align-self:flex-start;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:var(--r-lg) var(--r-lg) var(--r-lg) 4px;box-shadow:0 2px 10px rgba(15,25,50,.04);}
.plMsg.pet .plChipRow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.plMsg.pet .plChip{background:var(--surface2);border:1px solid var(--border);border-radius:16px;padding:5px 11px;font-size:11px;font-weight:600;color:var(--text1,var(--text));cursor:pointer;}
.plMsg.pet .plChip:active{background:var(--brand-lt);color:var(--brand);}

.plLive{
  flex-shrink:0;font-size:12px;color:var(--text2);font-style:italic;
  padding:2px 4px 6px;min-height:16px;
}
.plLive:empty{display:none;}

.plWave{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:22px;flex-shrink:0;margin-bottom:4px;}
.plWave.hidden{display:none;}
.plWave span{width:3px;border-radius:2px;background:var(--brand);height:4px;transition:height .08s ease;}

.plControls{flex-shrink:0;padding:8px 16px calc(env(safe-area-inset-bottom,0) + 14px);display:flex;flex-direction:column;align-items:center;gap:10px;}
.plMicBtn{
  width:64px;height:64px;border-radius:50%;border:none;
  background:var(--grad-premium);color:#fff;display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 10px 24px rgba(26,86,219,.35);
  transition:transform .12s ease;
}
.plMicBtn:active{transform:scale(.94);}
.plMicBtn.rec{background:var(--danger);}
.plMicBtn svg{width:26px;height:26px;}
.plTypeLink{font-size:11px;color:var(--text3);text-decoration:underline;cursor:pointer;background:none;border:none;}
.plFallback{display:flex;gap:7px;width:100%;max-width:340px;}
.plFallback input{
  flex:1;border:1px solid var(--border);border-radius:24px;padding:10px 15px;
  font-size:12.5px;outline:none;background:var(--surface);
}
.plFallback button{
  background:var(--grad-premium);color:#fff;border:none;border-radius:24px;
  padding:0 16px;font-size:12.5px;font-weight:700;cursor:pointer;
}
.plErrorBox{
  background:#fff4f4;border:1px solid #fbd5d5;color:var(--danger);
  border-radius:var(--r);padding:10px 13px;font-size:11.5px;max-width:320px;width:100%;
}
.plFoot{padding:4px 24px calc(env(safe-area-inset-bottom,0) + 10px);text-align:center;flex-shrink:0;}
.plFoot a{color:var(--text3);font-size:11px;text-decoration:underline;cursor:pointer;}
.hidden{display:none!important;}
</style>
</head>
<body>
  <div class="plHead">
    <button class="plCloseBtn" onclick="goBack()" aria-label="Close">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="plTitle" id="plTitle">Global Digits Pet</div>
    <div class="plLiveBadge" id="plLiveBadge"><span class="plLiveDot"></span><span id="plLiveBadgeText">Idle</span></div>
  </div>

  <div class="plBody">
    <div class="plPetRow">
      <div class="plPetWrap" id="plPetWrap">
        <div class="plPetRing"></div>
        <div class="plPetAvatar">
          <svg viewBox="0 0 48 48" fill="none"><ellipse cx="24" cy="27" rx="14" ry="12" fill="#fff"/><circle cx="24" cy="13" r="4.2" fill="#fff"/><circle cx="19" cy="26" r="2.2" fill="var(--brand)"/><circle cx="29" cy="26" r="2.2" fill="var(--brand)"/><path d="M20 31q4 3 8 0" stroke="var(--brand)" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
        </div>
      </div>
      <div class="plStateText" id="plStateText">Tap the mic and tell me what you need</div>
      <div class="plSubText" id="plSubText">I'll keep listening while we talk — no need to tap again between replies.</div>
    </div>

    <div class="plLog" id="plLog"></div>
    <div class="plLive" id="plLive"></div>
    <div class="plWave hidden" id="plWave"></div>
    <div class="plErrorBox hidden" id="plErrorBox"></div>
  </div>

  <div class="plControls">
    <button class="plMicBtn" id="plMicBtn" onclick="toggleListening()" aria-label="Tap to talk">
      <svg id="plMicIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
    <button class="plTypeLink" id="plTypeLink" onclick="showFallback()">Prefer to type instead?</button>
    <div class="plFallback hidden" id="plFallback">
      <input type="text" id="plFallbackInput" placeholder="Type what you'd like…" onkeydown="if(event.key==='Enter')submitFallbackText();"/>
      <button onclick="submitFallbackText()">Send</button>
    </div>
  </div>

  <div class="plFoot">
    <a onclick="goBack()">Back to Global Digits</a>
  </div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   GLOBAL DIGITS PET — VOICE LISTENER (standalone page, spec item 4)

   What changed in this rewrite, and why:

   1) THE HANDOFF WAS BROKEN. This page used to stash a one-shot parsed
      intent into sessionStorage under 'gd_pet_pending_intent' as
      {intent, query/amount, raw}, then redirect to index.html. But
      index.html only ever reads a key called 'gd_pet_ready_action',
      shaped {tool, input}. Those never matched — so every single voice
      request landed back on index.html and did precisely nothing. That
      is the "user speaks, it just stops" bug. Fixed by writing the exact
      key + shape index.html's initPetFab() actually reads (see the
      handoff() function below).

   2) NOT REALTIME. recognition.continuous was false, so the browser
      closed the mic after the first pause in speech, and onend() always
      tore everything down — one utterance, then dead. Fixed: continuous
      recognition that keeps listening across pauses, and onend/onerror
      now auto-resume the session instead of ending it, so the mic stays
      live for the whole back-and-forth until the user actually taps
      stop (or a request is fully handed off to the app).

   3) NO FOLLOW-UP. The old parser was single-shot: either it matched a
      complete intent from one sentence, or it said "I didn't quite
      catch that" and gave up. This page now keeps its own small
      conversation state (mirroring index.html's petConvo: a slotFill
      for one question at a time, and the same optional AI reasoning
      call) so things like "add funds" → "how much?" → "500" →
      "naira or dollar?" → "naira" happen as one continuous spoken
      conversation, with the mic never needing to be re-tapped between
      turns. Only once a request is fully understood does this page ever
      talk to index.html — and even then it only ever hands over an
      instruction; it still never executes a purchase itself (that still
      only happens in index.html, after the user confirms there, exactly
      as before).
   ══════════════════════════════════════════════════════════════════════ */
const SUPA_URL='https://pzronmbvusjwrcizxwef.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6cm9ubWJ2dXNqd3JjaXp4d2VmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNTE0MjUsImV4cCI6MjA5NDYyNzQyNX0.v6bz5YeLWKzRN4g09QYTY0x-ur5KGfeXupglKfTVKwA';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
// Same optional AI reasoning endpoint index.html calls — kept in sync on
// purpose so a voice conversation gets the same quality of follow-up
// understanding as a typed one, with an identical graceful fallback to
// the local pattern-matcher below when it's unavailable.
const PET_INTENT_URL='https://pzronmbvusjwrcizxwef.supabase.co/functions/v1/pet-intent';

var recognition=null;
var mediaStream=null;
var audioCtx=null,analyser=null,waveRaf=null;
var listening=false;      // true while the user wants the session live
var speaking=false;       // true while petSpeak() is talking — pauses processing so the pet doesn't hear itself
var finalBuffer='';
var currentUser=null;

/* petConvo mirrors index.html's conversation state on purpose — same
   idea, kept local to this page so the "which wallet / how much"
   back-and-forth can happen here, voice-first, before ever handing off
   to index.html. */
var petConvo={history:[],slotFill:null,missCount:0};
var PET_BOOST_PLATFORMS=['Instagram','TikTok','Facebook','YouTube','Twitter'];

/* ── Auth guard — same session check pattern as index.html. This page
   never does anything with the account beyond reading who's signed in
   (needed only so the handed-off intent lands for the right user back on
   index.html); no purchase/wallet action ever happens here. ── */
async function guardAuth(){
  try{
    var res=await sb.auth.getUser();
    if(!res.data||!res.data.user){
      window.location.href='login.html';
      return false;
    }
    currentUser=res.data.user;
    var petName=localStorage.getItem('gd_pet_name');
    var titleEl=document.getElementById('plTitle');
    if(titleEl&&petName)titleEl.textContent=petName;
    // Continue a conversation already started in the chat sheet, if any
    // (see index.html's openPetListener()) — read once, then clear so a
    // later visit doesn't replay stale context.
    try{
      var ctx=sessionStorage.getItem('gd_pet_ctx_history');
      if(ctx){
        sessionStorage.removeItem('gd_pet_ctx_history');
        var hist=JSON.parse(ctx);
        if(Array.isArray(hist)&&hist.length)petConvo.history=hist;
      }
    }catch(e){}
    return true;
  }catch(e){
    console.error('pet-listener auth check failed:',e);
    window.location.href='login.html';
    return false;
  }
}

function goBack(){
  stopEverything();
  window.location.href='index.html';
}
// Stop leaves nothing running behind — called on close, on page
// hide/unload. Does NOT get called between conversation turns anymore;
// that's the whole point of continuous mode (see startSpeechRecognition).
function stopEverything(){
  listening=false;
  try{if(recognition){recognition.onresult=null;recognition.onend=null;recognition.onerror=null;recognition.stop();}}catch(e){}
  try{if(mediaStream){mediaStream.getTracks().forEach(function(t){t.stop();});}}catch(e){}
  try{if(audioCtx){audioCtx.close();}}catch(e){}
  if(waveRaf){cancelAnimationFrame(waveRaf);waveRaf=null;}
  try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch(e){}
  mediaStream=null;audioCtx=null;analyser=null;speaking=false;
  setMicState('idle');
}
document.addEventListener('visibilitychange',function(){if(document.hidden)stopEverything();});
window.addEventListener('pagehide',stopEverything);
window.addEventListener('beforeunload',stopEverything);

function setMicState(state){
  var wrap=document.getElementById('plPetWrap');
  var micBtn=document.getElementById('plMicBtn');
  var stateText=document.getElementById('plStateText');
  var subText=document.getElementById('plSubText');
  var wave=document.getElementById('plWave');
  var badge=document.getElementById('plLiveBadge');
  var badgeText=document.getElementById('plLiveBadgeText');
  if(state==='listening'){
    wrap.classList.add('listening');
    micBtn.classList.add('rec');
    stateText.textContent="I'm listening…";
    subText.textContent='Just keep talking — tap the mic again when you\'re done.';
    wave.classList.remove('hidden');
    badge.classList.add('on');badgeText.textContent='Live';
  }else{
    wrap.classList.remove('listening');
    micBtn.classList.remove('rec');
    wave.classList.add('hidden');
    badge.classList.remove('on');badgeText.textContent='Idle';
    if(state==='idle'){
      stateText.textContent='Tap the mic and tell me what you need';
      subText.textContent="I'll keep listening while we talk — no need to tap again between replies.";
    }
  }
}

function showError(msg){
  var box=document.getElementById('plErrorBox');
  box.textContent=msg;
  box.classList.remove('hidden');
}
function hideError(){document.getElementById('plErrorBox').classList.add('hidden');}

async function toggleListening(){
  if(listening){stopEverything();return;}
  hideError();
  document.getElementById('plLive').textContent='';
  finalBuffer='';

  if(!window.isSecureContext){
    showError('Voice needs a secure (HTTPS) connection. Please open Global Digits over HTTPS to use the microphone.');
    return;
  }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    showError('This browser doesn\'t support microphone access. You can still type your request below.');
    showFallback();
    return;
  }

  try{
    mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(e){
    console.error('getUserMedia failed:',e);
    if(e && e.name==='NotAllowedError'){
      showError('Microphone access was denied. You can allow it in your browser settings, or just type your request below.');
    }else{
      showError('Couldn\'t access your microphone. You can still type your request below.');
    }
    showFallback();
    return;
  }

  listening=true;
  setMicState('listening');
  startWaveform(mediaStream);
  startSpeechRecognition();
}

/* ── Live waveform — purely visual, reacts to real mic input via Web
   Audio's AnalyserNode. No audio is recorded, stored, or sent anywhere;
   this just reads instantaneous volume levels to animate bars. ── */
function startWaveform(stream){
  var wave=document.getElementById('plWave');
  var barCount=20;
  wave.innerHTML='';
  for(var i=0;i<barCount;i++){var b=document.createElement('span');wave.appendChild(b);}
  var bars=wave.querySelectorAll('span');

  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    audioCtx=new AC();
    var source=audioCtx.createMediaStreamSource(stream);
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=64;
    source.connect(analyser);
    var data=new Uint8Array(analyser.frequencyBinCount);
    (function draw(){
      if(!listening){return;}
      analyser.getByteFrequencyData(data);
      for(var i=0;i<bars.length;i++){
        var v=data[i%data.length]/255;
        bars[i].style.height=(4+v*24)+'px';
      }
      waveRaf=requestAnimationFrame(draw);
    })();
  }catch(e){
    console.error('waveform init failed (non-fatal):',e);
    // Waveform is cosmetic only — recognition still works without it.
  }
}

/* ── Speech-to-text via the Web Speech API, now REALTIME/continuous.
   continuous:true keeps the recognizer running across natural pauses in
   speech instead of closing after the first one — this is the core fix
   for "if user speaks it just stops". onresult fires for every finalized
   phrase while the session stays open, so multi-turn conversation is
   possible without re-tapping the mic between replies. onend/onerror no
   longer tear the session down; as long as the user hasn't tapped stop
   (listening===true), they auto-restart so a network hiccup or a long
   pause never silently kills the mic. ── */
function startSpeechRecognition(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
    showError('Speech-to-text isn\'t supported in this browser — please type your request instead.');
    showFallback();
    listening=false;setMicState('idle');
    return;
  }
  recognition=new SR();
  recognition.lang='en-US';
  recognition.interimResults=true;
  recognition.continuous=true;
  recognition.maxAlternatives=1;

  var liveEl=document.getElementById('plLive');

  recognition.onresult=function(ev){
    if(speaking)return; // ignore anything picked up while the pet itself is talking
    var interim='',finished='';
    for(var i=ev.resultIndex;i<ev.results.length;i++){
      var t=ev.results[i][0].transcript;
      if(ev.results[i].isFinal)finished+=t;else interim+=t;
    }
    liveEl.textContent=interim||'';
    if(finished.trim()){
      var text=finished.trim();
      liveEl.textContent='';
      processUtterance(text); // async — keeps listening while it runs
    }
  };
  recognition.onerror=function(ev){
    console.error('SpeechRecognition error:',ev.error);
    if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){
      listening=false;
      showError('Microphone permission was blocked. You can type your request below instead.');
      showFallback();
      setMicState('idle');
      return;
    }
    // 'no-speech', 'aborted', network blips, etc. — not fatal. Leave
    // `listening` as-is; onend (below) decides whether to auto-restart.
  };
  recognition.onend=function(){
    if(listening&&!speaking){
      // Session is still supposed to be live — the browser just closed
      // this recognizer instance on its own (happens on some
      // browsers/devices even with continuous:true after a long pause
      // or a transient error). Restart it immediately so the mic stays
      // "real-time" from the user's point of view instead of going
      // dead. This is the exact behavior that used to be missing.
      try{recognition.start();}catch(e){
        // start() throws if called while already running/starting —
        // safe to ignore, it just means it's already back up.
      }
    }else if(listening&&speaking){
      // Paused deliberately while the pet talks — petSpeak()'s onend
      // handler restarts recognition once it's done.
    }else{
      setMicState('idle');
    }
  };
  try{
    recognition.start();
  }catch(e){
    console.error('recognition.start failed:',e);
    showError('Couldn\'t start voice recognition — please type your request below.');
    showFallback();
    listening=false;setMicState('idle');
  }
}

function showFallback(){
  document.getElementById('plFallback').classList.remove('hidden');
  document.getElementById('plTypeLink').classList.add('hidden');
  setTimeout(function(){var i=document.getElementById('plFallbackInput');if(i)i.focus();},100);
}
function submitFallbackText(){
  var input=document.getElementById('plFallbackInput');
  var text=(input.value||'').trim();
  if(!text)return;
  input.value='';
  processUtterance(text);
}

/* ══════════════════ CONVERSATION LOG (visual) ══════════════════ */
function logMsg(role,text,chips){
  var log=document.getElementById('plLog');
  var b=document.createElement('div');
  b.className='plMsg '+(role==='user'?'user':'pet');
  b.textContent=text;
  if(chips&&chips.length){
    var row=document.createElement('div');
    row.className='plChipRow';
    chips.forEach(function(c){
      var chip=document.createElement('span');
      chip.className='plChip';
      chip.textContent=c.label;
      chip.onclick=c.onClick;
      row.appendChild(chip);
    });
    b.appendChild(row);
  }
  log.appendChild(b);
  log.scrollTop=log.scrollHeight;
}
/* Speaks the pet's line, shows it in the log, and — this is what makes
   the back-and-forth feel realtime — pauses speech recognition while
   the pet is talking (so it doesn't transcribe its own voice) and
   resumes listening the instant it's done, with no tap required. */
function petSay(text,chips){
  logMsg('pet',text,chips);
  petConvo.history.push({role:'assistant',content:text});
  if(!('speechSynthesis' in window)){
    return;
  }
  try{
    speaking=true;
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text.replace(/[🐾👋]/g,''));
    u.rate=1.04;u.pitch=1.05;
    u.onend=u.onerror=function(){
      speaking=false;
      if(listening&&recognition){
        try{recognition.start();}catch(e){/* already running — fine */}
      }
    };
    window.speechSynthesis.speak(u);
  }catch(e){
    speaking=false;
  }
}

/* ══════════════════ CONVERSATION ENGINE ══════════════════
   Mirrors index.html's handlePetTurn as closely as it can while staying
   a standalone page: local pattern parser first for the fast/common
   cases, an optional AI reasoning call for anything less literal, and a
   one-question-at-a-time slotFill loop for multi-turn asks (add funds,
   boost). It NEVER decides a price or touches the wallet — the only
   thing it ever produces is a {tool, input} instruction, handed to
   index.html to confirm and actually execute, exactly as before. ── */
async function processUtterance(text){
  logMsg('user',text);
  petConvo.history.push({role:'user',content:text});

  // 1) Mid slot-fill — one question at a time, chained across turns.
  if(petConvo.slotFill){
    var sf=petConvo.slotFill;
    if(sf.type==='addfunds_wallet'){
      var wallet=/usd|dollar/i.test(text)?'usd':(/naira|ngn/i.test(text)?'ngn':null);
      if(!wallet){petSay('Naira or USD wallet?');return;}
      petConvo.slotFill=null;
      handoff('add_funds',{wallet:wallet,amount:sf.amount});
      return;
    }
    if(sf.type==='boost_qty'){
      var qtyMatch=text.match(/\d+/);
      if(!qtyMatch){petSay('How many — just the number is fine.');return;}
      petConvo.slotFill={type:'boost_target',platform:sf.platform,qty:parseInt(qtyMatch[0],10)};
      petSay('Got it. What\'s the profile link or username to boost?');
      return;
    }
    if(sf.type==='boost_target'){
      petConvo.slotFill=null;
      handoff('boost',{platform:sf.platform,type:'Followers',quantity:sf.qty,target:text.trim()});
      return;
    }
    if(sf.type==='accounts_platform'){
      var plat=petExtractPlatform(text.toLowerCase());
      if(!plat){petSay('Which platform — TikTok, Instagram, Facebook, YouTube or Twitter?');return;}
      petConvo.slotFill=null;
      handoff('buy_sm_account',{platform:plat});
      return;
    }
  }

  // 2) Try the AI reasoning engine (same endpoint/contract index.html
  //    uses) for full-conversation-memory understanding.
  var ai=await petCallAI();
  if(ai&&ai.type==='ask'){petConvo.missCount=0;petSay(ai.text);return;}
  if(ai&&ai.type==='ready'){petConvo.missCount=0;handoff(ai.tool,ai.input||{});return;}

  // 3) Local fallback parser.
  var local=parsePetIntentLocal(text);
  if(!local){petMiss(text);return;}
  petConvo.missCount=0;
  switch(local.intent){
    case'greeting':petSay('Hey 👋 What can I get for you today?');return;
    case'myorders':petSay("Here's your recent activity — taking you there now.");handoff('show_orders',{});return;
    case'vtu':petSay('Opening airtime & data for you.');handoff('navigate',{page:'vtu'});return;
    case'numbers':petSay("Let's find you a number.");handoff('navigate',{page:'numbers'});return;
    case'addfunds':
      if(local.amount){
        petConvo.slotFill={type:'addfunds_wallet',amount:local.amount};
        petSay('Got it — \u20a6'+local.amount.toLocaleString()+'. Naira or USD wallet?');
      }else{
        petSay('Sure — how much would you like to add?');
        petConvo.slotFill={type:'addfunds_amount'};
      }
      return;
    case'boost':
      var boostPlat=local.query?PET_BOOST_PLATFORMS.find(function(p){return p.toLowerCase()===local.query.toLowerCase();}):null;
      if(!boostPlat){petSay('Which platform do you want boosted — Instagram, TikTok, Facebook, YouTube or Twitter?');petConvo.slotFill={type:'boost_platform'};return;}
      petConvo.slotFill={type:'boost_qty',platform:boostPlat};
      petSay('How many followers would you like on '+boostPlat+'?');
      return;
    case'accounts':
      if(!local.query){petSay('Which platform — TikTok, Instagram, Facebook, YouTube or Twitter?');petConvo.slotFill={type:'accounts_platform'};return;}
      handoff('buy_sm_account',{platform:local.query});
      return;
    default:petMiss(text);
  }
}
// A couple of one-off slot types only reachable from the local-fallback
// branch above (amount-first addfunds, platform-first boost) need their
// own tiny continuations — handled here rather than in the main
// slotFill block since they loop back into the same switch above.
(function(){
  var origProcess=processUtterance;
  processUtterance=async function(text){
    if(petConvo.slotFill&&petConvo.slotFill.type==='addfunds_amount'){
      var amountMatch=text.replace(/,/g,'').match(/\d+/);
      if(!amountMatch){logMsg('user',text);petSay('Just the amount is fine — how much would you like to add?');return;}
      petConvo.slotFill={type:'addfunds_wallet',amount:parseInt(amountMatch[0],10)};
      logMsg('user',text);petConvo.history.push({role:'user',content:text});
      petSay('Got it — \u20a6'+parseInt(amountMatch[0],10).toLocaleString()+'. Naira or USD wallet?');
      return;
    }
    if(petConvo.slotFill&&petConvo.slotFill.type==='boost_platform'){
      var plat=petExtractPlatform(text.toLowerCase());
      var boostPlat=plat?PET_BOOST_PLATFORMS.find(function(p){return p.toLowerCase()===plat;}):null;
      logMsg('user',text);petConvo.history.push({role:'user',content:text});
      if(!boostPlat){petSay('I can boost Instagram, TikTok, Facebook, YouTube or Twitter — which one?');return;}
      petConvo.slotFill={type:'boost_qty',platform:boostPlat};
      petSay('How many followers would you like on '+boostPlat+'?');
      return;
    }
    return origProcess(text);
  };
})();

var PET_MISS_LINES=[
  "I didn't quite catch that — try something like \"boost my Instagram\" or \"add funds\".",
  "Still not sure what you mean — you can also tap below to open it in the app.",
  "Let's just hop into the app for this one — tap below and I'll bring what you said with me."
];
function petMiss(text){
  petConvo.missCount=(petConvo.missCount||0)+1;
  var line=PET_MISS_LINES[Math.min(petConvo.missCount-1,PET_MISS_LINES.length-1)];
  if(petConvo.missCount>=PET_MISS_LINES.length){
    petSay(line,[{label:'Continue in app',onClick:function(){handoff('chat',{text:text});}}]);
  }else{
    petSay(line);
  }
}

// Calls the optional reasoning-engine Edge Function. Returns null on any
// failure/not-configured — callers already fall back to the local parser.
async function petCallAI(){
  try{
    var res=await fetch(PET_INTENT_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY},
      body:JSON.stringify({messages:petConvo.history})
    });
    if(!res.ok)return null;
    var data=await res.json();
    if(!data||data.type==='unavailable')return null;
    return data;
  }catch(e){return null;}
}

/* ══════════════════ HANDOFF ══════════════════
   The ONE thing this page ever hands back to index.html — a ready
   {tool, input} instruction, under the exact key + shape index.html's
   initPetFab() reads. This is the fix for the core bug: before, this
   page wrote a differently-shaped object under a different key, so
   index.html never saw it and nothing happened after "Taking you there
   now…". tool:'chat' is the one special case — it means this page
   couldn't confidently resolve a full action, so it hands the raw text
   to index.html's full engine (AI + local parser + slotFill) instead of
   just giving up. */
function handoff(tool,input){
  stopEverything();
  var history=petConvo.history.slice();
  if(tool==='chat'){
    // Drop the trailing user turn from history since index.html's
    // petSendText() will push it again itself as `text` — avoids a
    // duplicate line in the transcript.
    history=history.slice(0,-1);
  }
  try{
    sessionStorage.setItem('gd_pet_ready_action',JSON.stringify({tool:tool,input:input,history:history}));
  }catch(e){console.error('could not stash ready action:',e);}
  petSay('On it — taking you there now…');
  setTimeout(function(){window.location.href='index.html';},700);
}

/* ── Small local intent parser — intentionally duplicated from
   index.html's parsePetIntentLocal (see the file-level comment at the
   top of this script for why). Keep the two in sync if either changes;
   nothing here spends money or touches the database, it only decides
   which existing page/flow to hand the user off to. ── */
var PET_KNOWN_PLATFORMS=['tiktok','instagram','facebook','twitter','x','whatsapp','telegram','gmail','youtube','snapchat','linkedin','pinterest','discord'];
function petExtractPlatform(text){
  for(var i=0;i<PET_KNOWN_PLATFORMS.length;i++){
    if(text.indexOf(PET_KNOWN_PLATFORMS[i])>-1)return PET_KNOWN_PLATFORMS[i];
  }
  return null;
}
function parsePetIntentLocal(textRaw){
  var text=(textRaw||'').toLowerCase().trim();
  if(!text)return null;
  var amountMatch=text.match(/(?:₦|ngn|naira)?\s?([\d,]{3,})(?:\s?(?:naira|ngn))?/);
  var amount=amountMatch?parseInt(amountMatch[1].replace(/,/g,''),10):null;
  if(/fund|deposit|top ?up|recharge my wallet|add.*wallet/.test(text))
    return{intent:'addfunds',amount:amount};
  if(/order|where is my|track/.test(text))
    return{intent:'myorders'};
  if(/boost/.test(text)){
    return{intent:'boost',query:petExtractPlatform(text)};
  }
  if(/airtime|data|\bvtu\b|recharge card|\d+\s?(mb|gb|tb)\b/.test(text))
    return{intent:'vtu'};
  if(/(virtual )?number|otp|verification code/.test(text)&&!/verify(ing)? account/.test(text))
    return{intent:'numbers'};
  if(/account|page|profile/.test(text)){
    return{intent:'accounts',query:petExtractPlatform(text)};
  }
  if(/^(hi|hey|hello|yo)\b/.test(text))
    return{intent:'greeting'};
  return null;
}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s;}

guardAuth();
</script>
