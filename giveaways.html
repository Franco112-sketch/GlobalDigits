<!-- SECTIONS: 1 CSS · 2 HTML · 3 Config & helpers · 4 Dropdown · 5 Data & realtime · 6 Feed · 7 Detail · 8 Claim
               9 History · 10 Admin · 11 Router & boot -->

<!-- ═══ 1. CSS ═══ -->
<style>
:root{
  --brand:#1a56db;--brand-dk:#1342b0;--brand-lt:#e8f0ff;--brand-xl:#f4f7ff;--accent:#6d5cff;
  --ink:#0b1220;--ink2:#51607c;--ink3:#8b96ad;--line:#e6ecf7;--line2:#d2ddf1;--bg:#f5f8ff;
  --ok:#067647;--ok-bg:#ecfdf3;--warn:#b54708;--warn-bg:#fffaeb;--bad:#b42318;--bad-bg:#fef3f2;--neu:#51607c;--neu-bg:#eef2f9;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--ease:cubic-bezier(.2,.7,.2,1);
  --sh1:0 1px 2px rgba(16,36,94,.05);--sh2:0 8px 22px -8px rgba(16,36,94,.18),0 1px 3px rgba(16,36,94,.06);
  --pop:0 14px 34px -8px rgba(15,35,90,.22),0 2px 6px rgba(15,35,90,.06);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:linear-gradient(180deg,#eaf1ff 0,var(--bg) 240px) no-repeat,var(--bg);color:var(--ink);font:12.5px/1.5 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p,ul,dl,dd{margin:0;padding:0}ul{list-style:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}a{color:inherit;text-decoration:none}svg{display:block;flex-shrink:0}
.i{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.i.s{width:12px;height:12px}.i.l{width:18px;height:18px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}.num{font-variant-numeric:tabular-nums}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}

/* top bar + tabs */
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.82);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid rgba(210,221,241,.7);padding-top:env(safe-area-inset-top,0px)}
.topbar-in{max-width:820px;margin:0 auto;height:44px;display:flex;align-items:center;gap:6px;padding:0 10px}
.topbar h1{font-size:14px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--ink2);transition:background .15s,color .15s}
.ibtn:hover{background:var(--brand-lt);color:var(--brand)}
.live{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:var(--ink3);padding:3px 8px;border-radius:99px;background:var(--neu-bg)}.live i{width:6px;height:6px;border-radius:50%;background:var(--ink3)}
.live[data-s="live"]{color:var(--ok);background:var(--ok-bg)}.live[data-s="live"] i{background:#12b76a;box-shadow:0 0 0 3px rgba(18,183,106,.18)}
.live[data-s="connecting"] i{background:#f79009;animation:pulse 1.2s ease-in-out infinite}.live[data-s="down"]{color:var(--bad);background:var(--bad-bg)}.live[data-s="down"] i{background:#f04438}
@keyframes pulse{50%{opacity:.35}}.spin{animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.tabs{max-width:820px;margin:0 auto;display:flex;gap:4px;padding:0 10px 8px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:99px;font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap;transition:color .15s,background .15s}
.tab:hover{color:var(--brand);background:var(--brand-xl)}.tab[aria-selected="true"]{color:#fff;background:linear-gradient(135deg,var(--brand),#3b73ee);box-shadow:0 4px 10px -3px rgba(26,86,219,.45)}
main{max-width:820px;margin:0 auto;padding:12px 10px calc(28px + env(safe-area-inset-bottom,0px))}

/* chips + toolbar */
.bar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -10px 10px;padding:0 10px}.bar::-webkit-scrollbar{display:none}
.chip{height:27px;padding:0 11px;border:1px solid var(--line2);border-radius:99px;background:#fff;font-size:11.5px;font-weight:600;color:var(--ink2);white-space:nowrap;transition:all .15s}
.chip:hover{border-color:var(--brand);color:var(--brand)}.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip small{opacity:.65;margin-left:5px;font-size:10.5px;font-weight:600}

/* feed cards */
.feed{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media(min-width:640px){.feed{grid-template-columns:1fr 1fr;gap:12px}}
.gcard{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;box-shadow:var(--sh1);transition:border-color .15s,box-shadow .2s,transform .2s var(--ease)}
.gcard:hover{border-color:var(--line2);box-shadow:var(--sh2);transform:translateY(-1px)}.gcard:active{transform:scale(.995)}
.thumb{position:relative;height:68px;background:linear-gradient(135deg,#dfe9ff,#ece6ff);display:grid;place-items:center;color:var(--brand);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}.thumb .i{width:24px;height:24px;opacity:.85}
.thumb .pill{position:absolute;left:8px;top:8px}
.gbody{padding:10px 11px 11px;display:grid;gap:7px}
.gtype{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink3);flex-wrap:wrap}
.gtitle{font-size:13px;font-weight:700;line-height:1.3;letter-spacing:-.005em;overflow-wrap:anywhere}
.greward{font-size:12px;color:var(--ink2);overflow-wrap:anywhere}
.gmeta{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--ink3);flex-wrap:wrap}.gmeta span{display:flex;align-items:center;gap:4px}
.pill{display:inline-flex;align-items:center;gap:5px;height:19px;padding:0 8px;border-radius:99px;font-size:10.5px;font-weight:600;white-space:nowrap}.pill i{width:5px;height:5px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.neu{background:var(--neu-bg);color:var(--neu)}.pill.blue{background:var(--brand-lt);color:var(--brand)}
.meter{height:5px;border-radius:99px;background:var(--brand-lt);overflow:hidden}.meter>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#5b8cff);border-radius:99px;transition:width .4s var(--ease)}
.mrow{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2);margin-bottom:4px}

/* panels */
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:var(--sh1)}
.card h2{font-size:12.5px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px;letter-spacing:-.005em}
.card h2>.i{color:var(--brand)}
.hero{position:relative;height:112px;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#dfe9ff,#ece6ff);display:grid;place-items:center;color:var(--brand);margin-bottom:10px}
.hero img{width:100%;height:100%;object-fit:cover}.hero .i{width:28px;height:28px}
.dh{display:grid;gap:6px;margin-bottom:10px}.dh h1{font-size:16px;font-weight:700;line-height:1.3;letter-spacing:-.015em;overflow-wrap:anywhere}
.dh .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.desc{color:var(--ink2);white-space:pre-wrap;overflow-wrap:anywhere}
.split{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.split{grid-template-columns:minmax(0,1fr) 300px;align-items:start}.split .side{position:sticky;top:96px}}
.kvs{display:grid;gap:7px}.kv{display:flex;justify-content:space-between;gap:10px}.kv dt{color:var(--ink3)}.kv dd{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}

/* detail layout */
.dgrid{display:grid;gap:0 10px;grid-template-columns:minmax(0,1fr);grid-template-areas:"tasks" "claim" "info" "comments"}
@media(min-width:760px){.dgrid{grid-template-columns:minmax(0,1fr) 300px;grid-template-areas:"tasks claim" "comments info";align-items:start}.dgrid.notasks{grid-template-areas:"comments claim" "comments info"}}

/* tasks */
.task{display:flex;gap:9px;align-items:flex-start;padding:9px 0}.task+.task{border-top:1px solid var(--line)}
.tstat{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;color:#fff;flex-shrink:0;margin-top:1px}
.tstat.completed{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}.tstat.verified{border-color:var(--ok);background:var(--ok)}.tstat.rejected{border-color:var(--bad);background:var(--bad)}
.tstat .i{width:10px;height:10px;stroke-width:2.6}
.tmain{flex:1;min-width:0}.ttitle{font-weight:600}.tdesc{color:var(--ink2);font-size:12px;margin-top:1px;overflow-wrap:anywhere}
.tact{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;align-items:center}
.tnote{font-size:11.5px;color:var(--bad);margin-top:4px}

/* buttons + inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:9px;font-size:12px;font-weight:600;border:1px solid var(--line2);background:#fff;color:var(--ink);transition:border-color .15s,color .15s,background .15s,opacity .15s,box-shadow .15s;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:linear-gradient(135deg,var(--brand),#3b73ee);border-color:var(--brand);color:#fff;box-shadow:0 4px 10px -4px rgba(26,86,219,.5)}.btn.pri:hover:not(:disabled){background:var(--brand-dk);border-color:var(--brand-dk);color:#fff}
.btn.dng{color:var(--bad);border-color:#fecdca;background:var(--bad-bg)}.btn.dng:hover:not(:disabled){border-color:var(--bad);color:var(--bad)}
.btn.sm{height:27px;padding:0 10px;font-size:11.5px;border-radius:8px}.btn.full{width:100%;height:36px}
.btn .sp{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:rot .7s linear infinite}
.btn:not(.pri) .sp{border-color:var(--line2);border-top-color:var(--brand)}
.field{margin-bottom:10px}.field>label,.field>.lbl{display:block;font-size:11.5px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.input,.area{width:100%;border:1px solid var(--line2);border-radius:9px;background:#fff;padding:0 10px;height:34px;font-size:12.5px;transition:border-color .15s,box-shadow .15s}
.area{height:auto;min-height:64px;padding:8px 10px;resize:vertical}
.input:hover,.area:hover{border-color:#a9c0ea}.input:focus,.area:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(26,86,219,.12)}
.input.invalid{border-color:var(--bad)}.ferr{font-size:11.5px;color:var(--bad);margin-top:4px}.hint{font-size:11.5px;color:var(--ink3);margin-top:4px}
@supports (-webkit-touch-callout:none){.input,.area,.dd-trigger{font-size:16px}}
.two{display:grid;gap:0 10px;grid-template-columns:minmax(0,1fr)}@media(min-width:520px){.two{grid-template-columns:1fr 1fr}}
.check{display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer;margin-bottom:8px}.check input{width:15px;height:15px;accent-color:var(--brand)}

/* alerts, states, toast, skeleton */
.alert{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border-radius:10px;border:1px solid;font-size:12px;margin-bottom:10px}
.alert .i{margin-top:1px}.alert.err{background:var(--bad-bg);border-color:#fecdca;color:#912018}.alert.info{background:var(--brand-xl);border-color:var(--brand-lt);color:#1e3a8a}
.alert.ok{background:var(--ok-bg);border-color:#abefc6;color:var(--ok)}.alert.warn{background:var(--warn-bg);border-color:#fedf89;color:var(--warn)}
.state{text-align:center;padding:28px 16px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh1)}.state .i{width:20px;height:20px;margin:0 auto 8px;color:var(--brand)}
.state h2{font-size:13px;font-weight:700}.state p{color:var(--ink2);margin:2px auto 12px;max-width:340px}.state .acts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.sk{background:linear-gradient(90deg,#e9f0fd 25%,#f6f9ff 50%,#e9f0fd 75%);background-size:200% 100%;animation:shimmer 1.2s linear infinite;border-radius:6px}@keyframes shimmer{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);max-width:min(92vw,380px);background:rgba(11,18,32,.94);color:#fff;padding:9px 13px;border-radius:10px;font-size:12px;box-shadow:var(--pop);opacity:0;pointer-events:none;transition:opacity .16s,transform .18s var(--ease);z-index:1300}
.toast.show{opacity:1;transform:translate(-50%,0)}
#boot{position:fixed;inset:0;z-index:2000;background:#fff;display:grid;place-items:center;transition:opacity .2s}#boot.hide{opacity:0;pointer-events:none}
.boot-w{display:grid;justify-items:center;gap:10px;color:var(--ink2)}.boot-r{width:28px;height:28px;border-radius:50%;border:3px solid var(--brand-lt);border-top-color:var(--brand);animation:rot .8s linear infinite}

/* engagement + comments */
.eng{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ebtn{display:inline-flex;align-items:center;gap:6px;height:29px;padding:0 11px;border:1px solid var(--line2);border-radius:99px;background:#fff;font-size:11.5px;font-weight:600;color:var(--ink2);transition:all .15s}
.ebtn:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}.ebtn:disabled{opacity:.5;cursor:not-allowed}
.ebtn.on{background:var(--brand-lt);border-color:var(--brand);color:var(--brand)}.ebtn.on .i{fill:currentColor}
.cm{display:flex;gap:8px;padding:9px 0}.cm+.cm{border-top:1px solid var(--line)}
.av{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--brand-lt),#e9e3ff);color:var(--brand);display:grid;place-items:center;font-size:11px;font-weight:700;flex-shrink:0}
.cm .cb{flex:1;min-width:0}.cm .cn{font-weight:600;font-size:12px}.cm .ct{color:var(--ink3);font-size:11px;margin-left:6px;font-weight:400}.cm p{overflow-wrap:anywhere;margin-top:1px;white-space:pre-wrap}.cm .ca{display:flex;gap:10px;margin-top:3px}
.linkbtn{font-size:11.5px;color:var(--ink3)}.linkbtn:hover{color:var(--brand)}.linkbtn.d:hover{color:var(--bad)}
.composer{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}.composer .area{min-height:34px;height:34px}

/* credentials, history rows, admin table */
.cred{display:grid;gap:6px;background:var(--brand-xl);border:1px solid var(--brand-lt);border-radius:10px;padding:9px 10px}
.cred .r{display:flex;align-items:center;gap:8px}.cred .r dt{width:68px;color:var(--ink3);font-size:11.5px}.cred .r dd{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.cp{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--ink3);border:1px solid var(--line);background:#fff}.cp:hover{color:var(--brand);border-color:var(--brand)}
.list{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--sh1)}.list>li+li{border-top:1px solid var(--line)}
.hrow{display:grid;gap:5px;padding:10px 11px;transition:background .15s}.hrow:hover{background:var(--brand-xl)}.hrow .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.hrow .t{font-weight:600;overflow-wrap:anywhere}
.arow{display:grid;gap:6px;padding:10px 11px}.arow .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.sechead{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 8px;font-size:12px;font-weight:600}
.trow{display:grid;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--brand-xl)}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:6px;background:var(--neu-bg);color:var(--neu);font-size:10.5px;font-weight:600}

/* custom dropdown */
.dd{position:relative}
.dd-trigger{width:100%;height:34px;display:flex;align-items:center;gap:8px;padding:0 8px 0 10px;border:1px solid var(--line2);border-radius:9px;background:#fff;font-size:12.5px;text-align:left;transition:border-color .15s,box-shadow .15s}
.dd-trigger:hover:not(:disabled){border-color:#a9c0ea}.dd-trigger:focus-visible,.dd.is-open .dd-trigger{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(26,86,219,.12)}
.dd-trigger:disabled{background:var(--brand-xl);color:var(--ink3);cursor:not-allowed}.dd-val{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dd-val.ph{color:var(--ink3)}
.dd-chev{width:14px;height:14px;color:var(--ink3);transition:transform .16s var(--ease)}.dd.is-open .dd-chev{transform:rotate(180deg);color:var(--brand)}
.dd-menu{position:fixed;z-index:1000;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--pop);display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:translateY(-3px) scale(.985);transform-origin:top center;transition:opacity .12s ease,transform .14s var(--ease);pointer-events:none}
.dd-menu.up{transform-origin:bottom center;transform:translateY(3px) scale(.985)}.dd-menu.open{opacity:1;transform:none;pointer-events:auto}
.dd-search{display:flex;align-items:center;gap:7px;padding:6px 9px;border-bottom:1px solid var(--line);color:var(--ink3)}.dd-search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:12.5px}
.dd-list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px;outline:none}
.dd-opt{display:flex;align-items:center;gap:8px;min-height:32px;padding:5px 8px;border-radius:8px;cursor:pointer;font-size:12.5px}.dd-opt .o-lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-opt .o-meta{font-size:11px;color:var(--ink3)}.dd-opt .o-chk{width:14px;height:14px;color:var(--brand);visibility:hidden}.dd-opt.is-active{background:var(--brand-xl)}
.dd-opt[aria-selected="true"]{color:var(--brand);font-weight:600}.dd-opt[aria-selected="true"] .o-chk{visibility:visible}.dd-note{padding:12px;text-align:center;color:var(--ink2)}

/* modal */
#modal{position:fixed;inset:0;z-index:1500;background:rgba(11,18,32,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;opacity:0;transition:opacity .18s}#modal.open{opacity:1}
.mbox{width:min(340px,100%);background:#fff;border-radius:16px;padding:18px;box-shadow:var(--pop);transform:translateY(8px) scale(.98);transition:transform .2s var(--ease)}#modal.open .mbox{transform:none}
.mbox .mi{width:34px;height:34px;border-radius:10px;background:var(--brand-lt);color:var(--brand);display:grid;place-items:center;margin-bottom:10px}
.mbox h2{font-size:14.5px;font-weight:700;margin-bottom:4px}.mbox p{color:var(--ink2);margin-bottom:14px}.mbox .acts{justify-content:flex-end}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:6px;margin-bottom:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:11px;padding:7px 10px;display:grid;gap:1px;box-shadow:var(--sh1)}
.stat b{font-size:14px;font-weight:700;line-height:1.2}.stat span{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--ink3);white-space:nowrap}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}

function mergeGw(r){if(!r||!r.id)return;if(!S.gw[r.id])S.order.push(r.id);S.gw[r.id]=Object.assign({},S.gw[r.id]||{},r);sortOrder();}
function sortOrder(){S.order.sort(function(a,b){return (ts(S.gw[b].created_at)||0)-(ts(S.gw[a].created_at)||0);});}
function visibleIds(){return S.order.filter(function(id){return S.gw[id].status!=='draft';});}
async function loadFeed(silent){
  if(!silent){S.feedState='loading';renderRoute();}
  try{
    var r=await sb.from('giveaways').select('*').order('created_at',{ascending:false}).limit(100);
    if(r.error)throw r.error;
    S.gw={};S.order=[];(r.data||[]).forEach(function(g){S.gw[g.id]=g;S.order.push(g.id);});
    S.feedState='ready';S.feedErr=null;
  }catch(e){console.warn('loadFeed:',e&&e.message||e);if(!silent||!S.order.length){S.feedState='error';S.feedErr=classify(e);}}
  renderRoute();
}
async function loadMine(){
  try{
    var a=await Promise.all([sb.from('giveaway_claims').select('*').eq('user_id',S.user.id),sb.from('giveaway_likes').select('giveaway_id').eq('user_id',S.user.id)]);
    if(!a[0].error){S.claims={};(a[0].data||[]).forEach(function(c){S.claims[c.giveaway_id]=c;});}
    if(a[1].error)logErr('select giveaway_likes',a[1].error);if(a[0].error)logErr('select giveaway_claims',a[0].error);if(!a[1].error){S.likes={};(a[1].data||[]).forEach(function(l){S.likes[l.giveaway_id]=true;});}
  }catch(e){console.warn('loadMine:',e&&e.message);}
}
async function loadDetailData(id){
  var a=await Promise.all([
    sb.from('giveaway_tasks').select('*').eq('giveaway_id',id).order('position',{ascending:true}),
    sb.from('giveaway_task_completions').select('*').eq('giveaway_id',id).eq('user_id',S.user.id),
    sb.from('giveaway_comments').select('*').eq('giveaway_id',id).order('created_at',{ascending:false}).limit(50)]);
  if(a[0].error)throw a[0].error;
  if(a[1].error)logErr('select giveaway_task_completions',a[1].error);if(a[2].error)logErr('select giveaway_comments',a[2].error);S.tasks[id]=a[0].data||[];S.comps[id]={};(a[1].data||[]).forEach(function(c){S.comps[id][c.task_id]=c;});
  S.comments[id]=(a[2].data||[]);
}

var chMain=null,chDet=null,rtDown=false;
function setRt(s){S.rt=s;var l=$('liveInd');l.setAttribute('data-s',s);$('liveTxt').textContent=s==='live'?'Live':s==='down'?'Offline':'Connecting';}
function subscribeMain(){
  var me=S.user.id;
  chMain=sb.channel('gw_main_'+me.slice(0,8)).on('postgres_changes',{event:'*',schema:'public',table:'giveaways'},function(p){
      if(p.eventType==='DELETE'){var id=p.old&&p.old.id;if(id&&S.gw[id]){delete S.gw[id];S.order=S.order.filter(function(x){return x!==id;});}}else mergeGw(p.new);
      onGiveawayChanged(p.new&&p.new.id||p.old&&p.old.id);
    }).on('postgres_changes',{event:'*',schema:'public',table:'giveaway_claims',filter:'user_id=eq.'+me},function(p){
      var r=p.new&&p.new.id?p.new:null;if(r){S.claims[r.giveaway_id]=r;if(r.status!=='delivered')delete S.accounts[r.id];onClaimChanged(r.giveaway_id);}
    }).on('postgres_changes',{event:'*',schema:'public',table:'giveaway_task_completions',filter:'user_id=eq.'+me},function(p){
      var r=p.new&&p.new.id?p.new:null;if(r){(S.comps[r.giveaway_id]=S.comps[r.giveaway_id]||{})[r.task_id]=r;onTasksChanged(r.giveaway_id);}
    }).subscribe(function(st){
      if(st==='SUBSCRIBED'){var re=rtDown;rtDown=false;setRt('live');if(re){loadFeed(true);loadMine().then(renderRoute);}}
      else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){rtDown=true;setRt('down');}});
}
function subscribeDetail(id){
  unsubscribeDetail();
  chDet=sb.channel('gw_det_'+id.slice(0,8)+'_'+Date.now()).on('postgres_changes',{event:'*',schema:'public',table:'giveaway_comments',filter:'giveaway_id=eq.'+id},function(p){
      var list=S.comments[id]||(S.comments[id]=[]);
      if(p.eventType==='DELETE'){var oid=p.old&&p.old.id;S.comments[id]=list.filter(function(c){return c.id!==oid;});}
      else if(p.new&&p.new.id){var n=p.new,i=list.findIndex(function(c){return c.id===n.id;});
        if(n.status==='hidden'&&!S.isAdmin&&n.user_id!==S.user.id){S.comments[id]=list.filter(function(c){return c.id!==n.id;});}
        else if(i>-1)list[i]=n;else list.unshift(n);}
      if(S.route.name==='detail'&&S.route.id===id)renderComments();
    }).on('postgres_changes',{event:'*',schema:'public',table:'giveaway_tasks',filter:'giveaway_id=eq.'+id},function(){
      sb.from('giveaway_tasks').select('*').eq('giveaway_id',id).order('position',{ascending:true}).then(function(r){if(r.data){S.tasks[id]=r.data;onTasksChanged(id);}});
    }).subscribe();
}
function unsubscribeDetail(){if(chDet){try{sb.removeChannel(chDet);}catch(e){}chDet=null;}}
function unsubscribeAll(){[chMain,chDet].forEach(function(c){if(c){try{sb.removeChannel(c);}catch(e){}}});chMain=chDet=null;}

function renderFeed(){

  var sc={},tc={};ids.forEach(function(id){var g=S.gw[id],s=effStatus(g);sc[s]=(sc[s]||0)+1;if(g.type)tc[g.type]=(tc[g.type]||0)+1;});
  if(F.status!=='all'&&!sc[F.status])F.status='all';if(F.type!=='all'&&!tc[F.type])F.type='all';

  var tchips='';if(Object.keys(tc).length>1){tchips='<div class="bar" role="group" aria-label="Filter by type"><button class="chip" type="button" data-ft="all" aria-pressed="'+(F.type==='all')+'">All types</button>'+
    Object.keys(tc).sort().map(function(t){return '<button class="chip" type="button" data-ft="'+esc(t)+'" aria-pressed="'+(F.type===t)+'">'+esc(humanize(t))+'</button>';}).join('')+'</div>';}
  var q=F.q.trim().toLowerCase();
  var list=ids.filter(function(id){var g=S.gw[id];return (F.status==='all'||effStatus(g)===F.status)&&(F.type==='all'||g.type===F.type)&&(!q||[g.title,g.reward_label,g.type,g.description].join(' ').toLowerCase().indexOf(q)>-1);});
  if(F.sort==='pop')list.sort(function(a,b){var A=S.gw[a],B=S.gw[b];return (lc(B,'likes')+lc(B,'comments')*2)-(lc(A,'likes')+lc(A,'comments')*2)||(Number(B.views_count)||0)-(Number(A.views_count)||0);});
  else if(F.sort==='end')list.sort(function(a,b){var A=S.gw[a],B=S.gw[b],x=effStatus(A)==='live'&&ts(A.ends_at)||1e18,y=effStatus(B)==='live'&&ts(B.ends_at)||1e18;return x===y?0:x-y;});
  var tv=0,tl=0;ids.forEach(function(id){tv+=Number(S.gw[id].views_count)||0;tl+=lc(S.gw[id],'likes');});
  var summary='<div class="stats" style="margin-bottom:10px">'+statTile(IC.gift,'Live now',sc.live||0)+statTile(IC.eye,'Total views',tv)+statTile(IC.heart,'Total likes',tl)+statTile(IC.check,'My claims',Object.keys(S.claims).length)+'</div>';
  var tools='<div class="tools"><label class="search">'+ico(IC.search,'s')+'<input id="fq" type="search" placeholder="Search giveaways" value="'+esc(F.q)+'" autocomplete="off" enterkeyhint="search"/></label>'+

  var af=document.activeElement,keep=af&&af.id==='fq'?[af.selectionStart,af.selectionEnd]:null;
  m.innerHTML=summary+tools+'<div class="bar" role="group" aria-label="Filter by status">'+chips+'</div>'+tchips+

  if(keep){var fi=$('fq');if(fi){fi.focus({preventScroll:true});try{fi.setSelectionRange(keep[0],keep[1]);}catch(e){}}}

/* tasks */

async function completeTask(tid){
  if(S.busy['t'+tid])return;S.busy['t'+tid]=true;renderTasks();

function claimErr(msg){var e=$('cErr');if(e){e.hidden=!msg;e.textContent=msg||'';}var i=$('cPhone')||$('cTarget');if(i)i.classList.toggle('invalid',!!msg);}
/* ── engagement counters ──
   views/visits/likes/comments are denormalised columns on `giveaways`, written by RPCs/triggers. The old code
   swallowed every error from giveaway_record_visit (supabase-js RPCs never reject, they resolve with {error}),
   so a failing RPC left the counters at 0 with nothing in the console. Now every failure is logged, the row is
   re-read after the visit is recorded, and likes/comments are also counted live from their own tables
   (display = the larger of column and live count, so a stale or un-wired trigger can't show a false 0). */
var visited={};
function lc(g,k){var v=Number(g[k+'_count'])||0,l=(S.live[g.id]||{})[k];if(typeof l==='number')v=Math.max(v,l);if(k==='likes'&&S.likes[g.id])v=Math.max(v,1);return v;}
function liveAdj(id,k,d){var l=S.live[id];if(l&&typeof l[k]==='number')l[k]=Math.max(0,l[k]+d);}
function statTile(icon,label,n){return '<div class="stat"><b class="num">'+(Number(n)||0).toLocaleString()+'</b><span>'+ico(icon,'s')+label+'</span></div>';}
async function recordVisit(id){
  try{
    if(!visited[id]){
      var r=await sb.rpc('giveaway_record_visit',{p_id:id});
      if(r.error)logErr('rpc giveaway_record_visit',r.error);else visited[id]=1;
    }
  }catch(e){logErr('recordVisit',e);}
  await syncCounts(id);
}
async function syncCounts(id){
  try{
    var a=await Promise.all([
      sb.from('giveaways').select('*').eq('id',id).maybeSingle(),
      sb.from('giveaway_likes').select('*',{count:'exact',head:true}).eq('giveaway_id',id),
      sb.from('giveaway_comments').select('*',{count:'exact',head:true}).eq('giveaway_id',id).neq('status','hidden')]);
    if(a[0].error)logErr('select giveaways (counts)',a[0].error);else if(a[0].data)mergeGw(a[0].data);
    var L=S.live[id]||(S.live[id]={});
    if(a[1].error)logErr('count giveaway_likes',a[1].error);else if(typeof a[1].count==='number')L.likes=a[1].count;
    if(a[2].error)logErr('count giveaway_comments',a[2].error);else if(typeof a[2].count==='number')L.comments=a[2].count;
    if(S.route.name==='detail'&&D.id===id){renderTop();renderInfo();}else if(S.route.name==='feed')renderFeed();
  }catch(e){logErr('syncCounts',e);}
}
async function refreshGw(id){try{var r=await sb.from('giveaways').select('*').eq('id',id).maybeSingle();if(r.error)logErr('select giveaways (refresh)',r.error);if(r.data)mergeGw(r.data);}catch(e){logErr('refreshGw',e);}}   // keeps inventory right even if realtime is down
async function refreshClaim(id){try{var r=await sb.from('giveaway_claims').select('*').eq('giveaway_id',id).eq('user_id',S.user.id).maybeSingle();if(r.data)S.claims[id]=r.data;}catch(e){}}
async function doClaim(){
  if(S.busy.claim)return;var id=D.id,g=S.gw[id],kind=rewardKind(g),input={};claimErr('');
  if(kind==='airtime'||kind==='data'){
    var p=($('cPhone').value||'').replace(/\D/g,'');D.form.phone=p;if(!/^0\d{10}$/.test(p)){claimErr(MSG.invalid_phone);$('cPhone').focus();return;}input.phone=p;
  }else if(kind==='boost'){
    var en=boostEntries(g).filter(function(x){return String(x.platform).toLowerCase()===String(D.form.platform||'').toLowerCase();})[0],t=($('cTarget').value||'').trim();D.form.target=t;
    if(!en){toast(MSG.invalid_platform);return;}if(t.length<3||/[\s<>"']/.test(t)){claimErr(MSG.invalid_target);$('cTarget').focus();return;}
    if(en.target_pattern){try{if(!new RegExp(en.target_pattern).test(t)){claimErr(MSG.invalid_target);return;}}catch(e){}}
    input.platform=en.platform;input.target=t;
  }
  S.busy.claim=true;renderClaim();
  var res=null,netFail=false;
  try{
    if(kind==='airtime'||kind==='data'||kind==='boost'){
      var ses=(await sb.auth.getSession()).data.session;if(!ses)throw {message:'not_authenticated'};
      var rsp=await fetch(CLAIM_URL,{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPA_KEY,Authorization:'Bearer '+ses.access_token},body:JSON.stringify(Object.assign({giveaway_id:id},input))});
      var txt=await rsp.text();try{res=JSON.parse(txt);}catch(e){res={ok:false,code:'server_error'};}
    }else{
      var r=await sb.rpc('giveaway_claim_manual',{p_id:id,p_input:input});if(r.error)throw r.error;res=r.data;
    }
  }catch(e){netFail=true;console.warn('claim:',e&&e.message||e);}
  await Promise.all([refreshClaim(id),refreshGw(id)]);   // the database is the source of truth for what happened
  S.busy.claim=false;
  var c=S.claims[id];
  if(netFail&&(!c||c.status==='failed')){toast(classify({message:''})==='network'||!navigator.onLine?'You appear to be offline.':'Couldn\u2019t reach the server. Check My claims before trying again.');}
  else if(res&&res.ok){toast(kind==='manual'?'Claim received':'Reward claimed');D.form={phone:'',target:'',platform:D.form.platform};}
  else if(res&&!res.ok){var m=MSG[res.code]||res.message||MSG.server_error;if(res.code==='invalid_phone'||res.code==='invalid_target')claimErr(m);else toast(m);}
  else if(netFail&&c){toast('Your claim was received. Check its status below.');}
  renderTop();renderClaim();renderInfo();
}

var BIZ=/likes_disabled|comments_disabled|giveaway_not_live|not_authenticated|rate_limited|invalid_comment/;

async function postComment(){
  var inp=$('cmInput'),b=$('cmSend');if(!inp||S.busy.cm)return;var t=inp.value.trim(),er=$('cmErr');er.hidden=true;
  if(!t||t.length>500){er.textContent=MSG.invalid_comment;er.hidden=false;return;}
  S.busy.cm=true;b.disabled=true;var id=D.id;
  try{
    var row=null,direct=false,r=await sb.rpc('giveaway_add_comment',{p_id:id,p_body:t});
    if(r.error){
      logErr('rpc giveaway_add_comment',r.error);
      if(BIZ.test(String(r.error.message||'')))throw r.error;
      direct=true;row=await commentDirect(id,t);
    }else row=unwrap(r.data);
    var list=S.comments[id]||(S.comments[id]=[]);
    if(row&&row.id){if(!list.some(function(c){return c.id===row.id;})){list.unshift(row);if(!direct)bumpComments(1);}}
    else await reloadComments(id);
    if(direct)await refreshGw(id);
    inp.value='';renderTop();renderComments();
  }catch(e){logErr('postComment',e);er.textContent=errMsg(e);er.hidden=false;}
  finally{S.busy.cm=false;b.disabled=false;}
}
async function verifyLiked(id){

async function likeDirect(id,was){
  var uid=S.user.id;
  if(was){var d=await sb.from('giveaway_likes').delete().eq('giveaway_id',id).eq('user_id',uid);if(d.error){logErr('delete giveaway_likes',d.error);throw d.error;}return false;}
  var i=await sb.from('giveaway_likes').insert({giveaway_id:id,user_id:uid});
  if(i.error&&i.error.code!=='23505'){logErr('insert giveaway_likes',i.error,{giveaway_id:id,user_id:uid});throw i.error;}

async function toggleLike(){
  var id=D.id,g=S.gw[id];if(!g||S.busy.like)return;S.busy.like=true;
  var was=!!S.likes[id],prev=g.likes_count||0;S.likes[id]=!was;g.likes_count=Math.max(0,prev+(was?-1:1));liveAdj(id,'likes',was?-1:1);renderTop();
  try{
    var liked,count=null,r=await sb.rpc('giveaway_toggle_like',{p_id:id});
    if(r.error){
      logErr('rpc giveaway_toggle_like',r.error);
      if(BIZ.test(String(r.error.message||'')))throw r.error;
      liked=await likeDirect(id,was);await refreshGw(id);
    }else{
      var d=unwrap(r.data);
      if(typeof d==='boolean')liked=d;
      else if(d&&typeof d.liked==='boolean'){liked=d.liked;var c=has(d.count)?d.count:d.likes_count;if(has(c)&&!isNaN(+c))count=+c;}
      else{console.warn('[giveaways] giveaway_toggle_like returned an unexpected shape',r.data);liked=await verifyLiked(id);}
      if(count===null)await refreshGw(id);
    }
    S.likes[id]=liked;if(count!==null)g.likes_count=count;
  }catch(e){logErr('toggleLike',e);S.likes[id]=was;g.likes_count=prev;liveAdj(id,'likes',was?1:-1);toast(errMsg(e));}
  finally{S.busy.like=false;renderTop();syncCounts(id);}
}

  $('tabs').innerHTML=[['feed','Giveaways',IC.gift],['history','My claims',IC.list]].map(function(t){
    return '<button class="tab" role="tab" type="button" data-tab="'+t[0]+'" aria-selected="'+(t[0]===r)+'">'+ico(t[2],'s')+t[1]+'</button>';}).join('');
  $('pageTitle').textContent=S.route.name==='detail'?'Giveaway':S.route.name==='history'?'My claims':'Giveaways';
}
function renderRoute(){renderTabs();if(S.route.name==='feed')renderFeed();}      // data refresh: only the feed is redrawn
function enterRoute(){
  if(S.route&&S.route.name==='detail'){unsubscribeDetail();S.accounts={};}      // never keep credentials in memory after leaving
  S.route=parseRoute();window.scrollTo(0,0);renderTabs();
  if(S.route.name==='feed')renderFeed();
  else if(S.route.name==='history')renderHistory();
  else openDetail(S.route.id);
}
function leavePage(){
  var ref=document.referrer;
  if(history.length>1&&ref&&ref.indexOf(location.origin)===0&&ref.indexOf(location.pathname)===-1)history.back();else location.href='index.html';
}
function rerenderStatuses(){
  var r=S.route;
  if(r.name==='feed')renderFeed();
  else if(r.name==='detail'&&$('dTop')&&S.gw[r.id]){renderTop();renderInfo();renderTasks();renderClaim();}
}
var lastSig='';
function tick(){
  document.querySelectorAll('[data-cd]').forEach(function(el){el.textContent=cd((+el.getAttribute('data-cd'))-nowMs());});
  var sig=S.order.map(function(id){return id+effStatus(S.gw[id]);}).join('|');
  if(sig!==lastSig){var had=lastSig!=='';lastSig=sig;if(had)rerenderStatuses();}
}

/* first-visit confirmation (stored per account in the database, so it shows once across devices) */
function showWelcome(){
  return new Promise(function(resolve){
    var m=$('modal'),name=S.profile.name||'your account';
    m.innerHTML='<div class="mbox"><div class="mi">'+ico(IC.shield,'l')+'</div><h2 id="mTitle">Continue with Global Digits</h2><p>You\u2019re signed in as <strong>'+esc(name)+'</strong>. Continue to access giveaways, tasks and rewards.</p><div class="acts"><button class="btn pri" type="button" id="mGo">Continue</button></div></div>';
    m.hidden=false;document.querySelector('.topbar').inert=true;$('main').inert=true;
    requestAnimationFrame(function(){m.classList.add('open');$('mGo').focus();});
    m.onkeydown=function(e){if(e.key==='Tab'){e.preventDefault();$('mGo').focus();}};
    $('mGo').onclick=async function(){
      var b=this;b.disabled=true;
      try{var r=await sb.rpc('giveaway_confirm_entry');if(r.error)throw r.error;}catch(e){console.warn('confirm entry:',e&&e.message);toast('Couldn\u2019t save this step \u2014 you may see it again.');}
      m.classList.remove('open');document.querySelector('.topbar').inert=false;$('main').inert=false;
      setTimeout(function(){m.hidden=true;m.innerHTML='';resolve();},REDUCED?0:180);
    };
  });
}

function wireEvents(){
  $('backBtn').addEventListener('click',function(){
    if(S.route.name!=='feed'){
      if(S.depth>0){history.back();}
      else{history.replaceState({d:0},'',location.pathname+location.search+'#/');enterRoute();}
    }else leavePage();
  });
  $('tabs').addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(!b)return;var t=b.getAttribute('data-tab');
    if((t==='history')!==(S.route.name==='history'))go(t==='history'?'#/history':'#/');else if(S.route.name==='detail')go('#/');});
  window.addEventListener('popstate',function(e){S.depth=(e.state&&e.state.d)||0;enterRoute();});
  var main=$('main');
  main.addEventListener('click',function(e){
    var t=e.target;
    var o=t.closest('[data-open]');if(o){go('#/g/'+o.getAttribute('data-open'));return;}
    var fs=t.closest('[data-fs]');if(fs){F.status=fs.getAttribute('data-fs');renderFeed();return;}
    var ft=t.closest('[data-ft]');if(ft){F.type=ft.getAttribute('data-ft');renderFeed();return;}
    var fso=t.closest('[data-fsort]');if(fso){F.sort=fso.getAttribute('data-fsort');renderFeed();return;}
    var cp=t.closest('[data-copy]');if(cp){copyText(cp.getAttribute('data-copy'));return;}
    var dn=t.closest('[data-done]');if(dn){completeTask(dn.getAttribute('data-done'));return;}
    var cd_=t.closest('[data-cm-del]');
    if(cd_){var cid=cd_.getAttribute('data-cm-del');
      sb.from('giveaway_comments').delete().eq('id',cid).then(function(r){if(r.error){logErr('delete giveaway_comments',r.error);toast(errMsg(r.error)+'');return;}
        var was=(S.comments[D.id]||[]).filter(function(c){return c.id===cid&&c.status==='visible';}).length;S.comments[D.id]=(S.comments[D.id]||[]).filter(function(c){return c.id!==cid;});if(was)bumpComments(-1);renderComments();});return;}
    if(t.closest('#cmSend')){postComment();return;}
    var a=t.closest('[data-act]');if(!a)return;var act=a.getAttribute('data-act');
    if(act==='like')toggleLike();
    else if(act==='share')shareGw();
    else if(act==='claim')doClaim();
    else if(act==='jump-comments'){e.preventDefault();var h=$('cmHead');if(h)h.scrollIntoView({behavior:REDUCED?'auto':'smooth',block:'center'});}
    else if(act==='feed')go('#/');
    else if(act==='reload')location.reload();
    else if(act==='reload-feed'){loadFeed();}
    else if(act==='clear-filters'){F.status='all';F.type='all';F.q='';renderFeed();}
  });
  main.addEventListener('input',function(e){
    var t=e.target;
    if(t.id==='cPhone'){D.form.phone=t.value.replace(/\D/g,'').slice(0,11);claimErr('');}
    else if(t.id==='cTarget'){D.form.target=t.value;claimErr('');}
    else if(t.hasAttribute&&t.hasAttribute('data-proof'))D.proof[t.getAttribute('data-proof')]=t.value;
  });
  main.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&(e.target.id==='cPhone'||e.target.id==='cTarget')){e.preventDefault();doClaim();}
    else if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&e.target.id==='cmInput'){e.preventDefault();postComment();}
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&openDD)openDD.close(true);});
  window.addEventListener('online',function(){loadFeed(true);loadMine().then(function(){rerenderStatuses();});});
  window.addEventListener('pagehide',cleanup);
}
var tickT=null;
function cleanup(){clearInterval(tickT);unsubscribeAll();}
function bootFail(title,msg,retry,signIn){
  $('boot').classList.add('hide');setTimeout(function(){$('boot').hidden=true;},250);
  $('tabs').innerHTML='';
  $m().innerHTML=stateHtml(IC.alert,title,msg,(signIn?'<a class="btn pri" href="login.html">Sign in</a>':'')+(retry?'<button class="btn pri" type="button" data-act="reload">Try again</button>':'')+'<a class="btn" href="index.html">Back to dashboard</a>');
}
async function boot(){
  if(!window.supabase||!window.supabase.createClient){wireEvents();bootFail('Couldn\u2019t load the page','A required script didn\u2019t load. Check your connection and try again.',true);return;}
  wireEvents();
  try{
    sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
    $('bootMsg').textContent='Checking your session\u2026';
    var ur=await sb.auth.getUser(),user=ur.data&&ur.data.user;
    if(!user){
      var er=ur.error,transient=er&&(er.name==='AuthRetryableFetchError'||er.status===0||er.status>=500||!navigator.onLine);
      if(transient){bootFail('You appear to be offline','We couldn\u2019t verify your session. Check your connection and try again.',true);return;}
      try{await sb.auth.signOut();}catch(e){}
      location.replace('login.html');return;                                      // existing Global Digits sign-in
    }
    S.user=user;
    try{sessionStorage.setItem('gd_entered_app','1');}catch(e){}
    if(sb.auth.onAuthStateChange)sb.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_OUT')location.replace('login.html');});

    $('bootMsg').textContent='Loading giveaways\u2026';
    var meta=(user.user_metadata&&user.user_metadata.name)||(user.email?user.email.split('@')[0]:'');
    var pr=await sb.from('profiles').select('name,phone,status').eq('id',user.id).maybeSingle();
    if(pr.data&&pr.data.status==='deactivated'){try{await sb.auth.signOut();}catch(e){}location.replace('login.html');return;}
    S.profile={name:(pr.data&&pr.data.name)||meta,phone:(pr.data&&pr.data.phone)||''};
    D.form.phone=String(S.profile.phone||'').replace(/\D/g,'').slice(0,11);
    S.isAdmin=false;                                                              // admin work lives in the admin panel

    S.route=parseRoute();renderTabs();
    var tr=await sb.rpc('giveaway_now');
    if(!tr.error&&tr.data){var st=new Date(tr.data).getTime();if(!isNaN(st))S.offset=st-Date.now();}
    var seen=await sb.from('giveaway_user_state').select('user_id').eq('user_id',user.id).maybeSingle();
    var setup=(tr.error&&classify(tr.error)==='setup')||(seen.error&&classify(seen.error)==='setup');
    if(setup){S.feedState='error';S.feedErr='setup';}
    else{await Promise.all([loadFeed(true),loadMine()]);if(S.feedState==='loading')S.feedState='ready';}
    $('boot').classList.add('hide');setTimeout(function(){$('boot').hidden=true;},250);
    if(setup){renderRoute();if(S.route.name!=='feed')enterRoute();}
    else{
      enterRoute();subscribeMain();
      if(!(seen.data))await showWelcome();
    }
    lastSig=S.order.map(function(id){return id+effStatus(S.gw[id]);}).join('|');
    tickT=setInterval(tick,1000);
  }catch(e){
    console.error('giveaways boot failed:',e);
    bootFail('Something went wrong','We couldn\u2019t load this page. Please try again.',true);
  }
}
var fqT=null;document.addEventListener('input',function(e){if(e.target&&e.target.id==='fq'){F.q=e.target.value;clearTimeout(fqT);fqT=setTimeout(function(){if(S.route.name==='feed')renderFeed();},140);}});
window.addEventListener('unhandledrejection',function(ev){console.error('[giveaways] unhandled rejection',ev.reason);});
window.addEventListener('error',function(ev){console.error('[giveaways] script error',ev.message,ev.filename,ev.lineno);});
boot();
})();
</script>
