.dd{position:relative}
.dd-trigger{width:100%;height:34px;display:flex;align-items:center;gap:6px;padding:0 7px 0 9px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);font-size:12.5px;text-align:left;transition:border-color .15s,box-shadow .15s}
.dd-trigger:hover:not(:disabled){border-color:var(--ink3)}
.dd-trigger:focus-visible,.dd.is-open .dd-trigger{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(0,0,0,.12)}
.dd-trigger:disabled{background:var(--sf2);color:var(--ink3);cursor:not-allowed}
.dd-val{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-chev{width:14px;height:14px;color:var(--ink3);transition:transform .16s cubic-bezier(.2,.7,.2,1)}
.dd.is-open .dd-chev{transform:rotate(180deg);color:var(--ac)}
.dd-menu{position:fixed;z-index:1000;min-width:150px;background:var(--sf);border:1px solid var(--ln);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:translateY(-3px) scale(.985);transform-origin:top center;transition:opacity .12s ease,transform .14s cubic-bezier(.2,.7,.2,1);pointer-events:none}
.dd-menu.up{transform-origin:bottom center;transform:translateY(3px) scale(.985)}
.dd-menu.open{opacity:1;transform:none;pointer-events:auto}
.dd-list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px;outline:none}
.dd-opt{display:flex;align-items:center;gap:8px;min-height:32px;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:12.5px}
.dd-opt .o-lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-opt .o-meta{font-size:11px;color:var(--ink3)}
.dd-opt .o-chk{width:14px;height:14px;color:var(--ac);visibility:hidden}
.dd-opt.is-active{background:var(--sf2)}
.dd-opt[aria-selected="true"]{color:var(--ac);font-weight:600}
.dd-opt[aria-selected="true"] .o-chk{visibility:visible}


</style>

var ddSeq=0,openDD=null;

function Dropdown(host,cfg){
  var self=this;
  this.host=host;this.cfg=cfg;this.id='dd'+(++ddSeq);
  this.options=[];this.value=null;this.isOpen=false;this.active=-1;this.typeBuf='';
  host.classList.add('dd');

  m.addEventListener('keydown',function(e){self.onKey(e);});

  this.paint();
}
Dropdown.prototype.setOptions=function(o){this.options=o||[];this.paint();if(this.isOpen){this.renderList();}};
Dropdown.prototype.setValue=function(v){this.value=v;this.paint();};
Dropdown.prototype.setDisabled=function(d){this.btn.disabled=!!d;};
Dropdown.prototype.cur=function(){for(var i=0;i<this.options.length;i++)if(String(this.options[i].value)===String(this.value))return this.options[i];return null;};
Dropdown.prototype.paint=function(){var c=this.cur();this.valEl.textContent=c?c.label:(this.cfg.placeholder||'Select');};
Dropdown.prototype.renderList=function(){
  var self=this;
  this.list.innerHTML=this.options.map(function(o,i){
    var sel=String(o.value)===String(self.value);
    return '<div class="dd-opt'+(i===self.active?' is-active':'')+'" role="option" id="'+self.id+'-o'+i+'" data-i="'+i+'" aria-selected="'+sel+'"><span class="o-lbl">'+esc(o.label)+'</span>'+(o.meta!=null?'<span class="o-meta num">'+esc(o.meta)+'</span>':'')+CHECK+'</div>';

Dropdown.prototype.open=function(){
  if(this.isOpen||this.btn.disabled)return;

  if(!this.isOpen)return;var self=this;

Dropdown.prototype.choose=function(i){
  var o=this.options[i];if(!o)return;
  var changed=String(o.value)!==String(this.value);

Dropdown.prototype.onKey=function(e){
  var k=e.key,self=this,n=this.options.length;

  }
};

  }catch(e){console.warn('listings failed:',e&&e.message);S.load='err';S.err=!navigator.onLine?'offline':'other';}
  render();openFromUrl();
}
async function loadFavs(){
  if(!uid)return;
  try{var r=await sb.from(T.fav).select('type_id').eq('user_id',uid);if(!r.error){S.fav={};(r.data||[]).forEach(function(x){S.fav[String(x.type_id)]=1;});render();}}catch(e){}
}
async function toggleFav(id){
  if(!uid){toast('Sign in to save accounts');return;}
  id=String(id);var on=!!S.fav[id];
  if(on)delete S.fav[id];else S.fav[id]=1;render();if(S.sel)drawSheet();
  var r=on?await sb.from(T.fav).delete().eq('user_id',uid).eq('type_id',id):await sb.from(T.fav).insert({user_id:uid,type_id:id});
  if(r.error){if(on)S.fav[id]=1;else delete S.fav[id];render();if(S.sel)drawSheet();toast('Couldn\u2019t update favorites');}
}

/* list */
function platforms(){var m={};S.rows.forEach(function(r){var p=r.platform||'Other';m[p]=(m[p]||0)+1;});return Object.keys(m).sort().map(function(k){return{k:k,n:m[k]};});}
function visible(){
  var q=S.q.trim().toLowerCase(),rec=recent();
  var l=S.rows.filter(function(r){
    if(S.tab==='fav'&&!S.fav[String(r.id)])return false;
    if(S.tab==='recent'&&rec.indexOf(String(r.id))<0)return false;
    if(S.plat!=='all'&&(r.platform||'Other')!==S.plat)return false;
    return !q||[title(r),r.platform,r.type,r.description].join(' ').toLowerCase().indexOf(q)>-1;});
  var t=function(r){return new Date(r.created_at||0).getTime()||0;};
  if(S.tab==='recent')l.sort(function(a,b){return rec.indexOf(String(a.id))-rec.indexOf(String(b.id));});
  else l.sort(function(a,b){return S.sort==='lo'?a.price-b.price:S.sort==='hi'?b.price-a.price:S.sort==='stock'?stock(b)-stock(a):t(b)-t(a);});
  return l;
}
function card(r){
  var n=stock(r),id=esc(r.id);
  return '<div class="card"><button class="card-btn" data-open="'+id+'" style="text-align:left;display:flex;flex-direction:column;flex:1" aria-label="View '+esc(title(r))+'"><div class="ph">'+img(r)+'</div><div class="cb"><span class="pl">'+esc(r.platform||'Other')+'</span><span class="ti">'+esc(title(r))+'</span>'+
    (r.description?'<span class="ds">'+esc(r.description)+'</span>':'')+'<span class="pr"><span>'+esc(money(r.price))+'</span><span class="st'+(n?'':' out')+'">'+(n?n.toLocaleString()+' in stock':'Out of stock')+'</span></span></div></button>'+
    '<button class="fav'+(S.fav[String(r.id)]?' on':'')+'" data-fav="'+id+'" aria-label="Save">'+ico(P.heart,'')+'</button></div>';
}
function stateH(ic,t,m,a){return '<div class="state">'+ico(ic,'')+'<h2>'+esc(t)+'</h2><p>'+esc(m)+'</p>'+(a||'')+'</div>';}
function render(){
  $('nav').innerHTML=[['market','Marketplace'],['fav','Favorites'],['recent','Recently viewed']].map(function(t){return '<button data-tab="'+t[0]+'" class="'+(S.tab===t[0]?'on':'')+'">'+t[1]+'</button>';}).join('')+
    '<a href="'+T.orders+'">My orders</a><a href="'+T.support+'">Support</a>';
  $('chips').innerHTML=S.rows.length?'<button class="chip'+(S.plat==='all'?' on':'')+'" data-plat="all">All</button>'+platforms().map(function(p){return '<button class="chip'+(S.plat===p.k?' on':'')+'" data-plat="'+esc(p.k)+'">'+esc(p.k)+' \u00b7 '+p.n+'</button>';}).join(''):'';
  $('tools').hidden=S.tab==='recent';if(ddSort)ddSort.setValue(S.sort);
  var c=$('list');
  if(S.load==='loading'){c.innerHTML='<div class="grid">'+'<div class="sk"></div>'.repeat(6)+'</div>';$('meta').textContent='';return;}
  if(S.load==='err'){c.innerHTML=stateH(P.alert,S.err==='offline'?'You\u2019re offline':'Couldn\u2019t load accounts','Check your connection and try again.','<button class="btn pri" data-act="retry">Try again</button>');$('meta').textContent='';return;}
  var l=visible();$('meta').textContent=l.length?l.length.toLocaleString()+(l.length===1?' account':' accounts'):'';
  if(!l.length){
    var none=!S.rows.length?stateH(P.user,'No accounts available','New listings will show up here.')
      :S.tab==='fav'?stateH(P.heart,'No favorites yet','Tap the heart on an account to save it.')
      :S.tab==='recent'?stateH(P.user,'Nothing viewed yet','Accounts you open will show up here.')
      :stateH(P.alert,'No matching accounts','Try another search or platform.','<button class="btn" data-act="clear">Clear filters</button>');
    c.innerHTML=none;return;
  }
  c.innerHTML='<div class="grid">'+l.map(card).join('')+'</div>';
}

/* details + purchase */
function findRow(id){for(var i=0;i<S.rows.length;i++)if(String(S.rows[i].id)===String(id))return S.rows[i];return null;}
function openItem(id){var r=findRow(id);if(!r)return;S.sel=r;S.buy='idle';S.order=null;pushRecent(r.id);drawSheet();$('scrim').hidden=false;$('sheet').hidden=false;
  try{history.replaceState(null,'','?id='+encodeURIComponent(r.id));}catch(e){}}
function closeSheet(){S.sel=null;$('scrim').hidden=true;$('sheet').hidden=true;try{history.replaceState(null,'',location.pathname);}catch(e){}if(S.tab==='recent')render();}
function openFromUrl(){var id=new URLSearchParams(location.search).get('id');if(id&&!S.sel)openItem(id);}
function drawSheet(){
  var r=S.sel;if(!r)return;var n=stock(r),b=S.buy,h='';
  h+='<div style="display:flex;justify-content:flex-end;gap:4px;margin-bottom:6px"><button class="ib" data-fav="'+esc(r.id)+'" aria-label="Save" style="'+(S.fav[String(r.id)]?'color:var(--ink)':'')+'">'+ico(P.heart,'')+'</button><button class="ib" data-act="close" aria-label="Close">'+ico(P.x,'')+'</button></div>';
  if(b==='done'){
    return $('sheet').innerHTML=h+'<div class="ok">'+ico(P.check,'')+'<div class="h2">Purchase successful</div><p style="color:var(--ink2);margin:4px 0 12px">'+esc(S.order?'Your account details are ready in your order.':'Your order was placed. Details appear in your order once delivered.')+'</p>'+
      '<a class="btn pri" href="'+T.orders+(S.order?'&id='+encodeURIComponent(S.order):'')+'">View order</a></div>';
  }
  h+='<div class="big">'+img(r,1)+'</div><span class="pl">'+esc(r.platform||'Other')+'</span><div class="h2">'+esc(title(r))+'</div>';
  if(r.type&&r.name)h+='<div style="color:var(--ink3)">'+esc(r.type)+'</div>';
  if(r.description)h+='<p class="desc">'+esc(r.description)+'</p>';
  var f=Array.isArray(r.features)?r.features:[];
  if(f.length)h+='<ul class="feat">'+f.map(function(x){return '<li>'+ico(P.ok,'')+'<span>'+esc(x)+'</span></li>';}).join('')+'</ul>';
  h+='<div class="st'+(n?'':' out')+'">'+(n?n.toLocaleString()+' available':'Out of stock')+'</div>';
  h+='<div class="buy"><b>'+esc(money(r.price))+'</b>';
  if(b==='confirm')h+='<span style="display:flex;gap:6px"><button class="btn" data-act="keep">Cancel</button><button class="btn pri" data-act="pay">Pay '+esc(money(r.price))+'</button></span>';
  else h+='<button class="btn pri" data-act="buy"'+(!n||b==='busy'?' disabled':'')+'>'+(b==='busy'?'Processing\u2026':n?'Buy now':'Out of stock')+'</button>';
  h+='</div>'+(b==='confirm'?'<p style="color:var(--ink3);margin:8px 0 0;text-align:right">Paid from your wallet balance. Details are delivered instantly.</p>':'');
  $('sheet').innerHTML=h;
}
async function pay(){
  var r=S.sel;if(!r||S.buy==='busy')return;
  if(!uid){location.href='login.html';return;}
  S.buy='busy';drawSheet();
  try{
    var res=await sb.rpc(T.rpc,{p_type_id:String(r.id)});
    if(res.error)throw res.error;
    var d=Array.isArray(res.data)?res.data[0]:res.data;
    S.order=d&&(d.order_id||d.id)||null;S.buy='done';
    var f=findRow(r.id);if(f)f.stock=Math.max(0,stock(f)-1);render();
  }catch(e){
    var m=String(e&&e.message||'').toLowerCase();S.buy='idle';
    toast(m.indexOf('insufficient_balance')>-1?'Insufficient wallet balance':m.indexOf('insufficient_stock')>-1||m.indexOf('out_of_stock')>-1?'Sorry, this account just sold out':m.indexOf('not_authenticated')>-1?'Please sign in again':'Purchase failed. You weren\u2019t charged \u2014 try again.');
    console.warn('purchase failed:',e&&e.message);
    if(m.indexOf('insufficient_balance')>-1){drawSheet();setTimeout(function(){location.href='index.html?page=addfunds';},1200);return;}
    loadListings();
  }
  drawSheet();
}

/* events */
function wire(){
  $('nav').addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(b){S.tab=b.getAttribute('data-tab');render();}});
  $('chips').addEventListener('click',function(e){var b=e.target.closest('[data-plat]');if(b){S.plat=b.getAttribute('data-plat');render();}});
  var qt;$('q').addEventListener('input',function(){var v=this.value;clearTimeout(qt);qt=setTimeout(function(){S.q=v;render();},120);});
  ddSort=new Dropdown($('sortDd'),{label:'Sort accounts',onChange:function(v){S.sort=v;render();}});ddSort.setOptions(SORTS);ddSort.setValue(S.sort);
  document.addEventListener('pointerdown',function(e){if(!openDD)return;if(openDD.menu.contains(e.target)||openDD.btn.contains(e.target))return;openDD.close(false);},true);
  window.addEventListener('resize',function(){if(openDD)openDD.position();});
  window.addEventListener('scroll',function(e){if(openDD&&!openDD.menu.contains(e.target))openDD.position();},true);
  document.addEventListener('click',function(e){
    var f=e.target.closest('[data-fav]');if(f){e.stopPropagation();toggleFav(f.getAttribute('data-fav'));return;}
    var o=e.target.closest('[data-open]');if(o){openItem(o.getAttribute('data-open'));return;}
    var a=e.target.closest('[data-act]');if(!a)return;var act=a.getAttribute('data-act');
    if(act==='retry')loadListings();
    else if(act==='clear'){S.q='';S.plat='all';$('q').value='';render();}
    else if(act==='close')closeSheet();
    else if(act==='buy'){if(!uid){location.href='login.html';return;}S.buy='confirm';drawSheet();}
    else if(act==='keep'){S.buy='idle';drawSheet();}
    else if(act==='pay')pay();
  });
  $('scrim').addEventListener('click',closeSheet);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!openDD&&S.sel&&S.buy!=='busy')closeSheet();});
  $('back').addEventListener('click',function(){var r=document.referrer;if(history.length>1&&r&&r.indexOf(location.origin)===0)history.back();else location.href='index.html';});
}
async function boot(){
  if(!window.supabase){$('list').innerHTML=stateH(P.alert,'Couldn\u2019t load the page','A required script didn\u2019t load. Check your connection.','<button class="btn pri" onclick="location.reload()">Reload</button>');return;}
  sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);wire();render();
  try{var u=await sb.auth.getUser();uid=u.data&&u.data.user?u.data.user.id:null;}catch(e){}
  loadListings();loadFavs();
}
boot();
})();
</script>
</body>
