<script>
/* ══ PWA GATE ══
   landing.html is the default page for a normal browser visit. A
   plain browser visit that lands here directly (typing the URL, a
   bookmark, a search-engine click, a page refresh) — without ever
   having gone through the landing page — is sent to landing.html. An
   installed PWA (opened from the home-screen/app icon) skips the
   landing page entirely and opens here directly, since forcing an
   installed app through a marketing page first would defeat the
   point of installing it. The sessionStorage flag also means
   navigating here from the landing page's "Open Global Digits"/"Log
   In" buttons, and a Google OAuth redirect back to this exact page,
   are never bounced to landing.html mid-flow. Runs synchronously,
   before anything else on the page loads, so there's no flash of app
   UI before the redirect. Any detection failure fails OPEN (into the
   app) rather than trapping the user. */
(function(){
  try{
    // BUG FIX (referral links): a referred friend's very first click is
    // almost always exactly the case this gate redirects — a plain
    // browser visit, not standalone, not yet "entered from landing" —
    // and the redirect below replaces the URL with a bare
    // '/landing.html', dropping any ?ref=CODE query string with it
    // before refer-earn.js's captureReferralCodeFromUrl() ever gets a
    // chance to read it. That silently lost the referral on every link
    // click that went through landing.html. Stash it into localStorage
    // right here, first thing, before any redirect can strip it —
    // captureReferralCodeFromUrl() already reads this same key as a
    // fallback, so the code survives the landing.html round trip intact
    // even though the final URL back on this page has no ?ref= on it.
    try{
      var refFromUrl=new URLSearchParams(window.location.search).get('ref');
      if(refFromUrl&&refFromUrl.trim())localStorage.setItem('gd_pending_ref_code',refFromUrl.trim().toUpperCase());
    }catch(refErr){}
    var isStandalone=
      (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||
      window.navigator.standalone===true|| // iOS "Add to Home Screen"
      document.referrer.indexOf('android-app://')===0; // Android TWA/installed
    var enteredFromLanding=sessionStorage.getItem('gd_entered_app')==='1';
    if(!isStandalone&&!enteredFromLanding){
      window.location.replace('/landing.html');
    }
  }catch(e){/* fail open — never block access to the app */}
})();
</script>

async function submitBoost(){
  if(!currentUser){toast('Please log in');return;}
  var target=(document.getElementById('boostTarget')||{}).value||'';
  var qty=parseInt((document.getElementById('boostQty')||{}).value||'500');
  if(!target.trim()){toast('Enter your profile URL or username');return;}
  var costNgn=calcBoostCost(currentBoostType,qty);
  var costUsd=ngnToUsd(costNgn);

  var wallet=boostWallet;
  var cost=wallet==='usd'?costUsd:costNgn;
  if(wallet==='usd'&&cost===null){toast('USD pricing is not available right now');return;}

  // Fast client-side pre-check for responsive UX only — the real,
  // authoritative check happens atomically in the database below, so a
  // stale cached balance here can never cause an incorrect charge.
  var haveInWallet=wallet==='usd'?(currentUser.balanceUsd||0):(currentUser.balance||0);
  if(haveInWallet<cost){
    // Per spec: never block outright if the OTHER wallet can cover it —
    // offer the switch instead of silently deducting from anything.
    var otherWallet=wallet==='usd'?'ngn':'usd';
    var otherCost=otherWallet==='usd'?costUsd:costNgn;
    var otherHave=otherWallet==='usd'?(currentUser.balanceUsd||0):(currentUser.balance||0);
    if(otherCost!==null&&otherHave>=otherCost){
      selectBoostWallet(otherWallet);
      toast('Insufficient '+wallet.toUpperCase()+' balance — switched to '+otherWallet.toUpperCase()+' Wallet. Tap Place Order again to confirm.');
    }else{
      toast('Insufficient balance in either wallet');
      nav('addfunds');
    }
    return;
  }

  var btn=document.getElementById('boostSubmitBtn');
  if(btn){if(btn.disabled)return;btn.disabled=true;btn.textContent='Processing…';}
  var clientRef='boost_'+wallet+'_'+currentUser.id+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
  try{
    var title=currentBoostPlat+' '+currentBoostType+' x'+qty.toLocaleString()+(currentBoostRefill==='refill'?' (Refill)':'');
    var debitFn=wallet==='usd'?'debit_usd_wallet_for_purchase':'debit_wallet_for_purchase';
    var dR=await sb.rpc(debitFn,{
      p_user_id:currentUser.id,p_amount:cost,p_category:'purchase',p_title:title,p_client_ref:clientRef
    });
    var dRow=Array.isArray(dR.data)?dR.data[0]:dR.data;
    if(dR.error||!dRow||!dRow.success){
      toast((dRow&&dRow.message)||(dR.error&&dR.error.message)||'Could not process payment');
      return;
    }
    if(wallet==='usd')updateUsdWalletDisplay(dRow.new_balance);else updateWalletDisplay(dRow.new_balance);

    var bR=await sb.from('boost_orders').insert({
      user_id:currentUser.id,platform:currentBoostPlat,boost_type:currentBoostType,
      quantity:qty,target_url:target,amount:cost,currency:wallet,status:'pending',refill_type:currentBoostRefill
    }).select().single();

    if(!bR.data){
      // Order record failed to create after a successful debit — refund
      // immediately so the customer is never charged with nothing to show
      // for it. Same client_ref family, so a retry of this exact failure
      // can't double-refund either.
      var refundFn=wallet==='usd'?'credit_usd_wallet_refund':'credit_wallet_refund';
      await sb.rpc(refundFn,{
        p_user_id:currentUser.id,p_amount:cost,p_category:'refund',
        p_title:'Refund — Boost order could not be created',p_client_ref:'refund_'+clientRef
      }).then(function(rR){
        var rRow=Array.isArray(rR.data)?rR.data[0]:rR.data;
        if(rRow&&rRow.new_balance!==undefined){if(wallet==='usd')updateUsdWalletDisplay(rRow.new_balance);else updateWalletDisplay(rRow.new_balance);}
      });
      toast('Could not place order — you have been refunded');
      return;
    }

    // Attempt to place the real order with the boost provider right away by
    // automatically matching against the provider's live service catalog —
    // no manual Service ID setup required. If no confident match is found or
    // the provider is unreachable, the order simply stays 'pending' for admin
    // to send manually — nothing is lost, payment has already been recorded.

async function callRapidBills(endpoint,payload,type){

    '/buy-airtime/':'buy-airtime','/buy-data/':'buy-data',
    '/buy-cable/':'buy-cable','/buy-power/':'buy-power','/catalog/':'catalog'
  };

      body:JSON.stringify({action,payload})};

      return{success:true,ref:data.tx_ref||data.reference||idKey,token:data.token||(data.data&&data.data.token)||'',data};

async function callSmmApi(action,payload){

    });

    if(!res.ok||data.error){return{success:false,message:(data.error||'Provider request failed')+' (HTTP '+res.status+')',data};}

  }catch(e){return{success:false,message:e.message||'Network error contacting boost provider'};}
}
// AccountHubMarket ("Logs"/SM account marketplace) proxy call — mirrors
// callSmmApi above. action is one of: 'create_order','order_status'.
// The Edge Function does the actual accounthubmarket.com call server-side.
// errText() turns any error shape into readable text instead of letting
// `+` coerce an object into the literal string "[object Object]".
function errText(x){
  if(x==null)return '';
  if(typeof x==='string')return x;
  if(x instanceof Error)return x.message;
  if(typeof x==='object'){
    if(typeof x.message==='string')return x.message;
    if(typeof x.error==='string')return x.error;
    if(x.error&&typeof x.error==='object')return errText(x.error);
    try{return JSON.stringify(x);}catch(e){return String(x);}
  }
  return String(x);
}

// Automatically finds the best-matching provider service for a platform + boost
// type + refill preference — no manual Service ID entry required.
async function resolveProviderService(platform,boostType,refillType){
  var catalog=await getSmmServicesCatalog();
  if(!catalog)return null;
  var platformKeywords={Instagram:['instagram','insta','ig '],TikTok:['tiktok','tik tok'],Facebook:['facebook','fb '],YouTube:['youtube','you tube','yt '],Twitter:['twitter','x.com','tweet']};
  var typeKeywords={Followers:['follower'],Likes:['like'],Views:['view'],Comments:['comment'],Shares:['share']};
  var pKeys=platformKeywords[platform]||[String(platform||'').toLowerCase()];
  var tKeys=typeKeywords[boostType]||[String(boostType||'').toLowerCase()];
  var wantsRefill=refillType==='refill';
  function textOf(s){return ((s.name||'')+' '+(s.category||'')+' '+(s.type||'')).toLowerCase();}
  var matches=catalog.filter(function(s){
    var t=textOf(s);
    return pKeys.some(function(k){return t.indexOf(k)>-1;})&&tKeys.some(function(k){return t.indexOf(k)>-1;});
  });
  if(!matches.length)return null;
  var refillMatches=matches.filter(function(s){return wantsRefill?(s.refill===true||textOf(s).indexOf('refill')>-1):(s.refill!==true&&textOf(s).indexOf('refill')===-1);});
  var pool=refillMatches.length?refillMatches:matches;
  var defaultOnes=pool.filter(function(s){return textOf(s).indexOf('default')>-1;});
  return (defaultOnes.length?defaultOnes:pool)[0];
}

function buildCatalogBuckets(raw){
  var buckets={};
  function isRecord(item){return item&&typeof item==='object'&&!Array.isArray(item);}
  function hasFields(item){
    var keys=Object.keys(item).map(function(k){return k.toLowerCase();});
    var hasName=keys.some(function(k){return['name','provider','network','label','title','plan','size','bundle'].indexOf(k)!==-1;});
    var hasId=keys.some(function(k){return['price','amount','id','provider_id','bundle_id','plan_id'].indexOf(k)!==-1;});
    return hasName&&hasId;
  }
  function walk(node,path){
    if(Array.isArray(node)){
      if(node.length&&isRecord(node[0])&&hasFields(node[0])){
        if(!buckets[path])buckets[path]=[];
        buckets[path]=buckets[path].concat(node);
      }else{node.forEach(function(item){if(isRecord(item))walk(item,path);});}
    }else if(isRecord(node)){
      Object.keys(node).forEach(function(k){walk(node[k],path?path+' > '+k:k);});
    }
  }
  walk(raw,'');return buckets;
}
function findProviderId(catalog,kind,name){
  if(!catalog)return null;
  var nameUpper=name.toUpperCase();
  var bucketKeys=Object.keys(catalog);
  var preferred=bucketKeys.filter(function(k){return k.toLowerCase().indexOf(kind.toLowerCase())!==-1;});
  var search=preferred.length?preferred:bucketKeys;
  for(var bi=0;bi<search.length;bi++){
    var items=catalog[search[bi]]||[];
    for(var i=0;i<items.length;i++){
      var p=items[i];
      var fields=[p.name,p.provider,p.network,p.label,p.title,p.disco].filter(Boolean);
      for(var f=0;f<fields.length;f++){
        if(fields[f].toString().toUpperCase().indexOf(nameUpper)!==-1)return p.id||p.provider_id||p.ID;
      }
    }
  }
  return null;
}
/* Data catalog helper */
function parseSizeToMB(s){
  if(!s)return null;
  var m=s.toString().toUpperCase().match(/([\d.]+)\s*(MB|GB)/);
  if(!m)return null;
  var n=parseFloat(m[1]);return isNaN(n)?null:(m[2]==='GB'?n*1024:n);
}
function formatSizeDisplay(s){
  if(!s)return{num:'',unit:'',raw:'Plan'};
  var m=s.toString().toUpperCase().match(/([\d.]+)\s*(MB|GB)/);
  if(!m)return{num:'',unit:'',raw:s.toString()};
  var n=parseFloat(m[1]);
  var ns=(n%1===0)?n.toString():n.toString().replace(/0+$/,'').replace(/\.$/,'');
  return{num:ns,unit:m[2],raw:''};
}
function getDataBundles(catalog,networkUpper){
  if(!catalog)return[];
  var keys=Object.keys(catalog);
  var all=[];
  keys.filter(function(k){var l=k.toLowerCase();return l.indexOf('bundle')!==-1||l.indexOf('data')!==-1;})
    .forEach(function(k){
      (catalog[k]||[]).forEach(function(p){
        // Tag with the source bucket path for category classification —
        // purely a client-side label, never sent to the provider and
        // never touches the plan's own identifiers/price/mapping fields.
        if(p._bucketKey===undefined)p._bucketKey=k;
        all.push(p);
      });
    });
  var providerId=findProviderId(catalog,'airtime',networkUpper);
  var filtered=all.filter(function(p){
    var fields=[p.network,p.provider,p.network_name,p.service_provider,p.telecom,p.operator];
    for(var i=0;i<fields.length;i++){
      if(!fields[i])continue;
      if(fields[i].toString().toUpperCase().indexOf(networkUpper)!==-1)return true;
    }
    if(providerId&&(p.provider_id===providerId||p.network_id===providerId))return true;
    return false;
  });
  return filtered.length?filtered:all;
}
function classifyDuration(plan){
  var v=(plan.validity||plan.duration||plan.period||'').toString().toLowerCase();
  if(!v)return 'monthly';
  // If the text explicitly says "month" or "week", trust that first —
  // this avoids misreading something like "1 Month" as 1 day.
  if(v.indexOf('month')!==-1)return 'monthly';
  if(v.indexOf('week')!==-1)return 'weekly';
  // Otherwise classify purely by the first number found, regardless
  // of what word (if any) follows it.
  var nm=v.match(/(\d+)/);
  var num=nm?parseInt(nm[1]):null;
  if(num===null)return 'monthly';
  if(num===1||num===2||num===3)return 'daily';
  if(num>=7&&num<30)return 'weekly';
  if(num>=30)return 'monthly';
  return 'monthly';
}
// Classifies a data plan into one of the 6 category tabs. The provider's
// catalog doesn't come with a fixed "category" field we can rely on, so
// this reads whatever text is available — the catalog bucket path the plan
// was grouped under (e.g. "data > sme_bundle") plus the plan's own
// name/type/category/label fields — and matches common industry terms
// for each category. Nothing here invents or changes plan data; it only
// decides which existing tab a plan is shown under. Falls back to SME
// (the standard/default data type) if nothing else matches, so a plan the
// heuristic can't confidently place still stays visible and purchasable
// rather than silently disappearing.
function classifyDataCategory(bucketKey,plan){
  var s=((bucketKey||'')+' '+(plan.plan_type||plan.type||plan.category||plan.name||plan.label||plan.bundle||'')).toString().toLowerCase();
  if(/\bawoof\b/.test(s))return'awoof';
  if(/\bcg\b|corporate\s*gift/.test(s))return'cg';
  if(/\bshar(e|ing)?\b/.test(s))return'sharing';
  if(/\bgift(ing)?\b/.test(s))return'gifting';
  if(/\bspecial\b/.test(s))return'special';
  if(/\bsme\b/.test(s))return'sme';
  return'sme';
}

  return '<h2>Account</h2><div class="list">'+f("Name",u.name)+f("Email",u.email)+f("Phone",u.phone)+f("Country",u.country)+'</div><div class="set"><button class="gb ghost" onclick="window.Vtu2OpenSettingsPin&&Vtu2OpenSettingsPin()">'+ic("shield")+'VTU PIN</button><button class="gb ghost" onclick="GD.go(GD.ROUTES.security)">'+ic("shield")+'Security</button><button class="gb ghost" onclick="GD.signOut()">Sign out</button></div>'}

/* ── dynamic catalog (nothing hardcoded: categories/services come from the database) ── */
GD.cat=[];
GD.catalog=async function(){
 var res=await Promise.all([
  sb.from("sm_account_types").select("*").eq("active",true).order("platform"),
  sb.from("verification_services").select("*"),
  sb.from("country_prices").select("*"),
  sb.from("boost_prices").select("*")]);
 var lab=function(r){return r.name||r.title||r.service||r.service_name||r.platform||r.country||""};
 var mk=function(kind,rows,url,icon){return(rows||[]).map(function(r){return{kind:kind,label:lab(r),url:url,icon:icon,id:r.id}}).filter(function(x){return x.label})};
 GD.cat=[].concat(mk("Accounts",res[0].data,GD.ROUTES.accounts,"users"),mk("Verification",res[1].data,GD.ROUTES.numbers,"phone"),mk("Numbers",res[2].data,GD.ROUTES.numbers,"phone"),mk("Boost",(res[3].data||[]).map(function(r){return{id:r.id,name:r.boost_type}}),"#/boost","bolt"));
 var kinds={};GD.cat.forEach(function(c){(kinds[c.kind]=kinds[c.kind]||{n:0,u:c.url,i:c.icon}).n++});
 var h=Object.keys(kinds).map(function(k){return '<div class="tile" data-go="'+kinds[k].u+'"><div class="ic">'+ic(kinds[k].i)+'</div><b>'+esc(k)+'</b><span>'+kinds[k].n+' available</span></div>'}).join("");
 $("svc").innerHTML=h||'<div class="emp">No services available right now.</div>';
};
$("q").addEventListener("input",function(){
 var v=this.value.trim().toLowerCase(),o=$("results");
 if(!v){o.innerHTML="";return}
 var m=GD.cat.filter(function(c){return c.label.toLowerCase().indexOf(v)>-1}).slice(0,12);
 o.innerHTML='<div class="list" style="margin-top:10px">'+(m.length?m.map(function(c){return '<a class="li" href="'+c.url+'" data-go="'+c.url+'"><div class="ic">'+ic(c.icon)+'</div><div><b>'+esc(c.label)+'</b><small>'+esc(c.kind)+'</small></div></a>'}).join(""):'<div class="emp">No matching services.</div>')+'</div>';
});

/* ── transactions ── */

 var d=r.data||[];

/* ── custom dropdown: every <select> becomes an in-page sheet, so the phone's native picker never opens ── */
GD.dd=(function(){
 var ov,sh,ul,ttl,inp,cur=null,items=[],act=-1,chev='<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';
 function build(){if(ov)return;
  ov=document.createElement("div");ov.id="ddov";
  ov.innerHTML='<div id="ddsh" role="dialog" aria-modal="true"><header><span id="ddt"></span><button type="button" aria-label="Close">'+ic("x")+'</button></header><input type="search" placeholder="Search" aria-label="Search options" hidden/><ul role="listbox"></ul></div>';
  document.body.appendChild(ov);sh=ov.firstChild;ul=sh.querySelector("ul");ttl=sh.querySelector("#ddt");inp=sh.querySelector("input");
  ov.addEventListener("click",function(e){if(e.target===ov)close()});
  sh.querySelector("header button").onclick=close;
  inp.addEventListener("input",function(){var q=inp.value.trim().toLowerCase();items.forEach(function(it){it.li.hidden=q&&it.text.toLowerCase().indexOf(q)<0});act=-1});
  ov.addEventListener("keydown",function(e){
   var vis=items.filter(function(it){return !it.li.hidden&&!it.dis});
   if(e.key==="Escape"){e.preventDefault();close()}
   else if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(!vis.length)return;var i=vis.findIndex(function(it){return it.li.classList.contains("act")});i=e.key==="ArrowDown"?Math.min(i+1,vis.length-1):Math.max(i-1,0);mark(vis[i])}
   else if(e.key==="Enter"){var a=vis.find(function(it){return it.li.classList.contains("act")});if(a){e.preventDefault();pick(a.i)}}
  });
 }
 function mark(it){items.forEach(function(x){x.li.classList.remove("act")});it.li.classList.add("act");it.li.scrollIntoView({block:"nearest"})}
 function sync(s){var d=s._dd;if(!d)return;var o=s.options[s.selectedIndex],t=d.b.firstChild;
  t.textContent=o?o.text.trim():"Select";t.classList.toggle("ph",!o||o.value==="");d.b.disabled=s.disabled}
 function pick(i){var s=cur;if(!s)return;var o=s.options[i];if(!o||o.disabled)return;
  var changed=s.selectedIndex!==i;s.selectedIndex=i;var b=s._dd.b;close();
  if(changed){s.dispatchEvent(new Event("input",{bubbles:true}));s.dispatchEvent(new Event("change",{bubbles:true}))}
  b.focus()}
 function open(s){build();if(s.disabled)return;cur=s;
  var lab=s.closest(".fG"),l=lab&&lab.querySelector("label");ttl.textContent=(l&&l.textContent.trim())||"Select";
  ul.innerHTML="";items=[];
  Array.prototype.forEach.call(s.options,function(o,i){var li=document.createElement("li");li.setAttribute("role","option");
   li.setAttribute("aria-selected",i===s.selectedIndex);if(o.disabled)li.setAttribute("aria-disabled","true");if(o.value==="")li.className="ph";
   li.textContent=o.text.trim();li.onclick=function(){pick(i)};ul.appendChild(li);items.push({li:li,i:i,text:li.textContent,dis:o.disabled})});
  inp.value="";inp.hidden=items.length<9;ov.classList.add("open");s._dd.b.setAttribute("aria-expanded","true");
  var sel=items[s.selectedIndex];if(sel)sel.li.scrollIntoView({block:"center"});
  (inp.hidden?ul:inp).tabIndex=-1;(inp.hidden?ul:inp).focus({preventScroll:true});
  if(sel)mark(sel)}
 function close(){if(!ov||!ov.classList.contains("open"))return;ov.classList.remove("open");if(cur&&cur._dd)cur._dd.b.setAttribute("aria-expanded","false");cur=null}
 function enhance(s){if(s._dd||s.multiple||s.hasAttribute("data-native"))return;
  var w=document.createElement("div"),b=document.createElement("button");w.className="ddw";
  b.type="button";b.className="fI ddb";b.setAttribute("aria-haspopup","listbox");b.setAttribute("aria-expanded","false");b.innerHTML='<span class="t"></span>'+chev;
  s.parentNode.insertBefore(w,s);w.appendChild(b);w.appendChild(s);s.classList.add("dd-native");s.tabIndex=-1;s.setAttribute("aria-hidden","true");
  s._dd={w:w,b:b};b.onclick=function(){open(s)};
  var pd=Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,"value"),pi=Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,"selectedIndex");
  Object.defineProperty(s,"value",{get:function(){return pd.get.call(s)},set:function(v){pd.set.call(s,v);sync(s)},configurable:true});
  Object.defineProperty(s,"selectedIndex",{get:function(){return pi.get.call(s)},set:function(v){pi.set.call(s,v);sync(s)},configurable:true});
  new MutationObserver(function(){sync(s)}).observe(s,{childList:true,subtree:true,attributes:true,characterData:true});
  sync(s)}
 var q=0;function scan(){q=0;Array.prototype.forEach.call(document.querySelectorAll("select:not(.dd-native)"),enhance)}
 new MutationObserver(function(){if(!q)q=requestAnimationFrame(scan)}).observe(document.body,{childList:true,subtree:true});
 scan();
 return{close:close,scan:scan};
})();
GD.start();
</script>
