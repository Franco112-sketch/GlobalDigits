# Nginx — add inside your existing `server { ... }` block for
# globaldigits.shop. try_files serves the file's content directly for
# that request; it does not issue a redirect, so the browser's address
# bar keeps showing exactly "/" or "/app".

location = / {
    try_files /landing.html =404;
}

location = /app {
    try_files /index.html =404;
}
