<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0f1724"/>
<title>Global Digits Store</title>
<link rel="icon" type="image/x-icon" href="favicon.ico"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ── TOKENS ── */
:root{
  --brand:#1a56db;--brand-dk:#1342b0;--brand-lt:#e8f0ff;
  --success:#10b981;--danger:#ef4444;--warn:#f59e0b;
  --bg:#f3f5fb;--surface:#fff;--surface2:#eef1f8;--border:#e0e6f0;
  --text:#0d1321;--text2:#5a6580;--text3:#9aa3b8;
  --topbar-bg:#0f1724;--topbar-h:56px;
  --r:10px;--r-sm:7px;--r-lg:16px;--r-xl:22px;
  --shadow:0 2px 12px rgba(15,25,50,.08);--shadow-md:0 6px 28px rgba(15,25,50,.13);
  --grad:linear-gradient(135deg,#1a56db 0%,#1e3a8a 100%);
  --font:'Plus Jakarta Sans',sans-serif;--font-d:'Syne',sans-serif;
  --t:.17s ease;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:var(--font);cursor:pointer;border:none;background:none}
input,select,textarea{font-family:var(--font);font-size:13.5px}
.hidden{display:none!important}
img{display:block;max-width:100%}

/* ── TOPBAR ── */
#topbar{
  height:var(--topbar-h);background:var(--topbar-bg);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;position:sticky;top:0;z-index:50;gap:10px;
}
#storeBrandMark{display:flex;align-items:center;gap:10px;min-width:0}
#storeLogo{width:32px;height:32px;border-radius:9px;object-fit:cover;flex-shrink:0}
#storeLogoFallback{width:32px;height:32px;border-radius:9px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;flex-shrink:0}
#storeName{font-family:var(--font-d);font-size:15px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbarRight{display:flex;align-items:center;gap:8px;flex-shrink:0}
.walletPill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 12px;color:#fff;font-size:12px;font-weight:700;cursor:pointer}
.walletPill:hover{background:rgba(255,255,255,.18)}
.signInBtn{background:var(--brand);color:#fff;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700}
.avatarDot{width:30px;height:30px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;cursor:pointer;flex-shrink:0}

/* ── CATEGORY NAV ── */
#catNav{
  background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:0;overflow-x:auto;
  scrollbar-width:none;position:sticky;top:var(--topbar-h);z-index:40;
}
#catNav::-webkit-scrollbar{display:none}
.catNavBtn{
  padding:14px 16px;font-size:12.5px;font-weight:700;color:var(--text2);
  white-space:nowrap;border-bottom:2.5px solid transparent;transition:var(--t);flex-shrink:0;
  display:inline-flex;align-items:center;gap:6px;
}
.catNavBtn.active{color:var(--brand);border-bottom-color:var(--brand)}
.catNavBtn:hover:not(.active){color:var(--text)}

/* ── MAIN ── */
#main{max-width:900px;margin:0 auto;padding:18px 14px 80px}

/* ── HERO ── */
.storeHero{
  background:var(--grad);border-radius:var(--r-xl);padding:26px 20px 22px;
  color:#fff;margin-bottom:18px;position:relative;overflow:hidden;
}
.storeHero::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Ccircle cx='30' cy='30' r='30'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E") repeat;pointer-events:none}
.storeHero h1{font-family:var(--font-d);font-size:20px;font-weight:800;position:relative}
.storeHero p{font-size:12.5px;opacity:.82;margin-top:4px;position:relative}
.storeBannerImg{width:100%;max-height:140px;object-fit:cover;border-radius:var(--r-lg);margin-bottom:14px}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.prodGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
.prodCard{
  background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-lg);
  padding:13px;display:flex;flex-direction:column;gap:8px;
  transition:border-color var(--t),box-shadow var(--t);
}
.prodCard:hover{border-color:var(--brand);box-shadow:0 4px 18px rgba(26,86,219,.1)}
.prodCard .pName{font-weight:700;font-size:12.5px;line-height:1.3}
.prodCard .pSub{font-size:11px;color:var(--text2)}
.prodCard .pPrice{font-family:var(--font-d);font-size:16px;font-weight:800;color:var(--brand)}
.accCard{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-lg);padding:14px;margin-bottom:10px}
.tierCard{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-lg);padding:14px;margin-bottom:10px}
.countryCard{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:11px;cursor:pointer;transition:var(--t)}
.countryCard:hover,.countryCard.active{border-color:var(--brand);background:var(--brand-lt)}
.cGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:var(--r);font-weight:700;font-size:13.5px;transition:var(--t);cursor:pointer}
.btnP{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(26,86,219,.25)}
.btnP:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
.btnO{background:var(--surface);border:1.5px solid var(--border);color:var(--text)}
.btnDanger{background:#fef2f2;color:var(--danger)}
.btnSm{padding:7px 12px;font-size:12px;border-radius:8px}
.btnBlock{width:100%}

/* ── FORM ── */
.field{margin-bottom:13px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.fI{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:var(--r-sm);background:var(--surface2);color:var(--text);font-family:var(--font);font-size:13.5px;transition:var(--t)}
.fI:focus{outline:none;border-color:var(--brand);background:var(--surface)}

/* ── CHIPS / FILTERS ── */
.chipRow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:7px 13px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface);border:1.5px solid var(--border);color:var(--text2);cursor:pointer;transition:var(--t);white-space:nowrap}
.chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.chip:hover:not(.active){border-color:var(--brand);color:var(--brand)}

/* ── BADGE ── */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.badge.active,.badge.approved,.badge.paid,.badge.successful,.badge.completed{background:#dcfce7;color:#15803d}
.badge.pending,.badge.reviewing,.badge.processing{background:#fef3c7;color:#92400e}
.badge.rejected,.badge.failed,.badge.bad{background:#fee2e2;color:#b91c1c}
.badge.out{background:var(--surface2);color:var(--text3)}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(10,14,28,.6);z-index:100;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.overlay{align-items:center}}
.modal{background:var(--surface);width:100%;max-width:430px;border-radius:20px 20px 0 0;padding:20px 18px;max-height:88vh;overflow-y:auto}
@media(min-width:640px){.modal{border-radius:var(--r-xl)}}
.modalHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modalHead h3{font-size:16px;font-family:var(--font-d)}
.xBtn{width:30px;height:30px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text2)}

/* ── MISC ── */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0d1321;color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.spin{width:22px;height:22px;border:2.5px solid var(--brand-lt);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.centerBox{min-height:44vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
.empty{padding:32px 10px;text-align:center;color:var(--text3);font-size:13px}
.poweredBy{text-align:center;font-size:11px;color:var(--text3);padding:18px 0 6px}
.pSelBtn{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:700;background:var(--surface);border:1.5px solid var(--border);color:var(--text2);cursor:pointer;white-space:nowrap}
.pSelBtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.chipSel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.planGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.planCard{border:1.5px solid var(--border);border-radius:var(--r);padding:12px;cursor:pointer;transition:var(--t);text-align:center}
.planCard:hover,.planCard.active{border-color:var(--brand);background:var(--brand-lt)}
.gcZone{border:2px dashed var(--border);border-radius:var(--r);padding:22px;text-align:center;cursor:pointer;transition:var(--t)}
.gcZone:hover,.gcZone.filled{border-color:var(--brand);background:var(--brand-lt)}
</style>
</head>
<body>
<div id="topbar">
  <div id="storeBrandMark">
    <div id="storeLogoFallback">G</div>

  </div>

</div>

<div id="main"><div class="centerBox"><div class="spin"></div></div></div>
<div id="modalRoot"></div>
<div id="toastEl" class="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════
   GLOBAL DIGITS STOREFRONT — standalone file
   Connects to: Supabase pzronmbvusjwrcizxwef
   Subdomain routing: username.globaldigits.shop → ?store=username
   All data is real-time from Supabase. No demo/fake data.
═══════════════════════════════════════════════════════════ */

/* ── CONFIG ── */
const SUPA_URL='https://pzronmbvusjwrcizxwef.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB6cm9ubWJ2dXNqd3JjaXp4d2VmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNTE0MjUsImV4cCI6MjA5NDYyNzQyNX0.v6bz5YeLWKzRN4g09QYTY0x-ur5KGfeXupglKfTVKwA';
const PROXY_URL=SUPA_URL+'/functions/v1/rapidbills-proxy';
const SMM_URL=SUPA_URL+'/functions/v1/smm-proxy';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);

/* ── STATE ── */
// No customer login/wallet — the storefront is fully public. Checkout is a
// pay-and-submit-proof flow (see PENDING ORDER / CHECKOUT section below).
var _reseller=null;                  // resellers row for this subdomain
var _sub=null;                       // active subscription
var _plan=null;                      // reseller_plans row
var _permCats=[];                    // permitted product_category strings
var _markup=0;                       // reseller's markup %
var _storeParam=null;
// caches
var _countries=[];var _vtuCatalog=null;var _vtuLoading=false;
var _boostPrices={};var _gcRates=[];var _esimPlans=[];var _smAccTypes=[];
var _smmCache=null;var _smmCacheTime=0;
var _currentCat='';
// VTU state
var _vtuNet='MTN',_dataNet='MTN',_dataDur='monthly',_dataPlan=null;
var _cable='DSTV',_disco='',_meterType=1;
var _airtimeChip=0;
// Boost state
var _bPlat='Instagram',_bType='Followers',_bRefill='no_refill',_bQty=500;

/* ── UTILS ── */
function toast(msg){
  var el=document.getElementById('toastEl');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('show');},2800);
}
function fmtN(n){return '₦'+Math.round(n||0).toLocaleString();}
function fmtDate(d){if(!d)return '—';return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function qs(n){return new URL(location.href).searchParams.get(n);}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):'';}
function uid(){return'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16);});}
function marked(custPrice,base){return _markup?'<span style="font-size:10px;color:var(--text3);text-decoration:line-through;margin-left:4px">'+fmtN(base)+'</span>':'';}
function withTO(p,ms,lbl){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error((lbl||'Request')+' timed out'));},ms||12000);})]);}

function openModal(html){document.getElementById('modalRoot').innerHTML='<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">'+html+'</div></div>';}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}

function setCatActive(cat){
  _currentCat=cat;
  document.querySelectorAll('.catNavBtn').forEach(function(b){b.classList.toggle('active',b.dataset.cat===cat);});
}

/* ── PLATFORM SVG ── */
function platSvg(p,sz){
  sz=sz||18;
  var d={Instagram:'<rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>',
    TikTok:'<path d="M16.5 3c.3 2 1.7 3.6 3.7 3.9v3a7 7 0 01-3.7-1.1v6.6a5.6 5.6 0 11-5.6-5.6c.3 0 .6 0 .9.1v3.1a2.5 2.5 0 102.1 2.5V3h2.6z" fill="currentColor" stroke="none"/>',
    Facebook:'<path d="M14 9h3V6h-3c-1.7 0-3 1.3-3 3v2H9v3h2v6h3v-6h2.5l.5-3H14V9z" fill="currentColor" stroke="none"/>',
    YouTube:'<polygon points="5 3 19 12 5 21 5 3" fill="currentColor" stroke="none"/>',
    'Twitter/X':'<path d="M18 3h3l-7.5 8.6L22 21h-6.5l-5-6.6L4.8 21H2l8-9.2L2 3h6.6l4.5 6z" fill="currentColor" stroke="none"/>',
    Twitter:'<path d="M23 3a10.9 10.9 0 01-3.14 1.53 4.48 4.48 0 00-7.86 3v1A10.66 10.66 0 013 4s-4 9 5 13a11.64 11.64 0 01-7 2c9 5 20 0 20-11.5a4.5 4.5 0 00-.08-.83A7.72 7.72 0 0023 3z"/>'};
  var path=d[p]||'<path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>';
  return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+path+'</svg>';
}
/* general-purpose interface icons (replaces emoji throughout the storefront) */
function ico(name,sz){
  sz=sz||16;
  var d={
    close:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
    store:'<path d="M3 9l1-5h16l1 5M3 9v10a1 1 0 001 1h16a1 1 0 001-1V9M3 9h18M9 21V13h6v8"/>',
    phone:'<path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.79 19.79 0 012.11 4.18 2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>',
    user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0116 0v1"/>',
    trend:'<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>',
    gift:'<polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z"/>',
    satellite:'<path d="M13 7L9 3 5 7l4 4"/><path d="M17 11l4 4-4 4-4-4"/><path d="M8 12l4 4L21 7"/><path d="M3 21l4-4"/>',
    zap:'<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
    globe:'<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 010 20 15.3 15.3 0 010-20z"/>',
    shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
    camera:'<path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/>',
    check:'<polyline points="20 6 9 17 4 12"/>',
    back:'<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
    alert:'<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'
  };
  return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(d[name]||d.alert)+'</svg>';
}

/* ── PROXY HELPERS ── */
async function callRapidBills(action,payload){
  try{
    var r=await fetch(PROXY_URL,{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':uid()},body:JSON.stringify({action,payload})});
    var d=await r.json();
    if(r.ok&&(action==='catalog'||d.status===true||d.status==='true'||d.status==='success'||d.success===true))
      return{ok:true,ref:d.tx_ref||d.reference||'',token:d.token||(d.data&&d.data.token)||'',data:d};
    return{ok:false,msg:d.message||d.error||'Transaction failed'};
  }catch(e){return{ok:false,msg:e.message||'Network error'};}
}
async function callSmm(action,payload){
  try{
    var r=await fetch(SMM_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY},body:JSON.stringify({action,payload:payload||{}})});
    var d=await r.json();
    if(!r.ok||d.error)return{ok:false,msg:d.error||'Provider error',data:d};
    return{ok:true,data:d};
  }catch(e){return{ok:false,msg:e.message||'Network error'};}
}

/* ── VTU CATALOG ── */
async function loadVtuCatalog(){
  if(_vtuCatalog)return _vtuCatalog;
  if(_vtuLoading)return null;
  _vtuLoading=true;
  try{var r=await callRapidBills('catalog',{});_vtuLoading=false;if(r.ok&&r.data){_vtuCatalog=buildBuckets(r.data);return _vtuCatalog;}return null;}
  catch(e){_vtuLoading=false;return null;}
}
function buildBuckets(raw){
  var b={};
  function isR(x){return x&&typeof x==='object'&&!Array.isArray(x);}
  function hasF(x){var ks=Object.keys(x).map(function(k){return k.toLowerCase();});return ks.some(function(k){return['name','provider','network','label','plan','size','bundle'].indexOf(k)>-1;})&&ks.some(function(k){return['price','amount','id','bundle_id','plan_id'].indexOf(k)>-1;});}
  function walk(n,p){if(Array.isArray(n)){if(n.length&&isR(n[0])&&hasF(n[0])){if(!b[p])b[p]=[];b[p]=b[p].concat(n);}else n.forEach(function(x){if(isR(x))walk(x,p);});}else if(isR(n)){Object.keys(n).forEach(function(k){walk(n[k],p?p+'>'+k:k);});}}
  walk(raw,'');return b;
}
function findProvider(kind,name){
  if(!_vtuCatalog)return null;
  var nu=name.toUpperCase();var keys=Object.keys(_vtuCatalog);
  var pref=keys.filter(function(k){return k.toLowerCase().indexOf(kind.toLowerCase())>-1;});
  var src=pref.length?pref:keys;
  for(var i=0;i<src.length;i++){for(var j=0;j<(_vtuCatalog[src[i]]||[]).length;j++){var p=_vtuCatalog[src[i]][j];var fs=[p.name,p.provider,p.network,p.label,p.disco].filter(Boolean);for(var f=0;f<fs.length;f++){if(fs[f].toString().toUpperCase().indexOf(nu)>-1)return p.id||p.provider_id||p.ID;}}}
  return null;
}
function parseMB(s){if(!s)return null;var m=s.toString().toUpperCase().match(/([\d.]+)\s*(MB|GB)/);if(!m)return null;var n=parseFloat(m[1]);return isNaN(n)?null:(m[2]==='GB'?n*1024:n);}
function classifyDur(p){var v=(p.validity||p.duration||'').toString().toLowerCase();if(v.indexOf('month')>-1)return 'monthly';if(v.indexOf('week')>-1)return 'weekly';var n=parseInt((v.match(/(\d+)/)||[])[1]);if(!n)return 'monthly';if(n<=3)return 'daily';if(n<30)return 'weekly';return 'monthly';}
function dataBundles(net){

  var all=[];Object.keys(_vtuCatalog).filter(function(k){var l=k.toLowerCase();return l.indexOf('bundle')>-1||l.indexOf('data')>-1;}).forEach(function(k){all=all.concat(_vtuCatalog[k]);});

async function compressImg(file){
  return new Promise(function(res){
    var r=new FileReader();r.onload=function(e){var img=new Image();img.onload=function(){var c=document.createElement('canvas');var max=800,w=img.width,h=img.height;if(w>max){h=Math.round(h*max/w);w=max;}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',.75));};img.src=e.target.result;};r.readAsDataURL(file);
  });
}

/* ── ORDER TRACKING — customer has no account, so a private tracking code
   (shown once, right after payment submission) is their receipt number.
   Status updates live via Supabase Realtime, no manual refresh needed.
   Supabase (reseller_storefront_orders.tracking_code) is always the source
   of truth — localStorage here only remembers the customer's most recent
   tracking code, purely as a same-device convenience, scoped per store so
   different storefronts on this browser don't clash. ── */
function _recentOrderKey(){return 'gd_sf_recent_'+(_storeParam||'store');}
function saveRecentOrder(code){
  if(!code)return;
  try{localStorage.setItem(_recentOrderKey(),JSON.stringify({code:code,ts:Date.now()}));}catch(e){}
}
function getRecentOrder(){
  try{
    var raw=localStorage.getItem(_recentOrderKey());
    if(!raw)return null;
    var parsed=JSON.parse(raw);
    return parsed&&parsed.code?parsed:null;
  }catch(e){return null;}
}

function attachTrackChannel(orderId){

        // has the joined reseller_username/store_name fields too.
        openTrackOrder(_trackedCode);

      .subscribe();
  }catch(e){console.warn('Realtime subscription failed (status will still update on manual re-check):',e);}
}

const CAT_META={
  numbers:{label:'Virtual Numbers',icon:'phone'},
  accounts:{label:'SM Accounts',icon:'user'},
  boost:{label:'Boosting',icon:'trend'},
  giftcard:{label:'Gift Cards',icon:'gift'},
  esim:{label:'eSIM',icon:'satellite'},
  vtu:{label:'VTU / Airtime & Data',icon:'zap'}
};
function buildStoreUI(){
  var r=_reseller;
  // Hero
  var heroHtml='<div class="storeHero">'+
    (r.banner_url?'<img class="storeBannerImg" src="'+esc(r.banner_url)+'"/>':'')+
    '<h1>'+esc(r.store_name||r.username)+'</h1>'+
    (r.description?'<p>'+esc(r.description)+'</p>':'')+
  '</div>';
  // Topbar branding
  var fallback=document.getElementById('storeLogoFallback');
  if(r.logo_url){
    var img=new Image();img.onload=function(){
      fallback.outerHTML='<img id="storeLogo" src="'+esc(r.logo_url)+'" alt=""/>';
    };img.src=r.logo_url;
  }
  document.getElementById('storeName').textContent=r.store_name||r.username;
  // Category nav
  var navEl=document.getElementById('catNav');
  navEl.innerHTML=_permCats.map(function(c){
    var meta=CAT_META[c]||{label:c,icon:'store'};
    return '<button class="catNavBtn" data-cat="'+c+'" onclick="selectCat(\''+c+'\')">'+ico(meta.icon,13)+' '+esc(meta.label)+'</button>';
  }).join('');
  navEl.classList.remove('hidden');
  // Main area
  document.getElementById('main').innerHTML=heroHtml+'<div id="catArea"></div>'+(r.hide_branding?'':'<div class="poweredBy">Powered by Global Digits</div>');
  // Load first category
  if(_permCats.length)selectCat(_permCats[0]);
}

function selectCat(cat){
  if(!CAT_META[cat]&&_permCats.indexOf(cat)<0)return;
  setCatActive(cat);
  var area=document.getElementById('catArea');
  area.innerHTML='<div class="centerBox" style="min-height:28vh"><div class="spin"></div></div>';
  var fns={numbers:loadNumbers,accounts:loadAccounts,boost:loadBoost,giftcard:loadGiftCard,esim:loadEsim,vtu:loadVtu};
  (fns[cat]||function(){area.innerHTML='<div class="empty">Coming soon</div>';})();
}

/* ═══════════════════════════
   VIRTUAL NUMBERS
═══════════════════════════ */
async function loadNumbers(){
  var area=document.getElementById('catArea');
  try{
    var r=await sb.from('country_prices').select('*').eq('active',true).order('name');
    _countries=r.data||[];
    renderCountries();
  }catch(e){area.innerHTML='<div class="empty">Failed to load countries</div><button class="btn btnO btnSm" style="margin:8px auto;display:block" onclick="loadNumbers()">Retry</button>';}
}
function renderCountries(){
  var area=document.getElementById('catArea');
  if(!_countries.length){area.innerHTML='<div class="empty">No countries available</div>';return;}
  var searchId='numSearch_'+Date.now();
  area.innerHTML=
    '<h3 style="font-size:14px;margin-bottom:10px;font-family:var(--font-d)">Select Country</h3>'+
    '<input id="'+searchId+'" class="fI" placeholder="Search country…" oninput="filterCountries(this.value)" style="margin-bottom:10px"/>'+
    '<div id="countryGrid" class="cGrid"></div>';
  renderCountryGrid(_countries);
  setTimeout(function(){var el=document.getElementById(searchId);if(el)el.focus();},100);
}
function filterCountries(q){
  var filtered=q?_countries.filter(function(c){return c.name.toLowerCase().indexOf(q.toLowerCase())>-1;}):_countries;
  renderCountryGrid(filtered);
}
function renderCountryGrid(list){
  var el=document.getElementById('countryGrid');if(!el)return;
  if(!list.length){el.innerHTML='<p class="empty" style="grid-column:1/-1">No matching countries</p>';return;}
  el.innerHTML=list.map(function(c){
    var avail=c.available>0;
    var fromPrice=custPrice(c.price);
    return '<div class="countryCard'+(avail?'':' out')+'" onclick="'+(avail?'openCountry(\''+c.id+'\')':'')+'" style="'+(avail?'':'opacity:.6;cursor:not-allowed')+'">'+
      '<div style="font-size:22px;margin-bottom:4px">'+(c.flag||ico('globe',20))+'</div>'+
      '<div style="font-weight:700;font-size:12px">'+esc(c.name)+'</div>'+
      '<div style="font-size:11px;color:var(--brand);font-weight:700;margin-top:2px">From '+fmtN(fromPrice)+'</div>'+
      '<span class="badge '+(avail?'active':'out')+'" style="margin-top:4px">'+(avail?'Available':'Unavailable')+'</span>'+
    '</div>';
  }).join('');
}
async function openCountry(countryId){
  var country=_countries.find(function(c){return c.id===countryId;});if(!country)return;
  var area=document.getElementById('catArea');
  area.innerHTML='<button class="btn btnO btnSm" onclick="renderCountries()" style="margin-bottom:12px">'+ico('back',13)+' Back to Countries</button>'+
    '<h3 style="font-size:15px;margin-bottom:10px;font-family:var(--font-d)">'+(country.flag||'')+'  '+esc(country.name)+' — Select Tier</h3>'+
    '<div id="tierArea"><div class="centerBox" style="min-height:20vh"><div class="spin"></div></div></div>';
  try{
    var r=await sb.from('number_tiers').select('*').eq('country',country.name).eq('active',true).order('price',{ascending:true});
    var tiers=r.data||[];
    var tArea=document.getElementById('tierArea');if(!tArea)return;
    if(!tiers.length){tArea.innerHTML='<div class="empty">No tiers available for '+esc(country.name)+'</div>';return;}
    tArea.innerHTML=tiers.map(function(t){
      var ns=t.network_status||'good';
      var nsColor=ns==='bad'?'#ef4444':ns==='fair'?'#f59e0b':'#10b981';
      var p=custPrice(t.price);
      return '<div class="tierCard">'+
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">'+
          '<div><div style="font-weight:700;font-size:14px">'+esc(t.tier_name)+'</div>'+
          (t.description?'<div style="font-size:12px;color:var(--text2);margin-top:2px">'+esc(t.description)+'</div>':'')+
          '<div style="display:flex;align-items:center;gap:4px;margin-top:4px"><svg width="8" height="8" viewBox="0 0 8 8"><circle cx="4" cy="4" r="4" fill="'+nsColor+'"/></svg><span style="font-size:11px;color:var(--text2)">'+{bad:'Bad Signal',fair:'Fair Signal',good:'Good Signal'}[ns]+'</span></div></div>'+
          '<div style="font-family:var(--font-d);font-size:18px;font-weight:800;color:var(--brand)">'+fmtN(p)+'</div>'+
        '</div>'+
        (ns==='bad'
          ?'<button class="btn btnO btnBlock" disabled style="cursor:not-allowed;opacity:.5">Currently Unavailable</button>'
          :'<button class="btn btnP btnBlock" onclick="openQtyNumber(\''+t.id+'\',\''+esc(t.tier_name)+'\','+t.price+','+(t.quantity||1)+',\''+esc(country.name)+'\',\''+esc(country.flag||'')+'\')">Order — '+fmtN(p)+'</button>')+
      '</div>';
    }).join('');
  }catch(e){var tA=document.getElementById('tierArea');if(tA)tA.innerHTML='<div class="empty">Failed to load tiers</div>';}
}
function openQtyNumber(tid,tname,unitBase,max,countryName,flag){
  var p=custPrice(unitBase);
  openModal(
    '<div class="modalHead"><h3>'+esc(tname)+'</h3><button class="xBtn" onclick="closeModal()">'+ico('close',14)+'</button></div>'+
    '<div style="font-size:11px;color:var(--text2);margin-bottom:4px">'+flag+' '+esc(countryName)+'</div>'+
    '<div style="font-family:var(--font-d);font-size:22px;font-weight:800;color:var(--brand);margin-bottom:14px">'+fmtN(p)+' each</div>'+
    '<div class="field"><label>Quantity</label><input id="numQty" class="fI" type="number" value="1" min="1" max="'+max+'"/></div>'+
    '<div id="numTotal" style="background:var(--surface2);border-radius:var(--r);padding:10px 13px;margin-bottom:12px;font-weight:700;font-size:13.5px">Total: '+fmtN(p)+'</div>'+
    '<button class="btn btnP btnBlock" onclick="confirmNumberOrder(\''+tid+'\',\''+esc(tname)+'\','+unitBase+',\''+esc(countryName)+'\',\''+esc(flag)+'\')">Continue</button>'
  );
  document.getElementById('numQty').addEventListener('input',function(){
    var q=Math.max(1,parseInt(this.value)||1);
    document.getElementById('numTotal').textContent='Total: '+fmtN(custPrice(unitBase)*q);
  });
}
function confirmNumberOrder(tid,tname,unitBase,countryName,flag){
  var qty=Math.max(1,parseInt((document.getElementById('numQty')||{}).value||1));
  openOrderConfirm('numbers',tid,tname+' — '+countryName,{country:countryName,flag:flag},qty,unitBase);
}

async function loadAccounts(){
  var area=document.getElementById('catArea');
  try{
    var r=await sb.from('sm_account_types').select('*').eq('active',true).order('platform').order('price',{ascending:true});
    _smAccTypes=r.data||[];
    renderAccounts('');
  }catch(e){area.innerHTML='<div class="empty">Failed to load accounts</div><button class="btn btnO btnSm" style="margin:8px auto;display:block" onclick="loadAccounts()">Retry</button>';}
}
function renderAccounts(platform){
  var area=document.getElementById('catArea');if(!area)return;
  var platforms=[...new Set(_smAccTypes.map(function(a){return a.platform;}))];
  var filtered=platform?_smAccTypes.filter(function(a){return a.platform===platform;}):_smAccTypes;
  area.innerHTML=
    '<div class="chipRow" id="accPlatRow">'+
      '<button class="chip'+(platform===''?' active':'')+'" onclick="renderAccounts(\'\')">All</button>'+
      platforms.map(function(p){return '<button class="chip'+(p===platform?' active':'')+'" onclick="renderAccounts(\''+esc(p)+'\')">'+platSvg(p,12)+' '+esc(p)+'</button>';}).join('')+
    '</div>'+
    '<div id="accList"></div>';
  var list=document.getElementById('accList');
  if(!filtered.length){list.innerHTML='<div class="empty">No accounts available</div>';return;}
  list.innerHTML=filtered.map(function(a,i){
    var inStock=a.stock>0;
    var p=custPrice(a.price);
    return '<div class="accCard">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px">'+
        '<div style="display:flex;align-items:center;gap:10px">'+
          '<div style="width:40px;height:40px;border-radius:12px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff">'+platSvg(a.platform,18)+'</div>'+
          '<div><div style="font-weight:700;font-size:13px">'+esc(a.type)+'</div>'+
            '<div style="font-size:11px;color:var(--text2)">'+esc(a.platform)+'</div>'+
            '<span class="badge '+(inStock?'active':'out')+'" style="margin-top:3px">'+(inStock?'In Stock':'Out of Stock')+'</span>'+
          '</div>'+
        '</div>'+
        '<div style="text-align:right">'+
          '<div style="font-family:var(--font-d);font-size:15px;font-weight:800;color:var(--brand)">'+fmtN(p)+'</div>'+
          (inStock?'<button class="btn btnP btnSm" style="margin-top:6px" onclick="openQtyAccount(\''+a.id+'\',\''+esc(a.platform)+'\',\''+esc(a.type)+'\','+a.price+','+a.stock+')">Buy</button>':
            '<button class="btn btnO btnSm" style="margin-top:6px;opacity:.5;cursor:not-allowed" disabled>Sold Out</button>')+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');
}
function openQtyAccount(id,platform,type,unitBase,maxStock){
  var p=custPrice(unitBase);
  openModal(
    '<div class="modalHead"><h3>'+esc(type)+'</h3><button class="xBtn" onclick="closeModal()">'+ico('close',14)+'</button></div>'+
    '<div style="font-size:12px;color:var(--text2);margin-bottom:8px">'+esc(platform)+'</div>'+
    '<div style="font-family:var(--font-d);font-size:22px;font-weight:800;color:var(--brand);margin-bottom:14px">'+fmtN(p)+' each</div>'+
    '<div class="field"><label>Quantity</label><input id="accQty" class="fI" type="number" value="1" min="1" max="'+maxStock+'"/></div>'+
    '<div id="accTotal" style="background:var(--surface2);border-radius:var(--r);padding:10px 13px;margin-bottom:12px;font-weight:700">Total: '+fmtN(p)+'</div>'+
    '<button class="btn btnP btnBlock" onclick="confirmAccountOrder(\''+id+'\',\''+esc(platform)+'\',\''+esc(type)+'\','+unitBase+')">Continue</button>'
  );
  document.getElementById('accQty').addEventListener('input',function(){
    var q=Math.max(1,Math.min(parseInt(this.value)||1,maxStock));
    document.getElementById('accTotal').textContent='Total: '+fmtN(custPrice(unitBase)*q);
  });
}
function confirmAccountOrder(id,platform,type,unitBase){
  var qty=Math.max(1,parseInt((document.getElementById('accQty')||{}).value||1));
  openOrderConfirm('accounts',id,type+' — '+platform,{platform:platform,type:type},qty,unitBase);
}

// Gift card trading (selling a card TO the store for cash) is the reverse
// money direction from every other section here — the storefront's payment
// flow is customer-pays-store, and this is store-pays-customer, so it can't
// go through submit_storefront_order(). Shown as a contact card instead of
// a half-working purchase flow.
function loadGiftCard(){
  var area=document.getElementById('catArea');
  var wa=_reseller.contact_whatsapp;
  area.innerHTML='<div class="card" style="text-align:center;padding:24px">'+
    '<div style="width:52px;height:52px;border-radius:14px;background:var(--brand-lt);color:var(--brand);display:flex;align-items:center;justify-content:center;margin:0 auto 10px">'+ico('gift',24)+'</div>'+
    '<h3 style="margin-bottom:6px">Gift Card Trading</h3>'+
    '<p style="font-size:12.5px;color:var(--text2);margin-bottom:14px">This store trades gift cards for cash. Contact the store directly to get a rate and sell your card.</p>'+
    (wa?'<a class="btn btnP" href="https://wa.me/'+esc(wa.replace(/\D/g,''))+'" target="_blank">'+ico('phone',14)+' Message on WhatsApp</a>':
      (_reseller.contact_phone?'<div style="font-weight:700">'+esc(_reseller.contact_phone)+'</div>':'<p style="font-size:11.5px;color:var(--text3)">No contact details available.</p>'))+
    '</div>';
}

async function loadBoost(){
  var area=document.getElementById('catArea');
  var r=await sb.from('boost_prices').select('*').eq('active',true);
  _boostPrices={};(r.data||[]).forEach(function(row){_boostPrices[row.boost_type+'|'+row.refill_type]=row.price_per_1000;});
  renderBoost();
}
function getBoostRate(type,refill){
  var v=_boostPrices[type+'|'+refill];if(v!==undefined)return v;
  var def={Followers:5,Likes:3,Views:1.5,Comments:8,Shares:4};
  var base=def[type]||5;return refill==='refill'?Math.round(base*1.3*100)/100:base;
}
function calcBoostCost(){
  var rate=getBoostRate(_bType,_bRefill);
  var base=Math.round(rate*_bQty/1000);
  return custPrice(base);
}
function renderBoost(){
  var area=document.getElementById('catArea');
  var plats=['Instagram','TikTok','Facebook','YouTube','Twitter/X'];
  var types=['Followers','Likes','Views','Comments','Shares'];
  area.innerHTML=
    '<div class="card">'+
      '<div style="background:var(--grad);border-radius:var(--r);padding:16px 14px;color:#fff;margin-bottom:16px">'+
        '<div style="font-family:var(--font-d);font-size:16px;font-weight:800">Social Media Boosting</div>'+
        '<div style="font-size:12px;opacity:.85;margin-top:2px">Real engagement, fast delivery</div>'+
      '</div>'+
      '<div class="field"><label>Platform</label><div class="chipSel" id="bPlatRow">'+
        plats.map(function(p){return '<button class="pSelBtn'+(p===_bPlat?' active':'')+'" onclick="setBPlat(\''+p+'\',this)">'+platSvg(p,12)+' '+esc(p)+'</button>';}).join('')+
      '</div></div>'+
      '<div class="field"><label>Boost Type</label><div class="chipSel" id="bTypeRow">'+
        types.map(function(t){return '<button class="pSelBtn'+(t===_bType?' active':'')+'" onclick="setBType(\''+t+'\',this)">'+esc(t)+'</button>';}).join('')+
      '</div></div>'+
      '<div class="field"><label>Quality</label><div style="display:flex;gap:8px">'+
        '<button class="pSelBtn'+(_bRefill==='no_refill'?' active':'')+'" onclick="setBRefill(\'no_refill\',this)">No Refill</button>'+
        '<button class="pSelBtn'+(_bRefill==='refill'?' active':'')+'" onclick="setBRefill(\'refill\',this)">'+ico('shield',12)+' With Refill</button>'+
      '</div></div>'+
      '<div class="field"><label>Profile URL or Username</label><input id="bTarget" class="fI" placeholder="https://instagram.com/yourprofile"/></div>'+
      '<div class="field"><label>Quantity</label>'+
        '<select id="bQty" class="fI" onchange="_bQty=parseInt(this.value);updateBoostCost()">'+
          [100,250,500,1000,2500,5000,10000].map(function(q){return '<option value="'+q+'"'+(q===_bQty?' selected':'')+'>'+q.toLocaleString()+'</option>';}).join('')+
        '</select></div>'+
      '<div style="display:flex;justify-content:space-between;align-items:center;background:var(--surface2);border-radius:var(--r);padding:12px 14px;margin-bottom:14px">'+
        '<span style="font-size:12px;color:var(--text2)">Estimated Cost</span>'+
        '<span id="bCost" style="font-family:var(--font-d);font-size:18px;font-weight:800;color:var(--brand)">'+fmtN(calcBoostCost())+'</span>'+
      '</div>'+
      '<button class="btn btnP btnBlock" onclick="submitBoost()">Place Order</button>'+
    '</div>';
}
function setBPlat(p,el){_bPlat=p;document.querySelectorAll('#bPlatRow .pSelBtn').forEach(function(b){b.classList.remove('active');});if(el)el.classList.add('active');updateBoostCost();}
function setBType(t,el){_bType=t;document.querySelectorAll('#bTypeRow .pSelBtn').forEach(function(b){b.classList.remove('active');});if(el)el.classList.add('active');updateBoostCost();}
function setBRefill(r,el){_bRefill=r;document.querySelectorAll('#catArea [onclick^="setBRefill"]').forEach(function(b){b.classList.remove('active');});if(el)el.classList.add('active');updateBoostCost();}
function updateBoostCost(){var el=document.getElementById('bCost');if(el)el.textContent=fmtN(calcBoostCost());}
function submitBoost(){
  var target=((document.getElementById('bTarget')||{}).value||'').trim();
  if(!target){toast('Enter profile URL or username');return;}
  _bQty=parseInt((document.getElementById('bQty')||{}).value||500);
  var rate=getBoostRate(_bType,_bRefill);
  var totalBase=Math.round(rate*_bQty/1000);
  var label=_bPlat+' '+_bType+' × '+_bQty.toLocaleString()+(_bRefill==='refill'?' (with Refill)':'');
  openOrderConfirm('boost',_bPlat+'|'+_bType+'|'+_bRefill,label,{platform:_bPlat,type:_bType,refill:_bRefill,target:target,quantity:_bQty},1,totalBase);
}

   eSIM
═══════════════════════════ */
var _esimCountry='';
async function loadEsim(){
  var area=document.getElementById('catArea');
  try{
    var r=await sb.from('esim_plans').select('id,country,region,plan_name,data_amount,validity,price,active').eq('active',true).order('country').order('price',{ascending:true});
    _esimPlans=r.data||[];
    renderEsim();
  }catch(e){area.innerHTML='<div class="empty">Failed to load eSIM plans</div><button class="btn btnO btnSm" style="margin:8px auto;display:block" onclick="loadEsim()">Retry</button>';}
}
function renderEsim(){
  var area=document.getElementById('catArea');
  if(!_esimPlans.length){area.innerHTML='<div class="empty">No eSIM plans available</div>';return;}
  var countries=[...new Set(_esimPlans.map(function(p){return p.country;}))].sort();
  if(!_esimCountry)_esimCountry=countries[0]||'';
  area.innerHTML=
    '<div class="field"><label>Country</label>'+
      '<select id="esimCountrySel" class="fI" onchange="_esimCountry=this.value;renderEsimPlans()">'+
        countries.map(function(c){return '<option value="'+esc(c)+'"'+(c===_esimCountry?' selected':'')+'>'+esc(c)+'</option>';}).join('')+
      '</select></div>'+
    '<div id="esimPlanGrid" class="prodGrid"></div>';
  renderEsimPlans();
}
function renderEsimPlans(){
  var el=document.getElementById('esimPlanGrid');if(!el)return;
  var plans=_esimPlans.filter(function(p){return p.country===_esimCountry;});
  if(!plans.length){el.innerHTML='<p class="empty" style="grid-column:1/-1">No plans for this country</p>';return;}
  el.innerHTML=plans.map(function(p,i){
    var cp=custPrice(p.price);
    return '<div class="prodCard">'+
      '<div class="pName">'+esc(p.plan_name)+'</div>'+
      '<div class="pSub">'+esc(p.data_amount)+' · '+esc(p.validity)+'</div>'+
      '<div class="pPrice">'+fmtN(cp)+'</div>'+
      '<button class="btn btnP btnSm btnBlock" onclick="openEsimOrder('+i+')">Order</button>'+
    '</div>';
  }).join('');
  el._plans=plans;
}
function openEsimOrder(idx){
  var plans=(document.getElementById('esimPlanGrid')||{})._plans||[];
  var p=plans[idx];if(!p)return;
  var cp=custPrice(p.price);
  openModal(
    '<div class="modalHead"><h3>'+esc(p.plan_name)+'</h3><button class="xBtn" onclick="closeModal()">'+ico('close',14)+'</button></div>'+
    '<div style="font-size:12px;color:var(--text2);margin-bottom:8px">'+esc(p.country)+' · '+esc(p.data_amount)+' · '+esc(p.validity)+'</div>'+
    '<div style="font-family:var(--font-d);font-size:22px;font-weight:800;color:var(--brand);margin-bottom:12px">'+fmtN(cp)+'</div>'+
    '<div style="background:var(--surface2);border-radius:var(--r);padding:12px;font-size:12px;color:var(--text2);margin-bottom:14px">The eSIM QR code / activation details will be delivered by the store after your payment is confirmed.</div>'+
    '<button class="btn btnP btnBlock" onclick="closeModal();openOrderConfirm(\'esim\',\''+p.id+'\',\''+esc(p.plan_name)+' — '+esc(p.country)+'\',{country:\''+esc(p.country)+'\',data_amount:\''+esc(p.data_amount)+'\',validity:\''+esc(p.validity)+'\'},1,'+p.price+')">Continue — '+fmtN(cp)+'</button>'
  );
}

function loadVtu(){
  var area=document.getElementById('catArea');
  area.innerHTML=
    '<div class="card">'+
      '<div style="display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;scrollbar-width:none" id="vtuTabs">'+
        ['airtime','data','cable','electricity'].map(function(t){
          return '<button class="chip'+(t==='airtime'?' active':'')+'" onclick="switchVtuTab(\''+t+'\',this)">'+{airtime:'Airtime',data:'Data',cable:'Cable TV',electricity:'Electricity'}[t]+'</button>';
        }).join('')+
      '</div>'+
      '<div id="vtuArea"></div>'+
    '</div>';
  loadVtuCatalog().then(function(){renderVtuTab('airtime');});
  renderVtuTab('airtime');
}
var _vtuCurTab='airtime';
function switchVtuTab(tab,el){
  _vtuCurTab=tab;
  document.querySelectorAll('#vtuTabs .chip').forEach(function(c){c.classList.remove('active');});
  if(el)el.classList.add('active');
  renderVtuTab(tab);
}
function netBtns(sel,curNet,fnName){
  return '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px" id="'+sel+'">'+
    ['MTN','GLO','AIRTEL','9MOBILE'].map(function(n){
      var short={MTN:'MTN',GLO:'GLO',AIRTEL:'AIR','9MOBILE':'9MB'}[n]||n;
      return '<button class="pSelBtn'+(n===curNet?' active':'')+'" onclick="'+fnName+'(\''+n+'\',this)"><span>'+short+'</span></button>';
    }).join('')+'</div>';
}
function renderVtuTab(tab){
  var area=document.getElementById('vtuArea');if(!area)return;
  if(tab==='airtime'){
    area.innerHTML=
      netBtns('airtimeNets',_vtuNet,'setANet')+
      '<div class="field"><label>Phone Number</label><input id="aPhone" class="fI" type="tel" maxlength="11" placeholder="08012345678" oninput="this.value=this.value.replace(/\\D/g,\'\')"/></div>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px" id="aChips">'+[100,200,500,1000,2000,5000].map(function(a){return '<button class="chip" onclick="pickAirtime('+a+',this)">₦'+a+'</button>';}).join('')+'</div>'+
      '<input id="aAmt" class="fI" type="number" placeholder="Or enter custom amount (min ₦100)" min="100" style="margin-bottom:12px"/>'+
      '<button class="btn btnP btnBlock" onclick="submitAirtime()">Buy Airtime</button>';
    return;
  }
  if(tab==='data'){
    area.innerHTML=
      netBtns('dataNets',_dataNet,'setDNet')+
      '<div style="display:flex;gap:6px;margin-bottom:10px">'+['daily','weekly','monthly'].map(function(d){return '<button class="chip'+(d===_dataDur?' active':'')+'" onclick="setDDur(\''+d+'\',this)">'+cap(d)+'</button>';}).join('')+'</div>'+
      '<div id="dataPlanGrid" class="planGrid" style="margin-bottom:12px"></div>'+
      '<div class="field"><label>Phone Number</label><input id="dPhone" class="fI" type="tel" maxlength="11" placeholder="08012345678" oninput="this.value=this.value.replace(/\\D/g,\'\')"/></div>'+
      '<button class="btn btnP btnBlock" onclick="submitData()">Buy Data</button>';
    renderDataPlans();
    return;
  }
  if(tab==='cable'){
    area.innerHTML=
      '<div style="display:flex;gap:6px;margin-bottom:12px">'+['DSTV','GOTV','STARTIMES'].map(function(c){return '<button class="pSelBtn'+(c===_cable?' active':'')+'" onclick="setCable(\''+c+'\',this)"><span>'+c+'</span></button>';}).join('')+'</div>'+
      '<div class="field"><label>Smartcard Number</label><input id="cCard" class="fI" placeholder="Enter smartcard number"/></div>'+
      '<div class="field"><label>Package</label><select id="cPlan" class="fI" onchange="calcCable()"><option value="">-- '+((_vtuCatalog)?'Select Package':'Loading…')+' --</option></select></div>'+
      '<div id="cTotal" style="background:var(--surface2);border-radius:var(--r);padding:11px 13px;margin-bottom:12px;font-weight:700;font-size:13.5px">Total: —</div>'+
      '<button class="btn btnP btnBlock" onclick="submitCable()">Pay Subscription</button>';
    renderCablePlans();
    return;
  }
  if(tab==='electricity'){
    area.innerHTML=
      '<div class="field"><label>Provider</label><select id="eDisco" class="fI" onchange="_disco=this.value">'+
        '<option value="">-- Select Provider --</option>'+
        [['IKEDC','IKEDC — Ikeja'],['EKEDC','EKEDC — Eko'],['KEDCO','KEDCO — Kano'],['PHED','PHED — Port Harcourt'],['JED','JED — Jos'],['AEDC','AEDC — Abuja'],['KAEDCO','KAEDCO — Kaduna'],['EEDC','EEDC — Enugu'],['BEDC','BEDC — Benin'],['YEDC','YEDC — Yola']].map(function(d){return '<option value="'+d[0]+'">'+d[1]+'</option>';}).join('')+
      '</select></div>'+
      '<div class="field"><label>Meter Type</label><div style="display:flex;gap:6px">'+
        '<button class="pSelBtn'+(_meterType===1?' active':'')+'" onclick="_meterType=1;this.classList.add(\'active\');this.nextElementSibling.classList.remove(\'active\')">Prepaid</button>'+
        '<button class="pSelBtn'+(_meterType===2?' active':'')+'" onclick="_meterType=2;this.classList.add(\'active\');this.previousElementSibling.classList.remove(\'active\')">Postpaid</button>'+
      '</div></div>'+
      '<div class="field"><label>Meter Number</label><input id="eMeter" class="fI" placeholder="Enter meter number"/></div>'+
      '<div class="field"><label>Phone Number</label><input id="ePhone" class="fI" type="tel" maxlength="11" placeholder="08012345678" oninput="this.value=this.value.replace(/\\D/g,\'\')"/></div>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px" id="eChips">'+[500,1000,2000,5000].map(function(a){return '<button class="chip" onclick="pickElec('+a+',this)">₦'+a+'</button>';}).join('')+'</div>'+
      '<input id="eAmt" class="fI" type="number" placeholder="Or enter amount (min ₦500)" min="500" style="margin-bottom:12px"/>'+
      '<button class="btn btnP btnBlock" onclick="submitElec()">Buy Token</button>';
    return;
  }
}
function setANet(n,el){_vtuNet=n;document.querySelectorAll('#airtimeNets .pSelBtn').forEach(function(b){b.classList.remove('active');});if(el)el.classList.add('active');}
function setDNet(n,el){_dataNet=n;document.querySelectorAll('#dataNets .pSelBtn').forEach(function(b){b.classList.remove('active');});if(el)el.classList.add('active');_dataPlan=null;renderDataPlans();}
function setDDur(d,el){_dataDur=d;document.querySelectorAll('#vtuArea .chip').forEach(function(c){c.classList.remove('active');});if(el)el.classList.add('active');_dataPlan=null;renderDataPlans();}
function setCable(c,el){_cable=c;document.querySelectorAll('#vtuArea .pSelBtn').forEach(function(b){b.classList.remove('active');});if(el)el.classList.add('active');renderCablePlans();}
function pickAirtime(a,el){document.querySelectorAll('#aChips .chip').forEach(function(c){c.classList.remove('active');});if(el)el.classList.add('active');var i=document.getElementById('aAmt');if(i)i.value='';}
function pickElec(a,el){document.querySelectorAll('#eChips .chip').forEach(function(c){c.classList.remove('active');});if(el)el.classList.add('active');var i=document.getElementById('eAmt');if(i)i.value='';}

function renderDataPlans(){
  var el=document.getElementById('dataPlanGrid');if(!el)return;
  if(!_vtuCatalog){el.innerHTML='<p class="empty" style="grid-column:1/-1">Loading plans…</p>';loadVtuCatalog().then(renderDataPlans);return;}
  var all=dataBundles(_dataNet.toUpperCase());
  var plans=all.filter(function(p){return classifyDur(p)===_dataDur&&(+(p.price||p.amount||0))>=50;});
  var seen={};plans=plans.filter(function(p){var k=(p.size||p.bundle||p.name||'')+'|'+(+(p.price||p.amount||0));if(seen[k])return false;seen[k]=true;return true;});
  plans.sort(function(a,b){var aM=parseMB(a.size||a.bundle||a.name||'')||0,bM=parseMB(b.size||b.bundle||b.name||'')||0;return aM!==bM?aM-bM:(+(a.price||a.amount||0))-(+(b.price||b.amount||0));});
  if(!plans.length){el.innerHTML='<p class="empty" style="grid-column:1/-1">No '+_dataDur+' plans for '+_dataNet+'</p>';el._plans=[];return;}
  el.innerHTML=plans.map(function(p,i){
    var lbl=p.size||p.bundle||p.label||p.name||'Plan';
    var raw=+(p.price||p.amount||0);var cp=custPrice(raw+10);
    var active=_dataPlan&&_dataPlan===p;
    return '<div class="planCard'+(active?' active':'')+'" onclick="setDataPlan('+i+',this)">'+
      '<div style="font-weight:700;font-size:13px">'+esc(lbl)+'</div>'+
      (p.validity?'<div style="font-size:10.5px;color:var(--text2);margin:2px 0">'+esc(p.validity)+'</div>':'')+
      '<div style="font-family:var(--font-d);font-size:14px;font-weight:800;color:var(--brand)">'+fmtN(cp)+'</div>'+
    '</div>';
  }).join('');
  el._plans=plans;
}
function setDataPlan(idx,el){
  var g=document.getElementById('dataPlanGrid');_dataPlan=g&&g._plans?g._plans[idx]:null;
  document.querySelectorAll('#dataPlanGrid .planCard').forEach(function(c){c.classList.remove('active');});if(el)el.classList.add('active');
}
function renderCablePlans(){
  var sel=document.getElementById('cPlan');if(!sel)return;
  if(!_vtuCatalog){sel.innerHTML='<option value="">-- Loading… --</option>';loadVtuCatalog().then(renderCablePlans);return;}
  var prov=_cable.toUpperCase();var all=[];
  Object.keys(_vtuCatalog).filter(function(k){return k.toLowerCase().indexOf('cable')>-1||k.toLowerCase().indexOf(prov.toLowerCase())>-1;}).forEach(function(k){all=all.concat(_vtuCatalog[k]);});
  var plans=all.filter(function(p){return(p.provider||p.network||p.name||'').toString().toUpperCase().indexOf(prov)>-1;});
  if(!plans.length&&all.length)plans=all;
  var seen={};plans=plans.filter(function(p){var k=(p.name||p.plan||p.label||'')+'|'+(+(p.price||p.amount||0));if(seen[k])return false;seen[k]=true;return true;});
  plans.sort(function(a,b){return(+(a.price||a.amount||0))-(+(b.price||b.amount||0));});
  if(!plans.length){sel.innerHTML='<option value="">-- No packages found --</option>';sel._plans=[];return;}
  sel.innerHTML='<option value="">-- Select Package --</option>'+plans.map(function(p,i){return '<option value="'+i+'">'+esc(p.name||p.plan||'Package')+' — '+fmtN(custPrice(+(p.price||p.amount||0)+10))+'</option>';}).join('');
  sel._plans=plans;calcCable();
}
function calcCable(){
  var sel=document.getElementById('cPlan');var plans=(sel&&sel._plans)||[];var idx=sel?parseInt(sel.value):NaN;
  var el=document.getElementById('cTotal');
  if(!isNaN(idx)&&plans[idx]&&el)el.textContent='Total: '+fmtN(custPrice(+(plans[idx].price||plans[idx].amount||0)+10));
  else if(el)el.textContent='Total: —';
}

function submitAirtime(){
  var phone=((document.getElementById('aPhone')||{}).value||'').trim();
  var chip=document.querySelector('#aChips .chip.active');
  var custom=parseFloat((document.getElementById('aAmt')||{}).value||0)||0;
  var amount=chip?parseInt(chip.textContent.replace(/\D/g,'')):custom;
  if(!phone||phone.length<11){toast('Enter a valid 11-digit phone number');return;}
  if(!amount||amount<100){toast('Minimum airtime is ₦100');return;}
  var totalBase=amount+10;
  openOrderConfirm('vtu','airtime|'+_vtuNet,_vtuNet+' Airtime — ₦'+amount+' to '+phone,
    {subtype:'airtime',network:_vtuNet,phone:phone,amount:amount},1,totalBase);
}
function submitData(){
  var phone=((document.getElementById('dPhone')||{}).value||'').trim();
  if(!phone||phone.length<11){toast('Enter a valid 11-digit phone number');return;}
  if(!_dataPlan){toast('Select a data plan');return;}
  var raw=+((_dataPlan.price||_dataPlan.amount)||0);var totalBase=raw+10;
  var bid=_dataPlan.id||_dataPlan.bundle_id;if(!bid){toast('Plan info incomplete — reselect');return;}
  var lbl=_dataPlan.size||_dataPlan.bundle||'Data';
  openOrderConfirm('vtu','data|'+bid,_dataNet+' '+lbl+' — to '+phone,
    {subtype:'data',network:_dataNet,phone:phone,bundle_id:bid,plan_label:lbl},1,totalBase);
}
function submitCable(){
  var card=((document.getElementById('cCard')||{}).value||'').trim();
  var sel=document.getElementById('cPlan');var idx=sel?parseInt(sel.value):NaN;var plans=(sel&&sel._plans)||[];
  if(!card){toast('Enter smartcard number');return;}
  if(isNaN(idx)||!plans[idx]){toast('Select a package');return;}
  var plan=plans[idx];var raw=+(plan.price||plan.amount||0);var totalBase=raw+10;
  var pid=plan.id||plan.plan_id;if(!pid){toast('Package info incomplete — reselect');return;}
  openOrderConfirm('vtu','cable|'+pid,_cable+' '+(plan.name||'Package')+' — card '+card,
    {subtype:'cable',provider:_cable,card_number:card,plan_id:pid,plan_label:plan.name||'Package'},1,totalBase);
}
function submitElec(){
  var disco=document.getElementById('eDisco').value;
  var meter=((document.getElementById('eMeter')||{}).value||'').trim();
  var phone=((document.getElementById('ePhone')||{}).value||'').trim();
  var chip=document.querySelector('#eChips .chip.active');
  var custom=parseFloat((document.getElementById('eAmt')||{}).value||0)||0;
  var amount=chip?parseInt(chip.textContent.replace(/\D/g,'')):custom;
  if(!disco){toast('Select an electricity provider');return;}
  if(!meter){toast('Enter meter number');return;}
  if(!phone||phone.length<11){toast('Enter a valid phone number');return;}
  if(!amount||amount<500){toast('Minimum is ₦500');return;}
  openOrderConfirm('vtu','electricity|'+disco,disco+' Electricity — ₦'+amount+' to meter '+meter,
    {subtype:'electricity',disco:disco,meter_number:meter,meter_type:_meterType,phone:phone,amount:amount},1,amount);
}

/* ═══════════════════════════
   START
═══════════════════════════ */
boot();
</script>
