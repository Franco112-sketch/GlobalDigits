      var label = p.size || p.bundle || p.label || p.name || 'Plan';
      var raw = +(p.price || p.amount || 0), cp = custPrice(raw + VTU_SERVICE_FEE);
      var active = dataPlan === p;
      return '<div class="plan-card' + (active ? ' active' : '') + '" data-idx="' + i + '">' +
        '<div style="font-weight:600;font-size:13px">' + esc(label) + '</div>' +
        (p.validity ? '<div class="faint" style="font-size:10.5px;margin:2px 0">' + esc(p.validity) + '</div>' : '') +
        '<div style="font-family:var(--font-display);font-size:14px;font-weight:600;color:var(--accent)">' + fmtNSafe(cp) + '</div>' +
      '</div>';
    }).join('');
    el._plans = plans;
    el.querySelectorAll('.plan-card').forEach(function(card){
      card.onclick = function(){
        dataPlan = el._plans[parseInt(card.getAttribute('data-idx'))];
        el.querySelectorAll('.plan-card').forEach(function(c){ c.classList.remove('active'); });
        card.classList.add('active');
      };
    });
  }

  function renderCablePlans(){
    var host = document.getElementById('cPlan'); if (!host) return;
    function mount(placeholder, options, disabled){
      mountDropdown('cPlan', {
        title: 'Select package', placeholder: placeholder, disabled: !!disabled, value: '', options: options || [],
        onChange: function(){ calcCable(); }
      });
      calcCable();
    }
    if (!catalog){
      mount(catalogPromise ? 'Loading\u2026' : 'Could not load packages', [], true);
      host._plans = [];
      if (catalogPromise) loadCatalog().then(renderCablePlans);
      return;
    }
    var prov = cable.toUpperCase(), all = [];
    Object.keys(catalog).filter(function(k){ return k.toLowerCase().indexOf('cable') > -1 || k.toLowerCase().indexOf(prov.toLowerCase()) > -1; }).forEach(function(k){ all = all.concat(catalog[k]); });
    var plans = all.filter(function(p){ return (p.provider || p.network || p.name || '').toString().toUpperCase().indexOf(prov) > -1; });
    if (!plans.length && all.length) plans = all;
    var seen = {};
    plans = plans.filter(function(p){ var k = (p.name || p.plan || p.label || '') + '|' + (+(p.price || p.amount || 0)); if (seen[k]) return false; seen[k] = true; return true; });
    plans.sort(function(a, b){ return (+(a.price || a.amount || 0)) - (+(b.price || b.amount || 0)); });
    host._plans = plans;
    if (!plans.length){ mount('No packages found', [], true); return; }
    mount('Select package', plans.map(function(p, i){
      return { value: i, label: (p.name || p.plan || 'Package'), hint: fmtNSafe(custPrice(+(p.price || p.amount || 0) + VTU_SERVICE_FEE)) };
    }));
  }
  function selectedCablePlan(){
    var host = document.getElementById('cPlan'); var plans = (host && host._plans) || [];
    var v = ddValue('cPlan'); if (v === '') return null;
    return plans[parseInt(v)] || null;
  }
  function calcCable(){
    var plan = selectedCablePlan(); var el = document.getElementById('cTotal');
    if (!el) return;
    el.textContent = plan ? 'Total: ' + fmtNSafe(custPrice(+(plan.price || plan.amount || 0) + VTU_SERVICE_FEE)) : 'Total: \u2014';
  }
  function fmtNSafe(n){ return '\u20A6' + Math.round(n || 0).toLocaleString(); }

  function submitAirtime(){
    var phone = ((document.getElementById('aPhone') || {}).value || '').trim();
    var activeChip = document.querySelector('#aChips .chip.active');
    var custom = parseFloat((document.getElementById('aAmt') || {}).value || 0) || 0;
    var amount = activeChip ? parseInt(activeChip.textContent.replace(/\D/g, '')) : custom;
    if (!phone || phone.length < 11){ toast('Enter a valid 11-digit phone number'); return; }
    if (!amount || amount < 100){ toast('Minimum airtime is \u20A6100'); return; }
    startCheckout('vtu', 'airtime|' + vtuNet, vtuNet + ' Airtime — \u20A6' + amount + ' to ' + phone, { subtype: 'airtime', network: vtuNet, phone: phone, amount: amount }, 1, amount + VTU_SERVICE_FEE);
  }
  function submitData(){
    var phone = ((document.getElementById('dPhone') || {}).value || '').trim();
    if (!phone || phone.length < 11){ toast('Enter a valid 11-digit phone number'); return; }
    if (!dataPlan){ toast('Select a data plan'); return; }
    var raw = +((dataPlan.price || dataPlan.amount) || 0);
    var bid = dataPlan.id || dataPlan.bundle_id;
    if (!bid){ toast('Plan info incomplete — reselect'); return; }
    var label = dataPlan.size || dataPlan.bundle || 'Data';
    startCheckout('vtu', 'data|' + bid, dataNet + ' ' + label + ' — to ' + phone, { subtype: 'data', network: dataNet, phone: phone, bundle_id: bid, plan_label: label }, 1, raw + VTU_SERVICE_FEE);
  }
  function submitCable(){
    var card = ((document.getElementById('cCard') || {}).value || '').trim();
    var plan = selectedCablePlan();
    if (!card){ toast('Enter smartcard number'); return; }
    if (!plan){ toast('Select a package'); return; }
    var raw = +(plan.price || plan.amount || 0);
    var pid = plan.id || plan.plan_id;
    if (!pid){ toast('Package info incomplete — reselect'); return; }
    startCheckout('vtu', 'cable|' + pid, cable + ' ' + (plan.name || 'Package') + ' — card ' + card, { subtype: 'cable', provider: cable, card_number: card, plan_id: pid, plan_label: plan.name || 'Package' }, 1, raw + VTU_SERVICE_FEE);
  }
  function submitElectricity(){
    var meter = ((document.getElementById('eMeter') || {}).value || '').trim();
    var phone = ((document.getElementById('ePhone') || {}).value || '').trim();
    var activeChip = document.querySelector('#eChips .chip.active');
    var custom = parseFloat((document.getElementById('eAmt') || {}).value || 0) || 0;
    var amount = activeChip ? parseInt(activeChip.textContent.replace(/\D/g, '')) : custom;
    if (!disco){ toast('Select an electricity provider'); return; }
    if (!meter){ toast('Enter meter number'); return; }
    if (!phone || phone.length < 11){ toast('Enter a valid phone number'); return; }
    if (!amount || amount < 500){ toast('Minimum is \u20A6500'); return; }
    startCheckout('vtu', 'electricity|' + disco, disco + ' Electricity — \u20A6' + amount + ' to meter ' + meter, { subtype: 'electricity', disco: disco, meter_number: meter, meter_type: meterType, phone: phone, amount: amount }, 1, amount);
  }
  return { renderVtu };
})();

/* ── LOGIN / REGISTRATION SCREENS ──────────────────────────────────── */
var M_authViews = (function(){
  var state = M_state.state;
  var icon = M_icons.icon;
  var esc = M_utils.esc;
  var toast = M_utils.toast;
  var qs = M_utils.qs;
  var signIn = M_auth.signIn;
  var signUp = M_auth.signUp;
  var forgotPassword = M_auth.forgotPassword;
  var setNewPassword = M_auth.setNewPassword;
  var goRoute = M_router.goRoute;
  var takeResume = M_router.takeResume;
  var defaultHash = M_router.defaultHash;
  function shell(title, sub, body, footer){
    var r = state.reseller || {};
    var initial = (r.store_name || r.username || 'G').charAt(0).toUpperCase();
    return '<div class="auth-wrap">' +
      '<div class="auth-logo">' + esc(initial) + '</div>' +
      '<div class="auth-head"><h1>' + title + '</h1><p>' + sub + '</p></div>' +
      '<div class="card">' + body + '<div class="auth-error hidden" id="authErr" role="alert"></div></div>' +
      '<div class="auth-switch">' + footer + '</div>' +
    '</div>';
  }

  function pwField(id, label, placeholder){
    return '<div class="field"><label>' + label + '</label><div class="pw-wrap">' +
      '<input id="' + id + '" class="input" type="password" placeholder="' + placeholder + '" autocomplete="current-password"/>' +
      '<button type="button" class="pw-toggle" data-for="' + id + '" aria-label="Show password">' + icon('eye', 16) + '</button>' +
    '</div></div>';
  }
  function bindPwToggles(root){
    root.querySelectorAll('.pw-toggle').forEach(function(b){
      b.onclick = function(){
        var i = document.getElementById(b.getAttribute('data-for'));
        var show = i.type === 'password';
        i.type = show ? 'text' : 'password';
        b.innerHTML = icon(show ? 'eyeOff' : 'eye', 16);
      };
    });
  }
  function showErr(msg){
    var el = document.getElementById('authErr');
    if (!el) { toast(msg); return; }
    el.textContent = msg; el.classList.remove('hidden');
  }
  function busy(btn, on, label){ if (btn){ btn.disabled = on; btn.textContent = label; } }
  function val(id){ return ((document.getElementById(id) || {}).value || '').trim(); }

  function finishAuth(){
    var r = takeResume();
    if (r){
      location.hash = r.back;
      if (r.fn) setTimeout(r.fn, 60);
    } else goRoute(defaultHash());
  }

  function renderLogin(root){
    if (state.session){ goRoute('#/dashboard'); return; }
    root.innerHTML = shell('Welcome back', 'Sign in to your account',
      '<div class="field"><label>Email Address</label><input id="lgEmail" class="input" type="email" placeholder="you@example.com" autocomplete="email"/></div>' +
      pwField('lgPass', 'Password', 'Enter your password') +
      '<div style="text-align:right;margin:-6px 0 14px"><a id="lgForgot" style="font-size:12px;color:var(--accent);font-weight:600;cursor:pointer">Forgot password?</a></div>' +
      '<button class="btn btn-primary btn-block btn-lg" id="lgSubmit">Sign In</button>',
      'New here? <a id="lgToReg" style="cursor:pointer">Create an account</a>');
    bindPwToggles(root);
    document.getElementById('lgForgot').onclick = function(){ goRoute('#/forgot'); };
    document.getElementById('lgToReg').onclick = function(){ goRoute('#/register'); };
    var submit = async function(){
      var btn = document.getElementById('lgSubmit');
      busy(btn, true, 'Signing in\u2026');
      try { await signIn(val('lgEmail'), (document.getElementById('lgPass') || {}).value || ''); finishAuth(); }
      catch (e) { showErr(e.message || 'Could not sign in'); busy(btn, false, 'Sign In'); }
    };
    document.getElementById('lgSubmit').onclick = submit;
    root.querySelectorAll('input').forEach(function(i){ i.addEventListener('keydown', function(e){ if (e.key === 'Enter') submit(); }); });
  }

  function renderRegister(root){
    if (state.session){ goRoute('#/dashboard'); return; }
    root.innerHTML = shell('Create your account', 'Join ' + esc((state.reseller && (state.reseller.store_name || state.reseller.username)) || 'this store'),
      '<div class="field"><label>Full Name</label><input id="rgName" class="input" placeholder="Your name" autocomplete="name"/></div>' +
      '<div class="field"><label>Phone Number</label><input id="rgPhone" class="input" type="tel" placeholder="080\u2026" autocomplete="tel"/></div>' +
      '<div class="field"><label>Email Address</label><input id="rgEmail" class="input" type="email" placeholder="you@example.com" autocomplete="email"/></div>' +
      pwField('rgPass', 'Password', 'Min. 6 characters') +
      '<button class="btn btn-primary btn-block btn-lg" id="rgSubmit">Create Account</button>',
      'Already have an account? <a id="rgToLogin" style="cursor:pointer">Sign in</a>');
    bindPwToggles(root);
    document.getElementById('rgToLogin').onclick = function(){ goRoute('#/login'); };
    var submit = async function(){
      var btn = document.getElementById('rgSubmit');
      busy(btn, true, 'Creating account\u2026');
      try {
        var res = await signUp(val('rgName'), val('rgPhone'), val('rgEmail'), (document.getElementById('rgPass') || {}).value || '');
        if (res.immediate){ toast('Account created \u2014 you\u2019re signed in'); finishAuth(); }
        else { toast('Check your email to confirm your account, then sign in'); goRoute('#/login'); }
      } catch (e) { showErr(e.message || 'Could not create account'); busy(btn, false, 'Create Account'); }
    };
    document.getElementById('rgSubmit').onclick = submit;
  }

  function renderForgot(root){
    root.innerHTML = shell('Reset password', 'We\u2019ll email you a link to set a new one',
      '<div class="field"><label>Email Address</label><input id="fgEmail" class="input" type="email" placeholder="you@example.com" autocomplete="email"/></div>' +
      '<button class="btn btn-primary btn-block btn-lg" id="fgSubmit">Send Reset Link</button>',
      'Remembered it? <a id="fgBack" style="cursor:pointer">Sign in</a>');
    document.getElementById('fgBack').onclick = function(){ goRoute('#/login'); };
    document.getElementById('fgSubmit').onclick = async function(){
      var btn = this;
      busy(btn, true, 'Sending\u2026');
      try { await forgotPassword(val('fgEmail'), qs('store') || (state.reseller && state.reseller.username)); toast('Check your email for a reset link'); goRoute('#/login'); }
      catch (e) { showErr(e.message || 'Could not send reset link'); busy(btn, false, 'Send Reset Link'); }
    };
  }

  function renderReset(root){
    root.innerHTML = shell('Set a new password', 'Choose a new password for your account',
      pwField('rsPass', 'New Password', 'Min. 6 characters') +
      '<button class="btn btn-primary btn-block btn-lg" id="rsSubmit">Save New Password</button>', '');
    bindPwToggles(root);
    document.getElementById('rsSubmit').onclick = async function(){
      var btn = this;
      busy(btn, true, 'Saving\u2026');
      try {
        await setNewPassword((document.getElementById('rsPass') || {}).value || '');
        toast('Password updated \u2014 you\u2019re signed in');
        history.replaceState(null, '', location.pathname + location.search);
        goRoute(defaultHash());
      } catch (e) { showErr(e.message || 'Could not update password'); busy(btn, false, 'Save New Password'); }
    };
  }
  return { renderLogin, renderRegister, renderForgot, renderReset };
})();

var M_app = (function(){

  var renderSupport = M_support.renderSupport;
  // Captured before anything else runs: the Supabase client consumes the
  // recovery token from the URL hash while it initialises.
  const RECOVERY_LINK = /type=recovery/.test(window.location.hash || '');

  function categoryGuard(cat, fn){
    return function(root, params){
      if (state.permittedCategories.indexOf(cat) === -1){
        root.innerHTML = '<div class="center-box"><div class="empty-state"><div class="icon-wrap">' + icon('alert', 20) + '</div><h2>Not available</h2><p>This service is not enabled for this store.</p></div><button class="btn btn-outline" id="backSvc">Back to Services</button></div>';
        document.getElementById('backSvc').onclick = function(){ goRoute('#/services'); };
        return;
      }
      return fn(root, params);
    };
  }

  function defineRoutes(){
    defineRoute('/login',    { nav: 'login', render: renderLogin });
    defineRoute('/register', { nav: 'login', render: renderRegister });
    defineRoute('/forgot',   { nav: 'login', render: renderForgot });
    defineRoute('/reset',    { nav: 'none',  render: renderReset });

    defineRoute('/dashboard', { auth: true, nav: 'dashboard', render: renderDashboard });

    defineRoute('/services/boost',    { nav: 'services', render: categoryGuard('boost', renderBoosting) });
    defineRoute('/services/vtu',      { nav: 'services', render: categoryGuard('vtu', renderVtu) });

    defineRoute('/orders',     { auth: true, nav: 'orders', render: renderOrdersList });
    defineRoute('/orders/:id', { auth: true, nav: 'orders', render: function(root, p){ return renderOrderDetail(root, p.id); } });
    defineRoute('/wallet',     { auth: true, nav: 'wallet', render: renderWalletPage });

    defineRoute('/payment-methods', { auth: true, nav: 'more', render: renderPaymentMethods });
    defineRoute('/customers',       { auth: true, owner: true, nav: 'more', render: renderCustomers });
    defineRoute('/profile',         { auth: true, nav: 'more', render: renderProfile });
    defineRoute('/support',         { nav: 'support', render: renderSupport });
  }

  function paintBrand(){
    var r = state.reseller;
    var slot = document.getElementById('brandSlot');
    if (!r){ slot.innerHTML = '<div class="brand-mark">G</div><div class="brand-name">Global Digits</div>'; return; }
    var initial = (r.store_name || r.username || 'G').charAt(0).toUpperCase();
    slot.innerHTML =
      (r.logo_url ? '<img class="brand-mark" id="brandImg" src="' + esc(r.logo_url) + '" alt=""/>' : '<div class="brand-mark">' + esc(initial) + '</div>') +
      '<div class="brand-name truncate">' + esc(r.store_name || r.username) + (r.hide_branding ? '' : '<span class="sub">Powered by Global Digits</span>') + '</div>';
    var img = document.getElementById('brandImg');
    if (img) img.onerror = function(){ img.outerHTML = '<div class="brand-mark">' + esc(initial) + '</div>'; };
  }

  function showBlocking(title, message, retry){
    document.getElementById('pillNav').classList.add('hidden');
    document.getElementById('viewport').innerHTML =
      '<div class="center-box"><div class="empty-state"><div class="icon-wrap" style="background:var(--bad-soft);color:var(--bad)">' + icon('alert', 20) + '</div></div>' +
      '<h2>' + esc(title) + '</h2><p>' + esc(message) + '</p>' +
      (retry ? '<button class="btn btn-primary" id="bootRetry">Retry</button>' : '') + '</div>';
    var b = document.getElementById('bootRetry'); if (b) b.onclick = function(){ location.reload(); };
  }

  async function boot(){
    document.getElementById('viewport').innerHTML = '<div class="center-box"><div class="spin"></div><p>Loading store\u2026</p></div>';
    try {
      var res = await loadReseller();
      if (!res.ok){ paintBrand(); showBlocking(res.title, res.message, res.title !== 'Store not found' && res.title !== 'No store specified'); return; }
      paintBrand();
      await initAuth();
      defineRoutes();

      on('auth-changed', function(){
        renderNav();
        var p = currentPath();
        if (!state.session && p && p.indexOf('/login') !== 0 && p.indexOf('/register') !== 0) render();
      });
      on('password-recovery', function(){ goRoute('#/reset'); });
      document.addEventListener('wallet:refresh', function(){ if (currentPath() === '/wallet') render(); });
      document.addEventListener('app:signout', async function(){ await signOut(); closeMoreSheet(); goRoute('#/services'); renderNav(); });

      if (RECOVERY_LINK) location.replace('#/reset');
      startRouter();
    } catch (e) {
      console.error('boot:', e);
      showBlocking('Connection error', (e && e.message) || 'Check your internet and try again.', true);
    }
  }

  window.addEventListener('scroll', function(){
    var h = document.getElementById('topHeader');
    if (h) h.classList.toggle('scrolled', window.scrollY > 4);
  }, { passive: true });

  boot();
})();

})();
</script>
</body>
</html>
