<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="color-scheme" content="only light"/>
<meta name="theme-color" content="#3d4dfa"/>
<title>Global Digits Store</title>
<link rel="icon" type="image/x-icon" href="favicon.ico"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ═══════════════════════════════════════════════════════════
   GLOBAL DIGITS — RESELLER STOREFRONT v2 (single file)
   Sections: 1) styles  2) markup  3) script
═══════════════════════════════════════════════════════════ */

:root{
  --ink:#12131a;
  --ink-soft:#565a6e;
  --ink-faint:#9497a8;
  --paper:#fbfbfd;
  --surface:#ffffff;
  --surface-sunk:#f4f4f8;
  --line:#e8e8ef;
  --line-soft:#f0f0f5;

  --accent:#3d4dfa;
  --accent-ink:#ffffff;
  --accent-soft:#eef0ff;
  --accent-dim:#6b76fb;

  --good:#1a9e6f;
  --good-soft:#e7f7f0;
  --bad:#e2483e;
  --bad-soft:#fdecea;
  --warn:#c07f11;
  --warn-soft:#fbf1de;

  --radius-sm:8px;
  --radius:12px;
  --radius-lg:18px;
  --radius-xl:24px;
  --radius-pill:999px;

  --gap-xs:6px;
  --gap-sm:10px;
  --gap:16px;
  --gap-lg:24px;

  --ease:cubic-bezier(.4,0,.2,1);
  --dur:.16s;

  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-display:'Lexend',var(--font);

  --nav-h:64px;
  --header-h:0px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);

  /* The storefront is light-only: never follow the device's dark mode. */
  color-scheme:only light;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:var(--safe-t);-webkit-text-size-adjust:100%}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--paper);
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
  letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;
  padding-top:var(--safe-t);
  padding-bottom:var(--safe-b);
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:inherit;background:none}
img{display:block;max-width:100%}
svg{display:block;flex-shrink:0}
.hidden{display:none!important}
.vis-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

h1,h2,h3{font-family:var(--font-display);letter-spacing:-.02em;font-weight:600}

#appRoot{min-height:100%;display:flex;flex-direction:column}
#viewport{
  flex:1;
  width:100%;
  max-width:640px;
  margin:0 auto;
  padding:18px 16px calc(var(--nav-h) + 40px);
}
@media (min-width:860px){
  #viewport{max-width:760px;padding-top:28px}
}

.stack{display:flex;flex-direction:column}
.g-xs{gap:var(--gap-xs)}
.g-sm{gap:var(--gap-sm)}
.g{gap:var(--gap)}
.g-lg{gap:var(--gap-lg)}
.row{display:flex;align-items:center}
.row-between{display:flex;align-items:center;justify-content:space-between}
.grow{flex:1;min-width:0}

.section{margin-bottom:26px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.section-head h2{font-size:15px}
.section-head .link{font-size:12.5px;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:2px}

.truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.muted{color:var(--ink-soft)}
.faint{color:var(--ink-faint)}
.mono{font-variant-numeric:tabular-nums}

.spin{
  width:26px;height:26px;border-radius:50%;
  border:2.5px solid var(--line);border-top-color:var(--accent);
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.center-box{
  min-height:44vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:10px;padding:20px;
}
.center-box h2{font-size:16px}
.center-box p{color:var(--ink-soft);font-size:13px;max-width:280px}

.skeleton{
  background:linear-gradient(90deg,var(--surface-sunk) 25%,var(--line-soft) 37%,var(--surface-sunk) 63%);
  background-size:400% 100%;
  animation:shimmer 1.4s ease infinite;
  border-radius:var(--radius-sm);
}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}


/* ── HEADER ── */
#topHeader{
  position:sticky;top:0;z-index:30;
  padding:14px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid transparent;
}
#topHeader.scrolled{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand-mark{
  width:32px;height:32px;border-radius:10px;object-fit:cover;flex-shrink:0;
  background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;font-size:14px;
}
.brand-name{font-family:var(--font-display);font-weight:600;font-size:14.5px;letter-spacing:-.01em}
.brand-name .sub{display:block;font-family:var(--font);font-weight:400;font-size:10.5px;color:var(--ink-faint);margin-top:-1px}
.header-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}

/* ── BUTTONS ── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 18px;border-radius:var(--radius);
  font-weight:600;font-size:13.5px;letter-spacing:-.005em;
  transition:transform var(--dur) var(--ease),opacity var(--dur) var(--ease),background var(--dur) var(--ease);
  white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn-outline{background:transparent;border:1.4px solid var(--line);color:var(--ink)}
.btn-ghost{background:var(--surface-sunk);color:var(--ink)}
.btn-danger{background:var(--bad-soft);color:var(--bad)}
.btn-sm{padding:7px 13px;font-size:12px;border-radius:9px}
.btn-lg{padding:13px 20px;font-size:14.5px}
.btn-block{width:100%}
.btn-icon{padding:9px;border-radius:var(--radius-sm)}

.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:7px 13px;border-radius:var(--radius-pill);
  font-size:12px;font-weight:600;color:var(--ink-soft);
  background:var(--surface-sunk);border:1.4px solid transparent;
  transition:all var(--dur) var(--ease);white-space:nowrap;
}
.chip.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.chip-row{display:flex;gap:7px;flex-wrap:wrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip-row::-webkit-scrollbar{display:none}

/* ── FIELDS ── */
.field{margin-bottom:14px}
.field label{
  display:block;font-size:11px;font-weight:600;color:var(--ink-soft);
  margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;
}
.input,.select{
  width:100%;padding:12px 14px;border-radius:var(--radius-sm);
  border:1.4px solid var(--line);background:var(--surface);color:var(--ink);
  transition:border-color var(--dur) var(--ease);
}
.input:focus,.select:focus{outline:none;border-color:var(--accent)}
.input::placeholder{color:var(--ink-faint)}
.field-hint{font-size:11px;color:var(--ink-faint);margin-top:5px}
.pw-wrap{position:relative}
.pw-wrap .input{padding-right:42px}
.pw-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--ink-faint)}

/* ── CARDS ── */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:18px;
}
.card-tight{padding:14px}
.surface-block{background:var(--surface-sunk);border-radius:var(--radius);padding:14px}

/* ── BADGES ── */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 9px;border-radius:var(--radius-pill);
  font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
}
.badge-good{background:var(--good-soft);color:var(--good)}
.badge-warn{background:var(--warn-soft);color:var(--warn)}
.badge-bad{background:var(--bad-soft);color:var(--bad)}
.badge-neutral{background:var(--surface-sunk);color:var(--ink-soft)}

/* ── EMPTY STATE ── */
.empty-state{
  text-align:center;padding:36px 16px;color:var(--ink-faint);
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.empty-state .icon-wrap{width:44px;height:44px;border-radius:14px;background:var(--surface-sunk);display:flex;align-items:center;justify-content:center;color:var(--ink-faint)}
.empty-state p{font-size:12.5px;max-width:240px}

/* ── SERVICE ROW / TILE ── */
.svc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:520px){.svc-grid{grid-template-columns:repeat(4,1fr)}}
.svc-tile{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:16px 14px;display:flex;flex-direction:column;gap:10px;text-align:left;
  transition:border-color var(--dur) var(--ease),transform var(--dur) var(--ease);
}
.svc-tile:active{transform:scale(.98)}
.svc-tile:hover{border-color:var(--accent)}
.svc-tile .icon-wrap{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.svc-tile .name{font-weight:600;font-size:13px}
.svc-tile .sub{font-size:11px;color:var(--ink-faint);line-height:1.35}

.row-card{
  display:flex;align-items:center;gap:12px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 13px;transition:border-color var(--dur) var(--ease);
}
.row-card:hover{border-color:var(--accent)}
.row-card .icon-wrap{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row-card .title{font-weight:600;font-size:13px}
.row-card .sub{font-size:11px;color:var(--ink-faint);margin-top:1px}
.row-card .amount{font-family:var(--font-display);font-weight:600;font-size:13.5px;flex-shrink:0}

/* ── PILL NAVIGATION ── */
#pillNav{
  position:fixed;left:50%;bottom:calc(16px + var(--safe-b));transform:translateX(-50%);
  z-index:40;display:flex;align-items:center;gap:2px;
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  border:1px solid var(--line);
  border-radius:var(--radius-pill);
  padding:5px;
  box-shadow:0 8px 30px rgba(0,0,0,.10);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  max-width:calc(100vw - 24px);
}
@media (min-width:860px){
  #pillNav{top:calc(16px + var(--safe-t));bottom:auto}
}
.pill-btn{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 15px;border-radius:var(--radius-pill);
  color:var(--ink-faint);font-size:9.5px;font-weight:600;
  transition:color var(--dur) var(--ease);
}
.pill-btn.active{color:var(--accent-ink)}
.pill-btn .pb-bubble{
  position:absolute;inset:0;border-radius:var(--radius-pill);background:var(--accent);
  z-index:-1;opacity:0;transform:scale(.85);transition:all var(--dur) var(--ease);
}
.pill-btn.active .pb-bubble{opacity:1;transform:scale(1)}
.pill-more-sheet{
  position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;
}
@media (min-width:860px){.pill-more-sheet{align-items:flex-start;padding-top:80px}}
.pms-overlay{position:absolute;inset:0;background:rgba(10,10,16,.4)}
.pms-sheet{
  position:relative;width:100%;max-width:420px;background:var(--surface);
  border-radius:var(--radius-xl) var(--radius-xl) 0 0;padding:10px 8px calc(20px + var(--safe-b));
  box-shadow:0 -10px 40px rgba(0,0,0,.18);
}
@media (min-width:860px){.pms-sheet{border-radius:var(--radius-xl);margin-bottom:auto}}
.pms-handle{width:36px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.pms-item{
  display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:var(--radius);
  font-size:13.5px;font-weight:600;
}
.pms-item:hover{background:var(--surface-sunk)}
.pms-item .icon-wrap{width:32px;height:32px;border-radius:9px;background:var(--surface-sunk);color:var(--ink-soft);display:flex;align-items:center;justify-content:center}
.pms-item.danger{color:var(--bad)}
.pms-item.danger .icon-wrap{background:var(--bad-soft);color:var(--bad)}

/* ── MODAL ── */
.overlay{
  position:fixed;inset:0;background:rgba(10,10,16,.44);z-index:70;
  display:flex;align-items:flex-end;justify-content:center;padding:0;
  animation:fadeIn var(--dur) var(--ease);
}
@media (min-width:640px){.overlay{align-items:center;padding:20px}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:440px;max-height:88vh;overflow-y:auto;
  background:var(--surface);border-radius:var(--radius-xl) var(--radius-xl) 0 0;
  padding:20px 18px calc(20px + var(--safe-b));
  animation:slideUp .18s var(--ease);
}
@media (min-width:640px){.modal{border-radius:var(--radius-xl)}}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-head h3{font-size:15.5px}
.x-btn{width:28px;height:28px;border-radius:50%;background:var(--surface-sunk);display:flex;align-items:center;justify-content:center;color:var(--ink-soft)}

/* ── TOAST ── */
#toast{
  position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%) translateY(12px);
  background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:var(--radius-pill);
  font-size:12.5px;font-weight:600;z-index:90;opacity:0;pointer-events:none;
  transition:all .22s var(--ease);max-width:88vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── AUTH ── */
.auth-wrap{max-width:380px;margin:6vh auto 0;display:flex;flex-direction:column;gap:22px}
.auth-logo{width:52px;height:52px;border-radius:16px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:22px;margin:0 auto}
.auth-head{text-align:center}
.auth-head h1{font-size:19px;margin-bottom:4px}
.auth-head p{font-size:12.5px;color:var(--ink-soft)}
.auth-switch{text-align:center;font-size:12.5px;color:var(--ink-soft)}
.auth-switch a{color:var(--accent);font-weight:700}

/* ── WALLET ── */
.wallet-hero{
  background:var(--ink);color:var(--paper);border-radius:var(--radius-xl);
  padding:22px 20px;display:flex;flex-direction:column;gap:14px;
}
.wallet-hero .lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.6}
.wallet-hero .amt{font-family:var(--font-display);font-size:30px;font-weight:600;letter-spacing:-.02em}
.wallet-hero .actions{display:flex;gap:8px}
.wallet-hero .btn-accent{background:#fff;color:var(--ink)}
.wallet-hero .btn-outline{border-color:rgba(255,255,255,.25);color:#fff}

/* ── PROGRESS / TRACKER ── */
.track-steps{display:flex;flex-direction:column;gap:0;margin:6px 0 4px}
.track-step{display:flex;gap:12px;padding:2px 0}
.track-step .dot-col{display:flex;flex-direction:column;align-items:center}
.track-step .dot{width:20px;height:20px;border-radius:50%;background:var(--surface-sunk);color:var(--ink-faint);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.track-step.done .dot{background:var(--good);color:#fff}
.track-step.current .dot{background:var(--accent);color:#fff}
.track-step .bar{width:2px;flex:1;background:var(--line);min-height:20px}
.track-step.done .bar{background:var(--good)}
.track-step .txt{padding-bottom:18px}
.track-step .txt .t1{font-size:12.5px;font-weight:600}
.track-step .txt .t2{font-size:11px;color:var(--ink-faint)}

/* ── MISC ── */
.divider{height:1px;background:var(--line);margin:14px 0}
.copy-field{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-sunk);border-radius:var(--radius-sm);padding:11px 13px}
.upload-zone{
  border:1.6px dashed var(--line);border-radius:var(--radius);padding:20px;text-align:center;
  color:var(--ink-faint);font-size:12px;cursor:pointer;transition:border-color var(--dur);
}
.upload-zone.filled{border-color:var(--good);color:var(--good)}
.plan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.plan-card{
  border:1.4px solid var(--line);border-radius:var(--radius);padding:11px;cursor:pointer;
  transition:all var(--dur) var(--ease);
}
.plan-card.active{border-color:var(--accent);background:var(--accent-soft)}

/* ── AUTH ERROR ── */
.auth-error{margin-top:12px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--bad-soft);color:var(--bad);font-size:12.5px;font-weight:500}

/* ── CUSTOM DROPDOWN ── */
.dd{position:relative;width:100%}
.dd-trigger{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;
  padding:12px 14px;border-radius:var(--radius-sm);border:1.4px solid var(--line);background:var(--surface);color:var(--ink);
  transition:border-color var(--dur) var(--ease);
}
.dd-trigger:hover{border-color:var(--ink-faint)}
.dd-trigger:focus-visible,.dd-trigger[aria-expanded="true"]{outline:none;border-color:var(--accent)}
.dd.disabled .dd-trigger{opacity:.55;cursor:not-allowed;background:var(--surface-sunk)}
.dd-label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-label.placeholder{color:var(--ink-faint)}
.dd-chevron{color:var(--ink-faint);display:flex;transition:transform var(--dur) var(--ease)}
.dd-trigger[aria-expanded="true"] .dd-chevron{transform:rotate(180deg)}

.dd-layer{position:fixed;inset:0;z-index:100}
.dd-overlay{position:absolute;inset:0;background:transparent}
.dd-panel{
  position:fixed;display:flex;flex-direction:column;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:0 14px 40px rgba(0,0,0,.16);animation:ddIn .12s var(--ease);
}
.dd-title{padding:12px 16px 6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);display:none}
.dd-list{overflow-y:auto;padding:5px;overscroll-behavior:contain}
.dd-item{
  width:100%;display:flex;align-items:center;gap:10px;text-align:left;
  padding:10px 11px;border-radius:var(--radius-sm);font-size:13.5px;
}
.dd-item:focus{outline:none;background:var(--surface-sunk)}
.dd-item.selected{color:var(--accent);font-weight:600}
.dd-item-label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-item-hint{font-size:11.5px;color:var(--ink-faint);flex-shrink:0}
.dd-item-check{display:flex;color:var(--accent);flex-shrink:0}
.dd-empty{padding:16px;text-align:center;color:var(--ink-faint);font-size:12.5px}
@keyframes ddIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* phones: bottom sheet */
.dd-layer.sheet .dd-overlay{background:rgba(10,10,16,.44);animation:fadeIn var(--dur) var(--ease)}
.dd-layer.sheet .dd-panel{
  left:0;right:0;bottom:0;top:auto;width:100%;max-height:70vh;
  border:none;border-radius:var(--radius-xl) var(--radius-xl) 0 0;
  padding-bottom:var(--safe-b);animation:slideUp .18s var(--ease);
}
.dd-layer.sheet .dd-title{display:block}

var M_utils = (function(){
  function fmtN(n){ return '\u20A6' + Math.round(n || 0).toLocaleString(); }

  function fmtDate(d){
    if (!d) return '—';
    return new Date(d).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
  }
  function fmtDateTime(d){
    if (!d) return '—';
    return new Date(d).toLocaleString('en-GB', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
  }

  function fmtFullDate(d){
    if (!d) return '—';
    return new Date(d).toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function qs(name){ return new URL(location.href).searchParams.get(name); }

  function cap(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

  function withTimeout(promise, ms, label){
    return Promise.race([
      promise,
      new Promise(function(_, reject){
        setTimeout(function(){ reject(new Error((label || 'Request') + ' timed out')); }, ms || 12000);
      })
    ]);
  }

  function debounce(fn, wait){
    var t;
    return function(){
      var args = arguments, ctx = this;
      clearTimeout(t);
      t = setTimeout(function(){ fn.apply(ctx, args); }, wait || 250);
    };
  }

  let toastTimer = null;
  function toast(msg){
    var el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 3000);
  }

  // Client-side fallback when Storage upload fails — resized/compressed
  // inline data URL, never used unless the real upload could not complete.
  function compressImage(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var max = 900, w = img.width, h = img.height;
          if (w > max){ h = Math.round(h * max / w); w = max; }
          var c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL('image/jpeg', 0.75));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function skeleton(count, height){
    var out = '';
    for (var i = 0; i < (count || 3); i++){
      out += '<div class="skeleton" style="height:' + (height || 56) + 'px;margin-bottom:10px"></div>';
    }
    return out;
  }

  // Shared error state — used whenever a backend read fails, so a failed
  // request is never mistaken for "nothing here yet".
  function renderError(root, message, retry){
    root.innerHTML = '<div class="center-box"><h2>Could not load this page</h2><p>' + esc(message || 'Please check your connection and try again.') + '</p>' +
      (retry ? '<button class="btn btn-outline" id="errRetry">Try again</button>' : '') + '</div>';
    var b = root.querySelector('#errRetry');
    if (b) b.onclick = retry;
  }
  return { fmtN, fmtDate, fmtDateTime, fmtFullDate, esc, qs, cap, withTimeout, debounce, toast, compressImage, skeleton, renderError };
})();

var M_state = (function(){
  const state = {
    reseller: null,          // resellers row for this store
    subscription: null,      // reseller_active_subscription row
    plan: null,              // reseller_plans row
    permittedCategories: [], // product_category[] this plan allows (filtered to ACTIVE_CATEGORIES)
    markupPercent: 0,

    session: null,           // Supabase auth session for the signed-in customer (or null)
    customerLink: null,      // reseller_customers row for (reseller, this user)
    isOwner: false,          // true when the signed-in account IS this store's reseller/owner

    walletBalance: 0,
    bootError: null
  };

  const listeners = {};

  function on(event, fn){
    (listeners[event] = listeners[event] || []).push(fn);
    return function off(){
      listeners[event] = (listeners[event] || []).filter(function(f){ return f !== fn; });
    };
  }

  function emit(event, payload){
    (listeners[event] || []).forEach(function(fn){
      try { fn(payload); } catch (e) { console.error('listener error for', event, e); }
    });
  }
  return { state, on, emit };
})();

    var el = document.getElementById(id);

  }

  function mountDropdown(id, cfg){
    var el = document.getElementById(id);
    if (!el) return;
    cfg = cfg || {};
    el._cfg = cfg;
    el.classList.add('dd');
    el.classList.toggle('disabled', !!cfg.disabled);
    el.dataset.value = cfg.value == null ? '' : String(cfg.value);
    paintTrigger(el);
  }

  function selectedOption(el){
    var cfg = el._cfg || {}, v = el.dataset.value;
    if (v === '') return null;
    return (cfg.options || []).find(function(o){ return String(o.value) === v; }) || null;
  }

  function paintTrigger(el){
    var cfg = el._cfg || {}, sel = selectedOption(el);
    el.innerHTML =
      '<button type="button" class="dd-trigger" aria-haspopup="listbox" aria-expanded="false"' + (cfg.disabled ? ' disabled' : '') + '>' +
        '<span class="dd-label' + (sel ? '' : ' placeholder') + '">' + esc(sel ? sel.label : (cfg.placeholder || 'Select')) + '</span>' +
        '<span class="dd-chevron">' + icon('chevronD', 16) + '</span>' +
      '</button>';
    var trigger = el.querySelector('.dd-trigger');
    trigger.addEventListener('click', function(){ openPanel(el); });

      if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); openPanel(el); }
    });
  }

  function closePanel(){
    if (!openLayer) return;
    var layer = openLayer; openLayer = null;
    document.removeEventListener('keydown', layer.onKey, true);
    window.removeEventListener('resize', closePanel);
    window.removeEventListener('scroll', layer.onScroll, true);
    layer.node.remove();
    var t = layer.host.querySelector('.dd-trigger');
    if (t){ t.setAttribute('aria-expanded', 'false'); t.focus({ preventScroll: true }); }
  }

  function openPanel(el){
    closePanel();
    var cfg = el._cfg || {}, options = cfg.options || [];

    if (!trigger || cfg.disabled) return;
    trigger.setAttribute('aria-expanded', 'true');

    var current = el.dataset.value;
    var node = document.createElement('div');
    node.className = 'dd-layer';
    node.innerHTML =
      '<div class="dd-overlay"></div>' +
      '<div class="dd-panel" role="listbox">' +
        (cfg.title ? '<div class="dd-title">' + esc(cfg.title) + '</div>' : '') +
        '<div class="dd-list">' +
          (options.length ? options.map(function(o, i){
            var isSel = String(o.value) === current;
            return '<button type="button" class="dd-item' + (isSel ? ' selected' : '') + '" role="option" aria-selected="' + isSel + '" data-i="' + i + '" tabindex="-1">' +
              '<span class="dd-item-label">' + esc(o.label) + '</span>' +
              (o.hint ? '<span class="dd-item-hint">' + esc(o.hint) + '</span>' : '') +
              (isSel ? '<span class="dd-item-check">' + icon('check', 15) + '</span>' : '') +
            '</button>';
          }).join('') : '<div class="dd-empty">No options available</div>') +
        '</div>' +
      '</div>';
    document.body.appendChild(node);

    var panel = node.querySelector('.dd-panel');
    var narrow = window.innerWidth < 640;
    if (narrow){
      node.classList.add('sheet');
    } else {
      var r = trigger.getBoundingClientRect();
      var spaceBelow = window.innerHeight - r.bottom - 12, spaceAbove = r.top - 12;
