      var openUp = spaceBelow < Math.min(maxH, 200) && spaceAbove > spaceBelow;
      panel.style.left = r.left + 'px';
      panel.style.width = r.width + 'px';
      panel.style.maxHeight = Math.max(140, Math.min(maxH, openUp ? spaceAbove : spaceBelow)) + 'px';
      if (openUp) panel.style.bottom = (window.innerHeight - r.top + 6) + 'px';
      else panel.style.top = (r.bottom + 6) + 'px';
    }

    var items = Array.prototype.slice.call(node.querySelectorAll('.dd-item'));
    function choose(i){
      var o = options[i]; if (!o) return;
      el.dataset.value = String(o.value);
      paintTrigger(el);
      var cb = cfg.onChange;
      closePanel();
      if (cb) cb(String(o.value), o);
    }
    function focusItem(i){
      if (!items.length) return;
      i = Math.max(0, Math.min(items.length - 1, i));
      items[i].focus({ preventScroll: true });
      items[i].scrollIntoView({ block: 'nearest' });
    }
    items.forEach(function(b, i){
      b.addEventListener('click', function(){ choose(i); });
      b.addEventListener('mouseenter', function(){ b.focus({ preventScroll: true }); });
    });
    node.querySelector('.dd-overlay').addEventListener('click', closePanel);

    function onKey(e){
      if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); closePanel(); return; }
      var idx = items.indexOf(document.activeElement);
      if (e.key === 'ArrowDown'){ e.preventDefault(); focusItem(idx + 1); }
      else if (e.key === 'ArrowUp'){ e.preventDefault(); focusItem(idx < 0 ? 0 : idx - 1); }
      else if (e.key === 'Home'){ e.preventDefault(); focusItem(0); }
      else if (e.key === 'End'){ e.preventDefault(); focusItem(items.length - 1); }
      else if ((e.key === 'Enter' || e.key === ' ') && idx > -1){ e.preventDefault(); choose(idx); }
      else if (e.key === 'Tab'){ closePanel(); }
    }
    document.addEventListener('keydown', onKey, true);
    window.addEventListener('resize', closePanel);
    // Scrolling the page closes the popover, but scrolling inside the list must not.
    var onScroll = function(e){ if (!narrow && !node.contains(e.target)) closePanel(); };
    window.addEventListener('scroll', onScroll, true);

    openLayer = { node: node, host: el, onKey: onKey, onScroll: onScroll };
    var selIdx = items.findIndex(function(b){ return b.classList.contains('selected'); });
    focusItem(selIdx > -1 ? selIdx : 0);
  }

  function closeDropdown(){ closePanel(); }
  return { ddValue, mountDropdown, closeDropdown };
})();

/* ── ROUTER & PILL NAVIGATION ──────────────────────────────────────── */
var M_router = (function(){
  var state = M_state.state;
  var icon = M_icons.icon;
  var esc = M_utils.esc;
  var closeDropdown = M_dropdown.closeDropdown;
  const routes = [];           // { pattern:RegExp, keys:[], auth:bool, owner:bool, nav:string, render:fn }
  let resume = null;           // { fn, back } — action to run after a login triggered mid-flow
  let rendering = 0;
  const leaveFns = [];         // cleanups registered by pages (realtime channels etc.)

  function onLeave(fn){ leaveFns.push(fn); }
  function runLeave(){
    while (leaveFns.length){ try { leaveFns.pop()(); } catch (e) { console.warn('leave cleanup failed', e); } }
  }

  function defineRoute(path, opts){
    var keys = [];
    var pattern = new RegExp('^' + path.replace(/:[a-z]+/gi, function(m){ keys.push(m.slice(1)); return '([^/]+)'; }) + '$');
    routes.push({ pattern: pattern, keys: keys, auth: !!opts.auth, owner: !!opts.owner, nav: opts.nav || '', render: opts.render });
  }

  function currentPath(){
    var h = location.hash || '';
    return h.indexOf('#/') === 0 ? h.slice(1).split('?')[0] : '';
  }

  function match(path){
    for (var i = 0; i < routes.length; i++){
      var m = path.match(routes[i].pattern);
      if (m){
        var params = {};
        routes[i].keys.forEach(function(k, j){ params[k] = decodeURIComponent(m[j + 1]); });
        return { route: routes[i], params: params };
      }
    }
    return null;
  }

  function goRoute(hash, resumeFn){
    if (resumeFn && hash.indexOf('#/login') === 0) resume = { fn: resumeFn, back: location.hash || '#/services' };
    if (location.hash === hash) render();
    else location.hash = hash;
  }

  function takeResume(){
    var r = resume; resume = null; return r;
  }

  function defaultHash(){
    return state.session ? '#/dashboard' : '#/services';
  }

  function startRouter(){
    window.addEventListener('hashchange', render);
    render();
  }

  function render(){
    runLeave();
    closeDropdown();
    closeMoreSheet();
    var view = document.getElementById('viewport');
    var path = currentPath();
    if (!path){ location.replace(defaultHash()); return; }
    var m = match(path);
    if (!m){ location.replace(defaultHash()); return; }
    var r = m.route;
    if (r.auth && !state.session){
      if (!resume) resume = { fn: null, back: '#' + path };
      location.replace('#/login');
      return;
    }
    if (r.owner && !state.isOwner){ location.replace(defaultHash()); return; }
    // A pending "continue after sign-in" only survives while the user stays
    // on the sign-in screens — wandering off cancels it.
    if (['/login', '/register', '/forgot'].indexOf(path) === -1) resume = null;

    var token = ++rendering;
    window.scrollTo(0, 0);
    // Every render gets its own container, so a slow request from a page the
    // user already left can never paint over the page they are on now.
    var box = document.createElement('div');
    box.className = 'route-box';
    view.replaceChildren(box);
    view.setAttribute('data-route', path);
    Promise.resolve(r.render(box, m.params)).catch(function(e){
      if (token !== rendering) return;
      console.error('route render failed', e);
      box.innerHTML = '<div class="center-box"><h2>Something went wrong</h2><p>' + esc((e && e.message) || 'Please try again.') + '</p><button class="btn btn-outline" id="retryRoute">Try again</button></div>';
      var b = box.querySelector('#retryRoute'); if (b) b.onclick = render;
    });
    renderNav(r.nav);
  }

  /* ── PILL NAV ── */
  function navItems(){
    if (state.session){
      return [
        { id: 'dashboard', label: 'Home', icon: 'home', hash: '#/dashboard' },
        { id: 'services', label: 'Services', icon: 'grid', hash: '#/services' },
        { id: 'orders', label: 'Orders', icon: 'bag', hash: '#/orders' },
        { id: 'wallet', label: 'Wallet', icon: 'wallet', hash: '#/wallet' },
        { id: 'more', label: 'More', icon: 'more', more: true }
      ];
    }
    return [
      { id: 'services', label: 'Services', icon: 'grid', hash: '#/services' },
      { id: 'support', label: 'Support', icon: 'headset', hash: '#/support' },
      { id: 'login', label: 'Sign In', icon: 'user', hash: '#/login' }
    ];
  }

  function renderNav(active){
    var nav = document.getElementById('pillNav');
    if (!nav) return;
    if (active === 'none'){ nav.classList.add('hidden'); return; }
    nav.classList.remove('hidden');
    if (active === undefined) active = (routes.length && match(currentPath()) || { route: {} }).route.nav;
    if (active === 'support' && state.session) active = 'more';
    nav.innerHTML = navItems().map(function(it){
      return '<button class="pill-btn' + (it.id === active ? ' active' : '') + '" data-id="' + it.id + '"' + (it.more ? ' aria-haspopup="dialog"' : '') + '>' +
        '<span class="pb-bubble"></span>' + icon(it.icon, 18) + '<span>' + it.label + '</span>' +
      '</button>';
    }).join('');
    navItems().forEach(function(it){
      var btn = nav.querySelector('[data-id="' + it.id + '"]');
      btn.onclick = function(){ if (it.more) openMoreSheet(); else goRoute(it.hash); };
    });
  }

  /* ── "More" sheet ── */
  function openMoreSheet(){
    closeMoreSheet();
    var items = [
      { label: 'Payment Methods', icon: 'card', hash: '#/payment-methods' }
    ];
    if (state.isOwner) items.push({ label: 'Customers', icon: 'user', hash: '#/customers' });
    items.push({ label: 'Profile', icon: 'gear', hash: '#/profile' });
    items.push({ label: 'Support', icon: 'headset', hash: '#/support' });

    var node = document.createElement('div');
    node.className = 'pill-more-sheet';
    node.id = 'moreSheet';
    node.innerHTML =
      '<div class="pms-overlay"></div>' +
      '<div class="pms-sheet" role="dialog" aria-label="More">' +
        '<div class="pms-handle"></div>' +
        items.map(function(it, i){
          return '<button class="pms-item" data-i="' + i + '"><span class="icon-wrap">' + icon(it.icon, 16) + '</span>' + it.label + '</button>';
        }).join('') +
        '<button class="pms-item danger" data-signout="1"><span class="icon-wrap">' + icon('logout', 16) + '</span>Sign Out</button>' +
      '</div>';
    document.body.appendChild(node);
    node.querySelector('.pms-overlay').onclick = closeMoreSheet;
    node.querySelectorAll('[data-i]').forEach(function(b){
      b.onclick = function(){ var it = items[parseInt(b.getAttribute('data-i'))]; closeMoreSheet(); goRoute(it.hash); };
    });
    node.querySelector('[data-signout]').onclick = function(){
      closeMoreSheet();
      document.dispatchEvent(new CustomEvent('app:signout'));
    };
    document.addEventListener('keydown', moreEsc);
  }
  function moreEsc(e){ if (e.key === 'Escape') closeMoreSheet(); }
  function closeMoreSheet(){
    var n = document.getElementById('moreSheet');
    if (n) n.remove();
    document.removeEventListener('keydown', moreEsc);
  }
  return { onLeave, defineRoute, currentPath, goRoute, takeResume, defaultHash, startRouter, render, renderNav, closeMoreSheet };
})();

/* ── RESELLER / STOREFRONT IDENTIFICATION ──────────────────────────── */
var M_reseller = (function(){
  var sb = M_config.sb;
  var ACTIVE_CATEGORIES = M_config.ACTIVE_CATEGORIES;
  var state = M_state.state;
  var withTimeout = M_utils.withTimeout;
  function resolveStoreSlug(){
    var fromParam = qsParam('store');
    if (fromParam) return fromParam;
    var host = location.hostname;
    var m = host.match(/^([a-z0-9-]+)\.globaldigits\.shop$/i);
    if (m && ['www', 'reseller', 'storefront'].indexOf(m[1].toLowerCase()) === -1) return m[1];
    return null;
  }
  function qsParam(name){ return new URL(location.href).searchParams.get(name); }

  async function loadReseller(){
    var slug = resolveStoreSlug();
    if (!slug){
      return { ok: false, title: 'No store specified', message: 'Check the URL and try again.' };
    }

    var rr = await withTimeout(
      sb.from('resellers').select('*').eq('username', slug.toLowerCase()).eq('status', 'active').maybeSingle(),
      12000, 'Loading store'
    );
    if (rr.error) throw new Error(rr.error.message || 'Could not reach the store');
    if (!rr.data){
      return { ok: false, title: 'Store not found', message: "This storefront doesn't exist or is not active." };
    }
    state.reseller = rr.data;
    state.markupPercent = Number(rr.data.default_markup_percent || 0);

    var sr = await sb.from('reseller_active_subscription').select('*').eq('reseller_id', rr.data.id).maybeSingle();
    if (sr.error) throw new Error(sr.error.message || 'Could not load the store subscription');
    var sub = (sr.data && new Date(sr.data.expires_at) > new Date()) ? sr.data : null;
    if (!sub){
      return { ok: false, title: 'Store temporarily unavailable', message: "This reseller's subscription is inactive." };
    }
    state.subscription = sub;

    var pr = await sb.from('reseller_plans').select('*').eq('id', sub.plan_id).single();
    state.plan = pr.data || null;

    var permR = await sb.from('reseller_plan_permissions').select('product_category').eq('plan_id', sub.plan_id);
    if (permR.error) throw new Error(permR.error.message || 'Could not load store services');
    var permitted = (permR.data || []).map(function(p){ return p.product_category; });
    // Only the four current reseller services ever surface here, regardless
    // of what a legacy plan row might still list.
    state.permittedCategories = ACTIVE_CATEGORIES.filter(function(c){ return permitted.indexOf(c) > -1; });

    document.title = (rr.data.store_name || slug) + ' — Powered by Global Digits';
    return { ok: true };
  }

  function custPrice(basePrice){
    return Math.round(basePrice * (1 + (state.markupPercent || 0) / 100));
  }
  return { loadReseller, custPrice };
})();

/* ── AUTHENTICATION ────────────────────────────────────────────────── */
var M_auth = (function(){
  var sb = M_config.sb;
  var state = M_state.state;
  var emit = M_state.emit;
  var toast = M_utils.toast;
  let lastUid = null;
  let linking = null;

  async function initAuth(){
    try {
      var s = await sb.auth.getSession();
      state.session = (s.data && s.data.session) || null;
    } catch (e) {
      state.session = null;
    }
    lastUid = state.session ? state.session.user.id : null;
    if (state.session) await afterSignedIn();
    sb.auth.onAuthStateChange(function(event, session){
      state.session = session || null;
      if (event === 'PASSWORD_RECOVERY') emit('password-recovery');
      var uid = session ? session.user.id : null;
      if (uid === lastUid) return;            // token refreshes etc. must not re-render the page
      lastUid = uid;
      // Deferred so no Supabase call runs inside the auth callback itself.
      setTimeout(function(){
        if (uid) afterSignedIn().then(function(){ emit('auth-changed'); });
        else { state.customerLink = null; state.isOwner = false; state.walletBalance = 0; emit('auth-changed'); }
      }, 0);
    });
  }

  async function afterSignedIn(){
    await ensureResellerCustomerLink();
    state.isOwner = !!(state.reseller && state.session && state.reseller.user_id === state.session.user.id);
  }

  // Every reseller storefront a customer visits shares the SAME Supabase
  // Auth account — this only inserts a reseller_customers row the first
  // time THIS reseller has seen THIS customer, mirroring exactly what the
  // legacy storefront and reseller dashboard already do.
  function ensureResellerCustomerLink(){
    if (!state.session || !state.reseller) return Promise.resolve();
    if (linking) return linking;
    linking = linkCustomer().finally(function(){ linking = null; });
    return linking;
  }
  async function linkCustomer(){
    try {
      var existing = await sb.from('reseller_customers').select('*')
        .eq('reseller_id', state.reseller.id).eq('auth_user_id', state.session.user.id).maybeSingle();
      if (existing.data){ state.customerLink = existing.data; return; }
      var meta = state.session.user.user_metadata || {};
      var created = await sb.from('reseller_customers').insert({
        reseller_id: state.reseller.id,
        auth_user_id: state.session.user.id,
        name: meta.name || null,
        email: state.session.user.email || null,
        phone: meta.phone || null
      }).select().single();
      state.customerLink = created.data || null;
    } catch (e) {
      console.warn('ensureResellerCustomerLink:', e.message || e);
    }
  }

  function displayName(){
    if (!state.session) return '';
    var meta = state.session.user.user_metadata || {};
    return meta.name || (state.session.user.email || '').split('@')[0] || 'there';
  }

  async function signUp(name, phone, email, password){
    if (!name) throw new Error('Enter your name');
    if (!email) throw new Error('Enter your email');
    if (password.length < 6) throw new Error('Password must be at least 6 characters');
    var r = await sb.auth.signUp({ email: email, password: password, options: { data: { name: name, phone: phone, source: 'storefront-v2' } } });
    if (r.error) throw new Error(r.error.message || 'Could not create account');
    if (r.data && r.data.session){
      state.session = r.data.session;
      await afterSignedIn();
      return { immediate: true };
    }
    return { immediate: false };
  }

  async function signIn(email, password){
    if (!email || !password) throw new Error('Enter your email and password');
    var r = await sb.auth.signInWithPassword({ email: email, password: password });
    if (r.error) throw new Error(r.error.message || 'Invalid email or password');
    state.session = r.data.session;
    await afterSignedIn();
  }

  async function forgotPassword(email, storeParam){
    if (!email) throw new Error('Enter your email');
    var redirectTo = window.location.origin + window.location.pathname + (storeParam ? '?store=' + encodeURIComponent(storeParam) : '');
    var r = await sb.auth.resetPasswordForEmail(email, { redirectTo: redirectTo });
    if (r.error) throw new Error(r.error.message || 'Could not send reset link');
  }

  async function setNewPassword(password){
    if (password.length < 6) throw new Error('Password must be at least 6 characters');
    var r = await sb.auth.updateUser({ password: password });
    if (r.error) throw new Error(r.error.message || 'Could not update password');
  }

  async function updateProfile(fields){
    var payload = { data: {} };
    if (fields.name !== undefined) payload.data.name = fields.name;
    if (fields.phone !== undefined) payload.data.phone = fields.phone;
    if (fields.email) payload.email = fields.email;
    var r = await sb.auth.updateUser(payload);
    if (r.error) throw new Error(r.error.message || 'Could not update profile');
    state.session = (await sb.auth.getSession()).data.session;
    // Keep the storefront's own customer record (used by the reseller's
    // Customers list) in sync with the auth profile.
    if (state.customerLink){
      try {
        await sb.from('reseller_customers').update({
          name: fields.name !== undefined ? fields.name : state.customerLink.name,
          phone: fields.phone !== undefined ? fields.phone : state.customerLink.phone
        }).eq('id', state.customerLink.id);
      } catch (e) { /* non-fatal */ }
    }
  }

  async function signOut(){
    try { await sb.auth.signOut(); } catch (e) {}
    state.session = null; state.customerLink = null; state.isOwner = false; state.walletBalance = 0;
    toast('Signed out');
  }

  function isPasswordRecoveryMode(){
    return /type=recovery/.test(window.location.hash || '');
  }
  return { initAuth, ensureResellerCustomerLink, displayName, signUp, signIn, forgotPassword, setNewPassword, updateProfile, signOut, isPasswordRecoveryMode };
})();

/* ── WALLET ────────────────────────────────────────────────────────── */
var M_wallet = (function(){
  var sb = M_config.sb;
  var DEPOSIT_BUCKET = M_config.DEPOSIT_BUCKET;
  var state = M_state.state;
  var icon = M_icons.icon;
  var fmtN = M_utils.fmtN;
  var fmtDate = M_utils.fmtDate;
  var fmtFullDate = M_utils.fmtFullDate;
  var esc = M_utils.esc;
  var cap = M_utils.cap;
  var toast = M_utils.toast;
  var compressImage = M_utils.compressImage;
  var renderError = M_utils.renderError;
  var openModal = M_modal.openModal;
  var closeModal = M_modal.closeModal;
  async function fetchWalletBalance(){
    if (!state.session || !state.reseller){ state.walletBalance = 0; return 0; }
    var r = await sb.from('reseller_customers').select('wallet_balance')
      .eq('reseller_id', state.reseller.id).eq('auth_user_id', state.session.user.id).maybeSingle();
    // A failed read must never look like an empty wallet — null means "unknown".
    if (r.error){ state.walletBalance = null; return null; }
    state.walletBalance = (r.data && Number(r.data.wallet_balance)) || 0;
    return state.walletBalance;
  }

  function fmtWallet(){
    return state.walletBalance == null ? '\u2014' : fmtN(state.walletBalance);
  }

  async function fetchActivePaymentAccount(){
    var r = await sb.from('payment_accounts').select('*').eq('active', true).order('created_at');
    return (r.data || [])[0] || null;
  }

  let txns = [];

  async function renderWalletPage(root){
    root.innerHTML = '<div class="center-box"><div class="spin"></div></div>';
    await fetchWalletBalance();
    var txR = await sb.from('storefront_wallet_transactions').select('*')
      .eq('reseller_id', state.reseller.id).eq('customer_user_id', state.session.user.id)
      .order('created_at', { ascending: false }).limit(50);
    if (!root.isConnected) return;
    if (txR.error){ renderError(root, txR.error.message, function(){ renderWalletPage(root); }); return; }
    txns = txR.data || [];
    root.innerHTML =
      '<div class="wallet-hero section">' +
        '<div class="lbl">Wallet Balance</div>' +
        '<div class="amt">' + fmtWallet() + '</div>' +
        '<div class="actions">' +
          '<button class="btn btn-accent" id="wAddFunds">' + icon('plus', 15) + ' Add Funds</button>' +
        '</div>' +
      '</div>' +
      '<div class="section">' +
        '<div class="section-head"><h2>Recent Transactions</h2></div>' +
        (txns.length ? '<div class="card tx-list">' + txns.map(txRow).join('') + '</div>'
          : '<div class="empty-state"><div class="icon-wrap">' + icon('wallet', 20) + '</div><p>No wallet activity yet</p></div>') +
      '</div>';
    document.getElementById('wAddFunds').onclick = openAddFundsModal;
    root.querySelectorAll('[data-tx]').forEach(function(el){
      el.addEventListener('click', function(){ openReceipt(txns[parseInt(el.getAttribute('data-tx'))]); });
    });
  }

  var TYPE_LABEL = { deposit: 'Wallet Funding', purchase: 'Purchase', refund: 'Refund' };
  function isCredit(t){ return t.type === 'deposit' || t.type === 'refund'; }
  function txTitle(t){ return t.description || TYPE_LABEL[t.type] || 'Transaction'; }
  function txStatus(t){
    if (t.status === 'pending') return { label: 'Pending', badge: 'badge-warn', color: 'var(--warn)', ico: 'clock' };
    if (t.status === 'rejected') return { label: 'Rejected', badge: 'badge-bad', color: 'var(--bad)', ico: 'close' };
    return { label: 'Successful', badge: 'badge-good', color: 'var(--good)', ico: 'check' };
  }

  function txRow(t, i){
    var st = txStatus(t);
    var amtColor = t.status === 'rejected' || t.status === 'pending' ? st.color : (isCredit(t) ? 'var(--good)' : 'var(--ink)');
    return '<button type="button" class="tx-row" data-tx="' + i + '" aria-label="View receipt">' +
      '<div class="grow"><div style="font-weight:600;font-size:13px" class="truncate">' + esc(txTitle(t)) + '</div>' +
      '<div class="faint" style="font-size:11px;margin-top:1px">' + fmtDate(t.created_at) + (t.status === 'pending' ? ' \u00b7 Pending' : (t.status === 'rejected' ? ' \u00b7 Rejected' : '')) + '</div></div>' +
      '<div class="mono" style="font-family:var(--font-display);font-weight:600;color:' + amtColor + ';white-space:nowrap">' + (isCredit(t) ? '+' : '\u2212') + fmtN(t.amount) + '</div>' +
      '<span class="faint">' + icon('chevronR', 14) + '</span>' +
    '</button>';
  }

  // Receipt fields are built only from what the backend actually returned
  // for this transaction — optional columns appear only when they exist.
  function receiptFields(t){
    var meta = state.session.user.user_metadata || {};
    var rows = [
      ['Type', TYPE_LABEL[t.type] || cap(t.type) || 'Transaction'],
      ['Description', t.description],
      ['Date & time', fmtFullDate(t.created_at)],
      ['Store', state.reseller && (state.reseller.store_name || state.reseller.username)],
      ['Account', meta.name || state.session.user.email],
      ['Payment reference', t.payment_reference || t.reference],
      ['Balance after', t.balance_after != null ? fmtN(t.balance_after) : null],
      ['Transaction ID', t.id]
    ];
    return rows.filter(function(r){ return r[1] != null && r[1] !== ''; });
  }

  function openReceipt(t){
    if (!t) return;
    var st = txStatus(t), fields = receiptFields(t);
    openModal(
      '<div class="modal-head"><h3>Transaction Receipt</h3><button class="x-btn" id="mClose" aria-label="Close">' + icon('close', 14) + '</button></div>' +
      '<div class="receipt-top">' +
        '<div class="receipt-ico" style="color:' + st.color + ';background:color-mix(in srgb, ' + st.color + ' 12%, transparent)">' + icon(st.ico, 24) + '</div>' +
        '<div class="receipt-amt">' + (isCredit(t) ? '+' : '\u2212') + fmtN(t.amount) + '</div>' +
        '<span class="badge ' + st.badge + '">' + st.label + '</span>' +
      '</div>' +
      '<div class="receipt-body">' +
        fields.map(function(r){
          return '<div class="receipt-row"><span>' + esc(r[0]) + '</span><span' + (r[0] === 'Transaction ID' || r[0] === 'Payment reference' ? ' class="receipt-mono"' : '') + '>' + esc(r[1]) + '</span></div>';
        }).join('') +
      '</div>' +
      '<button class="btn btn-outline btn-block" id="rcCopy" style="margin-bottom:8px">' + icon('copy', 14) + ' Copy Receipt</button>' +
      '<button class="btn btn-ghost btn-block" id="rcDone">Close</button>'
    );
    bindClose();
    document.getElementById('rcDone').onclick = closeModal;
    document.getElementById('rcCopy').onclick = function(){
      var text = 'Transaction Receipt\n' + (isCredit(t) ? '+' : '-') + fmtN(t.amount) + ' \u00b7 ' + st.label + '\n' +
        fields.map(function(r){ return r[0] + ': ' + r[1]; }).join('\n');
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){ toast('Receipt copied'); }).catch(function(){ toast('Could not copy receipt'); });
      } else toast('Copy is not supported on this device');
    };
  }

  async function openAddFundsModal(){
    openModal('<div class="modal-head"><h3>Add Funds</h3><button class="x-btn" id="mClose">' + icon('close', 14) + '</button></div><div class="center-box" style="min-height:100px"><div class="spin"></div></div>');
    bindClose();
    var acc = await fetchActivePaymentAccount();
    openModal(
      '<div class="modal-head"><h3>Add Funds</h3><button class="x-btn" id="mClose">' + icon('close', 14) + '</button></div>' +
      '<div class="field"><label>Amount (NGN)</label><input id="afAmt" class="input" type="number" min="100" placeholder="Minimum \u20A6100"/></div>' +
      accountBlock(acc) +
      '<div class="field"><label>Payment Reference (optional)</label><input id="afRef" class="input" placeholder="e.g. bank transfer reference"/></div>' +
      '<div class="field"><label>Payment Receipt (required)</label>' +
        '<div class="upload-zone" id="afZone">' + icon('camera', 20) + '<div style="margin-top:6px">Tap to upload your payment receipt</div></div>' +
        '<input type="file" id="afFile" accept="image/*" class="hidden"/></div>' +
      '<button class="btn btn-accent btn-block" id="afSubmit">Submit Payment</button>'
    );
    bindClose();
    var zone = document.getElementById('afZone'), fileInput = document.getElementById('afFile');
    zone.onclick = function(){ fileInput.click(); };
    fileInput.onchange = function(){
      if (fileInput.files && fileInput.files[0]){
        zone.classList.add('filled');
        zone.innerHTML = icon('check', 20) + '<div style="margin-top:6px">' + esc(fileInput.files[0].name) + '</div>';
      }
    };
    var copyBtn = document.getElementById('afCopyAcc');
    if (copyBtn) copyBtn.onclick = function(){ copyAccountNumber(acc.account_number); };
    document.getElementById('afSubmit').onclick = function(){ submitWalletDeposit(fileInput); };
  }

  function accountBlock(acc){
    if (!acc) return '<div class="empty-state"><p>No payment account is currently set up — contact the store owner.</p></div>';
    return '<div class="surface-block" style="margin-bottom:14px">' +
      '<div class="faint" style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em">' + esc(acc.bank) + '</div>' +
      '<div style="font-family:var(--font-display);font-size:17px;font-weight:600;letter-spacing:.5px;margin:4px 0">' + esc(acc.account_number) + '</div>' +
      '<div class="muted" style="font-size:12px;margin-bottom:8px">' + esc(acc.account_name) + '</div>' +
      '<button class="btn btn-outline btn-sm" id="afCopyAcc">' + icon('copy', 13) + ' Copy Account Number</button>' +
    '</div>';
  }

  function copyAccountNumber(num){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(num).then(function(){ toast('Account number copied'); }).catch(function(){ toast('Account: ' + num); });
    } else toast('Account: ' + num);
  }

  // The receipt is mandatory, so this never returns an empty result silently:
  // it returns a URL (or, if Storage is unavailable, a compressed inline copy)
  // or '' — and every caller treats '' as a failed upload and stops.
  async function uploadProof(fileInput, prefix){
    if (!fileInput || !fileInput.files || !fileInput.files[0]) return '';
    var f = fileInput.files[0];
    try {
      var up = await sb.storage.from(DEPOSIT_BUCKET).upload(prefix + '_' + Date.now() + '_' + Math.round(Math.random() * 1e6), f, { cacheControl: '3600', upsert: false });
      if (!up.error && up.data) return sb.storage.from(DEPOSIT_BUCKET).getPublicUrl(up.data.path).data.publicUrl;
    } catch (e) { /* fall through */ }
    try { return await compressImage(f); } catch (e) { return ''; }
  }

  // Returns an error message when the chosen receipt is missing/unusable, else ''.
  function receiptProblem(fileInput){
    var f = fileInput && fileInput.files && fileInput.files[0];
    if (!f) return 'Upload your payment receipt to continue';
    if (f.type && f.type.indexOf('image/') !== 0) return 'The receipt must be an image (screenshot or photo)';
    return '';
  }

  async function submitWalletDeposit(fileInput){
    var amt = parseFloat((document.getElementById('afAmt') || {}).value || 0);
    var ref = ((document.getElementById('afRef') || {}).value || '').trim();
    if (!amt || amt < 100){ toast('Minimum deposit is \u20A6100'); return; }
    var problem = receiptProblem(fileInput);
    if (problem){ toast(problem); return; }
    var btn = document.getElementById('afSubmit'); if (btn){ btn.disabled = true; btn.textContent = 'Submitting\u2026'; }
    try {
      var proofUrl = await uploadProof(fileInput, 'sfw');
      if (!proofUrl){ toast('Could not upload your receipt \u2014 please try again'); return; }
      var r = await sb.rpc('submit_storefront_wallet_deposit', {
        p_reseller_id: state.reseller.id, p_amount: amt, p_payment_reference: ref, p_payment_proof_url: proofUrl
      });
      if (r.error){ toast(r.error.message || 'Could not submit deposit'); return; }
      closeModal();
      toast('Deposit submitted — pending admin approval');
      document.dispatchEvent(new CustomEvent('wallet:refresh'));
    } catch (e) { toast(e.message || 'Could not submit deposit'); }
    finally { if (btn){ btn.disabled = false; btn.textContent = 'Submit Payment'; } }
  }

  function bindClose(){ var b = document.getElementById('mClose'); if (b) b.onclick = closeModal; }
  return { fetchWalletBalance, fmtWallet, fetchActivePaymentAccount, renderWalletPage, openAddFundsModal, uploadProof, receiptProblem, accountBlock, copyAccountNumber, bindClose };
})();

/* ── CHECKOUT (SHARED ORDER FLOW) ──────────────────────────────────── */
var M_checkout = (function(){
  var sb = M_config.sb;
  var state = M_state.state;
  var custPrice = M_reseller.custPrice;
  var icon = M_icons.icon;
  var fmtN = M_utils.fmtN;
  var esc = M_utils.esc;
  var toast = M_utils.toast;
  var openModal = M_modal.openModal;
  var closeModal = M_modal.closeModal;
  var fetchWalletBalance = M_wallet.fetchWalletBalance;
  var fmtWallet = M_wallet.fmtWallet;
  var fetchActivePaymentAccount = M_wallet.fetchActivePaymentAccount;
  var uploadProof = M_wallet.uploadProof;
  var receiptProblem = M_wallet.receiptProblem;
  var accountBlock = M_wallet.accountBlock;
  var copyAccountNumber = M_wallet.copyAccountNumber;
  var bindClose = M_wallet.bindClose;
  var openAddFundsModal = M_wallet.openAddFundsModal;
  var goRoute = M_router.goRoute;
  let pendingOrder = null;

  // category: 'numbers' | 'accounts' | 'boost' | 'vtu'
  // ref: a stable identifier for the product/plan being bought
  // name: human-readable label shown in the order summary
  // meta: arbitrary JSON describing the purchase (kept as product_meta)
  // qty: quantity
  // unitBasePrice: the reseller's base (unmarked-up) unit price
  function startCheckout(category, ref, name, meta, qty, unitBasePrice){
    if (!state.session){
      toast('Sign in to place an order');
      goRoute('#/login', function(){ startCheckout(category, ref, name, meta, qty, unitBasePrice); });
      return;
    }
    if (!(unitBasePrice > 0)){ toast('This item has no valid price right now'); return; }
    qty = Math.max(1, qty || 1);
    var totalBase = Math.round(unitBasePrice * qty);
    var totalCust = custPrice(unitBasePrice) * qty;
    pendingOrder = { category: category, ref: ref, name: name, meta: meta || {}, qty: qty, totalBase: totalBase, totalCust: totalCust };

    openModal(
      '<div class="modal-head"><h3>Confirm Your Order</h3><button class="x-btn" id="mClose">' + icon('close', 14) + '</button></div>' +
      '<div class="surface-block" style="margin-bottom:16px">' +
        '<div class="row-between" style="padding:4px 0"><span class="muted" style="font-size:12px">Product</span><span style="font-weight:600;font-size:12.5px;text-align:right;max-width:60%">' + esc(name) + '</span></div>' +
        (qty > 1 ? '<div class="row-between" style="padding:4px 0"><span class="muted" style="font-size:12px">Quantity</span><span style="font-weight:600;font-size:12.5px">' + qty + '</span></div>' : '') +
        '<div class="row-between" style="border-top:1px solid var(--line);padding-top:10px;margin-top:6px"><span class="muted" style="font-size:12px;font-weight:600">Total</span><span style="font-family:var(--font-display);font-weight:600;font-size:17px;color:var(--accent)">' + fmtN(totalCust) + '</span></div>' +
      '</div>' +
      '<button class="btn btn-accent btn-block" id="ccContinue">Proceed to Payment</button>'
    );
    bindClose();
    document.getElementById('ccContinue').onclick = openPaymentStep;
  }

  async function openPaymentStep(){
    if (!pendingOrder) return;
    openModal('<div class="modal-head"><h3>Make Payment</h3><button class="x-btn" id="mClose">' + icon('close', 14) + '</button></div><div class="center-box" style="min-height:100px"><div class="spin"></div></div>');
    bindClose();
    await fetchWalletBalance();
    var acc = await fetchActivePaymentAccount();
    var canPayWallet = typeof state.walletBalance === 'number' && state.walletBalance >= pendingOrder.totalCust;
    var meta = state.session.user.user_metadata || {};

    openModal(
      '<div class="modal-head"><h3>Make Payment</h3><button class="x-btn" id="mClose">' + icon('close', 14) + '</button></div>' +
      '<div style="text-align:center;margin-bottom:16px">' +
        '<div class="faint" style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em">Amount to Pay</div>' +
        '<div style="font-family:var(--font-display);font-size:24px;font-weight:600;color:var(--accent)">' + fmtN(pendingOrder.totalCust) + '</div>' +
      '</div>' +
      '<div class="surface-block" style="margin-bottom:14px">' +
        '<div class="row-between" style="margin-bottom:' + (canPayWallet ? '10' : '2') + 'px">' +
          '<span style="font-size:11.5px;font-weight:700;color:var(--accent)">' + icon('wallet', 13) + ' Wallet: ' + fmtWallet() + '</span>' +
        '</div>' +
        (canPayWallet
          ? '<button class="btn btn-accent btn-block" id="payWalletBtn">Pay with Wallet — ' + fmtN(pendingOrder.totalCust) + '</button>'
          : '<div class="faint" style="font-size:11px">Not enough balance to pay from wallet — <a id="goAddFunds" style="color:var(--accent);font-weight:700;cursor:pointer">add funds</a> or pay by bank transfer below.</div>') +
      '</div>' +
      '<div class="faint" style="text-align:center;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:4px 0 12px">Or pay by bank transfer</div>' +
      accountBlock(acc) +
      '<div class="field"><label>Your Name</label><input id="poName" class="input" placeholder="Full name" value="' + esc(meta.name || '') + '"/></div>' +
      '<div class="field"><label>Phone Number</label><input id="poPhone" class="input" type="tel" placeholder="080\u2026" value="' + esc(meta.phone || '') + '"/></div>' +
      '<div class="field"><label>Payment Reference (optional)</label><input id="poRef" class="input" placeholder="e.g. bank transfer reference"/></div>' +
      '<div class="field"><label>Payment Receipt (required)</label>' +
        '<div class="upload-zone" id="poZone">' + icon('camera', 20) + '<div style="margin-top:6px">Tap to upload your payment receipt</div></div>' +
        '<input type="file" id="poFile" accept="image/*" class="hidden"/></div>' +
      '<button class="btn btn-accent btn-block" id="poSubmit">Submit Payment</button>'
    );
    bindClose();
    if (canPayWallet) document.getElementById('payWalletBtn').onclick = payWithWallet;
    var addFundsLink = document.getElementById('goAddFunds');
    if (addFundsLink) addFundsLink.onclick = function(){ closeModal(); openAddFundsModal(); };
    var accCopy = document.getElementById('afCopyAcc'); if (accCopy && acc) accCopy.onclick = function(){ copyAccountNumber(acc.account_number); };
    var zone = document.getElementById('poZone'), fileInput = document.getElementById('poFile');
    zone.onclick = function(){ fileInput.click(); };
    fileInput.onchange = function(){
      if (fileInput.files && fileInput.files[0]){
        zone.classList.add('filled');
        zone.innerHTML = icon('check', 20) + '<div style="margin-top:6px">' + esc(fileInput.files[0].name) + '</div>';
      }
    };
    document.getElementById('poSubmit').onclick = function(){ submitBankTransferOrder(fileInput); };
  }

  async function payWithWallet(){
    if (!pendingOrder) return;
    var o = pendingOrder;
    var btn = document.getElementById('payWalletBtn'); if (btn){ btn.disabled = true; btn.textContent = 'Processing\u2026'; }
    try {
      var r = await sb.rpc('purchase_with_storefront_wallet', {
        p_reseller_id: state.reseller.id, p_category: o.category, p_ref: String(o.ref), p_name: o.name,
        p_meta: o.meta, p_qty: o.qty, p_base_price: o.totalBase, p_customer_price: o.totalCust
      });
      if (r.error){
        if ((r.error.message || '').indexOf('insufficient_balance') > -1) toast('Wallet balance is too low — fund your wallet or pay by bank transfer');
        else toast(r.error.message || 'Could not complete purchase');
        return;
      }
      var row = Array.isArray(r.data) ? r.data[0] : r.data;
      pendingOrder = null;
      showSuccess(row, true);
    } catch (e) {
      // The debit may have gone through even though the reply never arrived.
      toast('Connection problem \u2014 check My Orders and your wallet before trying again, so you are not charged twice');
    }
    finally { if (btn){ btn.disabled = false; btn.textContent = 'Pay with Wallet'; } }
  }

  async function submitBankTransferOrder(fileInput){
    if (!pendingOrder) return;
    var name = ((document.getElementById('poName') || {}).value || '').trim();
    var phone = ((document.getElementById('poPhone') || {}).value || '').trim();
    var ref = ((document.getElementById('poRef') || {}).value || '').trim();
    if (!name){ toast('Enter your name'); return; }
    if (!phone){ toast('Enter your phone number'); return; }
    var problem = receiptProblem(fileInput);
    if (problem){ toast(problem); return; }
    var btn = document.getElementById('poSubmit'); if (btn){ btn.disabled = true; btn.textContent = 'Submitting\u2026'; }
    try {
      var proofUrl = await uploadProof(fileInput, 'sfo');
      if (!proofUrl){ toast('Could not upload your receipt \u2014 please try again'); return; }
      var o = pendingOrder;
      var r = await sb.rpc('submit_storefront_order', {
        p_reseller_id: state.reseller.id, p_product_category: o.category, p_product_ref: String(o.ref),
        p_product_name: o.name, p_product_meta: o.meta, p_quantity: o.qty,
        p_base_price: o.totalBase, p_markup_percent: state.markupPercent, p_customer_price: o.totalCust,
        p_customer_name: name, p_customer_phone: phone, p_payment_reference: ref, p_payment_proof_url: proofUrl
      });
      if (r.error){ toast(r.error.message || 'Could not submit payment'); return; }
      var row = Array.isArray(r.data) ? r.data[0] : r.data;
      var linked = true;
      if (row && row.id){
        // supabase-js reports failures via { error } rather than throwing, so
        // check it explicitly — an unlinked order would never show in My Orders.
        var link = await sb.from('reseller_storefront_orders').update({ customer_user_id: state.session.user.id }).eq('id', row.id);
        if (link.error){
          link = await sb.from('reseller_storefront_orders').update({ customer_user_id: state.session.user.id }).eq('id', row.id);
          linked = !link.error;
        }
      }
      pendingOrder = null;
      showSuccess(row, false, linked);
    } catch (e) { toast(e.message || 'Something went wrong'); }
    finally { if (btn){ btn.disabled = false; btn.textContent = 'Submit Payment'; } }
  }

  function showSuccess(row, paidFromWallet, linked){
    if (linked === undefined) linked = true;
    var trackingCode = row && row.tracking_code;
    openModal(
      '<div style="text-align:center;padding:6px 4px 2px">' +
        '<div style="width:56px;height:56px;border-radius:50%;background:var(--good-soft);color:var(--good);display:flex;align-items:center;justify-content:center;margin:0 auto 14px">' + icon('checkCircle', 26) + '</div>' +
        '<h3 style="margin-bottom:8px;font-size:16px">' + (paidFromWallet ? 'Order Placed' : 'Payment Submitted') + '</h3>' +
        '<p class="muted" style="font-size:12.5px;margin-bottom:16px">' + (paidFromWallet ? 'Paid from your wallet — your order is now processing.' : "We've received your payment details. The store will confirm your payment and deliver your order shortly.") + '</p>' +
        (linked ? '' : '<div class="surface-block" style="margin-bottom:16px;background:var(--warn-soft);color:var(--warn);font-size:12px">Your payment was received, but this order could not be attached to your account yet. Keep your tracking code and contact support if it does not appear in My Orders.</div>') +
        (trackingCode ? '<div class="surface-block" style="margin-bottom:16px">' +
          '<div class="faint" style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px">Tracking Code</div>' +
          '<div style="font-family:var(--font-display);font-size:17px;font-weight:600;letter-spacing:1.5px;color:var(--accent)">' + esc(trackingCode) + '</div>' +
        '</div>' : '') +
        (row && row.id && linked ? '<button class="btn btn-accent btn-block" id="ccViewOrder" style="margin-bottom:8px">View Order Details</button>' : '') +
        '<button class="btn btn-outline btn-block" id="mClose">Done</button>' +
      '</div>'
    );
    bindClose();
    var viewBtn = document.getElementById('ccViewOrder');
    if (viewBtn) viewBtn.onclick = function(){ closeModal(); goRoute('#/orders/' + row.id); };
    else if (linked) goRoute('#/orders');
    document.dispatchEvent(new CustomEvent('wallet:refresh'));
  }
  return { startCheckout };
})();

/* ── ORDERS ────────────────────────────────────────────────────────── */
var M_orders = (function(){
  var sb = M_config.sb;
  var CAT_META = M_config.CAT_META;
  var state = M_state.state;
  var icon = M_icons.icon;
  var fmtN = M_utils.fmtN;
  var fmtDate = M_utils.fmtDate;
  var esc = M_utils.esc;
  var toast = M_utils.toast;
  var openModal = M_modal.openModal;
  var closeModal = M_modal.closeModal;
  var goRoute = M_router.goRoute;
  var onLeave = M_router.onLeave;
  let ordersChannel = null;
  let detailChannel = null;

  const FULFILL_LABELS = {
    phone_number: 'Phone Number', verification_code: 'Verification Code',
    username: 'Username', password: 'Password', extra_notes: 'Notes',
    activation_code: 'Activation Code', confirmation_code: 'Confirmation Code',
    provider_ref: 'Reference', token: 'Token', external_order_id: 'Order ID',
    provider_status: 'Delivery Status', account_details: 'Account Details'
  };

  function phoneOf(o){ return o.fulfillment_data && o.fulfillment_data.phone_number ? String(o.fulfillment_data.phone_number) : ''; }

  function statusStep(o){
    var fd = o.fulfillment_data;
    if (o.wallet_refunded) return { step: -2, label: 'Refunded to Wallet' };
    if (o.status === 'rejected') return { step: -1, label: 'Payment Rejected' };
    if (o.status === 'reviewing') return { step: 0, label: 'Awaiting Payment Confirmation' };
    if (o.status === 'credited' && !o.fulfilled && o.product_category === 'numbers'){
      return phoneOf(o) ? { step: 1, label: 'Number Assigned — Waiting for Code' } : { step: 1, label: 'Searching for a Number' };
    }
    if (o.status === 'credited' && !o.fulfilled && fd && fd.phone_number) return { step: 1, label: 'Number Assigned — Awaiting Code' };
    if (o.status === 'credited' && !o.fulfilled && o.routed_order_id) return { step: 1, label: 'Payment Confirmed — Processing' };
    if (o.status === 'credited' && !o.fulfilled) return { step: 1, label: 'Payment Confirmed — Preparing Delivery' };
    return { step: 2, label: 'Fulfilled — Delivered' };
  }

  // A number order can be cancelled (and refunded) only while it is paid for,
  // undelivered, and no code has been delivered yet.
  function canCancelNumber(o){
    return o.product_category === 'numbers' && o.status === 'credited' && !o.fulfilled && !o.wallet_refunded &&
      !(o.fulfillment_data && o.fulfillment_data.verification_code);
  }
  function badgeClass(o){ return o.wallet_refunded ? 'badge-neutral' : o.status === 'rejected' ? 'badge-bad' : (o.status === 'credited' && o.fulfilled) ? 'badge-good' : 'badge-warn'; }

  async function renderOrdersList(root){
    detachOrdersChannel();
    root.innerHTML = '<div class="center-box"><div class="spin"></div></div>';
    var r = await sb.from('reseller_storefront_orders').select('*')
      .eq('reseller_id', state.reseller.id).eq('customer_user_id', state.session.user.id)
      .order('created_at', { ascending: false });
    if (r.error){
      root.innerHTML = '<div class="center-box"><h2>Could not load your orders</h2><p>' + esc(r.error.message) + '</p></div>';
      return;
    }
    if (!root.isConnected) return;
    var orders = r.data || [];
    root.innerHTML =
      '<div class="section-head"><h2>My Orders</h2><span class="faint" style="font-size:12px">' + orders.length + ' order' + (orders.length === 1 ? '' : 's') + '</span></div>' +
      (orders.length
        ? '<div class="stack g-sm">' + orders.map(orderCard).join('') + '</div>'
        : '<div class="empty-state"><div class="icon-wrap">' + icon('bag', 20) + '</div><p>You have no orders yet at this store.</p></div>');
    root.querySelectorAll('[data-order-id]').forEach(function(el){
      el.addEventListener('click', function(){ goRoute('#/orders/' + el.getAttribute('data-order-id')); });
    });
    attachOrdersChannel(function(){ if (root.isConnected) renderOrdersList(root); });
    onLeave(detachOrdersChannel);
  }

  function orderCard(o){
    var st = statusStep(o);
    var meta = CAT_META[o.product_category] || { icon: 'grid' };
    return '<div class="row-card" style="cursor:pointer" data-order-id="' + esc(o.id) + '">' +
      '<div class="icon-wrap">' + icon(meta.icon, 17) + '</div>' +
      '<div class="grow">' +
        '<div class="row-between"><div class="title truncate">' + esc(o.product_name) + (o.quantity > 1 ? ' \u00d7 ' + o.quantity : '') + '</div><div class="amount">' + fmtN(o.customer_price) + '</div></div>' +
        '<div class="sub">' + fmtDate(o.created_at) + '</div>' +
        '<div style="margin-top:6px"><span class="badge ' + badgeClass(o) + '">' + esc(st.label) + '</span></div>' +
      '</div>' +
    '</div>';
  }

  async function renderOrderDetail(root, orderId){
    detachDetailChannel();
    root.innerHTML = '<div class="center-box"><div class="spin"></div></div>';
    var r = await sb.from('reseller_storefront_orders').select('*')
      .eq('id', orderId).eq('customer_user_id', state.session.user.id).maybeSingle();
    if (!root.isConnected) return;
    if (r.error || !r.data){
      root.innerHTML = '<div class="center-box"><h2>Order not found</h2><p>This order could not be loaded.</p><button class="btn btn-outline" id="backBtn">Back to Orders</button></div>';
      document.getElementById('backBtn').onclick = function(){ goRoute('#/orders'); };
      return;
    }
    paintDetail(root, r.data);
    attachDetailChannel(orderId, function(row){ if (root.isConnected && row) paintDetail(root, row); });
    // Safety net in case realtime is not delivering: while a number order is
    // still waiting on the admin (number or code), re-check every few seconds.
    var poll = setInterval(async function(){
      if (!root.isConnected){ clearInterval(poll); return; }
      var cur = await sb.from('reseller_storefront_orders').select('*')
        .eq('id', orderId).eq('customer_user_id', state.session.user.id).maybeSingle();
      if (!root.isConnected || !cur.data) return;
      var prev = JSON.stringify([cur.data.status, cur.data.fulfilled, cur.data.wallet_refunded, cur.data.fulfillment_data]);
      if (prev !== lastSeen){ lastSeen = prev; paintDetail(root, cur.data); }
      if (!canCancelNumber(cur.data)) clearInterval(poll);
    }, 8000);
    var lastSeen = JSON.stringify([r.data.status, r.data.fulfilled, r.data.wallet_refunded, r.data.fulfillment_data]);
    if (!canCancelNumber(r.data)) clearInterval(poll);
    onLeave(function(){ clearInterval(poll); detachDetailChannel(); });
  }

  function paintDetail(root, o){
    var st = statusStep(o);
    var meta = CAT_META[o.product_category] || { icon: 'grid' };
    var steps = ['Payment Review', 'Payment Confirmed', 'Fulfilled'];
    var stepsHtml = steps.map(function(label, i){
      var done = st.step > i, current = st.step === i;
      return '<div class="track-step ' + (done ? 'done' : (current ? 'current' : '')) + '">' +
        '<div class="dot-col">' +
          '<div class="dot">' + (done ? icon('check', 11) : (i + 1)) + '</div>' +
          (i < steps.length - 1 ? '<div class="bar"></div>' : '') +
        '</div>' +
        '<div class="txt"><div class="t1">' + label + '</div>' + (current ? '<div class="t2">' + esc(st.label) + '</div>' : '') + '</div>' +
      '</div>';
    }).join('');
    if (st.step === -2) stepsHtml = '<div class="track-step done"><div class="dot-col"><div class="dot">' + icon('check', 11) + '</div></div><div class="txt"><div class="t1">Refunded to your wallet</div><div class="t2">The amount for this order was returned to your wallet balance.</div></div></div>';
    else if (o.status === 'rejected') stepsHtml = '<div class="track-step"><div class="dot-col"><div class="dot" style="background:var(--bad);color:#fff">' + icon('close', 12) + '</div></div><div class="txt"><div class="t1">Payment Rejected</div><div class="t2 faint">Contact the store for help</div></div></div>';

    var fulfillHtml = '';
    if (!o.wallet_refunded && o.fulfilled && o.fulfillment_data && typeof o.fulfillment_data === 'object'){
      fulfillHtml = '<div class="section"><div class="section-head"><h2>Delivery Details</h2></div><div class="card stack g-sm">' +
        Object.keys(o.fulfillment_data).filter(function(k){ return o.fulfillment_data[k] != null && o.fulfillment_data[k] !== ''; }).map(function(k){
          return '<div class="row-between"><span class="muted" style="font-size:12px">' + (FULFILL_LABELS[k] || esc(k)) + '</span><span style="font-weight:600;font-size:12.5px;text-align:right;max-width:60%;word-break:break-word">' + esc(o.fulfillment_data[k]) + '</span></div>';
        }).join('') + '</div></div>';
    }

    var numberHtml = canCancelNumber(o) ? numberPanel(o) : '';

    root.innerHTML =
      '<button class="btn btn-outline btn-sm" id="backBtn" style="margin-bottom:14px">' + icon('chevronL', 14) + ' Back to Orders</button>' +
      '<div class="card section">' +
        '<div class="row g" style="margin-bottom:14px">' +
          '<div class="icon-wrap" style="width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center">' + icon(meta.icon, 18) + '</div>' +
          '<div class="grow"><div style="font-weight:600;font-size:14px">' + esc(o.product_name) + '</div><div class="faint" style="font-size:11.5px">' + fmtDate(o.created_at) + '</div></div>' +
          '<div class="amount" style="font-size:15px">' + fmtN(o.customer_price) + '</div>' +
        '</div>' +
        (o.tracking_code ? '<div class="copy-field" style="margin-bottom:14px"><span style="font-family:var(--font-display);font-weight:600;letter-spacing:1px">' + esc(o.tracking_code) + '</span><button class="btn btn-outline btn-sm" id="copyTrack">Copy</button></div>' : '') +
        '<div class="track-steps">' + stepsHtml + '</div>' +
      '</div>' +
      numberHtml +
      fulfillHtml;

    document.getElementById('backBtn').onclick = function(){ goRoute('#/orders'); };
    var copyBtn = document.getElementById('copyTrack');
    if (copyBtn) copyBtn.onclick = function(){
      if (navigator.clipboard) navigator.clipboard.writeText(o.tracking_code).then(function(){ toast('Tracking code copied'); });
    };
    var numCopy = document.getElementById('copyNumber');
    if (numCopy) numCopy.onclick = function(){
      if (navigator.clipboard) navigator.clipboard.writeText(phoneOf(o)).then(function(){ toast('Number copied'); });
    };
    var cancelBtn = document.getElementById('cancelNumberBtn');
    if (cancelBtn) cancelBtn.onclick = function(){ confirmCancel(root, o); };
  }

  // The number the admin assigned (or the search state before that), with a
  // small live "waiting" line and the cancel button. Repainted automatically
  // whenever the order row changes.
  function numberPanel(o){
    var phone = phoneOf(o);
    return '<div class="card section num-panel">' +
      (phone
        ? '<div class="faint num-label">Your number</div>' +
          '<div class="row-between g-sm"><div class="num-value">' + esc(phone) + '</div>' +
          '<button class="btn btn-outline btn-sm" id="copyNumber">' + icon('copy', 13) + ' Copy</button></div>' +
          '<div class="wait-line"><span class="mini-spin"></span><span>Waiting for code<span class="dots"></span></span></div>'
        : '<div class="wait-line searching"><span class="mini-spin"></span><span>Searching for a number<span class="dots"></span></span></div>') +
      '<div class="divider"></div>' +
      '<button class="btn btn-danger btn-block" id="cancelNumberBtn">Cancel Purchase</button>' +
      '<div class="faint" style="font-size:11px;text-align:center;margin-top:8px">Cancelling refunds ' + fmtN(o.customer_price) + ' to your wallet immediately.</div>' +
    '</div>';
  }

  function confirmCancel(root, o){
    openModal(
      '<div class="modal-head"><h3>Cancel Purchase?</h3><button class="x-btn" id="mClose" aria-label="Close">' + icon('close', 14) + '</button></div>' +
      '<p class="muted" style="font-size:13px;margin-bottom:16px">' + fmtN(o.customer_price) + ' will be refunded to your wallet right away and you will no longer receive this number.</p>' +
      '<button class="btn btn-danger btn-block" id="cancelYes" style="margin-bottom:8px">Yes, Cancel &amp; Refund</button>' +
      '<button class="btn btn-ghost btn-block" id="cancelNo">Keep Order</button>'
    );
    document.getElementById('mClose').onclick = closeModal;
    document.getElementById('cancelNo').onclick = closeModal;
    document.getElementById('cancelYes').onclick = function(){ doCancel(root, o, this); };
  }

  var CANCEL_ERRORS = {
    code_already_delivered: 'The code has already been delivered, so this order can no longer be cancelled.',
    not_cancellable: 'This order can no longer be cancelled.',
    already_refunded: 'This order has already been refunded.',
    order_not_found: 'Order not found.',
    wallet_not_found: 'Your wallet could not be found \u2014 please contact support.'
  };

  async function doCancel(root, o, btn){
    btn.disabled = true; btn.textContent = 'Cancelling\u2026';
    var r = await sb.rpc('cancel_storefront_number_order', { p_order_id: o.id });
    closeModal();
    if (r.error){
      var msg = r.error.message || '';
      var known = Object.keys(CANCEL_ERRORS).find(function(k){ return msg.indexOf(k) > -1; });
      if (known) toast(CANCEL_ERRORS[known]);
      else if (r.error.code === 'PGRST202' || /could not find the function/i.test(msg)) toast('Cancellation is not available yet \u2014 please contact support');
      else toast('Could not cancel \u2014 please check your connection and try again');
      await refreshDetail(root, o.id);           // state may have changed (e.g. code just arrived)
      return;
    }
    toast('Order cancelled \u2014 ' + fmtN(r.data != null ? r.data : o.customer_price) + ' refunded to your wallet');
    document.dispatchEvent(new CustomEvent('wallet:refresh'));
    await refreshDetail(root, o.id);
  }

  async function refreshDetail(root, orderId){
    var r = await sb.from('reseller_storefront_orders').select('*')
      .eq('id', orderId).eq('customer_user_id', state.session.user.id).maybeSingle();
    if (root.isConnected && r.data) paintDetail(root, r.data);
  }

  function attachOrdersChannel(onChange){
    detachOrdersChannel();
    if (!state.session) return;
    try {
      ordersChannel = sb.channel('my-orders-' + state.session.user.id)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'reseller_storefront_orders', filter: 'customer_user_id=eq.' + state.session.user.id }, onChange)
        .subscribe();
    } catch (e) { console.warn('Realtime unavailable:', e); }
  }
  function detachOrdersChannel(){ if (ordersChannel){ try { sb.removeChannel(ordersChannel); } catch (e) {} ordersChannel = null; } }

  function attachDetailChannel(orderId, onChange){
    detachDetailChannel();
    try {
      detailChannel = sb.channel('order-' + orderId)
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'reseller_storefront_orders', filter: 'id=eq.' + orderId }, function(payload){ onChange(payload.new); })
        .subscribe();
    } catch (e) { console.warn('Realtime unavailable:', e); }
  }
  function detachDetailChannel(){ if (detailChannel){ try { sb.removeChannel(detailChannel); } catch (e) {} detailChannel = null; } }
  return { statusStep, renderOrdersList, renderOrderDetail };
})();

var M_profile = (function(){
  var state = M_state.state;
  var icon = M_icons.icon;
  var esc = M_utils.esc;
  var toast = M_utils.toast;
  var updateProfile = M_auth.updateProfile;
  var setNewPassword = M_auth.setNewPassword;
  var signOut = M_auth.signOut;
  var goRoute = M_router.goRoute;
  function renderProfile(root){
    var u = state.session.user;
    var meta = u.user_metadata || {};
    root.innerHTML =
      '<div class="section-head"><h2>Profile</h2></div>' +
      '<div class="card section">' +
        '<div class="field"><label>Full Name</label><input id="pfName" class="input" value="' + esc(meta.name || '') + '"/></div>' +
        '<div class="field"><label>Phone Number</label><input id="pfPhone" class="input" type="tel" value="' + esc(meta.phone || '') + '"/></div>' +
        '<div class="field"><label>Email Address</label><input id="pfEmail" class="input" type="email" value="' + esc(u.email || '') + '"/><div class="field-hint">Changing your email requires confirming the new address.</div></div>' +
        '<button class="btn btn-accent btn-block" id="pfSave">Save Changes</button>' +
      '</div>' +
      '<div class="card section">' +
        '<div class="section-head" style="margin-bottom:12px"><h2 style="font-size:13.5px">Security</h2></div>' +
        '<div class="field"><label>New Password</label><input id="pfPass" class="input" type="password" placeholder="Min. 6 characters"/></div>' +
        '<button class="btn btn-outline btn-block" id="pfPassSave">Update Password</button>' +
      '</div>' +
      '<button class="btn btn-danger btn-block" id="pfSignOut">' + icon('logout', 15) + ' Sign Out</button>';

    document.getElementById('pfSave').onclick = saveProfile;
    document.getElementById('pfPassSave').onclick = savePassword;
    document.getElementById('pfSignOut').onclick = doSignOut;
  }

  async function saveProfile(){
    var name = ((document.getElementById('pfName') || {}).value || '').trim();
    var phone = ((document.getElementById('pfPhone') || {}).value || '').trim();
    var email = ((document.getElementById('pfEmail') || {}).value || '').trim();
    var btn = document.getElementById('pfSave'); if (btn){ btn.disabled = true; btn.textContent = 'Saving\u2026'; }
    try {
      var fields = { name: name, phone: phone };
      if (email && email !== state.session.user.email) fields.email = email;
      await updateProfile(fields);
      toast('Profile updated');
    } catch (e) { toast(e.message || 'Could not update profile'); }
    finally { if (btn){ btn.disabled = false; btn.textContent = 'Save Changes'; } }
  }

  async function savePassword(){
    var pass = (document.getElementById('pfPass') || {}).value || '';
    if (!pass){ toast('Enter a new password'); return; }
    var btn = document.getElementById('pfPassSave'); if (btn){ btn.disabled = true; btn.textContent = 'Updating\u2026'; }
    try {
      await setNewPassword(pass);
      document.getElementById('pfPass').value = '';
      toast('Password updated');
    } catch (e) { toast(e.message || 'Could not update password'); }
    finally { if (btn){ btn.disabled = false; btn.textContent = 'Update Password'; } }
  }

  async function doSignOut(){
    await signOut();
    goRoute('#/services');
  }
  return { renderProfile };
})();

var M_virtualNumbers = (function(){
  var sb = M_config.sb;
  var state = M_state.state;
  var custPrice = M_reseller.custPrice;
  var icon = M_icons.icon;
  var fmtN = M_utils.fmtN;
  var esc = M_utils.esc;
  var skeleton = M_utils.skeleton;
  var renderError = M_utils.renderError;
  var fetchWalletBalance = M_wallet.fetchWalletBalance;
  var fmtWallet = M_wallet.fmtWallet;
  var startCheckout = M_checkout.startCheckout;
  var mountDropdown = M_dropdown.mountDropdown;
  let services = [];
  let selectedPlatform = '';
  let selectedRow = null;

  async function renderVirtualNumbers(root){
    root.innerHTML = skeleton(3, 64);
    var r = await sb.from('verification_services').select('*').eq('active', true).order('platform').order('country');
    if (!root.isConnected) return;
    if (r.error){ renderError(root, r.error.message, function(){ renderVirtualNumbers(root); }); return; }
    services = r.data || [];
    selectedPlatform = ''; selectedRow = null;
    await fetchWalletBalance();
    if (!root.isConnected) return;
    paint(root);
  }

  function platformList(){
    var seen = {}, out = [];
    services.forEach(function(s){ if (!seen[s.platform]){ seen[s.platform] = true; out.push(s.platform); } });
    return out;
  }
  function countriesFor(platform){ return services.filter(function(s){ return s.platform === platform; }); }

  function paint(root){
    if (!services.length){
      root.innerHTML = headerHtml() + '<div class="empty-state"><div class="icon-wrap">' + icon('phone', 20) + '</div><p>No services available right now — check back soon</p></div>';
      return;
    }
    var platforms = platformList();
    var countryRows = selectedPlatform ? countriesFor(selectedPlatform) : [];
    var row = selectedRow, avail = !!(row && row.stock > 0);

    root.innerHTML = headerHtml() +
      '<div class="card">' +
        '<div class="field"><label>Service</label><div id="vnSvc"></div></div>' +
        '<div class="field"><label>Country</label><div id="vnCtry"></div></div>' +
        '<div class="divider"></div>' +
        (row
          ? '<div class="row g" style="margin-bottom:14px">' +
              '<div class="icon-wrap" style="width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center">' + icon('phone', 17) + '</div>' +
              '<div class="grow"><div style="font-weight:600;font-size:13.5px">' + esc(row.platform) + ' — ' + esc(row.country) + '</div>' +
              '<div style="font-family:var(--font-display);font-weight:600;color:var(--accent);font-size:16px;margin-top:2px">' + fmtN(custPrice(row.price)) + '</div></div>' +
              '<span class="badge ' + (avail ? 'badge-good' : 'badge-bad') + '">' + (avail ? 'Available' : 'Unavailable') + '</span>' +
            '</div>'
          : '<div class="empty-state" style="padding:18px 0"><p>Choose a service and a country</p></div>') +
        '<div class="row-between" style="padding-top:10px;border-top:1px dashed var(--line);margin-bottom:14px">' +
          '<span class="muted" style="font-size:12px">Wallet balance</span><span style="font-weight:600;font-family:var(--font-display)">' + fmtWallet() + '</span>' +
        '</div>' +
        '<button class="btn btn-accent btn-block" id="vnBuy" ' + (row && avail ? '' : 'disabled') + '>Get Number</button>' +
      '</div>';

    mountDropdown('vnSvc', {
      title: 'Select a service', placeholder: 'Select a service', value: selectedPlatform,
      options: platforms.map(function(p){ return { value: p, label: p }; }),
      onChange: function(v){ selectedPlatform = v; selectedRow = null; paint(root); }
    });
    mountDropdown('vnCtry', {

var M_boosting = (function(){

    root.innerHTML = skeleton(1, 320);

        '</div></div>' +
        '<div class="field"><label>Profile URL or Username</label><input id="bTarget" class="input" placeholder="https://instagram.com/yourprofile"/></div>' +
        '<div class="field"><label>Quantity</label><div id="bQty"></div></div>' +

/* ── VTU ───────────────────────────────────────────────────────────── */
var M_vtu = (function(){
  var PROXY_URL = M_config.PROXY_URL;
  var VTU_SERVICE_FEE = M_config.VTU_SERVICE_FEE;

  var esc = M_utils.esc;
  var toast = M_utils.toast;
  var startCheckout = M_checkout.startCheckout;
  var mountDropdown = M_dropdown.mountDropdown;
  var ddValue = M_dropdown.ddValue;
  const NETWORKS = ['MTN', 'GLO', 'AIRTEL', '9MOBILE'];
  const DISCOS = [['IKEDC','IKEDC — Ikeja'],['EKEDC','EKEDC — Eko'],['KEDCO','KEDCO — Kano'],['PHED','PHED — Port Harcourt'],
    ['JED','JED — Jos'],['AEDC','AEDC — Abuja'],['KAEDCO','KAEDCO — Kaduna'],['EEDC','EEDC — Enugu'],['BEDC','BEDC — Benin'],['YEDC','YEDC — Yola']];

  let tab = 'airtime';
  let vtuNet = 'MTN', dataNet = 'MTN', dataDur = 'monthly', dataPlan = null;
  let cable = 'DSTV', disco = '', meterType = 1;
  let catalog = null, catalogPromise = null;

  async function loadCatalog(){
    if (catalog) return catalog;
    if (catalogPromise) return catalogPromise;
    catalogPromise = (async function(){
      try {
        var ctrl = new AbortController();
        var timer = setTimeout(function(){ ctrl.abort(); }, 20000);
        var res;
        try { res = await fetch(PROXY_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'catalog', payload: {} }), signal: ctrl.signal }); }
        finally { clearTimeout(timer); }
        var data = await res.json();
        if (res.ok && data) { catalog = bucketize(data); return catalog; }
        return null;
      } catch (e) { return null; }
      finally { catalogPromise = null; }
    })();
    return catalogPromise;
  }

  // Walks the provider's arbitrarily-shaped catalog response and buckets
  // any array of plan-like objects (has a name/network/label field AND a
  // price/id field) under its own path — works whichever shape the
  // provider happens to return, without hardcoding any of it.
  function bucketize(raw){
    var buckets = {}, visited = 0, MAX = 20000;
    function isObj(x){ return x && typeof x === 'object' && !Array.isArray(x); }
    function looksLikePlan(x){
      var keys = Object.keys(x).map(function(k){ return k.toLowerCase(); });
      return keys.some(function(k){ return ['name','provider','network','label','plan','size','bundle'].indexOf(k) > -1; })
        && keys.some(function(k){ return ['price','amount','id','bundle_id','plan_id'].indexOf(k) > -1; });
    }
    function walk(node, path){
      if (visited++ > MAX) return;
      if (Array.isArray(node)){
        if (node.length && isObj(node[0]) && looksLikePlan(node[0])){ buckets[path] = (buckets[path] || []).concat(node); }
        else node.forEach(function(x){ if (isObj(x)) walk(x, path); });
      } else if (isObj(node)){
        Object.keys(node).forEach(function(k){ walk(node[k], path ? path + '>' + k : k); });
      }
    }
    walk(raw, '');
    return buckets;
  }
  function parseMB(s){ if (!s) return null; var m = s.toString().toUpperCase().match(/([\d.]+)\s*(MB|GB)/); if (!m) return null; var n = parseFloat(m[1]); return isNaN(n) ? null : (m[2] === 'GB' ? n * 1024 : n); }
  function classifyDur(p){
    var v = (p.validity || p.duration || '').toString().toLowerCase();
    if (v.indexOf('month') > -1) return 'monthly';
    if (v.indexOf('week') > -1) return 'weekly';
    var n = parseInt((v.match(/(\d+)/) || [])[1]);
    if (!n) return 'monthly';
    if (n <= 3) return 'daily';
    if (n < 30) return 'weekly';
    return 'monthly';
  }
  function dataBundles(net){
    if (!catalog) return [];
    var all = [];
    Object.keys(catalog).filter(function(k){ var l = k.toLowerCase(); return l.indexOf('bundle') > -1 || l.indexOf('data') > -1; })
      .forEach(function(k){ all = all.concat(catalog[k]); });
    return all.filter(function(p){ return [p.network, p.provider, p.network_name, p.service_provider].some(function(f){ return f && f.toString().toUpperCase().indexOf(net) > -1; }); });
  }

  function renderVtu(root){
    tab = 'airtime';
    root.innerHTML =
      '<div class="section-head"><h2>VTU</h2></div>' +
      '<div class="card">' +
        '<div class="chip-row" id="vtuTabs" style="margin-bottom:16px">' +
          ['airtime','data','cable','electricity'].map(function(t){
            return '<button class="chip' + (t === 'airtime' ? ' active' : '') + '" data-tab="' + t + '">' + ({ airtime:'Airtime', data:'Data', cable:'Cable TV', electricity:'Electricity' })[t] + '</button>';
          }).join('') +
        '</div>' +
        '<div id="vtuArea"></div>' +
      '</div>';
    root.querySelectorAll('#vtuTabs .chip').forEach(function(b){
      b.addEventListener('click', function(){
        tab = b.getAttribute('data-tab');
        root.querySelectorAll('#vtuTabs .chip').forEach(function(c){ c.classList.remove('active'); });
        b.classList.add('active');
        paintTab(root);
      });
    });
    paintTab(root);
    loadCatalog().then(function(){ if (tab !== 'airtime') paintTab(root); });
  }

  function netChips(idName, current, onPick){
    return '<div class="chip-row" id="' + idName + '" style="margin-bottom:14px">' +
      NETWORKS.map(function(n){ return '<button class="chip' + (n === current ? ' active' : '') + '" data-net="' + n + '">' + n + '</button>'; }).join('') +
    '</div>';
  }

  function paintTab(root){
    var area = document.getElementById('vtuArea'); if (!area) return;

    if (tab === 'airtime'){
      area.innerHTML =
        netChips('airtimeNets', vtuNet) +
        '<div class="field"><label>Phone Number</label><input id="aPhone" class="input" type="tel" maxlength="11" placeholder="08012345678"/></div>' +
        '<div class="chip-row" id="aChips" style="margin-bottom:8px">' + [100,200,500,1000,2000,5000].map(function(a){ return '<button class="chip" data-amt="' + a + '">\u20A6' + a + '</button>'; }).join('') + '</div>' +
        '<input id="aAmt" class="input" type="number" placeholder="Or enter custom amount (min \u20A6100)" min="100" style="margin-bottom:12px"/>' +
        '<button class="btn btn-accent btn-block" id="aSubmit">Buy Airtime</button>';
      area.querySelectorAll('#airtimeNets .chip').forEach(function(b){ b.onclick = function(){ vtuNet = b.getAttribute('data-net'); area.querySelectorAll('#airtimeNets .chip').forEach(function(c){ c.classList.remove('active'); }); b.classList.add('active'); }; });
      area.querySelectorAll('#aChips .chip').forEach(function(b){ b.onclick = function(){ area.querySelectorAll('#aChips .chip').forEach(function(c){ c.classList.remove('active'); }); b.classList.add('active'); document.getElementById('aAmt').value = ''; }; });
      document.getElementById('aPhone').oninput = function(){ this.value = this.value.replace(/\D/g, ''); };
      document.getElementById('aSubmit').onclick = submitAirtime;

      area.innerHTML =

        '<div class="chip-row" style="margin-bottom:10px" id="dataDurRow">' + ['daily','weekly','monthly'].map(function(d){ return '<button class="chip' + (d === dataDur ? ' active' : '') + '" data-dur="' + d + '">' + d.charAt(0).toUpperCase() + d.slice(1) + '</button>'; }).join('') + '</div>' +
        '<div id="dataPlanGrid" class="plan-grid" style="margin-bottom:12px"></div>' +
        '<div class="field"><label>Phone Number</label><input id="dPhone" class="input" type="tel" maxlength="11" placeholder="08012345678"/></div>' +
        '<button class="btn btn-accent btn-block" id="dSubmit">Buy Data</button>';
      area.querySelectorAll('#dataNets .chip').forEach(function(b){ b.onclick = function(){ dataNet = b.getAttribute('data-net'); dataPlan = null; paintTab(root); }; });
      area.querySelectorAll('#dataDurRow .chip').forEach(function(b){ b.onclick = function(){ dataDur = b.getAttribute('data-dur'); dataPlan = null; paintTab(root); }; });
      document.getElementById('dPhone').oninput = function(){ this.value = this.value.replace(/\D/g, ''); };
      document.getElementById('dSubmit').onclick = submitData;
      renderDataPlans();
      return;
    }

    if (tab === 'cable'){
      area.innerHTML =

        '<div class="field"><label>Smartcard Number</label><input id="cCard" class="input" placeholder="Enter smartcard number"/></div>' +
        '<div class="field"><label>Package</label><div id="cPlan"></div></div>' +
        '<div class="surface-block" id="cTotal" style="margin-bottom:12px;font-weight:600">Total: \u2014</div>' +

      area.querySelectorAll('#cableRow .chip').forEach(function(b){ b.onclick = function(){ cable = b.getAttribute('data-cable'); paintTab(root); }; });
      document.getElementById('cSubmit').onclick = submitCable;
      renderCablePlans();

    if (tab === 'electricity'){

        '<div class="field"><label>Provider</label><div id="eDisco"></div></div>' +

        '<input id="eAmt" class="input" type="number" placeholder="Or enter amount (min \u20A6500)" min="500" style="margin-bottom:12px"/>' +
        '<button class="btn btn-accent btn-block" id="eSubmit">Buy Token</button>';
      mountDropdown('eDisco', {

  function renderDataPlans(){
    var el = document.getElementById('dataPlanGrid'); if (!el) return;

      el.innerHTML = '<p class="faint" style="grid-column:1/-1;font-size:12px">' + (catalogPromise ? 'Loading plans\u2026' : 'Could not load data plans.') + '</p>';
      if (catalogPromise) loadCatalog().then(renderDataPlans);
      return;
    }
    var all = dataBundles(dataNet.toUpperCase());
    var plans = all.filter(function(p){ return classifyDur(p) === dataDur && (+(p.price || p.amount || 0)) >= 50; });
    var seen = {};
    plans = plans.filter(function(p){ var k = (p.size || p.bundle || p.name || '') + '|' + (+(p.price || p.amount || 0)); if (seen[k]) return false; seen[k] = true; return true; });
    plans.sort(function(a, b){ var aM = parseMB(a.size || a.bundle || a.name || '') || 0, bM = parseMB(b.size || b.bundle || b.name || '') || 0; return aM !== bM ? aM - bM : (+(a.price || a.amount || 0)) - (+(b.price || b.amount || 0)); });
    if (!plans.length){ el.innerHTML = '<p class="faint" style="grid-column:1/-1;font-size:12px">No ' + dataDur + ' plans for ' + esc(dataNet) + '</p>'; el._plans = []; return; }
