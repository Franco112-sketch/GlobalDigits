<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#ffffff"/>
<meta name="color-scheme" content="light"/>
<meta name="robots" content="noindex"/>
<title>Sell Gift Card — Global Digits</title>
<link rel="icon" type="image/x-icon" href="favicon.ico"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --brand:#1a56db;--brand-2:#1342b0;--brand-soft:#eef3ff;--brand-line:#c9d8fb;
  --bg:#f6f8fc;--panel:#fff;--line:#e5e9f1;--line-2:#d3d9e6;
  --ink:#0c1424;--ink-2:#4a5570;--ink-3:#8590a8;
  --ok:#0f9d6b;--ok-soft:#e6f6ef;--warn:#a8680f;--warn-soft:#fdf4e1;--bad:#d1293d;--bad-soft:#fdecee;
  --r:12px;--r-s:8px;
  --sh-1:0 1px 2px rgba(12,20,36,.04),0 1px 1px rgba(12,20,36,.03);
  --sh-2:0 10px 30px -8px rgba(12,20,36,.18),0 2px 6px rgba(12,20,36,.06);
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:var(--sans);font-size:13px;line-height:1.45;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
svg{flex-shrink:0}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ── top bar ── */
.bar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.86);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar-in{max-width:980px;margin:0 auto;height:50px;padding:0 12px;display:flex;align-items:center;gap:6px}
.icon-btn{width:34px;height:34px;border-radius:var(--r-s);display:grid;place-items:center;color:var(--ink-2);transition:background .15s,color .15s}
.icon-btn:hover{background:var(--brand-soft);color:var(--brand)}
.brand{display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.brand img{height:22px;width:auto;display:block}
.brand b{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;font-size:10.5px;font-weight:500;color:var(--ink-3);margin-top:-1px}
.link-btn{font-size:12px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:5px;padding:6px 9px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--panel)}
.link-btn:hover{color:var(--brand);border-color:var(--brand-line)}

/* ── layout ── */
.wrap{max-width:980px;margin:0 auto;padding:14px 12px calc(32px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:880px){.wrap{grid-template-columns:minmax(0,1fr) 290px;gap:18px;padding-top:22px}.aside{position:sticky;top:68px}}
.main{min-width:0}
.aside{display:grid;gap:12px}
@media (max-width:879px){.aside{display:contents}.wallet{order:-1}.elig{order:1}}
.shead+.step,.okbox+.step{margin-top:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1)}
.sec{padding:16px}
.sec+.sec{border-top:1px solid var(--line)}
.h{font-size:15px;font-weight:700;letter-spacing:-.015em}
.sub{font-size:12px;color:var(--ink-2);margin-top:3px;max-width:52ch}
.lbl{font-size:11.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px;display:block}
.fg{margin-top:14px}

/* ── wallet strip + eligibility ── */
.wallet{display:grid;grid-template-columns:1fr 1fr;border-radius:var(--r);background:var(--ink);color:#fff;overflow:hidden;position:relative}
.wallet>div{padding:12px 14px;position:relative}
.wallet>div+div{border-left:1px solid rgba(255,255,255,.12)}
.wallet span{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:rgba(255,255,255,.6);letter-spacing:.02em}
.wallet b{display:block;margin-top:3px;font-size:17px;font-weight:700;letter-spacing:-.02em}
.wallet::after{content:"";position:absolute;right:-30px;top:-40px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(66,120,240,.55),transparent 70%);pointer-events:none}
.elig{padding:12px 14px}
.elg{display:flex;gap:10px;align-items:flex-start}
.elg .et{display:grid;gap:2px;font-size:11.5px;color:var(--ink-2);line-height:1.45}.elg .et b{color:var(--ink);font-weight:700;font-size:12.5px}
.how{margin-top:10px;font-size:11.5px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:9px}
.how summary{cursor:pointer;color:var(--brand);font-weight:600;list-style:none;display:flex;align-items:center;gap:5px}
.how summary::-webkit-details-marker{display:none}
.how ul{margin:8px 0 0 16px;display:grid;gap:4px}

/* ── tabs ── */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:3px;margin-bottom:12px;background:#e9eef7;border-radius:10px}
.tab{padding:8px 4px;font-size:12.5px;font-weight:700;color:var(--ink-3);border-radius:8px;transition:background .15s,color .15s,box-shadow .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{background:var(--panel);color:var(--brand);box-shadow:0 1px 3px rgba(12,20,36,.12)}

/* ── steps ── */
.step{display:flex;gap:11px}
.step+.step{margin-top:16px}
.sn{width:22px;height:22px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-size:11px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.sb{flex:1;min-width:0}
.st{font-size:12.5px;font-weight:700;margin-bottom:9px}
.two{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:520px){.two{grid-template-columns:1fr 1fr}}

/* ── inputs ── */
.amt{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:var(--r-s);padding:0 12px;height:44px;background:var(--panel);transition:border-color .15s,box-shadow .15s}
.amt:hover{border-color:#b9c3d8}
.amt:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(26,86,219,.14)}
.amt.bad{border-color:var(--bad)}
.amt span{color:var(--ink-3);font-weight:600}
.amt input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.amt input::placeholder{color:var(--ink-3);font-weight:500}
.amt input:disabled{color:var(--ink-3)}
.in{width:100%;height:42px;border:1px solid var(--line-2);border-radius:var(--r-s);padding:0 12px;background:var(--panel);font-size:13px;outline:0;transition:border-color .15s,box-shadow .15s}
.in:hover{border-color:#b9c3d8}
.in:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(26,86,219,.14)}
.err{display:flex;gap:5px;align-items:center;color:var(--bad);font-size:11.5px;margin-top:6px;font-weight:600}
.limits{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-top:7px}

/* ── custom dropdown trigger ── */
.dd{position:relative}
.ddt{width:100%;min-height:46px;display:flex;align-items:center;gap:10px;padding:6px 12px;border:1px solid var(--line-2);border-radius:var(--r-s);background:var(--panel);text-align:left;transition:border-color .15s,box-shadow .15s,background .15s}
.ddt:hover:not(:disabled){border-color:#b9c3d8}
.ddt[aria-expanded=true]{border-color:var(--brand);box-shadow:0 0 0 3px rgba(26,86,219,.14)}
.ddt.bad{border-color:var(--bad)}
.ddt:disabled{background:#f3f5f9;color:var(--ink-3);cursor:not-allowed}
.ddt>svg{margin-left:auto;color:var(--ink-3);transition:transform .2s}
.ddt[aria-expanded=true]>svg{transform:rotate(180deg);color:var(--brand)}
.ddv{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.ph{color:var(--ink-3);font-weight:500}
.ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;font-size:16px;background:var(--bg);border:1px solid var(--line);font-weight:700;color:var(--ink)}
.art{width:30px;height:21px;border-radius:5px;display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:-.02em;flex-shrink:0;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 1px 2px rgba(12,20,36,.2)}
.art::after{content:"";position:absolute;left:3px;bottom:3px;width:7px;height:2px;border-radius:2px;background:currentColor;opacity:.5}
.ico.artw{background:none;border:0;width:34px}
.tx{min-width:0;display:grid;gap:0;line-height:1.25}
.tx b{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx small{font-size:11px;color:var(--ink-3);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── dropdown popup (rendered in body → never clipped) ── */
.ddlayer{position:fixed;inset:0;z-index:1000;pointer-events:none}
.ddlayer>*{pointer-events:auto}
.ddp{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-2);display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:translateY(-6px) scale(.985);transform-origin:top center;transition:opacity .14s ease,transform .16s cubic-bezier(.2,.8,.3,1)}
.ddlayer.up .ddp{transform:translateY(6px) scale(.985);transform-origin:bottom center}
.ddlayer.on .ddp{opacity:1;transform:none}
.dds{display:flex;align-items:center;gap:8px;padding:0 12px;height:42px;border-bottom:1px solid var(--line);color:var(--ink-3);flex-shrink:0}
.dds input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:13px;color:var(--ink)}
.ddl{flex:1;min-height:0;list-style:none;overflow-y:auto;overscroll-behavior:contain;padding:5px;max-height:100%;-webkit-overflow-scrolling:touch}
.ddo{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:8px;cursor:pointer;min-height:44px}
.ddo.act{background:var(--brand-soft)}
.ddo[aria-selected=true]{background:var(--brand-soft)}
.ddo .ck{margin-left:auto;color:var(--brand);opacity:0;flex-shrink:0}
.ddo[aria-selected=true] .ck{opacity:1}
.ddo .mt{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.ddo .mt+.ck{margin-left:8px}
.ddm{padding:18px 12px;text-align:center;color:var(--ink-3);font-size:12px}
.ddm .bt{margin-top:8px;color:var(--brand);font-weight:700}
.sk{height:40px;margin:4px;border-radius:8px;background:linear-gradient(90deg,#eef1f7,#f7f9fc,#eef1f7);background-size:200% 100%;animation:sh 1.1s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.ddf{display:flex;align-items:center;gap:8px;width:100%;padding:11px 14px;border-top:1px solid var(--line);color:var(--brand);font-weight:700;font-size:12.5px;flex-shrink:0;background:var(--panel)}
.ddf:hover{background:var(--brand-soft)}
.ddbd{position:fixed;inset:0;background:rgba(12,20,36,.38);opacity:0;transition:opacity .18s}
.ddlayer.on .ddbd{opacity:1}
@media (max-width:640px){
  .ddp{left:0!important;right:0;bottom:0!important;top:auto!important;width:100%!important;max-height:72vh!important;border-radius:16px 16px 0 0;border-width:1px 0 0;transform:translateY(24px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .ddlayer.up .ddp{transform:translateY(24px)}
  .ddp::before{content:"";width:36px;height:4px;border-radius:4px;background:var(--line-2);margin:8px auto 2px;flex-shrink:0}
  .dds input{font-size:16px}
  .ddo{min-height:48px}
}

/* ── payout slip (estimate) ── */
.slip{position:relative;margin-top:16px;background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:var(--r);padding:12px 14px 12px}
.slip::before,.slip::after{content:"";position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--panel);border:1px solid var(--brand-line);margin-top:-6px}
.slip::before{left:-7px;clip-path:inset(0 0 0 50%)}.slip::after{right:-7px;clip-path:inset(0 50% 0 0)}
.slip .er{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink-2);padding:3px 0}
.slip .er b{color:var(--ink);font-weight:700}
.slip .tot{border-top:1px dashed var(--brand-line);margin-top:6px;padding-top:9px;color:var(--ink);font-weight:700}
.slip .tot b{font-size:19px;letter-spacing:-.02em;color:var(--brand-2)}
.slip .en{font-size:11px;color:var(--ink-2);margin-top:6px;line-height:1.45}
.slip.muted{background:var(--bg);border-color:var(--line);color:var(--ink-3)}
.slip.muted::before,.slip.muted::after{border-color:var(--line)}
.slip.muted p{font-size:12px;color:var(--ink-2);line-height:1.5}

/* ── upload ── */
.drop{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:1.5px dashed var(--line-2);border-radius:var(--r);background:#fbfcfe;text-align:left;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop.bad{border-color:var(--bad);background:var(--bad-soft)}
.drop .di{width:40px;height:40px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex-shrink:0}
.drop b{font-size:12.5px;font-weight:700;display:block}
.drop small{font-size:11px;color:var(--ink-3)}
.pv{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--ok);background:var(--ok-soft);border-radius:var(--r)}
.pv img{width:64px;height:48px;object-fit:cover;border-radius:7px;border:1px solid var(--line);background:#fff}
.pv .tx{flex:1}.pv .tx b{font-size:12.5px}
.pv .acts{display:flex;gap:4px}
.mini{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-2);background:var(--panel);border-radius:var(--r-s);padding:5px 9px;font-size:11.5px;font-weight:600;transition:border-color .15s,color .15s}
.mini:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}.mini.bad:hover:not(:disabled){border-color:var(--bad);color:var(--bad)}.mini:disabled{opacity:.45;cursor:not-allowed}

/* ── buttons ── */
.cta{width:100%;height:44px;font-size:13.5px;border-radius:var(--r-s);background:var(--brand);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px;transition:background .15s,transform .1s,box-shadow .15s;box-shadow:0 1px 2px rgba(26,86,219,.35),inset 0 1px 0 rgba(255,255,255,.14)}
.cta:hover:not(:disabled){background:var(--brand-2)}
.cta:active:not(:disabled){transform:scale(.985)}
.cta:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.ghost{width:100%;height:42px;font-size:13px;border-radius:var(--r-s);border:1px solid var(--line-2);background:var(--panel);font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;transition:border-color .15s,color .15s}
.ghost:hover{border-color:var(--brand);color:var(--brand)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── misc blocks ── */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.p{background:var(--warn-soft);color:var(--warn)}.pill.a{background:var(--ok-soft);color:var(--ok)}.pill.x{background:var(--bad-soft);color:var(--bad)}
.note{display:flex;gap:8px;font-size:11.5px;padding:9px 11px;border-radius:var(--r-s);margin-top:12px;line-height:1.45}
.note.info{background:var(--brand-soft);color:var(--ink-2)}.note.info svg{color:var(--brand)}
.note.warn{background:var(--warn-soft);color:var(--ink-2)}.note.warn svg{color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--ink-2)}.note.bad svg{color:var(--bad)}
.note.ok{background:var(--ok-soft);color:var(--ink-2)}.note.ok svg{color:var(--ok)}
.okbox{display:flex;gap:11px;align-items:flex-start;padding:12px;border-radius:var(--r);background:var(--ok-soft);border:1px solid #bfe6d4;margin-bottom:14px;animation:pop .3s ease}
.okbox .c{width:28px;height:28px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;flex-shrink:0}
.okbox b{font-size:13px;display:block}.okbox p{font-size:11.5px;color:var(--ink-2);margin-top:1px}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv dt{font-size:11.5px;color:var(--ink-3);flex-shrink:0}
.kv dd{font-size:12.5px;font-weight:600;text-align:right;min-width:0;word-break:break-word}
.calc{margin-top:12px}
.hero{text-align:center;padding:20px 14px 6px}
.hero .c{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;background:var(--ok-soft);color:var(--ok)}
.hero p{font-size:12px;color:var(--ink-2);max-width:340px;margin:4px auto 0}
.li{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r);padding:10px 11px;margin-top:8px;background:var(--panel)}
.li .lb{flex:1;min-width:0}
.lr{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px}
.ls{font-size:11px;color:var(--ink-3);margin-top:3px;line-height:1.45;word-break:break-word}
.ls.bad{color:var(--bad)}.okt{color:var(--ok);font-weight:700}.mut{color:var(--ink-3)}
.empty{font-size:12px;color:var(--ink-3);padding:14px;text-align:center;border:1px dashed var(--line-2);border-radius:var(--r);margin-top:10px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cnt{font-size:11px;font-weight:700;color:var(--ink-3);background:var(--bg);border-radius:99px;padding:2px 8px}
.chg{display:flex;gap:7px;align-items:flex-start;font-size:11px;color:var(--ink-2);background:var(--brand-soft);border-radius:var(--r-s);padding:8px 10px;margin:8px 0 2px;line-height:1.45}.chg svg{color:var(--brand);margin-top:1px}
.chg.full{background:var(--warn-soft)}.chg.full svg{color:var(--warn)}
.pms2{display:grid;gap:8px;margin-top:12px}
.pm2{display:flex;gap:11px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--panel);transition:border-color .15s,box-shadow .15s}
.pm2:hover{border-color:var(--brand);box-shadow:0 0 0 3px rgba(26,86,219,.08)}.pm2 .ic{width:36px;height:36px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.pm2 b{display:block;font-size:13px;font-weight:700}.pm2 small{font-size:11px;color:var(--ink-3)}
.gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50}
.gate i{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:sp .8s linear infinite}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:9px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:1100;max-width:90%;text-align:center;box-shadow:var(--sh-2)}
#toast.show{opacity:1;transform:translate(-50%,0)}
@supports (-webkit-touch-callout:none){.amt input,.in{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}

/* ══ premium layer ══ */
:root{--r:14px;--r-s:10px;--sh-1:0 1px 2px rgba(12,20,36,.04),0 6px 18px -10px rgba(12,20,36,.12);--grad:linear-gradient(180deg,#2c66e8,#1a56db 58%,#1649bf)}
html,body{background:var(--bg)}
body{background:radial-gradient(820px 300px at 50% -140px,#e4ecfd 0,rgba(228,236,253,0) 72%),var(--bg);background-repeat:no-repeat}
.panel{border-radius:var(--r)}
.sec{padding:16px}
.ttl{display:flex;gap:11px;align-items:flex-start}
.hic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;color:var(--brand);background:linear-gradient(180deg,#f2f6ff,#e3ecff);border:1px solid var(--brand-line)}
.h{font-size:15px}
.sub{font-size:12px}
/* tabs */
.tabs{background:#e7ecf6;border-radius:12px;gap:3px}
.tab{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 4px;border-radius:9px}
.tab svg{opacity:.75}.tab[aria-selected=true] svg{opacity:1}
/* wallet */
.wallet{background:linear-gradient(135deg,#0b1428 0%,#12214a 58%,#1a3a8c 100%);box-shadow:0 10px 24px -14px rgba(12,28,80,.7);border:1px solid rgba(255,255,255,.06)}
.wallet::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 1px,transparent 1px 14px);pointer-events:none}
.wallet span{gap:7px}.wallet b{font-size:16px}
.ci{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;flex-shrink:0;line-height:0}
.ci.ngn{background:#e6f6ef;color:#0b7a53}.ci.usdt{background:transparent}.ci svg{display:block}
.wallet .ci.ngn{background:rgba(255,255,255,.14);color:#fff}
.elig{border-radius:var(--r)}
/* steps */
.step{display:block}.step+.step{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.shead+.step,.okbox+.step,.ttl+.step{margin-top:16px}
.st{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:10px}
.st .cnt{margin-left:auto}
.sn{width:20px;height:20px;margin:0;font-size:10.5px;color:#fff;background:var(--brand);box-shadow:0 2px 6px -2px rgba(26,86,219,.6)}
.lbl2{margin-top:14px}
/* brand logo + flag tiles */
.lg{position:relative;width:36px;height:36px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;flex-shrink:0;box-shadow:0 1px 2px rgba(12,20,36,.06)}

.lg.ok img{display:block}.lg.ok .fb{display:none}
.fl{position:relative;width:24px;height:18px;border-radius:4px;overflow:hidden;flex-shrink:0;display:grid;place-items:center;background:var(--bg);box-shadow:0 0 0 1px rgba(12,20,36,.12)}
.fl .fb{display:grid;color:var(--ink-3)}

.fl.ok img{display:block}.fl.ok .fb{display:none}
/* gift card grid (live from Admin → Gift Card Rates) */
.srch{display:flex;align-items:center;gap:8px;height:38px;padding:0 11px;border:1px solid var(--line-2);border-radius:var(--r-s);background:var(--panel);color:var(--ink-3);margin-bottom:10px;transition:border-color .15s,box-shadow .15s}

.gcg{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.gc{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 6px 9px;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-align:center;min-width:0;transition:border-color .15s,box-shadow .15s,background .15s,transform .1s}
.gc:hover{border-color:var(--brand-line);box-shadow:0 6px 14px -10px rgba(26,86,219,.5)}
.gc:active{transform:scale(.98)}
.gc b{max-width:100%;font-size:11.5px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc small{max-width:100%;font-size:10.5px;color:var(--ink-3);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc .ck{position:absolute;top:6px;right:6px;width:16px;height:16px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;opacity:0;transform:scale(.7);transition:opacity .15s,transform .15s}
.gc.on{border-color:var(--brand);background:linear-gradient(180deg,#f6f9ff,var(--brand-soft));box-shadow:0 0 0 3px rgba(26,86,219,.12)}
.gc.on .ck{opacity:1;transform:none}
/* country chips + payout segmented control */
.cg,.seg{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(138px,1fr))}
.seg{grid-template-columns:1fr 1fr}
.cc,.sg{display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid var(--line-2);border-radius:11px;background:var(--panel);text-align:left;min-width:0;transition:border-color .15s,box-shadow .15s,background .15s}
.cc:hover,.sg:hover{border-color:#b9c3d8}
.cc.on,.sg.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px rgba(26,86,219,.11)}
.cc .tx small,.sg .tx small{font-variant-numeric:tabular-nums}
.sg .ci{width:24px;height:24px}
.sg .tx b{font-size:12.5px}
/* inputs, dropdowns */
.amt{height:44px;border-radius:var(--r-s)}
.amt input{font-size:16px}
.in{border-radius:var(--r-s)}
.ddt{border-radius:var(--r-s)}
.ico{border-radius:9px}
.ddo .ci{width:24px;height:24px}
/* payout estimate */
.slip{margin-top:14px;border-radius:12px;background:linear-gradient(180deg,#f7faff,var(--brand-soft))}
.slip .tot b{font-size:16px;display:inline-flex;align-items:center;gap:7px}
.slip .rc{white-space:nowrap}
.slip.muted{background:var(--bg)}
/* buttons */
.cta{height:42px;border-radius:11px;font-size:13.5px;background:var(--grad);box-shadow:0 8px 16px -8px rgba(26,86,219,.65),inset 0 1px 0 rgba(255,255,255,.2)}
.cta:hover:not(:disabled){background:var(--grad);filter:brightness(1.06)}
.ghost{height:40px;border-radius:11px}
.mini{border-radius:9px;padding:5px 9px}
.link-btn{border-radius:10px}.icon-btn{border-radius:10px}
.drop{border-radius:12px;padding:11px 12px}
.drop .di{width:38px;height:38px;border-radius:11px}
.pm2 .ic{border-radius:11px}
/* lists */
.li{border-radius:12px;padding:10px 11px;align-items:center}
.li .lb{min-width:0}
.pv{border-radius:12px}
.pill{font-size:10.5px}
.cnt{font-size:10.5px}
.note{border-radius:10px}
.okbox{border-radius:12px}
@media (max-width:520px){.gcg{grid-template-columns:repeat(3,minmax(0,1fr))}.cg{grid-template-columns:1fr 1fr}.cc .tx b{font-size:12px}}

.empty{display:grid;justify-items:center;gap:6px}.empty svg{color:var(--line-2)}.empty p{font-size:12px;color:var(--ink-3)}
.pill svg{margin-left:-2px}.elig{box-shadow:var(--sh-1)}.hic{box-shadow:inset 0 1px 0 #fff}
.live{display:flex;align-items:center;gap:7px;margin:12px 0 0;font-size:11px;font-weight:600;color:var(--ink-3)}

.rf{margin-left:auto;width:28px;height:28px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);display:grid;place-items:center}

.chips{display:flex;gap:6px;overflow-x:auto;margin:2px 0 10px;padding-bottom:2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;height:30px;padding:0 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:12px;font-weight:700;color:var(--ink-2)}
.chip i{font-style:normal;font-size:10.5px;min-width:17px;padding:1px 5px;border-radius:999px;background:var(--bg);color:var(--ink-3);text-align:center}
.chip.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}.chip.on i{background:var(--brand);color:#fff}
.idc{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border:1px solid var(--line);border-radius:7px;background:var(--bg);font-size:10.5px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.idc:hover{color:var(--brand);border-color:var(--brand-line)}
.li.tap{cursor:pointer;position:relative;transition:border-color .15s,box-shadow .15s,transform .1s}
.li.tap:hover{border-color:var(--brand-line);box-shadow:0 6px 14px -10px rgba(26,86,219,.45)}.li.tap:active{transform:scale(.995)}
.li.tap:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.vr{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:11px;font-weight:700;color:var(--brand)}
.rs-lock{overflow:hidden}
.rs-back{position:fixed;inset:0;z-index:70;background:rgba(10,16,30,.5);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;animation:rsfade .18s ease}
.rs{width:100%;max-width:440px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));outline:0;animation:rsup .24s cubic-bezier(.2,.8,.2,1)}

.rs-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.rs-ttl{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:800}

.rs-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--sh-1)}
.rs-head{display:flex;align-items:center;gap:10px}.rs-head .tx{min-width:0;display:flex;flex-direction:column;gap:5px;align-items:flex-start}.rs-head b{font-size:13.5px}

.rs-steps{display:flex;margin:14px 4px 2px}.rs-s{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;font-size:10.5px;font-weight:700;color:var(--ink-3)}
.rs-s .b{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--panel);display:grid;place-items:center;color:#fff;z-index:1}
.rs-s+.rs-s::before{content:"";position:absolute;top:10px;right:50%;width:100%;height:2px;background:var(--line-2)}
.rs-s.on .b{background:var(--brand);border-color:var(--brand)}.rs-s.on{color:var(--ink)}.rs-s.on+.rs-s.on::before{background:var(--brand)}
.rs-s.fin .b{background:#16a34a;border-color:#16a34a}
.rs-x{display:flex;gap:8px;align-items:center;margin-top:12px;padding:9px 11px;border-radius:10px;background:#fdecec;color:#b42318;font-size:12px;font-weight:600}
.rs-sep{border-top:1px dashed var(--line-2);margin:14px -14px;position:relative}
.rs-sep::before,.rs-sep::after{content:"";position:absolute;top:-7px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.rs-sep::before{left:-8px;clip-path:inset(0 0 0 50%)}.rs-sep::after{right:-8px;clip-path:inset(0 50% 0 0)}
.rs-r{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:12.5px}.rs-r>span:first-child{color:var(--ink-3)}.rs-r>span:last-child{text-align:right;font-weight:600;min-width:0;word-break:break-word}
.rs-id{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px}.rs-id>span{color:var(--ink-3)}
.rs-id{flex-direction:column;align-items:stretch;gap:6px}.rs-id .idc{justify-content:space-between;width:100%;padding:7px 9px;font-size:11px;word-break:break-all;text-align:left}
.rs-act{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}

.acc-on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.link-btn .dotb{width:7px;height:7px;border-radius:50%;background:var(--bad)}
.rcpt-link{margin-top:6px;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--brand)}

function compress(file){return new Promise((res,rej)=>{
  if(!file.type||file.type.indexOf('image/')!==0){res('');return}
  const r=new FileReader();r.onerror=()=>rej(new Error('read'));
  r.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('img'));
    im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.75))};im.src=r.result};
  r.readAsDataURL(file)})}
async function uploadImage(f){
  let url='',data='';
  try{const p='gc_'+S.user.id+'_'+Date.now();
    const u=await sb.storage.from('deposit-receipts').upload(p,f,{cacheControl:'3600',upsert:false});
    if(!u.error&&u.data)url=sb.storage.from('deposit-receipts').getPublicUrl(u.data.path).data.publicUrl;
  }catch(e){}
  if(!url){data=await compress(f)}
  return {url,data};
}

/* ── data ── */
async function rpc(name,args){const r=await sb.rpc(name,args||{});if(r.error)throw r.error;return r.data}
async function loadAll(){
  const [ov,rates,trades,accts,wds]=await Promise.all([rpc('gc_overview'),rpc('gc_rates'),rpc('gc_my_trades'),rpc('gc_my_accounts'),rpc('gc_my_withdrawals')]);
  try{const ps=await rpc('gc_pin_status');S.pin={has:!!(ps&&ps.has_pin),locked_until:ps&&ps.locked_until||null,ok:true}}catch(e){S.pin={has:false,locked_until:null,ok:false};console.warn('gc_pin_status unavailable (run the PIN SQL):',e)}
  S.ov=ov;S.trades=trades||[];S.accts=accts||[];S.wds=wds||[];
  /* only cards the admin has switched on, in the admin's sort order */
  S.rates=(rates||[]).filter(r=>r&&r.active!==false).map((r,i)=>Object.assign({_i:i},r));
  if(S.rates.some(r=>r.sort_order!=null))S.rates.sort((a,b)=>(+a.sort_order||0)-(+b.sort_order||0)||a._i-b._i);
  /* logos set in Admin → Gift Card Rates (read separately so the page still works if the column is missing) */
  const lg={};S.rates.forEach(r=>{if(r.logo_url)lg[r.type]=r.logo_url});
  try{const q=await sb.from('gift_card_rates').select('type,logo_url').not('logo_url','is',null);if(!q.error&&q.data)q.data.forEach(r=>{if(r.logo_url&&!lg[r.type])lg[r.type]=r.logo_url})}catch(_){}
  S.logos=lg;
  /* NGN per 1 USDT as configured by the admin (validated and served by the database); null when not set */
  /* 1) the database function; 2) if it is missing or blocked, read the same admin_config row directly. S.usdtWhy records why no rate was found. */
  S.at=Date.now();S.usdtRate=0;S.usdtWhy='';
  try{
    const r=await sb.rpc('gc_usdt_rate');
    if(!r.error){
      S.usdtRate=+r.data>0?+r.data:0;
      if(!(S.usdtRate>0)){   /* the function returned null: look at the row itself so the reason is exact, not assumed */
        const t=await sb.from('admin_config').select('value').eq('key','gcw_usdt_ngn_rate').maybeSingle();
        if(t.error)S.usdtWhy='gc_usdt_rate() returned null; admin_config not readable: '+(t.error.message||'blocked');
        else if(!t.data)S.usdtWhy='no gcw_usdt_ngn_rate row exists in admin_config (nothing has been saved)';
        else{const v=Number(String(t.data.value).replace(/"/g,''));
          if(v>0){S.usdtRate=v}else S.usdtWhy='saved value '+JSON.stringify(t.data.value)+' is not a number above 0'}
      }
    }
    else{
      S.usdtWhy='gc_usdt_rate: '+(r.error.message||r.error.code||'error');
      const t=await sb.from('admin_config').select('value').eq('key','gcw_usdt_ngn_rate').maybeSingle();
      const v=(!t.error&&t.data)?Number(String(t.data.value).replace(/"/g,'')):0;
      if(v>0){S.usdtRate=v;S.usdtWhy=''}else if(t.error)S.usdtWhy+=' | admin_config: '+(t.error.message||'blocked');else S.usdtWhy+=' | no gcw_usdt_ngn_rate row';
    }
  }catch(e){S.usdtRate=0;S.usdtWhy='error: '+(e&&e.message||e)}
  if(S.usdtWhy)console.warn('[USDT rate unavailable]',S.usdtWhy);
}
const sig=()=>JSON.stringify([S.pin,S.ov,S.rates,S.logos,S.usdtRate,S.usdtWhy,S.trades,S.accts,S.wds]);

function wdReceiptRows(x){
  const m=x.method,rows=[['Reference','<span class="mono">'+esc(x.reference)+'</span>'],['Method',m==='NGN'?'Bank transfer (NGN)':'USDT'],['Destination',esc(x.destination||'—')],['Amount requested',wmoney(m,x.amount)],['Fee',wmoney(m,x.fee)],['You receive','<b>'+wmoney(m,x.net)+'</b>'],['Requested',esc(fmtDT(x.created_at))]];
  if(x.status==='approved'){rows.push(['Paid on',esc(fmtDT(x.paid_at))]);if(x.payout_ref)rows.push(['Payout reference','<span class="mono">'+esc(x.payout_ref)+'</span>'])}
  if(x.status==='rejected')rows.push(['Reason',esc(x.rejection_reason||'No reason given')]);
  return rows;
}
function wdReceiptText(x){const st=wdStatus(x.status);return ['Global Digits · Withdrawal receipt','Status: '+st[1],...wdReceiptRows(x).map(r=>r[0]+': '+r[1].replace(/<[^>]+>/g,'').replace(/&amp;/g,'&'))].join('\n')}
function wdReceiptHtml(x){
  const st=wdStatus(x.status),m=x.method,paid=x.status==='approved',bad=x.status==='rejected';
  const stage=paid?3:x.status==='processing'?2:1;
  const steps=bad?'<div class="rs-x">'+I(IC.x,14)+'<span>This withdrawal was rejected. The reserved funds were returned to your wallet.</span></div>':
    '<div class="rs-steps" aria-label="Withdrawal progress">'+[['Requested',1],['Processing',2],['Paid',3]].map((q,i)=>'<div class="rs-s'+(stage>=q[1]?' on':'')+(i===2&&paid?' fin':'')+'"><span class="b">'+(stage>=q[1]?I(IC.check,11):'')+'</span><small>'+q[0]+'</small></div>').join('')+'</div>';
  return '<div class="rs-top"><span class="rs-ttl">'+I(IC.receipt,15)+'Withdrawal receipt</span><button type="button" class="rs-x2" id="rsClose" aria-label="Close receipt">'+I(IC.x,14)+'</button></div>'+
    '<div class="rs-card"><div class="rs-head"><span class="ico">'+I(m==='NGN'?IC.bank:IC.wallet,16)+'</span><div class="tx"><b>'+(m==='NGN'?'Bank withdrawal':'USDT withdrawal')+'</b>'+pill(st[0],st[1])+'</div></div>'+
    '<div class="rs-amt">'+curIco(m==='NGN'?'NGN':'USDT',22)+'<b class="num">'+wmoney(m,x.net)+'</b></div><div class="rs-cap">'+(paid?'Paid to your account':bad?'Not paid':'You will receive')+'</div>'+steps+
    '<div class="rs-sep"></div>'+wdReceiptRows(x).map(r=>'<div class="rs-r"><span>'+r[0]+'</span><span>'+r[1]+'</span></div>').join('')+'</div>'+
    '<div class="rs-act"><button type="button" class="ghost" id="rsShare">'+I(IC.share,14)+'Share receipt</button><button type="button" class="cta" id="rsDone" style="height:40px">Done</button></div>';
}
function openWdReceipt(k){
  if(!findWd(k))return;S.rcK='wd';S.rc=k;S.rcFocus=document.activeElement;
  let o=document.getElementById('rcpt');
  if(!o){o=document.createElement('div');o.id='rcpt';o.className='rs-back';o.innerHTML='<div class="rs" role="dialog" aria-modal="true" aria-label="Receipt" tabindex="-1"></div>';document.body.appendChild(o);o.addEventListener('click',e=>{if(e.target===o)closeReceipt()})}
  drawReceipt();document.body.classList.add('rs-lock');o.querySelector('.rs').focus();
}

/* ── ACCOUNTS ── */
function chBanner(){const c=S.ov.changes,left=c.limit-c.used;
  return '<div class="chg'+(left<=0?' full':'')+'">'+I(IC.info,13)+'<span>'+c.used+' of '+c.limit+' account changes used today (adding, editing and deleting all count). Resets at '+new Date(c.resets_at).toLocaleTimeString('en-NG',{hour:'2-digit',minute:'2-digit',timeZone:c.tz})+' ('+esc(c.tz)+').</span></div>'}
function viewAccounts(){
  const a=S.ac,s=S.ov.settings,left=S.ov.changes.limit-S.ov.changes.used;
  if(a.mode==='type'){
    return '<div class="sec"><h2 class="h">Add payout account</h2>'+(S.wd.addMode?note('info','info','<b>Add a payout account to withdraw.</b> Once saved you will go straight back to the withdrawal page.'):'')+'<p class="sub">Which account do you want to add?</p><div class="pms2">'+
      (s.currencies.includes('NGN')?'<button class="pm2" data-type="NGN"><span class="ic">'+I(IC.bank,18)+'</span><span><b>NGN Bank Account</b><small>Receive Naira by bank transfer</small></span></button>':'')+
      (s.currencies.includes('USDT')?'<button class="pm2" data-type="USDT"><span class="ic">'+I(IC.wallet,18)+'</span><span><b>USDT Wallet</b><small>Receive USDT on a supported network</small></span></button>':'')+
      '</div><button class="ghost" id="acCancel" style="margin-top:12px">Cancel</button></div>';
  }
  if(a.mode==='form'){
    const f=a.f,isN=a.type==='NGN',nets=s.networks||[];
    if(!isN&&!f.network&&nets.length)f.network=nets[0];
    return '<div class="sec"><h2 class="h">'+(a.id?'Edit':'Add')+' '+(isN?'bank account':'USDT wallet')+'</h2>'+chBanner()+
      (isN?'<div class="fg"><label class="lbl" for="fBank">Bank name</label><input id="fBank" class="in" maxlength="60" placeholder="e.g. GTBank" value="'+esc(f.bank_name||'')+'"/></div>'+
        '<div class="fg"><label class="lbl" for="fName">Account holder name</label><input id="fName" class="in" maxlength="80" placeholder="As it appears on the account" value="'+esc(f.account_name||'')+'"/></div>'+
        '<div class="fg"><label class="lbl" for="fNum">Account number</label><input id="fNum" class="in" inputmode="numeric" maxlength="'+(s.ngn_digits||10)+'" placeholder="'+'0'.repeat(s.ngn_digits||10)+'" value="'+esc(f.account_number||'')+'"/></div>':
       '<div class="fg">'+dd('ddNet',{label:'Network',value:f.network,placeholder:'Select network',items:nets.map(n=>({v:n,t:n,ic:'<span class="ico">'+I(IC.wallet,15)+'</span>'})),empty:'No networks available.',onChange:v=>{S.ac.f.network=v;render()}})+'</div>'+
        '<div class="fg"><label class="lbl" for="fAddr">USDT wallet address</label><input id="fAddr" class="in mono" placeholder="Paste the address for the selected network" value="'+esc(f.wallet_address||'')+'" autocapitalize="off" autocomplete="off" spellcheck="false"/></div>'+
        note('warn','warn','Sending USDT on the wrong network can lose the funds permanently. Double-check the network and address.'))+
      note('info','info','We check the format of these details but cannot confirm who owns the account.')+
      '<div style="display:grid;gap:8px;margin-top:16px"><button class="cta" id="acSave"'+(left<=0?' disabled':'')+'>'+(a.id?'Save changes':'Save account')+'</button><button class="ghost" id="acCancel">Cancel</button></div></div>';
  }
  return '<div class="sec"><div class="shead"><h2 class="h">Saved payout accounts</h2><button class="mini" id="acAdd"'+(left<=0?' disabled':'')+'>'+I(IC.plus,12)+'Add</button></div>'+chBanner()+
    (S.accts.length?S.accts.map(x=>'<div class="li"><span class="ico">'+I(x.method==='NGN'?IC.bank:IC.wallet,15)+'</span><div class="lb"><div class="lr"><b>'+(x.method==='NGN'?'NGN bank account':'USDT wallet')+'</b><span style="display:flex;gap:5px"><button class="mini" data-edit="'+esc(x.id)+'"'+(left<=0?' disabled':'')+' aria-label="Edit account">'+I(IC.edit,12)+'</button><button class="mini bad" data-del="'+esc(x.id)+'"'+(left<=0?' disabled':'')+' aria-label="Delete account">'+I(IC.trash,12)+'</button></span></div><div class="ls">'+acctLine(x)+'</div></div></div>').join(''):'<div class="empty">'+I(IC.gift,20)+'<p>No saved accounts yet. Add one to withdraw faster.</p></div>')+'</div>';
}

/* ══ EVENTS ══ */
const cleanAmt=v=>{v=v.replace(/[^0-9.]/g,'');const p=v.split('.');if(p.length>2)v=p[0]+'.'+p.slice(1).join('');if(p[1]&&p[1].length>2)v=p[0]+'.'+p[1].slice(0,2);return v};
async function takeFile(f){
  if(!f)return;
  if(!f.type||f.type.indexOf('image/')!==0){toast('Please choose an image file');return}
  if(f.size>12*1024*1024){toast('That image is too large');return}
  S.sell.file=f;S.sell.err=Object.assign({},S.sell.err,{file:''});S.sell.done=false;
  try{S.sell.preview=await compress(f)}catch(_){S.sell.preview=''}render();
}
function bind(){
  const q=s=>$('#view').querySelector(s),qa=s=>$('#view').querySelectorAll(s);
  /* home + withdrawal receipts */
  if(q('#goWd'))q('#goWd').onclick=openWithdrawPage;
  if(q('#goWd2'))q('#goWd2').onclick=openWithdrawPage;
  if(q('#goSell'))q('#goSell').onclick=()=>{S.tab='sell';render();window.scrollTo(0,0)};
  qa('[data-wr]').forEach(r=>{const go=()=>openWdReceipt(r.dataset.wr);r.onclick=go;r.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});
  if(q('#wdViewRc'))q('#wdViewRc').onclick=()=>{const r=S.wd.result;if(r&&r.reference){const x=S.wds.find(z=>z.reference===r.reference);if(x)openWdReceipt(wdKey(x));else toast('Receipt is still loading, try again in a moment')}};
  if(q('#stPin'))q('#stPin').onclick=()=>{S.afterPin=false;S.tab='pin';render();window.scrollTo(0,0)};
  if(q('#stAcc'))q('#stAcc').onclick=()=>{S.wd.addMode=false;S.ac={mode:'list',type:'NGN',id:null,f:{}};S.tab='accounts';render();window.scrollTo(0,0)};
  if(q('#pinSave'))q('#pinSave').onclick=savePin;
  qa('#pinOld,#pinNew,#pinCfm,#wdPin').forEach(i=>i.addEventListener('input',()=>{i.value=i.value.replace(/\D/g,'').slice(0,4)}));
  /* sell */
  if(q('#gcAmt')||q('#gcSubmit')||q('#gcFile')){
    const ga=q('#gcAmt');if(ga)ga.oninput=e=>{const v=cleanAmt(e.target.value);e.target.value=v;S.sell.amount=v;S.sell.done=false;if(S.sell.err.amt){S.sell.err.amt='';const w=e.target.closest('.amt');w.classList.remove('bad');const er=w.parentNode.querySelector('.err');if(er)er.remove()}const eb=$('#estBox');if(eb)eb.innerHTML=estHtml();};
    const fi=q('#gcFile'),dz=q('#gcDrop'),open=()=>fi&&fi.click();
    if(fi)fi.onchange=e=>{takeFile(e.target.files[0]);e.target.value=''};
    if(dz){dz.onclick=open;dz.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};
      ['dragenter','dragover'].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.add('over')}));
      ['dragleave','drop'].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.remove('over')}));
      dz.addEventListener('drop',e=>{const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)takeFile(f)});}
    if(q('#gcReplace'))q('#gcReplace').onclick=open;
    if(q('#gcRemove'))q('#gcRemove').onclick=()=>{S.sell.file=null;S.sell.preview='';render()};
    if(q('#gcSubmit'))q('#gcSubmit').onclick=submitTrade;
  }
  /* trade rows open the receipt (the small copy-ID chip inside a row keeps its own action) */
  qa('[data-rc]').forEach(r=>{const go=e=>{if(e.target.closest&&e.target.closest('.idc'))return;openReceipt(r.dataset.rc)};r.onclick=go;r.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(e)}}});
  /* trades: filters, show more, copy id; rates refresh */
  qa('[data-tf]').forEach(b=>b.onclick=()=>{S.tf=b.dataset.tf;S.tmore=false;render()});
  const tm=q('#tMore');if(tm)tm.onclick=()=>{S.tmore=true;render()};
  qa('#view [data-cp]').forEach(b=>b.onclick=async()=>{const v=b.dataset.cp;const fb=()=>{const t=document.createElement('textarea');t.value=v;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(__){}t.remove()};try{await Promise.race([navigator.clipboard.writeText(v),new Promise((_,rj)=>setTimeout(rj,900))])}catch(_){fb()}toast('Trade ID copied')});
  const rr=q('#ratesRefresh');if(rr)rr.onclick=async()=>{rr.classList.add('spin');await refresh(false);toast('Rates refreshed')};
  /* sell: card tiles, country chips, payout currency, search */
  qa('[data-cc]').forEach(b=>b.onclick=()=>{S.sell.country=b.dataset.cc;S.sell.err=Object.assign({},S.sell.err,{card:''});S.sell.done=false;render()});
  qa('[data-cur]').forEach(b=>b.onclick=()=>{S.sell.cur=b.dataset.cur;S.sell.done=false;try{localStorage.setItem('gc_cur',b.dataset.cur)}catch(_){}render()});
  /* withdraw */
  const wa=q('#wdAmt');if(wa){wa.oninput=e=>{const v=cleanAmt(e.target.value);e.target.value=v;S.wd.amount=v;wdPreview()};wdPreview()}
  if(q('#wdReview'))q('#wdReview').onclick=reviewWd;
  if(q('#wdBack'))q('#wdBack').onclick=()=>{S.wd.step='form';render()};
  if(q('#wdConfirm'))q('#wdConfirm').onclick=confirmWd;
  if(q('#wdAnother'))q('#wdAnother').onclick=()=>{S.wd={step:'form',method:S.wd.method,acct:'',amount:'',key:'',result:null,addMode:false};render()};
  /* accounts */
  if(q('#acAdd'))q('#acAdd').onclick=()=>{S.ac={mode:'type',type:'NGN',id:null,f:{}};render()};
  qa('[data-type]').forEach(b=>b.onclick=()=>{S.ac={mode:'form',type:b.dataset.type,id:null,f:{}};render()});
  qa('[data-edit]').forEach(b=>b.onclick=()=>{const a=S.accts.find(x=>String(x.id)===b.dataset.edit);if(a){S.ac={mode:'form',type:a.method,id:a.id,f:Object.assign({},a)};render()}});
  qa('[data-del]').forEach(b=>b.onclick=()=>delAcct(b.dataset.del));
  if(q('#acCancel'))q('#acCancel').onclick=()=>{S.ac={mode:'list',type:'NGN',id:null,f:{}};if(S.wd.addMode){S.wd.addMode=false;S.tab=S.accts.length?'withdraw':'home'}render()};
  if(q('#acSave'))q('#acSave').onclick=saveAcct;
  [['fBank','bank_name'],['fName','account_name'],['fNum','account_number'],['fAddr','wallet_address']].forEach(p=>{const el=q('#'+p[0]);if(el)el.oninput=()=>{S.ac.f[p[1]]=el.value}});
}
function busy(btn,on,label){S.busy=on;btn.disabled=on;if(on){btn.dataset.l=btn.innerHTML;btn.innerHTML='<span class="spin"></span><span>'+label+'</span>'}else if(btn.dataset.l){btn.innerHTML=btn.dataset.l}}

async function submitTrade(){
  if(S.busy)return;const f=S.sell,amt=parseFloat(f.amount),e={};
  if(!f.type||!f.country)e.card='Choose a gift card and country';
  if(!(amt>0))e.amt='Enter the card value';
  if(!f.file)e.file='Please attach a clear photo of the card';
  if(f.cur==='USDT'&&!(usdtRef()>0)){toast('USDT payout is unavailable right now. Choose Naira or try again later.');return}
  f.err=e;f.done=false;
  if(Object.keys(e).length){render();toast(e.card||e.amt||e.file);const bad=$('#view .err');if(bad)bad.scrollIntoView({block:'center',behavior:'smooth'});return}
  const b=$('#gcSubmit');busy(b,true,'Submitting…');
  try{
    const up=await uploadImage(f.file);
    await rpc('gc_submit_trade',{p_type:f.type,p_country:f.country,p_amount:amt,p_payout_currency:f.cur,p_image_url:up.url||null,p_image_data:up.data||null});
    S.sell={type:f.type,country:'',amount:'',cur:f.cur,file:null,preview:'',err:{},done:true};S.busy=false;toast('Submitted. We’ll review your card shortly.');await refresh();
    const ok=$('#view .okbox');if(ok)ok.scrollIntoView({block:'nearest',behavior:'smooth'});
  }catch(er){busy(b,false);toast(errMsg(er))}
}
function reviewWd(){
  const w=S.wd,amt=parseFloat(w.amount),m=w.method;
  if(!S.ov.eligible_trade){toast('You need a new paid-out gift card trade first');return}
  if(!S.accts.length){openWithdrawPage();return}
  if(!w.acct){toast('Choose a payout account, or add one');return}
  if(!(amt>0)){toast('Enter the amount');return}
  const x=calc(m,amt);if(!x){toast('Fees are not configured right now');return}
  if(amt<minFor(m)){toast('Minimum withdrawal is '+(m==='NGN'?money('NGN',minFor(m)):money('USDT',minFor(m))+' USDT'));return}
  if(x.net<=0){toast('Amount is too small to cover the fee');return}
  if(x.debit>balFor(m)){toast('Insufficient balance');return}
  w.key=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2));   /* one key per confirmed review: retries/double taps can't create a 2nd request */
  w.step='review';render();
}
async function confirmWd(){
  if(S.busy)return;const w=S.wd,b=$('#wdConfirm'),pin=(($('#wdPin')||{}).value||'').trim();
  if(!/^\d{4}$/.test(pin)){toast('Enter your 4-digit withdrawal PIN');return}
  busy(b,true,'Submitting…');
  try{
    const r=await rpc('gc_request_withdrawal',{p_method:w.method,p_account_id:w.acct,p_amount:parseFloat(w.amount),p_idempotency_key:w.key,p_trade_id:S.ov.eligible_trade?S.ov.eligible_trade.id:null,p_pin:pin});
    if(r&&r.pin_error){busy(b,false);S.busy=false;const pi=$('#wdPin');if(pi){pi.value='';pi.focus()}
      toast(r.pin_error==='locked'?'Too many wrong tries. Try again in 15 minutes.':r.pin_error==='not_set'?'Set a withdrawal PIN first':'Wrong PIN'+(r.attempts_left!=null?' ('+r.attempts_left+' tries left)':''));
      if(r.pin_error==='not_set'){S.pin.has=false;render()}return}
    S.busy=false;w.result=r;w.step='done';w.amount='';w.acct='';await refresh();
  }catch(e){busy(b,false);toast(errMsg(e));if(/pin_not_set/.test(String(e.message||''))){S.pin.has=false;S.afterPin=true;render();return}if(/qualifying|already_used|insufficient|minimum/.test(String(e.message||''))){w.step='form';await refresh()}}
}
async function saveAcct(){
  if(S.busy)return;const a=S.ac,isN=a.type==='NGN',b=$('#acSave'),v=id=>($('#'+id)||{}).value||'';
  busy(b,true,'Saving…');
  try{
    await rpc('gc_account_save',{p_id:a.id||'',p_method:a.type,p_bank_name:isN?v('fBank'):null,p_account_name:isN?v('fName'):null,p_account_number:isN?v('fNum'):null,p_network:isN?null:(a.f.network||''),p_wallet_address:isN?null:v('fAddr')});
    S.busy=false;S.ac={mode:'list',type:'NGN',id:null,f:{}};toast('Account saved');
    if(S.wd.addMode){S.tab='withdraw';S.wd.addMode=false;S.wd.method=a.type}
    await refresh();
  }catch(e){busy(b,false);toast(errMsg(e))}
}
async function delAcct(id){
  if(S.busy)return;if(!confirm('Delete this payout account? Past withdrawal requests keep the details they were submitted with.'))return;
  try{S.busy=true;await rpc('gc_account_delete',{p_id:id});S.busy=false;if(S.wd.acct===id)S.wd.acct='';toast('Account deleted');await refresh()}
  catch(e){S.busy=false;toast(errMsg(e))}
}
</script>
